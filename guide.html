# Ch.15 — AI 시대의 노트와 인용 관리

읽은 논문의 세부는 시간이 지나면 흐려진다. 얼마나 빨리 흐려지는지는 사람마다, 논문마다 다르다. 그래서 언제 다시 꺼내 보더라도 왜 이 논문을 남겼는지 바로 알 수 있게 적어 둔다.

AI가 논문을 다시 열어 요약해 줄 수 있으니 긴 요약을 직접 쓸 이유는 줄었다. 그 대신 사람이 확인해서 적어 둘 것이 있다. 논문이 어떤 claim을 했는지, 그 근거가 논문 어디에 있는지, 그 claim 때문에 내 작업에서 무엇을 다르게 결정하는지다.

[Ch.9](./chapter_09_lit_survey_workflow.md)에서 자료를 모으는 흐름을 만들었다면, 이 장에서는 모은 자료를 저장했다가 다시 찾아 쓰는 방법을 다룬다. [Ch.8](./chapter_08_five_cs.md)에서 1st pass 결과를 적는 양식으로 쓴 5 Cs에 근거 위치와 결정을 적는 칸을 더한다.

---

## 15.1 노트 양식 — 5 Cs에 세 칸 더하기

[Ch.8](./chapter_08_five_cs.md)의 5 Cs(Category, Context, Correctness, Contributions, Clarity)는 1st pass를 마치고 적는 양식이다. 노트로 남길 때는 여기에 세 칸을 더한다.

**근거 위치.** 내 글에서 쓸 만한 claim 하나와 그 claim이 나오는 위치를 적는다. 쪽, 절, 그림, 표, 식 번호 가운데 하나는 꼭 붙인다. 원문을 그대로 옮겨야 할 대목만 짧게 발췌하고, 나머지는 내 말로 정리한 claim과 위치만 적으면 된다. 나중에 서론을 쓸 때 필요한 것은 "이 주장을 어느 표가 뒷받침했는가"에 답하는 한 줄이다.

**내 작업과의 관계.** 이 논문이 내 thesis와 어떤 관계인지 baseline 후보, related work, 반박할 대상, 무관 가운데 하나로 적는다. 무관하다고 적어 두면 반년 뒤 왜 이 논문을 인용하지 않았는지 답할 수 있다.

**다음 행동.** 중단, 보류, 진행 가운데 하나를 고른다([Ch.8 §8.6](./chapter_08_five_cs.md)의 세 가지 결정). 진행하기로 했으면 언제 다시 볼지 날짜를 적는다. 보류한 논문에도 다시 볼 시점을 적어야 그 주의 정리 시간에 다시 찾을 수 있다.

노트는 처음에는 한 편당 한 페이지 안쪽으로 잡아 볼 만하다. 자세히 읽은 내용이 많으면 파일을 따로 만들고, 요약 노트에는 claim, 근거 위치, 내 작업과의 관계만 남긴다. 요약과 정독 기록을 나눠 두면 나중에 어떤 논문을 자세히 읽었는지 바로 알 수 있다.

노트 파일 이름은 저자-연도-키워드로 지으면 찾기 쉽다. 키워드를 영문 소문자로 쓰면 grep이나 검색에 잘 걸린다. 예를 들면 `mur-artal-2015-orbslam.md`다.

---

## 15.2 인용 관리 — reference manager는 도구일 뿐이다

참고문헌 관리 도구는 원 출처의 서지 정보를 모아 인용 양식에 맞게 바꿔 준다. 서지 정보는 DOI가 가리키는 문서, arXiv, OpenReview, 학회와 출판사 페이지에서 확인한다.

BibTeX 항목은 DOI, arXiv, CrossRef, Semantic Scholar, OpenAlex, 학회 페이지에서 자동으로 가져온다. Google Scholar에서 내보낸 항목은 빠르지만 필드가 비어 있거나 학회 이름이 부정확하게 들어올 때가 있다. 최종본은 DOI나 학회 페이지를 기준으로 맞춘다.

자동으로 가져온 항목도 한 번은 직접 확인한다.

| 항목 | 확인할 것 |
|---|---|
| ID | DOI나 arXiv ID가 맞는가 |
| 저자 | 첫 저자와 마지막 저자, 철자가 맞는가 |
| venue | 학회·학술지 이름과 연도가 맞는가 |
| 버전 | arXiv 프리프린트와 심사를 거친 판이 구분되는가 |
| key | 한 논문이 두 key로 중복되지 않았는가 |

어떤 도구를 쓸지는 연구실 관행이나 공동 저자의 환경에 맞추면 된다. 다만 도구를 노트의 중심에 두지는 않는다. 노트에 남길 것은 확인한 claim과, 그 claim 때문에 바뀐 내 작업의 결정이다.

라이브러리가 100편을 넘어도 도구가 무엇인지는 크게 중요하지 않다. 한 논문이 key 하나로만 있고, 인용 정보가 기준이 되는 URL과 이어져 있고, 빌드할 때 참고문헌 오류가 드러나면 충분하다. reference manager는 이 조건을 맞추는 여러 방법 가운데 하나다.

---

## 15.3 paper packet과 AI 질의

논문 한 편을 저장할 때는 관련 자료를 한데 묶는다. 이 장에서는 이 묶음을 paper packet이라고 부른다. 논문 URL, DOI나 arXiv ID, PDF, 코드 저장소, 프로젝트 페이지, 부록, OpenReview 토론, 데이터셋 링크가 들어간다. PDF에 한 표시는 읽는 동안의 흔적으로 쓰고, 다시 찾는 데 필요한 claim, 근거 위치, 식별자는 따로 적는다.

AI 도구는 이런 곳에 쓸 수 있다.

**5 Cs 초안.** paper packet을 AI에 주고 "5 Cs를 채우되 항목마다 근거 위치를 붙이고, 근거가 없는 항목에는 '없음'이라고 적어라"라고 묻는다. 나는 그 결과를 확인하는 일로 1st pass를 시작한다.

**다음에 읽을 후보.** 참고문헌 목록과 이 논문을 인용한 논문 목록을 AI에 주고 "내 thesis 키워드와 가까운 5편을 고르고, 왜 가까운지 한 줄씩 적어라"라고 묻는다. 여기서 다음에 읽을 후보가 나온다. 후보를 고르는 일은 AI에 맡겨도 되지만, 읽을지는 내가 정한다.

**related work 비교표.** 논문 A와 B의 차이를 표 하나로 정리해 달라고 한다. 칸은 방법, 가정, 데이터셋, metric, 한계, 내 작업과의 관계 정도면 충분하다. 표의 내용을 원문 위치에서 직접 확인한 뒤에야 내 글의 related work 단락의 뼈대로 쓴다.

AI가 만든 5 Cs 노트는 초안이다. 최종 노트에는 내가 확인한 claim과 위치만 남긴다. AI의 hallucination 가운데 특히 조심할 것은 그럴듯한 인용 위치다. 절, 표, 식 번호가 틀린 항목은 버린다.

---

## 15.4 검색과 재호출 — 태그보다 문장

노트는 시간이 지나도 다시 찾을 수 있어야 한다. 태그와 함께 본문 검색, citation key, DOI나 arXiv ID, 임베딩 검색, grep을 필요에 따라 쓴다. 그래서 태그 개수보다 claim과 식별자가 들어 있어 검색에 걸리는 문장이 더 중요하다.

태그는 꼭 필요한 만큼만 둔다.

| 축 | 값 |
|---|---|
| 분야 | slam · cv · dl · vfm · vla |
| 읽은 깊이 | skim · read · implement · cite |
| 관계 | baseline · related · rebuttal · out |

세 축을 조합하면 예를 들어 내 thesis의 baseline 후보인 SLAM 논문 5편을 한 번에 찾을 수 있다. 더 자세한 분류는 related work 비교표에서 한다.

정기적으로 claim을 모은 목록을 정리한다. 이 장에서는 한 달에 한 번 30분을 예로 든다. 노트에서 서로 부딪치는 claim, 같은 baseline을 쓰는 논문, 내 가설을 바꾼 논문을 한 줄씩 뽑는다. "논문 A와 B는 둘 다 가정 X에서 출발하지만 metric Y에서 결과가 다르다" 같은 문장이 쌓이면 내 연구가 들어갈 자리가 보인다.

Whitesides가 연구실 학생들에게 쓴 글에서 흥미롭더라도 발표하지 않은 결과는 없는 것과 같다고 했듯이([Ch.17 §17.4](./chapter_17_outline_first.md)), 모아 둔 노트도 내 글에 쓰여야 쓸모가 있다.

노트에서 글로 넘어가는 길은 단순하다. 내 논문의 related work 한 단락은 관련 노트 몇 편을 골라 표 하나로 묶는 데서 시작할 수 있다. 몇 편을 묶을지는 다루는 claim에 따라 다르다. 표의 칸인 방법, 가정, 한계, 내 작업과의 관계가 단락의 문장이 된다. 서론과 related work를 쓰는 법은 [Ch.23 (Introduction)](./chapter_23_introduction.md)과 [Ch.24 (Related Work)](./chapter_24_related_work.md)에서 다룬다.

몇 달에 몇 편, 몇 문장 같은 정해진 비율은 없다. 직접 확인한 claim과 근거 위치가 있는 노트만 논문의 related work와 가설 설계에 들어간다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §1 "What is a Scientific Paper?"("Interesting and unpublished" is equivalent to "non-existent"). [Ch.8 (5 Cs)](./chapter_08_five_cs.md), [Ch.23 (Introduction)](./chapter_23_introduction.md), [Ch.24 (Related Work)](./chapter_24_related_work.md). 5 Cs에 세 칸을 더한 노트 양식, paper packet 구성, AI 결과 확인 기준, claim 목록 정리법은 이 장에서 정리했다. 페이지 수, 정리 주기와 시간, 비교 편수는 예시다.

# Ch.16 — 마음가짐

논문을 처음 쓰는 학생이 가장 먼저 버릴 것은 학부 시험의 채점 방식이다. [임형태 박사](https://github.com/LimHyungTae/paper-writing-checklist)는 논문이 학부 시험처럼 100점을 받는 '만점' 상태가 절대로 될 수 없다고 적었다. 만점이 없는 글에 만점을 노리면 수정이 한없이 길어진다.

[최윤섭 박사의 「첫 번째 논문을 최대한 빨리 써라」](https://gradschoolstory.chkwon.net/yoonsup/first-paper/)도 같은 쪽을 가리킨다. 최윤섭 박사는 실험하는 능력과 논문을 출판하는 능력이 매우 다른 영역이라서 출판의 전체 과정을 일찍 겪어 봐야 한다고 말한다. 박사 말년에야 첫 논문을 쓰려 하면 경험이 없어 한 번에 잘될 리 없고, 졸업은 더 기약이 없어진다는 것이다.

> "고기도 먹어본 놈이 잘 먹고, 방귀도 자꾸 뀌어야 똥이 나온다."

이 문장은 첫 논문으로 Nature나 Science를 노리기보다 작은 논문을 차근차근 내면서 경험을 쌓으라는 대목에 나온다. 같은 글에서 최윤섭 박사는 자신이 주도한 논문이 계획보다 2년 넘게 늦게 나왔다고 적었다. 여러 저널에서 세 번 거절당했고, 실린 저널에서도 세 차례 리비전을 거치며 추가 실험과 수정에만 6개월이 걸렸다. 리비전에 대응하는 방법은 [Ch.32](./chapter_32_revision_rebuttal.md)에서 다룬다.

---

## 16.1 Reject의 complement

임형태 박사는 같은 체크리스트에서 이 태도를 "Accept를 노린다는 마인드가 아니라, reject의 complement를 노린다는 마인드"로 정리했다. 논문이 '만점' 상태가 될 수 없다는 항목 바로 아래에 적은 말이다. 합격률과 심사 절차는 학회, 트랙, 연도마다 다르므로, 이 장은 이 말을 원고를 점검하는 태도로 읽는다.

떨어질 이유 가운데에는 사소해 보이는 것이 많다. 표기 불일치, baseline 비교 누락, 메시지가 한눈에 들어오지 않는 그림 1이 그런 예다. 임형태 박사는 "ensure consistency", "ensure robustness"처럼 뜻이 흐린 표현도 독자가 무슨 말인지 정확히 알 수 없다며 피해야 한다고 한다.

[김기섭 교수의 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html)에도 같은 권고가 있다.

> "경력 초기에는 대작을 노리기 보다는 '리젝 줄 이유를 찾기 어려운' 논문을 작성하려고 해보세요."

김기섭 교수는 이를 위해 좋은 논문의 모양을 많이 보아 두라고 한다. 형식이 갖춰지지 않으면 아이디어가 좋아도 '억셉 줄 이유가 충분하지 못하게' 된다는 것이다. 같은 글에는 "한 가지 논문은 단 한 가지 컨셉을 지녀야 합니다"라는 권고도 있다. 컨셉이 둘이면 논문을 둘로 나눠 내는 편이 낫다고 한다.

---

## 16.2 형식 안에서 쓴다

논문은 형식을 따르는 비중이 큰 글이다. 임형태 박사는 논문을 "엄격한 template이 존재하는 글"이라 부르고, 처음 쓰는 사람은 제발 글이나 그림을 창의적으로 표현하지 말라고 당부한다. 처음 쓰는 사람이 만든 새 표현은 자기만 알아볼 수 있는 경우가 많기 때문이다.

임형태 박사가 내놓는 해법은 좋은 본보기를 정해 따라 쓰는 것이다. 읽어 본 논문 가운데 인용 수가 100에 가까운 논문의 표현과 문장 구조를 바탕으로 쓰고, 그림도 따라 그려 보라고 권한다. 자신은 첫 논문을 쓸 때 [He et al. 2016](https://arxiv.org/abs/1512.03385)의 ResNet 논문의 모든 문단을 거의 외우다시피 필사하며 글쓰기를 공부했다고 적었다. 인용 수와 함께 내 문제와 얼마나 가깝고 명료하게 쓰였는지를 보고 고르면 따라 쓰기가 더 쉽다.

임형태 박사는 로보틱스 연구자에게 [Cyrill Stachniss 연구실](https://scholar.google.com/citations?user=8vib2lAAAAAJ&hl=en) 논문을 읽으며 영어를 공부하라고 권한다. Stachniss 교수가 논문은 이야기책처럼 술술 읽혀야 한다는 생각을 지니고 있어서, 구조가 잘 짜여 있고 독자가 쉽게 이해하도록 깊이 고민한 흔적이 보인다는 이유다.

[엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)은 첫 조언으로 이렇게 적었다.

> "모든걸 두려워하지 마시고 일단 쓰기부터 시작하시란 것이다. 영어가 어렵다면 한글로라도 좋다."

엄태웅 대표는 뭐라도 써 두어야 전체 구성과 부족한 부분이 보이고, 초안이 있어야 지도교수나 동료와 이야기할 수 있다고 말한다. 목차를 먼저 나누고 들어갈 내용을 개조식으로 적어 보는 방법을 권한다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)도 데이터 수집이 '끝나기'를 기다리지 말고 연구 초기부터 논문 개요를 쓰기 시작하라고 한다. 영어 문장을 다듬느라 내용을 적는 일이 늦어진다면 한글 초안부터 써도 된다.

---

## 16.3 교정은 도구와 나눠서 한다

원고의 오타, 수 일치, 인덱스 오류, 인용 누락, 깨진 참고문헌은 한 사람이 다 잡기 어렵다. 임형태 박사는 누구나 원고를 쓸 때 실수한다고 전제하고, 그 실수를 줄이려고 LaTeX를 쓴다고 말한다. 공동 저자라면 책임감을 가지고 Grammarly를 돌리거나 ChatGPT에게 한 섹션씩 교정을 맡겨 한 번은 교정을 돕자고 한다. 한꺼번에 많은 양을 물으면 대충 답하므로, 한 섹션씩 LaTeX 원본 그대로 묻기를 권한다. 아래는 임형태 박사가 체크리스트에 올린 프롬프트다.

```
아래는 낸 논문의 ${SECTION} 부분이야

.
.
(본문 내용)
.
.

위의 문장들에서 오탈자나 수일치, 문법 등 틀린 부분을 proofread해주고, 틀린 부분이 있으면 개조식으로 line-by-line으로 간략히 알려 줘
문장 앞에 % 되어 있는 부분은 주석 처리된 줄이어서 proofreading할 때 무시해 줘.
```

공동 저자에게 원고를 보내기 전에 표면 오류를 먼저 고쳐 두면, 공동 저자는 오탈자를 잡는 대신 논리를 보는 데 시간을 쓸 수 있다.

---

## 16.4 영어 수준과 글쓰기 스타일

영어 과학 글에서는 능동태와 `we`를 써도 되며, 모든 문장을 수동태로 바꿀 필요는 없다. [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1의 6번 항목은 `we`가 수동태를 피하는 데 유용할 때가 많다고 설명한다. 다만 `we`는 "너와 나 함께"라는 뜻일 때 쓰고 `I`를 격식 있게 바꿔 부르는 말로 쓰지는 말라고 단서를 단다.

문장 수준은 '원어민 수준' 같은 막연한 감각보다 연구팀의 스타일 가이드와 문장이 뜻을 분명히 전하는지를 기준으로 판단한다. 임형태 박사는 토플 점수가 110점 이상이 아니라면 지도교수의 글쓰기 스타일을 최대한 존중하자고 한다. 다만 지도교수의 제안이 뜻을 너무 바꾸거나 리뷰어가 공격할 여지를 남겨 명백히 틀렸다고 판단될 때에는 공손하게 의견을 내 보자고 덧붙인다. 능동태, 대명사, 용어 표기는 지도교수, 공동 저자와 미리 정하고 원고 전체에서 같게 쓴다.

---

## 16.5 Context-Content-Conclusion 단락 구조

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 3이 권하는 context-content-conclusion(C-C-C) 구조는 [Ch.19](./chapter_19_ccc.md)에서 단락, 섹션, 논문 전체로 나눠 다룬다.

단락 길이는 점검 신호로만 쓴다. 유난히 길거나 짧은 단락은 맥락, 내용, 결론 가운데 무엇이 빠졌는지 확인한다. 그 단락의 메시지를 한 줄로 말할 수 없으면 메시지 두 개가 섞여 있을 수 있으니 둘로 나눠 본다.

---

## 16.6 많이 읽히는 곳에 시간을 쓴다

Mensh & Kording 2017의 rule 9에 따르면 제목, 초록, 그림은 논문의 나머지보다 훨씬 많은 사람이 보고, 방법 절은 가장 적게 읽힌다. 저자들은 이에 맞춰 시간을 배분하라고 권한다. 작업 계획용 비율과, 시간 기록으로 치우침을 찾는 방법은 [Ch.18](./chapter_18_time_budget.md)에서 다룬다.

---

# Ch.17 — 아웃라인부터 시작하기

[George Whitesides의 "Writing a Paper" (2004)](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 논문을 진행 중인 연구를 계획하는 틀로 쓰라고 권한다. Whitesides는 데이터 수집이 "끝날" 때까지 기다리지 말고 연구 초기부터 outline을 쓰라고 적었다.

---

## 17.1 아웃라인을 데이터 구조로 다루기

Whitesides는 연구 내내 계획이자 outline인 문서를 쓰고 다시 쓰라고 권한다. 연구 초기의 문서는 대부분 계획이고, 연구가 끝날 무렵에는 대부분 outline이 된다. 데이터가 들어올 때마다 이 문서를 고친다.

Whitesides는 outline을 목적, 가설, 결론을 붙여 정리한 데이터 묶음으로 보라고 했다. 그래서 outline에는 글이 거의 들어가지 않는다. 공동 저자와 outline의 데이터와 구성에 합의하면 본문은 비교적 쉽게 붙는다. outline을 여러 번 고치는 데는 시간이 적게 들지만, 본문 전체를 여러 번 다시 쓰는 일은 느리다.

아직 없는 데이터는 빈칸으로 둔다. Whitesides는 빠진 데이터가 들어갈 자리와 그 데이터가 어떻게 나올지에 대한 가설, 가설이 맞을 때의 해석을 outline에 적어 두라고 했다. `[DATA NEEDED]`나 `[HYPOTHESIS]` 같은 표시를 남겨 두면 어떤 실험이 빠졌는지 한눈에 보인다.

---

## 17.2 7-슬롯 골격

Whitesides가 2.3절 "The Outline"에 적은 outline 항목은 다음 순서다.

1. Title
2. Authors
3. Abstract — 나중에
4. Introduction
5. Results & Discussion (합쳐서)
6. Conclusions
7. Experimental

Abstract에 대해서는 "초록은 쓰지 말라. 논문이 완성된 뒤에 쓰면 된다"고만 적었다.

Introduction에는 연구 목적(objectives), 그 목적이 중요한 이유(justification), 배경, 독자 안내, 결론 예고가 들어간다. Whitesides는 첫 한두 단락을 outline 단계에서도 완전한 문장으로 쓰라고 했고, 특히 첫 문장에 공을 들이라고 했다. 첫 문장은 연구 목적과 그 목적이 중요한 이유를 짧게 밝히는 것이 이상적이라고 적었다.

Results & Discussion은 보통 합쳐 쓰고, 주요 주제별로 나눈다. Whitesides는 2.4절에서 결과를 중요한 순서대로 배치하라고 했다. 초보자는 실패에서 시작해 마지막 성공으로 끝나는 실험 과정을 그대로 늘어놓기 쉬운데, Whitesides는 이 방식을 "완전히 틀렸다"고 했다. "The reader usually does not care how you arrived at your big results, only what they are." 독자는 대개 큰 결과에 어떻게 도달했는지에는 관심이 없고 그 결과가 무엇인지만 궁금해한다.

Conclusions에는 한 단계 위의 분석을 담는다. [Ch.20](./chapter_20_subheadings_and_conclusions.md)에서 자세히 다룬다.

---

## 17.3 4-5회 반복 주기

Whitesides는 학생이 outline을 가져오면 자기 의견을 붙여 돌려주고, outline에 합의하기까지 보통 네다섯 번 오간다고 적었다. 그 사이에 추가 실험을 하는 경우도 많다. 합의가 끝날 무렵이면 outline의 표와 그림이 논문의 표와 그림이 된다.

Whitesides는 회차마다 할 일을 정해 두지 않았다. 아래 구분은 이 책에서 작업 계획을 세우려고 나눈 것이다.

- **1회차.** 가설과 핵심 결과를 7개 슬롯에 대강 채운다. 대부분의 칸에는 `[DATA NEEDED]`나 `[HYPOTHESIS]` 표시가 남는다.
- **2-3회차.** 그림과 표를 슬롯에 넣는다. 이 단계에서 빠진 실험이 자주 드러나고, 추가 실험도 보통 여기서 정한다.
- **4-5회차.** 소제목을 주장이 담긴 문장으로 다듬고, 슬롯 사이의 흐름을 점검한다.

회차 사이에 24시간을 두는 것도 이 책이 정한 출발값이다. 같은 날 다시 보더라도 새 데이터나 공동 저자의 의견이 들어왔다면 다시 볼 만하다. 마감과 실험 주기에 따라 간격을 조정한다.

---

## 17.4 발표하지 않은 결과는 없는 결과다

Whitesides는 1절에서 "'Interesting and unpublished' is equivalent to 'non-existent'"(흥미롭더라도 발표하지 않은 결과는 없는 것과 같다)라고 적었다. 바로 앞 문장에서는 연구에서 논문이 나오지 않으면 그 연구는 하지 않은 것과 다름없다고 했다.

outline 단계에서는 이번 논문에 넣을 결과를 고른다. Whitesides는 중요한 결과부터 쓰고 부차적인 결과는 뒤에 두거나 아예 빼라고 했고, 짧은 논문이 긴 논문보다 읽기 쉽다고 적었다. 핵심 가설과 직접 맞물리지 않는 결과는 다음 논문의 outline으로 옮겨 둔다.

연구를 시작할 때의 가설과 다 쓴 논문의 목적이 달라져도 괜찮다. Whitesides는 데이터가 다른 가설을 더 잘 검증하는 것처럼 보이면 두 가설을 모두 적고 가장 나은 조합을 고르라고 했다. "Much of good science is opportunistic and revisionist."

---

## 17.5 아웃라인 골격과 서사 구조

[Joshua Schimel의 Writing Science (2012)](https://global.oup.com/academic/product/writing-science-9780199760244)는 OCAR나 ABDCE 같은 서사 구조로 논문을 짜라고 권한다. Whitesides는 데이터에서 출발해 outline을 세우라고 하니, 두 책의 권고가 부딪친다고 느끼는 학생이 있다.

이 책은 두 방법을 쓰는 시점으로 나눈다. 초반에는 Whitesides의 슬롯으로 빠진 데이터와 실험을 찾고, 후반에는 Schimel의 서사 구조로 글의 흐름을 점검한다. 어느 회차에서 넘어갈지는 프로젝트마다 다르다.

---

## 17.6 도입 단락을 따라 써 보기

[KISS-ICP (Vizzo et al., RA-L 2023)](https://arxiv.org/abs/2209.15397)의 Introduction은 Whitesides의 요소를 찾아보기 좋은 예다. 첫 단락과 이어지는 기여 설명에서 연구 목적, 중요한 이유, 배경, 독자 안내, 결론 예고가 각각 어디에 있는지 표시해 본다. "We show that with the proper use of ICP that builds on basic reasoning about the system's physics and the sensor data's nature, we obtain competitive odometry."는 결과를 미리 요약한 문장이다. 논문 뒷부분의 구성을 알려 주는 독자 안내와는 다른 요소로 표시한다.

[`kiss_icp_intro_hook.md`](./excerpts/excerpt_01_kiss_icp_intro_hook.md)에 발췌와 분석이 있다. outline이 글이 되는 과정을 한 번 직접 따라 써 본다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 1절(논문의 목적), 2.1-2.3절(outline의 구성), 2.4절(요약 규칙). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 9 (연결). [Schimel 2012](https://global.oup.com/academic/product/writing-science-9780199760244) (비교용). 회차별 작업 구분과 24시간 간격은 이 책에서 정한 것이다.

# Ch.18 — 시간 배분과 피드백 루프

방법 섹션을 오래 다듬었는데 심사 의견은 제목과 초록, 큰 그림이 불명확하다는 지적부터 하는 경우가 있다. 독자가 가장 많이 보는 부분과 저자가 가장 많이 다듬은 부분이 어긋났을 수 있다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 9와 rule 10이 이 문제를 다룬다.

---

## 18.1 가장 많이 읽히는 부분에 시간을 쓴다

Rule 9는 "The title, abstract, and figures are viewed by far more people than the rest of the paper, and the methods section is read least of all. Budget accordingly."라고 적었다. 제목, 초록, 그림은 논문의 다른 부분보다 훨씬 많은 사람이 보고, 방법 섹션은 가장 적게 읽힌다. 시간도 그 비율대로 쓰라는 권고다. Rule 9의 제목에는 outline도 들어 있다. outline을 만들 때 저자들은 계획한 문단마다 비공식 문장을 하나씩 적는 방식을 좋아한다고 했다. 이야기에 맞지 않는 단락을 다듬느라 시간을 버리지 않으려면 각 단락의 역할은 outline 단계에서 따져 보는 것이 가장 좋다고 덧붙였다.

이 책은 다음 순서를 첫 점검표로 쓴다. 분야와 원고 종류에 따라 조정한다.

> Title > Abstract > Figure(특히 Fig 1) > Outline > Introduction > Results > Discussion > Method > Related Work

방법을 읽는 독자가 적다고 해서 방법을 부정확하게 써도 되지는 않는다. 내용은 정확하게 쓰되 문장을 매만지는 데 시간을 덜 쓴다. 방법 섹션은 다른 사람이 실험을 재현할 수 있게 쓰는 곳이다.

---

## 18.2 비율 가이드

논문 한 편을 쓰는 시간을 100%로 보면 다음 비율에서 출발해 볼 수 있다. 이 비율은 Mensh와 Kording의 논문에 없고, 이 책에서 작업 계획용으로 정한 값이다.

| 항목 | 비율 |
|---|---|
| Title + Abstract | 15-20% |
| Figures (특히 Fig 1과 main result figure) | 25-30% |
| Outline iteration ([Ch.17](./chapter_17_outline_first.md)) | 15-20% |
| Introduction | 15% |
| Results & Discussion | 10-15% |
| Method + 부록 | 5-10% |

경계할 계획은 방법에 시간의 절반 넘게 쓰고 제목, 초록, 그림에는 합쳐 10%만 쓰는 경우다. 이 수치도 불균형을 보여 주려고 만든 예다. 자기 작업 시간을 기록해 두면 같은 치우침이 있는지 확인할 수 있다.

---

## 18.3 테스트 독자 운영법

Rule 10은 글쓰기를 이야기, outline, 문장을 함께 고쳐 나가는 최적화 문제로 본다. 논문을 쓰려면 보통 여러 사람의 의견이 필요하고, 전체 이야기가 통하는지 확인하려면 테스트 독자(test reader)가 꼭 있어야 한다고 적었다. 테스트 독자는 이야기가 너무 빨리 또는 너무 느리게 진행되는 곳도 알려 줄 수 있다.

이 책은 단계마다 다른 독자를 두기를 권한다.

- **Outline 단계** — 같은 분야 동료 한 명. 구조가 말이 되는지 본다.
- **초고 단계** — 다른 세부 분야 동료 한 명. Introduction에서 넓은 맥락부터 좁혀 들어가 연구 공백(gap)을 드러내는 흐름이 다른 분야 독자에게도 통하는지 본다.
- **수정 단계** — 비전공 대학원생 한 명. 초록만 보여 주고 "이 논문이 무엇을 푸는지 한 문장으로 말해 달라"고 부탁한다.

"이 부분 괜찮아?"처럼 물으면 의례적인 대답만 돌아오기 쉽다. "이 논문이 무슨 문제를 푸는지 한 문장으로 설명해 달라"처럼 독자가 내용을 다시 말하게 하는 질문을 하면 글이 제대로 전달됐는지 알 수 있다. Mensh와 Kording도 Table 1에서 독자가 논문을 한 문장으로 요약하지 못하는 것을 rule 1을 어긴 신호로 꼽았다.

---

## 18.4 막연한 피드백 읽기

Rule 10에 따르면 막연한 피드백과 시큰둥한 심사 의견은 흔히 심사자가 큰 그림을 파악하지 못했다는 뜻이다. 아주 구체적인 피드백은 대개 단락 안의 논리가 부족한 곳을 가리킨다. 독자에게서 "좋네요", "뭔가 어렵다", "잘 모르겠다" 같은 답이 돌아오면 구조를 먼저 의심한다. 구조에 문제가 있는데 단어만 고치면 다음 독자에게서도 같은 답이 돌아온다.

피드백에 따라 손볼 곳은 다음과 같이 나눈다.

- "초록만 보고 무슨 논문인지 모르겠다" — 제목과 초록을 처음부터 다시 쓴다. [Ch.22](./chapter_22_title_abstract.md) 참고.
- "왜 이게 중요한지 모르겠다" — Introduction에서 연구 공백을 드러내는 흐름을 점검한다. [Ch.23](./chapter_23_introduction.md)에서 다룬다.
- "방법은 알겠는데 결과가 와닿지 않는다" — Results의 소제목이 주장을 담은 문장인지 먼저 본다. [Ch.26](./chapter_26_results_discussion.md)에서 다룬다.

---

## 18.5 피드백 빈도와 간격

outline을 고치는 회차 사이, 초고와 수정 사이에 간격을 두면 방금 쓴 문장에서 한 발 떨어져 읽을 수 있다. 이 책은 outline 회차 사이 24시간, 초고와 수정 사이 48시간을 출발값으로 둔다. 마감과 협업 주기에 맞춰 조정한다.

마감 직전에 새 독자를 부를 때는 큰 구조를 바꿀 시간이 남았는지 먼저 확인한다. 예를 들어 마감 일주일 전쯤 논문의 큰 구조를 고정하고, 원고를 이미 잘 아는 공동 저자와 함께 오탈자와 표기 같은 겉면의 오류를 마지막으로 점검한다. 이 시점은 학회 일정과 팀 규모에 따라 달라진다.

---

## 18.6 반복해서 점검할 신호

섹션마다 수정 횟수가 크게 차이 나거나, 초록은 두고 방법만 계속 고치거나, 피드백이 단어 수준에서만 오간다면 §18.1의 우선순위가 뒤집혔을 가능성이 크다. 단락 수준의 결함은 비교적 빨리 보이지만, 섹션이나 논문 전체의 결함은 독자를 바꿔 다시 읽혀 봐야 보인다.

# Ch.19 — CCC: 단락·섹션·논문의 프랙털

단락을 읽고도 요점이 남지 않으면 마지막 문장부터 본다. 마지막 문장이 어떤 판단을 남기는지, 그 판단이 문장 끝에 놓였는지, 앞 문장들이 그 판단에 필요한 맥락과 근거를 주는지 차례로 읽는다.

단락에서 맥락, 내용, 결론이 이어지는지 보는 방법은 섹션과 논문 전체에도 쓸 수 있다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 3에서 Context-Content-Conclusion(C-C-C)을 과학 논문의 기본 구조로 제안했다.

---

## 19.1 독자의 두 질문

Mensh와 Kording은 처음에 맥락을, 중간에 내용을, 끝에 결론을 두는 구조가 독자의 두 질문이 나올 여지를 줄인다고 적었다. 맥락이 빠졌을 때 나오는 "Why was I told that?"(이걸 왜 들려주지?)과, 결론이 빠졌을 때 나오는 "So what?"(그래서 뭐?)이다.

갓 연구를 시작한 학생은 시간순으로 쓰기 쉽다. "처음에 A를 시도했는데 실패했고, 그래서 B로 갔는데 이건 또 다른 문제가 있어서, 결국 C에 도달했다." 연구 노트라면 괜찮지만, 논문에서는 이 순서가 핵심 주장과 근거의 논리를 가린다. Rule 3도 자기 작업을 시간순으로 적고 싶은 마음은 자연스럽다고 인정한다. 그러면서 독자는 결과에 이른 시간순 경로에 관심이 없고 최종 주장과 그것을 받치는 논리에 관심이 있다고 적었다.

C-C-C로 쓰면 독자는 맥락에서 출발해 내용과 근거를 거쳐 결론에 닿는다. 연구 과정을 설명해야 할 때도 작업 기록을 순서대로 옮기기 전에, 그 과정이 어떤 주장을 뒷받침하는지부터 정한다.

Mensh와 Kording은 이 구조의 한계도 적었다. C-C-C는 맥락을 읽을 시간이 있는 독자에게 맞고, 성급한 독자는 신문 기사처럼 흥미로운 내용을 먼저 보여 줘야 붙잡을 수 있다. 다만 과학 논문은 제목과 초록에서 내용을 먼저 드러내므로 Introduction까지 읽는 독자는 맥락을 받아들일 준비가 되어 있을 것이라고 보았다.

---

## 19.2 세 층위의 프랙털

Rule 3은 C-C-C가 여러 규모에서 논문 구조를 정한다고 설명하고, 논문 전체와 단락 규모의 대응을 적었다. 섹션 규모는 이 책에서 같은 방식으로 채웠다.

- **단락.** 첫 문장은 주제나 맥락을 정한다. 가운데 문장들은 독자가 따져 볼 새 내용을 담는다. 마지막 문장은 기억할 결론을 남긴다.
- **섹션.** 도입 단락에서 섹션의 목적과 위치를 밝힌다. 본문 단락들이 내용을 전개하고, 마지막 단락이 섹션의 결론을 맺는다.
- **논문 전체.** Introduction이 맥락을, Results가 내용을, Discussion이 결론을 맡는다.

단락은 저마다 결론이 있어도 섹션 전체가 실험한 순서대로만 흘러가면 독자는 결과들이 어떤 주장을 뒷받침하는지 놓친다. 앞 단락에서 맥락을 충분히 줬다면 다음 단락은 결과로 바로 시작해도 된다. 모든 자리에 세 요소를 기계적으로 넣기보다, 독자가 그때그때 필요한 맥락과 근거를 얻는지 확인한다.

---

## 19.3 초록 — 완결된 C-C-C

Rule 5에 따르면 대부분의 독자가 읽는 부분은 초록뿐이므로, 초록 하나로 논문의 메시지 전체가 전달되어야 한다. 그래서 초록에는 맥락, 내용, 결론이 모두 들어간다. 맥락에서 연구 공백이나 질문을 제시하고, 내용에서 결과를 요약하고, 결론에서 그 결과로 앞의 질문에 답한다. Mensh와 Kording은 결과가 공백을 "like a key fits its lock"(열쇠가 자물쇠에 맞듯) 메우게 하려면 좋은 초록도 대개 여러 번 다듬어야 한다고 적었다.

연구 공백이 아직 바뀌는 중에 쓴 초록은 공백이 바뀌면 다시 써야 한다. 초록은 논문이 완성된 뒤에 써도 된다는 [Whitesides의 말](./chapter_17_outline_first.md)과도 맞는다.

섹션은 앞 섹션의 결론을 이어받아 시작하지만, 초록은 그 안에서 끝나야 한다. 초록이 본문의 그림이나 다른 섹션을 가리키면 초록만 읽는 독자는 내용을 따라갈 수 없다.

---

## 19.4 문장의 강조와 단락의 결론을 연결하기

[Gopen & Swan 1990](https://www.americanscientist.org/sites/americanscientist.org/files/20053191534_306.pdf)은 독자가 문장 끝에 오는 정보를 강조된 정보로 읽는다고 설명하고, 이 자리를 stress position(강조 위치)이라 불렀다. Mensh와 Kording의 rule 3은 단락의 마지막 문장에 독자가 기억할 결론을 두라고 권한다. 앞의 것은 문장 안에서 강조가 놓이는 자리이고, 뒤의 것은 단락 안에서 정보를 놓는 자리다.

마지막 문장에 결론이 있어도 그 문장 끝을 부수적인 출처나 앞에서 한 말로 채우면, 독자는 어디에 무게를 둘지 다시 판단해야 한다.

문장마다 중요한 정보를 끝에 두었다고 해서 단락의 결론이 생기지는 않는다. 각 문장의 내용이 마지막에 하나의 주장으로 모여야 한다. 문장의 강조 위치와 단락의 결론을 따로 확인한 뒤 둘을 이어 보면, 문장은 매끄러운데 요점이 남지 않는 단락을 찾을 수 있다.

---

## 19.5 흔한 실수 5종

C-C-C가 깨지는 모양은 대개 비슷하다.

- 앞에서 맥락을 주지 않았는데 단락 첫 문장을 결과로 시작한다. 독자는 그 결과를 왜 읽어야 하는지 모른다.
- 단락 마지막 문장을 다음 단락으로 넘어가는 연결 문장으로 쓴다. 결론이 놓일 자리를 연결 문장이 차지해 독자가 기억할 요점이 사라진다.
- 섹션 도입 단락 없이 §2.1로 바로 들어간다. 섹션 규모의 맥락이 비어 있다.
- Discussion에서 새 결과를 내놓는다. 내용과 결론이 섞인다. Rule 8에 따르면 Discussion은 결과가 연구 공백을 어떻게 메웠는지, 해석의 한계는 무엇인지, 분야에 어떤 의미가 있는지를 다루는 곳이다.
- Conclusion이 Results를 요약하는 데서 끝난다. [Ch.20](./chapter_20_subheadings_and_conclusions.md)에서 따로 다룬다.

섹션이나 논문 전체의 결함은 다른 독자에게 읽혀 봐야 드러나는 경우가 많다([Ch.18 §18.3](./chapter_18_time_budget.md)).

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 3·5·8. [Gopen & Swan 1990](https://www.americanscientist.org/sites/americanscientist.org/files/20053191534_306.pdf) (stress position). 문장의 강조 위치와 단락의 결론을 함께 점검하는 절차는 두 자료를 바탕으로 이 책에서 구성했다.

# Ch.20 — 정보가 담긴 소제목과 결론 ≠ 요약

논문 본문을 끝까지 읽지 않고 소제목을 훑은 뒤 그림으로 내려가는 독자도 있다. 이런 독자에게 논문의 핵심 메시지를 전하려면 소제목에 주장이 담겨 있어야 한다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 2.3절에서 소제목을 되도록 구체적이고 정보가 많게 쓰라고 권했다.

---

## 20.1 소제목에 주장이 필요한 이유

훑어 읽는 독자는 본문보다 소제목과 그림 캡션을 먼저 본다. 이 독자에게 "Loop Closure Experiments"라는 소제목은 실험 주제만 알려 준다. 같은 자리에 "Loop closure recall improves 14% with multi-scale BEV"를 쓰면 한 줄로 핵심 결과가 전해진다. 이 예와 아래 표의 수치는 소제목의 문장 구조를 보여 주려고 만든 가상의 값이다.

Whitesides는 Results & Discussion을 주요 주제별로 나누고 굵은 소제목을 달라고 했다. 그래야 구성이 분명해지고, 독자가 원고를 훑으며 관심 있는 부분을 찾을 수 있다. 그가 든 예에서 "The Rate of Self-Exchange Decreases with the Polarity of the Solvent"는 "Measurement of Rates"보다 길지만 독자에게 훨씬 쓸모 있다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 7도 결과가 주장을 받치는 논리를 서술문의 연속으로 바꿔 Results의 소제목으로 쓰라고 권한다. 이렇게 쓴 소제목을 모으면 소제목만 읽어도 논문의 논리를 따라갈 수 있다.

"Network Architecture", "Ablation Study" 같은 주제형 소제목은 분야에서 관행으로 굳어 있어 낯설지 않다. Whitesides가 든 예에도 "Synthesis of Alkane Thiols"처럼 주제만 밝힌 소제목이 섞여 있다. 결과를 다루는 소제목이라면 주장을 담을 수 있는지 먼저 따져 본다.

---

## 20.2 Before / After 5쌍

로보틱스 논문에서 볼 법한 소제목 다섯 쌍을 비교한다.

| Before (topic) | After (claim) |
|---|---|
| Loop Closure Experiments | **Loop closure recall improves 14% with multi-scale BEV** |
| Ablation Study | **Removing geometric prior degrades RTE by 38% on KITTI-08** |
| Comparison with Baselines | **Our method matches LIO-SAM accuracy at 1/3 the runtime** |
| Network Architecture | **A two-branch encoder separates appearance from geometry** |
| Dataset and Metrics | **We evaluate on KITTI-360 and VIVID with rotation/translation error** |

After 쪽 소제목에는 모두 동사와 대상이 있다. "improves 14%", "degrades RTE by 38%", "matches LIO-SAM accuracy at 1/3 the runtime", "separates appearance from geometry"가 각각 한 줄에 들어 있다. 동사 없이 명사구만 남으면 소제목은 주제만 알려 준다.

---

## 20.3 작성 절차 3단계

주장을 담은 소제목 한 줄은 다음 순서로 만든다.

1. 해당 섹션 본문의 핵심 결론을 한 문장으로 적는다.
2. 주어-동사-목적어 구조로 다듬고, 명사구 안의 수식 관계도 확인한다. Whitesides는 3절 "Some Points of Style"에서 명사를 형용사처럼 쓰지 말라고 했다. "ATP formation" 대신 "formation of ATP"로 쓰라는 예를 들었다.
3. 학회 템플릿의 지면 폭 안에서 한 줄로 읽히게 줄인다. 60-80자를 초안의 출발 범위로 잡아 볼 수 있지만 정해진 규칙은 없다. 길이보다 주장이 완결됐는지, 같은 층위의 소제목들과 형식이 맞는지를 먼저 본다.

이 작업은 [Ch.17](./chapter_17_outline_first.md)에서 나눈 outline 반복의 4-5회차에 한다. 1-3회차에는 소제목을 임시로 두어도 된다. 본문의 결론이 정해져야 소제목에 담을 주장도 정해진다.

---

## 20.4 Conclusions ≠ Summary

Conclusions 섹션에서 흔한 결함 하나는 Results의 숫자를 다시 늘어놓는 것이다. "In summary, we showed A, B, and C."로 시작하는 Conclusions는 초록과 Results에 이미 있는 정보를 되풀이할 뿐이어서 독자가 새로 얻는 것이 없다.

Whitesides는 2.3절에서 Conclusions를 이렇게 정의했다. outline 단계에서는 결론을 짧은 구나 문장의 목록으로 정리한다. Results에 있는 내용은 특별히 강조할 때가 아니면 되풀이하지 않는다. Conclusions에는 말 그대로 결론을 쓰고, 한 단계 높은 분석을 더하고 연구의 의의를 분명히 밝혀야 한다. 그 앞의 2.2절에서는 outline에 적은 생각을 Introduction, Results and Discussion, Conclusions로 나누면서 Conclusions에 들어갈 질문으로 "What does it all mean? What hypotheses were proved or disproved? What did I learn? Why does it make a difference?"를 꼽았다.

Discussion 섹션이 따로 있는 논문이라면 Conclusions는 짧아도 된다. 짧은 요점 3-5개에서 시작해 볼 수 있고, 학회 형식과 기여의 수에 따라 조정한다. Discussion이 없는 형식이라면 Conclusions가 해석과 한계까지 맡아 길어진다. 어느 경우든 Results의 숫자를 되풀이하는 데서 멈추지 않는다.

---

## 20.5 흔한 실수

Conclusions와 소제목에서 되풀이되는 실수는 다음과 같다.

- Conclusions에 future work 한 줄만 적는다. 한 단계 높은 분석이 빠져 있다. future work는 분석 뒤에 덧붙인다.
- 소제목 길이가 들쭉날쭉하다. 한 섹션 안에 10자짜리와 90자짜리 소제목이 섞이면 형식이 맞지 않아 훑어 읽기 어렵다. 같은 층위의 소제목은 길이를 비슷하게 맞춘다.

---

## 20.6 점검 절차

주장을 담은 소제목은 본문 섹션에서 결론 문장을 먼저 뽑은 뒤에 만든다. 그 문장을 주어-동사-목적어 구조로 다듬고, 길이 제약에 맞춰 줄이고, 같은 섹션 안 다른 소제목과 길이와 문장 구조를 맞춘다. outline 반복의 후반부에 사람이 직접 되풀이해야 하는 작업이다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 2.2절(Conclusions에 들어갈 질문), 2.3절(정보가 담긴 소제목, 요약이 아닌 결론), 3절(명사를 형용사로 쓰지 않기). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 7 (서술문 소제목). 로보틱스 소제목 다섯 쌍과 그 수치는 이 책에서 만든 예시다.

# Ch.21 — 문단 흐름

문장 하나하나는 다듬었는데 단락으로 이어 읽으면 흐름이 끊긴다는 학생이 있다. 다섯 문장을 따로 보면 멀쩡하지만 이어 붙이면 어딘가 어긋난다. 이런 어긋남은 [Ch.12 §12.2](./chapter_12_reader_expectations_diagnosis.md)에서 다룬 topic position과 stress position 원칙이 단락 안에서 지켜지지 않을 때 생긴다.

[Gopen & Swan 1990](https://www.americanscientist.org/blog/the-long-view/the-science-of-scientific-writing)은 문장 첫머리에 앞에서 나온 정보(old information)를, 끝에 강조할 새 정보(new information)를 두라고 한다. 두 사람은 이 배치가 문장 하나를 넘어 단락 전체의 흐름에도 영향을 준다고 적었다. 첫머리를 앞 내용과 이어 주지 못하는 말이 계속 차지하면 독자는 새 문장이 앞 문장과 어떻게 이어지는지, 단락 안에서 무슨 구실을 하는지 알기 어렵다고 했다. Ch.19의 CCC로는 단락의 어느 자리에 무엇이 들어가는지를 점검했다. 이 장에서는 문장에서 문장으로 정보가 어떻게 넘어가는지를 본다.

---

## 21.1 문장 층위와 단락 층위

단락을 읽는 독자는 두 층위를 함께 따라간다. 문장 안에서는 첫 자리(topic position)가 앞 문장과 이어 주는 말을 받고, 끝자리(stress position)가 새 정보를 받는다. 단락 안에서는 첫 문장이 들어가는 입구가 되고, 마지막 문장이 독자가 가져갈 요점(takeaway)을 받는다.

두 층위 모두 앞에서 나온 것에서 새것으로 나아간다. 흐름이 자연스러운 단락에서는 두 층위가 같은 방향으로 움직인다. 어느 한 층위가 어긋나면 독자는 문장마다 이 정보가 왜 지금 나오는지 짐작해야 하고, 그런 짐작이 쌓이면 단락 끝에서 요점이 흐려진다.

학생 원고에서는 단락 층위가 어긋나기도 한다. 문장은 [Ch.29](./chapter_29_reader_expectations.md)의 원칙으로 어느 정도 다듬지만, 문장과 문장을 잇는 일을 따로 점검해야 할 작업으로 여기지 않기도 한다.

---

## 21.2 Topic chain — 앞 문장과 잇는 첫머리

**문장의 첫 명사구는 앞 문장의 어딘가와 이어져야 한다.** 흔히 쓰는 모양은 앞 문장 끝자리에 나온 명사구를 다음 문장 첫머리가 받는 모양이다.

> 원문: The proposed method achieves 14% improvement on KITTI. Many KITTI sequences are challenging due to dynamic objects. Loop closure is critical.
>
> 연결을 일부 고친 문장: The proposed method achieves 14% improvement on KITTI. This benchmark contains many sequences that are challenging due to dynamic objects. Loop closure is critical.

예문의 14%는 문장 연결을 보여 주려고 넣은 가상 수치다. 두 문안에 담긴 정보는 같다. 고친 문안에서는 둘째 문장의 this benchmark가 앞 문장의 KITTI를 받으므로 어느 자료의 sequence인지 바로 알 수 있다.

셋째 문장은 여전히 앞과 이어지지 않는다. Loop closure가 왜 중요한지, 앞의 성능이나 동적 물체와 어떤 관계인지가 주어진 문장에는 없다. 이 빈틈을 메우려면 방법과 실험에서 근거를 더 확인해야 한다. 연결을 고친다며 "동적 물체가 있는 sequence에서도 14% 향상이 유지된다"를 덧붙이거나 critical을 most critical로 바꾸면 없던 결과와 최상급 주장을 새로 만들게 된다.

**첫 명사구로는 바로 앞에 나온 명사나 대명사, 앞 내용을 묶어 부르는 명사구를 쓴다.** "this result", "such configurations" 같은 묶음 명사구가 앞 문장과 이어 주는 도구다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)도 "this" 뒤에는 반드시 명사를 붙여 무엇을 가리키는지 분명히 하라고 했다("This is a fast reaction; This leads us to conclude" 대신 "This reaction is fast; This observation leads us to conclude").

---

## 21.3 Stress chain — 쌓여 가는 새 정보

**문장 끝자리의 새 정보는 다음 문장 첫머리로 넘어간다.** 이렇게 받아 넘기면 단락 안에 정보가 차례로 쌓인다.

> ✓ Textureless walls provide weak image gradients. Weak image gradients make photometric motion estimation less informative. This loss of photometric information motivates adding geometric constraints in a hybrid method.

둘째 문장은 첫 문장 끝의 weak image gradients를 그대로 받는다. 셋째 문장의 this loss of photometric information은 둘째 문장이 말한 정보 부족을 받아, 기하 제약을 함께 쓰려는 이유로 잇는다. 질감이 부족하면 밝기 변화에 기대는 추정이 어려워진다. 기하 제약은 질감과 상관없이 쓸 수 있지만, 장면의 형상에 따라 기하 제약도 부족할 수 있다. 그러니 이 예가 hybrid method의 성공을 보장하지는 않는다. 이 단락의 요점은 마지막 문장에 담긴 방법 선택의 이유다.

**문장 끝마다 상투어가 오면 stress chain이 빈다.** "in this paper", "of our approach" 같은 말이 문장 끝자리를 차지하면 새 정보가 어디 있는지 흐려진다. [Ch.12 §12.2](./chapter_12_reader_expectations_diagnosis.md)의 진단 1(stress position)과 같은 문제다.

---

## 21.4 흔한 결함

**Topic 끊김.** 문장 첫머리에 새 명사가 잇달아 나와 앞 문장과 이어 주는 말이 없다. 단락에서 문장마다 첫 명사구만 뽑아 한 줄로 늘어놓고, 그 줄이 이어지는지 본다.

**Stress 흩뿌리기.** 문장 끝마다 상투어가 와서 새 정보가 어디 있는지 흐릿하다. 문장마다 마지막 명사구만 뽑아 한 줄로 늘어놓고, 새 정보가 쌓이는지 본다.

**한 단락에 요점 둘.** 독자가 가져갈 요점 후보가 둘이다. [Ch.11 §11.2](./chapter_11_ccc_lens.md)의 Q2(이 단락의 content는 한 가지인가)로 잡히는 결함이다. 단락을 나눈다.

**접속사 남발.** "However", "Moreover", "Therefore"를 문장마다 첫머리에 놓는다. 앞 문장과 이어 주는 말 대신 접속사를 놓으면 topic chain이 빈다. 접속사는 정보 사이의 관계를 밝혀야 할 때만 남긴다.

---

## 21.5 두 줄 뽑기로 스스로 진단하기

자기 원고에서 단락 하나를 골라 아래 순서로 해 본다.

1. 문장마다 첫 명사구만 뽑아 한 줄로 늘어놓는다. 이 줄이 topic chain이다.
2. 문장마다 마지막 명사구만 뽑아 한 줄로 늘어놓는다. 이 줄이 stress chain이다.

두 줄을 나란히 놓고 topic chain이 이어지는지, stress chain에 새 정보가 쌓이는지 본다. 어느 한 줄이라도 끊기는 곳이 흐름에 결함이 있는 자리다.

이 방법은 [Ch.29](./chapter_29_reader_expectations.md) §29.4에서 따로 보던 문장 첫머리와 문장 끝을 나란히 놓고 본다. 같은 방법을 남의 논문 읽기에 쓴 예는 [Ch.12](./chapter_12_reader_expectations_diagnosis.md)에 있다.

---

## 21.6 CCC 점검과 함께 쓰기

Ch.19의 CCC는 단락의 각 자리에 무엇이 들어가는지 점검하고, 두 줄 뽑기는 문장 사이로 정보가 어떻게 넘어가는지 점검한다.

CCC 골격을 갖춘 단락에서도 topic chain과 stress chain은 끊길 수 있다. 첫 문장에 맥락이 잘 들어가 있어도 둘째 문장 첫머리가 첫 문장 끝을 받아야 흐름이 이어진다. CCC가 깨진 단락이라면 두 줄 뽑기에서 stress chain의 마지막 낱말이 요점에 닿지 않을 수 있다.

두 점검 가운데 CCC를 먼저 한다. 각 자리가 채워졌는지 확인한 다음 두 줄 뽑기로 흐름을 본다. 빈자리가 있는데 흐름부터 다듬으면 빈자리는 그대로 남는다.

---

**출처.** [Gopen & Swan 1990](https://www.americanscientist.org/blog/the-long-view/the-science-of-scientific-writing) — topic position의 old information이 앞 문장과의 연결과 단락 전체의 전개를 독자에게 알려 준다는 설명. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 3(단락 규모의 C-C-C). [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) — "this" 뒤에 명사를 붙이라는 권고. 두 층위를 함께 보는 관점과 두 줄 뽑기는 이 장에서 정리했다.

# Ch.22 — 제목과 초록

심사위원 한 사람이 맡는 원고 수와 심사 절차는 학회와 학술지마다 다르다. 그래도 많은 독자는 [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)의 first pass처럼 제목, 초록, 서론부터 읽는다. Keshav는 논문을 쓸 때 심사위원과 독자 대부분이 한 번만 훑어본다고 생각하라고 했다. 그 한 번에 요지를 알아보지 못하면 심사위원은 논문을 떨어뜨리기 쉽고, 5분 안에 핵심을 알아보지 못한 독자에게 그 논문은 아마 끝내 읽히지 않는다는 것이다. 그래서 Keshav는 섹션 제목을 일관되게 짓고 초록을 간결하면서도 빠짐없이 쓰라고 권한다.

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 1에서 제목을, rule 5에서 초록을 다룬다. 두 사람은 rule 9에서 제목, 초록, 그림을 보는 사람이 논문의 나머지를 읽는 사람보다 훨씬 많으니 그만큼 시간을 들이라고 했다([Ch.18 §18.1](./chapter_18_time_budget.md)).

---

## 22.1 제목 — 기여를 담은 한 줄

**제목에는 논문의 중심 기여를 담는다.** Mensh와 Kording은 rule 1에서 논문을 하나의 중심 기여에 집중시키고 그 기여를 제목으로 전하라고 했다. 여러 기여를 한꺼번에 내세우는 논문은 기여 하나하나의 설득력이 떨어지기 쉽고, 그래서 기억에도 덜 남는다는 것이다. [Ch.16 §16.1](./chapter_16_mindset.md)에 인용한 김기섭 교수의 "한 가지 논문은 단 한 가지 컨셉을 지녀야 합니다"와도 통한다. 두 사람은 제목을 논문에서 가장 중요한 요소로 꼽는다. 독자가 대개 가장 먼저 만나는 부분이고, 제목을 보고 초록을 읽을지 정하기 때문이다. 이 대목에서 두 사람은 결과를 서술한 짧은 제목이 더 많이 인용된다는 Paiva 외(2012)의 연구를 인용했다.

**제목에서 무엇을 새로 보였는지 드러나야 한다.** "BEV-based Loop Closure"는 주제만 말한다. "BEV-based loop closure halves recall failures on KITTI"처럼 동사와 효과, 대상을 넣으면 결과를 말하는 제목이 된다. 이 제목의 수치는 문형을 보여 주려고 지어낸 것이다. 분야 관행에 따라 명사구 제목을 쓰더라도 무엇을 새로 보였는지 드러나는지 확인한다.

**길이는 학회·학술지 규정과 명료성으로 정한다.** 모든 분야에 통하는 12~15단어 규칙은 없다. 기여를 알아보는 데 필요한 말은 남기고, 검색 결과에서 뒷부분이 잘려도 뜻이 통하도록 앞부분을 다듬는다.

**핵심 용어를 넣는다.** 기여와 바로 이어지는 용어를 제목에 넣는다. 검색과 색인에 실제로 쓰이는 분야 용어를 고르고, 기여를 설명하는 데 필요한 만큼만 쓴다.

---

## 22.2 초록 — 그 안에서 완결된 이야기

**초록만 읽어도 이야기가 끝나야 한다.** Mensh와 Kording은 rule 5에서 대부분의 독자가 논문에서 초록만 읽는다고 보고, 초록에 논문의 메시지 전체를 담으라고 했다. 좋은 초록은 대개 여러 번 다듬어야 결과가 앞에서 제기한 빈틈에 "열쇠가 자물쇠에 맞듯(like a key fits its lock)" 들어맞는다고 한다. [Ch.19 §19.3](./chapter_19_ccc.md)에서 본 초록의 C-C-C와 같은 내용이다.

**rule 5에서 초록은 맥락, 내용, 결론 차례로 흐른다.**

1. **맥락(context)** — 첫 문장에서 연구가 속한 넓은 분야를 소개하고, 연구가 답한 열린 질문까지 좁혀 간다. 문헌에 무엇이 빠져 있는지(구체적인 빈틈), 그 빈틈이 처음의 넓은 맥락과 왜 이어지는지를 밝힌다.
2. **내용(content)** — "Here we"로 시작해, 빈틈을 메우려고 쓴 새 방법이나 접근을 먼저 쓰고 결과의 핵심을 요약한다.
3. **결론(conclusion)** — 결과를 해석해 맥락 끝에서 던진 질문에 답한다. 그 결론이 넓은 분야를 어떻게 진전시키는지를 덧붙이기도 한다.

두 사람은 이 차례를 지키면 초록에서 가장 흔한 실수, 곧 독자가 이해할 준비가 되기 전에 결과부터 꺼내는 실수를 피할 수 있다고 했다.

**본문을 가리키는 말을 넣지 않는다.** 초록에 "Fig. 3 shows …", "in Sec. 4 we …" 같은 말이 들어가면 초록만 떼어 읽는 독자는 그 대상을 볼 수 없다. 초록은 따로 읽어도 뜻이 통해야 한다.

**길이는 학회·학술지의 단어 제한을 따른다.** 150~250단어는 여러 분야에서 흔히 보는 범위일 뿐 보편 규칙은 아니다. 세 부분을 모두 담되 같은 맥락을 두 번 쓰지 않는다.

---

## 22.3 언제 쓰는가

**초록은 논문을 다 쓴 뒤에 쓴다.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 개요(outline)에 들어갈 항목을 적으면서 초록 항목에 "초록은 쓰지 말라. 논문이 완성된 뒤에 쓰면 된다(Do not write an abstract. That can be done when the paper is complete.)"라고 적었다. 본문의 결과와 결론이 바뀌는 동안 초록을 다듬으면 본문이 바뀔 때마다 초록을 다시 써야 한다.

**제목은 일찍 생각하고 자주 고친다.** Mensh와 Kording은 rule 1에서 제목을 일찍부터 생각하고 계속 돌아와 다듬으면 글쓰기뿐 아니라 실험 설계나 이론 전개에도 도움이 될 수 있다고 했다. [김기섭 교수의 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html) 12번 항목도 비슷하다. 간단한 가설이 있다면 코딩을 하나도 하지 않았더라도 제목을 먼저 그럴듯하게 지어 보라고 하고, 그러면 시간이 많이 아껴진다고 한다. 시작에서 너무 작은 것을 공략하는 논문은 아무리 노력해도 탑티어에 가기 힘들 수 있다는 이유다. 결과를 담은 최종 제목은 본문의 결론이 정해진 뒤에 확정한다. 소제목을 다듬는 절차는 [Ch.20 §20.3](./chapter_20_subheadings_and_conclusions.md)에 있다.

**제목과 초록에 들일 시간을 따로 잡는다.** 출발 비율과 작업 기록으로 치우침을 찾는 방법은 [Ch.18 §18.2](./chapter_18_time_budget.md)에 있다.

---

## 22.4 검색 결과에 보이는 제목과 초록

논문은 arXiv 목록, 검색 결과, 추천 서비스에서 제목과 초록 앞부분만으로 먼저 노출되는 경우가 많다. 서비스마다 추천 알고리즘을 공개하는 범위가 다르므로 특정 낱말 수나 키워드 밀도가 효과가 있는지는 확인하기 어렵다. 실제 분야 용어와 기여가 제목과 초록에 분명히 들어가 있으면 검색 결과에서도 독자가 논문을 알아볼 수 있다.

**초록의 첫 한두 문장은 여러 목록 화면에서 독자에게 먼저 보인다.** 첫 두 문장에서 분야와 이 논문이 다루는 빈틈을 구체적으로 밝히고, 접근과 결과가 뒤따를 자리를 만든다. 요약기나 추천기가 어느 문장을 가져가는지는 서비스마다 다르니, 이 권고는 사람 독자를 기준으로 한다. 추천 알고리즘을 짐작해 문장을 짜기보다 정확한 제목과 그것만 읽어도 뜻이 통하는 초록을 쓴다.

---

**출처.** [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf) §2.1 — first pass와, 심사위원 대부분이 한 번만 훑는다는 전제. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 1(중심 기여와 제목, 기여를 여럿 내세울 때의 약점, 제목을 일찍 생각하기), rule 5(초록의 맥락·내용·결론, key fits its lock), rule 9(제목·초록·그림에 시간 배분). [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 2.3절 개요 항목 3(초록은 논문이 완성된 뒤에). [김기섭 교수 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html) 12번 항목(제목 먼저 지어 보기).

# Ch.23 — 서론은 어떻게 좁혀지는가

독자는 서론을 읽으며 논문을 판단할 큰 틀을 잡는다. [Keshav (2007)](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)의 first pass는 제목, 초록, 서론을 주의 깊게 읽고 섹션 제목과 결론을 읽은 뒤 참고문헌을 훑어보는 순서다. 서론이 불분명하면 독자는 이 논문이 무슨 문제를 다루고 무엇을 기여했는지 알기 어렵다.

서론을 Related Work의 축약본으로 채우는 원고가 있다. 인용을 줄줄이 늘어놓다가 끝에서 "we propose …"로 건너뛴다. 이렇게 쓰면 심사위원은 이 논문이 왜 필요한지 답을 얻지 못한 채 기여 문장에 이른다.

이 장은 두 자료를 겹쳐 쓴다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 서론에 들어가야 할 요소를 묶어 두었고, [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 6은 서론이 빈틈(gap)을 차례로 좁혀 가는 순서를 보여 준다.

---

## 23.1 Whitesides가 꼽은 서론의 요소

Whitesides는 논문 개요(outline)에 들어갈 항목을 적으면서(2.3절 항목 4) 서론에 보통 다음 요소가 있어야 한다고 했다. 첫 요소를 뺀 나머지는 원문에서 물음으로 적혀 있다.

1. **Objectives** — 이 연구의 목표.
2. **Justification** — 그 목표가 왜 중요한가.
3. **Background** — 다른 사람들은 무엇을 어떻게 했는가. 우리는 앞서 무엇을 했는가.
4. **Guidance to the reader** — 독자는 논문에서 무엇을 눈여겨봐야 하는가. 흥미로운 대목은 어디인가. 우리는 어떤 전략을 썼는가.
5. **Summary/conclusion** — 독자는 어떤 결론을 기대해야 하는가.

같은 항목에서 Whitesides는 서론의 첫 한두 단락을 개요 단계에서 완전한 문장으로 써 두라고 했다. 특히 첫 문장에 공을 들이고, 되도록 그 문장에서 연구 목표를 간결하게 밝히고 그 목표가 왜 중요한지 보이라고 권한다.

자기 서론을 점검할 때는 서론 전체에서 각 요소에 해당하는 내용을 한 줄씩 뽑아 본다. 뽑히지 않는 요소가 있으면 그 자리가 비어 있는 것이다. Guidance to the reader 항목에서는 Whitesides의 물음대로 독자가 눈여겨볼 대목과 연구 전략을 알려 주는지 본다.

---

## 23.2 빈틈을 좁혀 가는 순서

Mensh와 Kording은 rule 6에서 서론이 지금의 지식이나 방법에 있는 빈틈과 그 빈틈이 왜 중요한지를 드러내야 한다고 했다. 서론은 대개 점점 구체적으로 좁혀지는 단락들로 이루어지고, 그 끝에서 문헌에 무엇이 빠져 있는지 분명히 밝힌 뒤 마지막 단락에서 이 논문이 그 빈틈을 어떻게 메웠는지 요약한다. 두 사람이 든 예는 세포 분화다.

- **Field gap** — 첫 단락은 세포 분화를 이해하는 일이 왜 중요한지, 그리고 분야가 아직 분화의 계기를 밝히지 못했다는 것을 설명한다.
- **Subfield gap** — 둘째 단락은 astrocyte라는 특정 세포의 분화에 대해 무엇이 알려지지 않았는지 설명한다.
- **이 논문이 메울 빈틈** — 셋째 단락은 어떤 유전자가 astrocyte 분화를 이끌 수 있다는 단서를 제시하고, 이 가설이 아직 검증되지 않았다고 밝힌다.

마지막 단락은 따로 다룬다. 두 사람에 따르면 서론의 마지막 단락은 방금 세운 빈틈을 메우는 결과를 간추린다. 초록과 비교하면 맥락을 되풀이할 필요가 없고, 결과는 조금 더 구체적으로 쓰며, 논문의 결론은 짧게 내비치거나 아예 쓰지 않는다.

마지막을 뺀 각 단락도 같은 모양이다. 한두 문장으로 주제를 알려 주고, 관련 문헌에서 알려진 것을 설명한 다음, 이 논문이 중요해지는 "알려지지 않은 것"에 이른다. 두 사람은 서론에 논문의 동기를 넘어서는 폭넓은 문헌 검토가 들어가서는 안 된다고 했다. 빈틈에 초점을 맞춘 서론이면 경험 많은 독자는 주장된 빈틈이 중요한지만 따져 보고도 논문의 중요성을 쉽게 가늠할 수 있다고 덧붙였다.

subfield gap에서 곧장 기여로 건너뛰면 이 논문이 메울 빈틈을 밝히는 단계가 빠진다. 그러면 독자는 기여가 정확히 어느 빈틈을 메우는지 스스로 짐작해야 한다.

---

## 23.3 엄태웅 대표의 서론 순서

[엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)은 같은 흐름을 한국어로 설명한다.

> "먼저 Introduction의 시작은 큰 문제제기부터 시작해 본인의 연구 영역까지 점진적으로 스코프를 좁혀오도록 하고, 그런 과정에서 다른 사람들이 문제를 해결해 온 방식을 간략해 설명해주자. 그런 뒤 이들의 한계점과 본인 연구에 대한 필요성을 역설하고, 마지막으로 본 논문의 기여를 요약해주면 (그리고 앞으로 나올 내용의 outline을 그려주면) Introduction은 끝이 난다."

큰 문제에서 시작해 연구 영역으로 좁혀 가며 선행 연구를 소개하고, 그 한계를 짚는 부분은 §23.2의 빈틈 좁히기와 겹친다. 기여 요약은 Whitesides의 summary/conclusion에, 괄호 안의 outline은 섹션 순서를 알려 주는 guidance에 해당한다.

같은 글에서 엄태웅 대표는 "정확한 수치는 알 수 없지만, 추측컨데 90%의 논문은 Abstract과 Introduction을 읽는 단계에서 그 다음을 읽을 가치가 있는지 없는지가 판단되는 것 같다"고 적고, 그래서 "Abstract과 Introduction은 논문을 쓰는데 40~50%의 노력을 투자할 가치가 있다고 생각한다"고 했다. 90%는 저자 스스로 추측이라고 밝힌 수치이고, 40~50%도 "생각한다"로 맺은 저자의 의견이다. Mensh와 Kording이 rule 9에서 제목과 초록에 시간을 더 들이라고 한 것([Ch.18 §18.1](./chapter_18_time_budget.md))과 같은 방향이다. 엄태웅 대표는 또 "우리는 어떤 텍스트북의 Introduction이 아닌 내 논문의 Introduction을 쓰고 있다"는 점을 명심하자며, 세상의 모든 것을 하나도 빠짐없이 다룰 필요는 없다고 했다.

---

## 23.4 두 자료를 맞대기

아래 표는 이 책에서 Whitesides의 요소를 rule 6의 단계에 맞대 본 것이다. 대응은 이 책이 정한 것이다.

| Whitesides의 요소 | rule 6의 단계 |
|---|---|
| Background | field gap과 subfield gap 단락에서 설명하는 "알려진 것" |
| Justification | 빈틈이 왜 중요한지 밝히는 부분 |
| Objectives | 이 논문이 메울 빈틈과 그것을 메우려는 시도 |
| Summary/conclusion | 마지막 단락의 결과 요약 |
| Guidance to the reader | 대응하는 단계 없음. 독자가 눈여겨볼 대목과 전략 |

개요를 짤 때는 rule 6의 순서로 단락의 흐름을 정하고, 초고가 나오면 Whitesides의 요소로 빠진 내용이 없는지 점검한다.

---

## 23.5 KISS-ICP의 서론

[KISS-ICP (Vizzo et al., RA-L 2023)](https://arxiv.org/abs/2209.15397)의 서론은 여섯 단락으로 문제와 접근을 좁혀 간다. 첫 단락은 odometry 추정이 모르는 환경을 자율 주행하는 모바일 로봇의 기본 구성 요소라고 말한 뒤, 지금의 LiDAR odometry가 대개 ICP를 쓰면서 로봇의 움직임과 환경 구조에 대한 가정에 기대 정확도를 얻는다고 설명한다. 단락 끝에서는 저자들이 아는 한 parameter 조정 없이 여러 센서와 환경, 움직임에서 바로 쓸 수 있는 3D LiDAR odometry가 없다고 밝힌다. 이 문장이 이 논문이 메울 빈틈이다.

둘째 단락은 30년 전 Besl과 McKay가 제안한 고전적인 point-to-point ICP로 돌아가, 설정 하나로 여러 환경과 센서 해상도, 움직임에 쓸 수 있게 하겠다는 목표를 밝힌다. 셋째 단락은 feature 추출, 학습, loop closure를 쓰지 않고도 같은 parameter로 여러 시나리오에서 동작한다고 말한다. 넷째 단락은 주요 기여를 정리하고, 다섯째 단락은 세 가지 핵심 주장을 내놓는다. 마지막 단락은 공개 구현의 주소를 알려 준다.

Whitesides의 요소로 보면 background와 justification은 첫 단락에, objective는 둘째 단락에 있다. 넷째 단락은 저자들이 무엇을 눈여겨보라고 하는지(핵심 구성 요소와 adaptive threshold)를 알려 주므로 guidance to the reader로 읽을 수 있다. 다섯째 단락의 세 주장은 실험에서 무엇을 보일지 미리 알려 주는 summary/conclusion에 해당한다. 이 서론에는 다음 섹션의 순서를 안내하는 문장이 없다.

발췌와 문장별 분석은 [`kiss_icp_intro_hook.md`](./excerpts/excerpt_01_kiss_icp_intro_hook.md)에 있다.

## 23.6 흔한 실수

**첫 문장을 유행 이야기로 연다.** "Recently, deep learning has revolutionized …" 같은 문장이다. Whitesides는 되도록 첫 문장에서 연구 목표와 그 중요성을 밝히라고 했고, rule 6의 예에서도 첫 단락은 분야의 빈틈을 말한다.

**Background가 교과서처럼 길다.** 선행 연구를 분류하고 비교하는 일은 Related Work 섹션이 맡는다([Ch.24](./chapter_24_related_work.md)). 서론의 background는 이 논문이 메울 빈틈을 이해하는 데 필요한 만큼만 쓴다.

**독자가 눈여겨볼 대목을 알려 주지 않는다.** 섹션 순서를 안내하는 "In Sec. 2 we …" 단락은 분야와 학회 관행에 따라 넣기도 하고 빼기도 한다. KISS-ICP처럼 이 단락이 없는 서론도 있다. 이 단락이 있든 없든 Whitesides가 guidance to the reader로 꼽은 내용, 곧 흥미로운 대목과 연구 전략이 서론 어딘가에 있는지 확인한다.

**목표와 기여를 같은 말로 되풀이한다.** 첫 단락의 목표 문장과 기여 목록의 첫 항이 같은 표현이면 둘 중 하나는 군더더기다. 기여 목록에는 실제로 이룬 결과를 적어 목표 문장과 겹치지 않게 한다.

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 6 — 점점 구체적으로 좁혀지는 빈틈, 서론 마지막 단락의 구실, 폭넓은 문헌 검토를 넣지 말라는 권고. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 2.3절 항목 4 — 서론의 요소와 첫 한두 단락을 완전한 문장으로 쓰라는 권고. [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf) §2.1 — first pass의 순서. [엄태웅 대표 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/) Introduction 절 — 서론의 순서, 90% 추측과 40~50% 권고. [Vizzo et al. 2023](https://arxiv.org/abs/2209.15397) §I. 두 자료를 맞댄 표와 KISS-ICP 분석은 이 장에서 정리했다.

# Ch.24 — Related Work: 분류와 비판의 자리

Ch.23의 서론은 이 논문이 왜 필요한지를 밝힌다. Related Work는 그 주변에서 누가 무엇을 시도했는지를 정리한다. 두 섹션이 할 일을 나누지 않으면 어느 한쪽이 분야 소개만 늘어놓게 된다.

Related Work를 연도순 인용 목록으로 채우면 연구들을 어떤 기준으로 비교하는지 드러나지 않는다. "Smith et al. 2018 did A. Lee et al. 2019 did B. ..."처럼 단락이 흘러가면 끝까지 읽어도 자기 방법이 어디에 놓이는지 알 수 없다. 그런 원고에서는 novelty와 비교 대상(baseline)을 충분히 다뤘는지 확인하기 어렵다.

[엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)은 Related Work가 "내 연구결과의 상대적인 위치를 보여주는 곳"이라고 하고, "논문들에 대한 단순 나열을 피하고 비판적 시각을 견지하도록 하자"고 쓴다. [Ch.16 §16.1](./chapter_16_mindset.md)에서 본 대로 떨어질 이유부터 줄이려면 나열식 목록과 핵심 baseline 누락을 먼저 손봐야 한다.

---

## 24.1 분류 기준 세우기

**Related Work의 뼈대는 분류 기준이다.** 스스로 정한 기준에 따라 선행 연구를 나누고 각 연구의 자리를 정하는 일이 Related Work의 중심이다. 기준 없이 인용을 늘어놓으면 목록이 된다.

**로보틱스와 컴퓨터 비전에서 자주 쓰는 기준**은 다음과 같다. 분야마다 기준은 다르다.

- 입력 modality — LiDAR, RGB, RGB-D, IMU 융합
- 표현 방식 — sparse, dense, neural field
- 학습에 기대는 정도 — geometric, learned, hybrid
- 적용 환경 — 실내, 야외, 동적 환경

**두 기준으로 표 만들기.** 연구 수가 많고 두 기준이 연구 사이의 실제 차이를 설명한다면 한 기준을 행에, 다른 기준을 열에 놓고 분류표를 만들어 본다. 이 표는 먼저 생각을 정리하는 데 쓴다. 자기 방법이 표의 빈칸에 들어간다면 그 칸이 이 논문이 메울 빈틈의 후보다. 그 칸이 연구할 가치가 있는지는 따로 논증해야 한다.

표가 분류를 더 분명하게 보여 주면 Related Work에 넣는다. 기준이 하나뿐이거나 연구 수가 적으면 산문으로 쓰는 편이 낫다. 어느 쪽이든 분류 기준과 자기 방법의 자리는 글에 밝혀 둔다.

---

## 24.2 정확하고 정중하게 비판하기

**비판은 방법의 한계에 한정한다.** 저자를 깎아내리는 표현은 쓰지 않는다. "Smith et al.'s approach is naive"는 저자에 대한 비난으로 읽힐 수 있다. "Smith et al.'s approach assumes static environments"는 방법의 한계만 말한다. 엄태웅 대표도 남의 논문을 비판할 때는 조심하자고 했다. 심사에서 강한 반발을 살 수 있고, 지적이 과하거나 틀렸다면 "본인 논문 띄우기 위해 부풀려 얘기했네"라는 인상을 주어 신뢰를 크게 잃을 수 있기 때문이다.

**흐릿한 표현을 점검한다.** "may suffer from", "is limited in some scenarios", "could be improved"만으로는 한계가 어디까지인지 알 수 없다. 출처가 보고한 데이터셋, 조건, 지표를 구체적으로 적고, 수치는 원 논문이 보고한 것만 쓴다. 엄태웅 대표는 "B연구는 A연구를 개선하였다"라고 두루뭉술하게 쓰기보다 "B연구는 어떠한 측면에서 이러한 아이디어를 사용하여 A연구를 정확도 OO%에서 OO%로 개선하였다"처럼 수치를 들어 비교하라고 권한다.

> ❌ Method X may suffer from drift in long sequences.
>
> ✓ Method X reports $d_1$ drift on sequence A, compared with $d_2$ on the shorter sequences [citation].

✓ 문장의 $d_1$, $d_2$, sequence 이름은 실제 출처에서 확인해 채운다. 조건과 수치와 인용을 함께 적으면 독자가 비판의 근거를 따라가 확인할 수 있다.

**비판이 셀수록 근거도 탄탄해야 한다.** 자기 실험 결과나 선행 연구가 직접 보고한 한계를 인용한다. 근거 없이 비판만 세면 심사위원은 자기 방법을 돋보이게 하려고 비교를 비튼 것은 아닌지 의심한다.

**결과를 미리 선언하지 않는다.** Related Work에서 "we outperform all prior work"라고 쓰면 결과 섹션이 할 말을 앞당겨 하게 된다. [Ch.19 §19.5](./chapter_19_ccc.md)에서 본, 내용과 결론이 뒤섞이는 결함과 같은 종류다.

---

## 24.3 핵심 baseline을 빠뜨리면

**자기 방법과 가장 가까운 baseline을 빠뜨리면 novelty와 비교의 공정성이 흔들린다.** Related Work에 나오지 않은 baseline은 실험 섹션에서도 빠지기 쉽다. 누락이 심사 결과에 얼마나 영향을 주는지는 논문의 주장과 학회·학술지에 따라 다르다. 그래도 왜 비교하지 않았는지는 설명해야 한다. [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)은 논문을 깊이 읽는 third pass를 마치면 관련 연구에 대한 인용 누락을 짚어 낼 수 있어야 한다고 했다. 꼼꼼한 심사위원은 바로 그 누락을 찾는다.

**얼마나 인용해야 하는가.** 5편이나 3~5편 같은 고정된 최소선은 없다. 문제 정의를 처음 세운 연구, 자기 방법과 가장 가까운 방법, 같은 benchmark의 강한 비교 대상, 최근에 나온 직접 관련 연구가 빠지지 않았는지 주장마다 확인한다. 최근 연구를 어디까지 찾았는지는 검색을 마친 날짜를 적어 분명히 한다.

**자기 연구실 논문에 치우친 인용.** 자기 연구실 논문만 골라 인용하면 분야를 비뚤게 보여 줄 수 있다. 모든 분야에 통하는 30% 같은 안전선은 없다. 자기 연구실 논문을 인용할 때마다 지금의 주장에 꼭 필요한지 확인하고, 다른 연구 그룹의 가까운 선행 연구도 같은 기준으로 찾는다.

선행 연구를 찾는 방법은 [Ch.9](./chapter_09_lit_survey_workflow.md)에서 다룬 문헌 조사 절차를 따른다. Keshav가 권한 대로 최근 논문 몇 편에서 시작해 함께 인용되는 핵심 논문과 연구자를 찾고, 주요 학회의 최근 proceedings를 훑는다.

---

## 24.4 서론과 할 일 나누기

Ch.23에서 서론이 이 논문이 메울 빈틈을 한 줄로 밝혔다면, Related Work는 그 빈틈 주변의 연구를 자세히 펼친다. 두 섹션은 아래처럼 할 일을 나눈다.

| 항목 | 서론 (Ch.23) | Related Work (Ch.24) |
|---|---|---|
| 길이 | 빈틈을 밝히는 데 필요한 만큼 | 분류와 자리를 설명하는 데 필요한 만큼 |
| 인용 수 | 핵심 주장에 직접 필요한 인용 | 분류 기준의 주요 갈래와 직접 비교 대상을 다루는 인용 |
| 뼈대 | 빈틈을 좁혀 가는 순서 | 분류 기준(필요하면 두 기준의 표) |
| 비판 | 빈틈을 밝히는 한 줄 | 수치를 근거로 자세히 |
| 자기 방법 | 기여 한 문장 | 분류표 안의 한 칸 |

할 일이 섞이는 흔한 예는 서론에 선행 연구 30편을 인용하는 원고다. Mensh와 Kording이 서론에 논문의 동기를 넘어서는 폭넓은 문헌 검토를 넣지 말라고 한 것([Ch.23 §23.2](./chapter_23_introduction.md))과 같은 문제다. Related Work를 서론에 합쳐 쓰는 분야라면 문제 제기와 선행 연구 분류가 한 단락에 뒤섞이지 않게 단락을 나눈다.

---

**출처.** [엄태웅 대표 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/) Related Work 절 — 연구의 상대적 위치, 단순 나열 피하기, 수치를 든 비교, 비판할 때의 주의. [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf) §2.3(관련 연구 인용 누락 짚기), §3(문헌 조사). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 6. 분류 기준, 두 기준의 표, 인용 범위 점검은 이 장에서 정리했다. 인용 수나 자기 연구실 인용 비율은 논문마다 정한다.

# Ch.25 — 방법 섹션

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 9에서 제목, 초록, 그림을 보는 사람이 논문의 나머지를 읽는 사람보다 훨씬 많고, Method 섹션을 읽는 사람이 가장 적다고 했다. 이 장은 Method까지 읽는 독자를 결과를 재현하거나 비교가 공정했는지 따지려는 사람으로 보고 쓴다. 이 독자에게 필요한 정보가 빠지면 주장(claim)의 근거가 약해진다.

Method를 연구 노트처럼 시간순으로 쓰면 최종 방법의 논리가 가려진다. "처음에 X를 시도했는데 안 돼서 Y로 갔고, Y에도 한계가 있어서 Z에 이르렀다" 같은 과정은 연구 노트에 남긴다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 2.4절에서 초심자가 처음의 실패부터 마지막 성공까지 실험 과정을 시간순으로 늘어놓곤 한다고 지적하고, 중요한 결과부터 쓰라고 했다. Method에는 재현에 필요한 최종 절차와 그 절차를 고른 근거를 논리 순서로 쓴다.

---

## 25.1 Results-driven structure — 결과에 맞춘 골격

**Method의 순서는 Results의 순서를 따른다.** Whitesides는 개요에 들어갈 항목을 적으면서(2.3절 항목 7) Experimental 섹션의 소제목을 Results 섹션의 순서에 맞춰 적으라고 했다. Mensh와 Kording도 rule 7에서 control과 method는 전체 논리에 필요한 자리에 들어간다고 했다. Results의 그림과 표를 만든 절차가 Method의 서브섹션이 된다.

그래서 Results의 개요(outline)를 먼저 잡고, 그 개요를 거슬러 가며 Method의 개요를 만든다. Ch.26의 주요 결과 표, ablation 표, 정성 비교 그림이 각각 Method의 어느 서브섹션에 대응하는지는 개요 단계에서 정한다.

**Method의 소제목.** "Section 3.1 Feature Extraction"보다 "Section 3.1 Multi-scale BEV feature extraction"에 정보가 더 많다. 다만 Method 소제목에는 [Ch.20](./chapter_20_subheadings_and_conclusions.md)의 주장형 소제목처럼 결과를 넣을 수 없으니, 명사와 기법 이름으로 쓴다.

---

## 25.2 Notation table — 기호를 찾아볼 수 있는 표

**기호가 많으면 Method 앞부분에 notation table(기호 표)을 둔다.** 핵심 기호를 표에서 한 번 정의하고, 본문에서 처음 나올 때도 뜻을 알 수 있게 쓴다. 기호가 몇 개뿐이면 본문에서 정의하는 것으로 충분하다.

**표 구성.** 아래 네 열은 예시다. 학회·학술지 템플릿과 기호 수에 맞춰 줄인다.

| Symbol | Meaning | Dimension/Unit | First introduced |
|---|---|---|---|
| $\mathbf{T}_k$ | sensor pose at time $k$ | $SE(3)$ | §3.1 |
| $\mathbf{r}_i$ | reprojection residual for measurement $i$ | $\mathbb{R}^2$ | §3.2 |
| $\lambda$ | regularization weight | scalar | §3.3 |

**한 기호에는 한 뜻만 준다.** 로보틱스 논문에서는 $R$ 하나가 회전행렬, residual, reward를 함께 가리키기도 한다. 한 기호에 한 뜻만 주는 원칙은 [Ch.30 R8](./chapter_30_math_and_proofs.md)에서, 이 원칙을 LaTeX 매크로로 지키는 방법은 [Ch.31](./chapter_31_notation_hygiene.md)에서 다룬다.

---

## 25.3 Algorithm pseudocode — 재현을 돕는 의사코드

**단계의 순서, 분기, 반복이 방법의 핵심이면 pseudocode(의사코드)를 넣는다.** LaTeX에서는 `algorithm2e` 패키지를 흔히 쓴다. 학회·학술지 템플릿이 정한 환경이 있으면 그것을 따르고, 정해진 것이 없으면 [robotics-practice ch20 §20.8.5](https://alexjunholee.github.io/robotics-practice/guide.html#208-연구-실전)의 도구 목록을 참고한다.

**Pseudocode 구조.**

- **Input** 한 줄. 어떤 데이터와 hyperparameter를 받는지 적는다.
- **Output** 한 줄. 무엇을 어떤 형태로 돌려주는지 적는다.
- **단계** 한 줄에 하나씩. 본문 수식을 쓰는 단계에는 식 번호를 붙인다.

**계산 복잡도.** 입력 크기에 따라 비용이 어떻게 늘어나는지 분석할 수 있으면 pseudocode 뒤나 본문에 적는다. 이론적 복잡도와 실제 실행 시간(runtime)은 따로 적는다. 빠르다고 주장한다면 하드웨어, 구현, 입력 크기, 측정 방법도 함께 적는다. 복잡도를 분석할 수 있는데 runtime만 보고하면 심사위원은 왜 빠른지 짐작해야 한다.

---

## 25.4 Hyperparameter table — 설정값을 한곳에

**재현에 필요한 hyperparameter는 한곳에서 찾을 수 있게 한다.** 수가 많으면 표나 공개 config 파일로 모으고, 핵심 값은 본문에서도 설명한다. "we use learning rate 1e-4 … batch size 32 …" 같은 값이 여러 곳에 흩어져 있으면 어떤 설정으로 결과를 냈는지 따라가기 어렵다.

**표 구성.** parameter, 값, 뜻, 값을 바꿨을 때의 영향(sensitivity)을 적는다. 마지막 열의 근거는 Ch.26의 ablation 표에서 보인다.

**Dataset마다 값이 다른 hyperparameter.** dataset을 행에, parameter를 열에 놓은 표로 정리한다. 어떤 dataset에서 어떤 값을 기본으로 썼는지가 드러나야 한다.

---

## 25.5 Ch.26의 Results와 맞추기

Method의 서브섹션마다 대응하는 Results의 서브섹션이 있으면 심사위원은 두 섹션이 서로 맞는지 쉽게 확인할 수 있다. 두 섹션이 어긋나는 흔한 경우는 다음과 같다.

- **Method에는 있는데 Results에는 없는 구성 요소.** Method §3.2에 "we use multi-scale fusion"이라고 썼는데 Results의 어느 그림에서도 그 효과를 검증하지 않은 경우다. 대개 ablation이 빠져 있다([Ch.26 §26.2](./chapter_26_results_discussion.md)).
- **Results에는 있는데 Method에는 없는 구성 요소.** Results §4의 ablation 표에 "w/o geometric prior" 행이 있는데 Method에는 geometric prior의 정의가 없는 경우다. 정의나 기호가 빠진 것이다.

개요 단계에서 Method의 서브섹션마다 대응하는 Results 항목을 옆에 적어 두면 두 경우를 일찍 찾을 수 있다.

---

# Ch.26 — 결과와 논의

Results와 Discussion을 나눌지 합칠지는 학회·학술지와 논문 형식에 따라 다르다. 두 섹션을 합치더라도 문단 안에서 결과를 밝히는 문장과 해석하는 문장을 구분해야 독자가 어느 문장이 관측이고 어느 문장이 해석인지 가려낼 수 있다. [Ch.19 §19.5](./chapter_19_ccc.md)에서 다룬, content와 conclusion이 한 문단에 뒤섞이는 결함이 여기서도 나타난다.

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 7에서 Results의 논리 구조를, rule 8에서 Discussion이 다룰 내용(빈틈을 어떻게 메웠는지, 해석의 한계, 분야에 주는 의미)을 다룬다. Results에는 주장을 뒷받침하는 그림, 표, 관측을 싣고, 결과의 해석과 한계는 Discussion에서 다룬다. 새 결과를 어디에 둘지는 학회·학술지 형식을 따르되, 해석의 근거가 되는 관측을 독자가 찾을 수 있어야 한다.

---

## 26.1 Results의 골격 — Method와 맞추기

**Results의 서브섹션은 Method의 서브섹션과 하나씩 대응한다.** [Ch.25 §25.1](./chapter_25_method.md)에서 Method의 순서를 Results에 맞춘 결과다. Method의 절차로 Results의 그림과 표를 만들고, 그 그림과 표가 Results의 서브섹션을 이룬다.

**처음 골격은 아래 항목으로 잡아 본다.** 모든 논문에 모든 항목이 필요하지는 않다. 중심 주장에 맞춰 고른다.

1. **주요 결과 비교** — 핵심 비교 표. 자기 방법을 가장 가까운 기존 방법, 공개된 최신 방법과 비교한다.
2. **정성 비교 그림 한두 개** — 궤적 시각화나 실패 사례 비교처럼 수치 비교로 드러나지 않는 부분을 보여 준다.
3. **Ablation** — 구성 요소(component)를 하나씩 빼 보며 각각의 효과를 검증한다.
4. **실패 사례(failure case)** — 자기 방법이 실패하는 조건을 보여 주고, 한계를 다루는 부분과 연결한다.

**소제목은 주장을 담은 문장으로 쓴다.** [Ch.20](./chapter_20_subheadings_and_conclusions.md)의 권고는 Results에 가장 잘 맞는다. Mensh와 Kording도 rule 7에서 결과가 주장을 뒷받침하는 논리를 서술문으로 바꿔 Results의 서브섹션 제목으로 쓰라고 했다. "Loop closure recall improves 14% with multi-scale BEV"는 형식을 보여 주려고 지어낸 예다. 실제 소제목에는 검증한 결과만 넣는다.

---

## 26.2 Ablation — 구성 요소를 하나씩 빼 보기

**구성 요소마다 기여를 주장한다면 ablation이 필요하다.** 어느 구성 요소가 어떤 효과를 내는지 보이려면 구성 요소를 하나씩 떼어 내고 결과를 비교해야 한다.

**Ablation 표 구성.** 행에는 뺀 구성 요소(또는 바꾼 설정)를, 열에는 결과 metric을 둔다. 전체 방법(full method)은 첫 행이나 마지막 행에 둔다. 아래 수치는 표의 배치를 보여 주려고 지어낸 것이다.

| Variant | KITTI ATE (m) ↓ | KITTI RTE (%) ↓ | Runtime (ms) ↓ |
|---|---|---|---|
| **Ours (full)** | **0.42** | **0.61** | **18** |
| w/o geometric prior | 0.58 | 0.84 | 15 |
| w/o multi-scale fusion | 0.51 | 0.73 | 14 |
| w/o loop closure | 0.71 | 1.12 | 12 |

**구성 요소는 한 번에 하나씩 뺀다.** 두 개를 함께 빼면 어느 쪽의 효과인지 가릴 수 없다. 두 구성 요소의 상호작용을 보고 싶으면 둘을 함께 뺀 행(w/o A + B)을 따로 넣는다.

---

## 26.3 통계 유의성과 공정한 비교

**무작위성이 있는 실험을 반복할 수 있다면 결과의 변동도 함께 보고한다.** 표본과 추정 대상(estimand)에 맞춰 표준편차(std), 표준오차, 신뢰구간, 분포 그림 가운데 맞는 것을 고른다. 실행 횟수는 계산 비용, 결과의 분산, 분야의 표준 평가 절차를 함께 따져 정한다. seed와 결과를 모은 방법도 적는다.

**hyperparameter를 조정할 기회를 공정하게 준다.** 자기 방법만 넓게 탐색하고 baseline은 검증 없이 기본값으로 두면 비교가 자기 방법에 유리해진다. 방법마다 탐색 공간이 다를 수 있으니 시도 횟수만 똑같이 맞추지 말고, 공식 설정, 검증 절차, 탐색 공간, 계산 예산을 모두 보고한다.

**dataset split과 평가 절차(evaluation protocol)를 맞춘다.** 공식 benchmark나 직접 비교하는 논문이 정한 split과 metric을 확인한다. 다른 split을 쓴다면 이유를 설명하고, baseline도 같은 절차로 다시 평가했는지 밝힌다. KITTI처럼 task마다 공개 ground truth와 test server 구성이 다른 dataset은 해당 task의 공식 지침을 따른다.

**미리 정한 주 metric으로 평가한다.** 주 metric과 함께, 주장에 필요한 trade-off도 본다. 정확도, runtime, 메모리, 강건성 가운데 무엇을 개선했고 무엇을 내주었는지 Discussion에서 설명한다.

---

## 26.4 Discussion — 결과의 해석

**Mensh와 Kording이 rule 8에서 든 Discussion의 순서는 다음과 같다.**

1. **첫 문단은 Results의 중요한 발견을 요약한다.** 결과를 꼼꼼히 읽지 않은 독자도 이 문단에서 요지를 얻는다. 두 사람이 든 예에서 이 요약은 결과의 의미에 초점을 맞춘다.
2. **이어지는 문단은 논문의 약점이나 강점을 하나씩 다룬다.** 각 문단은 약점이나 강점을 관련 문헌과 이어서 평가하고, 앞으로의 실험으로 약점을 어떻게 다룰 수 있는지 말하기도 한다.
3. **마지막 문단은 이 논문이 분야를 어떻게 앞으로 나아가게 하는지 말한다.**

**한계를 밝힌다.** Limitation 섹션을 따로 둘지는 학회·학술지 규정을 따르되, 방법의 가정, 실험 범위, 계산 비용은 Discussion이나 규정이 정한 섹션에서 밝힌다. "한계가 없다"고 쓰지 말고 지금의 검증이 어디까지 닿는지 적는다.

**한계로 먼저 살펴볼 것.** 방법의 가정(예: 정적인 환경을 가정함), 실험 범위(예: 실내 dataset에서만 검증함), 계산 복잡도(예: 메모리가 $O(N^2)$로 늘어남)를 먼저 본다. 분야에 따라 항목을 더한다.

**Results와 Discussion을 나누는 형식이면 새 결과는 Results에 둔다.** 새 수치, 새 그림, 새 ablation은 Results에 싣는다. Discussion에 추가 실험 결과가 끼어들면 독자는 어디까지가 결과이고 어디부터가 해석인지 가리기 어렵다.

---

## 26.5 분야별 벤치마크 후보

분야마다 널리 쓰는 benchmark와 metric이 있지만, task와 센서, 연도에 따라 달라진다. 아래 표는 후보를 찾는 출발점이고 공식 표준 목록은 아니다. 실제로 제출할 때는 benchmark의 공식 평가 페이지와 직접 비교하는 논문의 평가 절차를 확인한다.

| 분야 | 데이터셋 후보 | 지표 후보 |
|---|---|---|
| Visual SLAM | KITTI · TUM RGB-D · EuRoC | ATE · RTE |
| LiDAR SLAM | KITTI · MulRan · Newer College | ATE · RTE · Loop closure recall |
| 3D 재구성 | ScanNet · Tanks and Temples · Replica | F-score · 정확도 · 완전성 |
| Object detection | COCO · LVIS · Open Images | mAP · AP@[0.5:0.95] |

**방법별 결과를 비교하는 표에는 강조 규약을 한 줄로 적는다.** 예를 들면 "Bold marks the best in each column. Underline marks the second best." 같은 문장을 캡션이나 표 아래 각주에 둔다. 이 한 줄이 없으면 심사위원은 굵은 글씨와 밑줄이 무엇을 뜻하는지 짐작해야 한다. 자세한 내용은 [Ch.28 §28.2](./chapter_28_tables.md)에 있다.

**자기 방법의 행을 눈에 띄게 한다.** 음영이나 별표로 표시하고, 표 아래 각주에 "Ours" 같은 표시가 무엇인지 적는다. 심사위원이 표를 훑어볼 때 어느 행이 자기 방법인지 바로 알아볼 수 있어야 한다.

ablation, 변인 통제, 반복 실험, 공정한 비교의 요점은 [robotics-practice ch20 §20.8.2](https://alexjunholee.github.io/robotics-practice/guide.html#208-연구-실전)에 있다.

# Ch.27 — 그림: 안티패턴과 좋은 패턴

[Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)은 second pass에서 그래프의 축 라벨과 error bar를 확인하라고 하며, 이런 흔한 실수에서 서둘러 만든 엉성한 연구와 정말 뛰어난 연구가 갈린다고 했다([Ch.7 §7.2](./chapter_07_keshav_three_passes.md)). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 9에서 제목, 초록, 그림을 보는 사람이 논문의 나머지를 읽는 사람보다 훨씬 많으니 그만큼 시간을 들이라고 권한다.

[Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 2.2절에서 어떻게 그려야 가장 분명하고 보기 좋은지 정하려고 그림 하나를 다섯 번에서 열 번까지 다르게 스케치하기도 한다고 적었다. 이 횟수는 Whitesides 자신의 작업 방식이다.

그림에서 흔히 보는 안티패턴(피해야 할 패턴)은 [cxli233 (GitHub)의 Friends Don't Let Friends Make Bad Graphs](https://github.com/cxli233/FriendsDontLetFriends)에 모여 있다.

---

## 27.1 차트 안티패턴

**평균 차이를 bar plot으로 그린다.** 평균을 막대로 그리면 분포가 가려진다. 두 막대의 차이가 표본 수 때문인지, 분산 때문인지, 실제 평균 차이 때문인지 가리기 어렵다. KITTI 시퀀스별 RTE의 평균을 방법 A와 B의 막대 두 개로 그리는 그림이 그런 예다. 시퀀스별 값을 점으로 찍는 strip plot을 깔고, 그 위에 평균 막대나 box plot을 얹는다.

**표본이 적은데 violin plot을 쓴다.** violin plot은 커널 밀도 추정(KDE)으로 분포 모양을 그리므로, 표본이 적으면 bandwidth를 어떻게 잡느냐에 따라 모양이 크게 달라진다. 모든 분포에 통하는 `n≥10` 같은 문턱은 없다. 점을 직접 보여 주고, violin plot을 쓴다면 표본 수와 bandwidth를 함께 확인한다. KITTI 시퀀스 몇 개처럼 관측을 모두 보일 수 있으면 strip plot이 데이터를 있는 그대로 보여 준다.

**한 방향 데이터에 양방향 colormap을 쓴다.** RdBu, coolwarm 같은 발산형 colormap은 0을 중심으로 양과 음에 뜻이 있을 때만 쓴다. 0~100% recall에 RdBu를 쓰면 50%가 중간값처럼 보이지만, recall 50%에는 그런 뜻이 없다. 0 이상의 값만 있는 데이터에는 viridis, magma처럼 값의 차이가 고르게 보이도록 설계한(perceptually uniform) 순차형 colormap을 쓴다.

**pie chart를 쓴다.** 비슷한 비율 여러 개를 각도로 비교하기는 어렵다. 순위와 차이를 정확히 보여 줘야 하면 정렬한 가로 막대가 낫다. 항목 수로 문턱을 정하지 말고, 라벨이 겹치는지와 차이를 읽을 수 있는지를 본다.

**rainbow colormap(jet)을 쓴다.** cxli233은 빨강·초록이나 무지개 색 척도가 적록 색각 이상이 있는 독자에게 문제가 되고, 흑백으로 인쇄하면 정보가 잘 남지 않는다고 지적한다. 밝기가 값에 따라 고르게 변하지 않아서 데이터에 없는 경계가 보이기도 한다. Matplotlib은 2.0 버전부터 기본 colormap을 viridis로 바꿨다. depth map이나 error map을 그릴 때는 데이터가 한 방향으로 커지는지, 기준값을 중심으로 양쪽으로 갈리는지 먼저 따지고, 그에 맞는 perceptually uniform colormap을 고른다.

---

## 27.2 라벨·축·통계 안티패턴

**축 라벨이나 단위가 없다.** 가로축이 시간인지 frame 번호인지, 단위가 초인지 밀리초인지 그림만 보고 알 수 있어야 결과를 해석할 수 있다. 세로축도 마찬가지다. drift가 m인지 %인지, RTE가 m/s인지 m/frame인지 밝힌다.

**error bar가 무엇인지 적지 않는다.** 막대 위에 ± 표시만 있으면 독자는 그것이 표준편차(std)인지, 표준오차(sem)인지, 95% 신뢰구간인지 알 수 없다. 캡션에 한 줄로 밝혀야 독자가 결과의 불확실성을 판단할 수 있다.

**유의성 표시가 무엇인지 적지 않는다.** `*`, `**`, `***`가 어떤 검정의 어떤 p값 기준인지 캡션에 적는다. 별표만 그리고 검정 이름을 빼면 독자는 유의성을 확인할 수 없다.

---

## 27.3 캡션은 self-explanatory해야 한다

캡션만 읽어도 그림을 이해할 수 있어야 한다. 심사위원이 그림만 훑어볼 때도 캡션에서 요점(takeaway)을 얻어야 한다.

캡션은 다음 순서로 쓴다.

1. **요점 한 줄.** "Method A는 KITTI 시퀀스 00-10 전반에서 method B보다 RTE가 14% 낮다" 같은 서술문으로 쓴다. 14%는 문형을 보여 주려고 지어낸 수치다.
2. **데이터·축·기호의 뜻.** 점, 색, error bar가 각각 무엇을 나타내는지 적는다.
3. **통계와 표본 수.** 표본 수, 검정 방법, p값 기준을 적는다.

---

## 27.4 그림 만드는 과정

**여러 판을 스케치해 비교한다.** 종이에 거칠게 그려서 무엇을 보여 줄지와 무엇을 비교할지 먼저 점검하고, 구조가 잡힌 뒤에 그림 코드를 짠다. 몇 번 스케치할지, 언제 코드로 옮길지는 그림이 얼마나 복잡한지에 맞춰 정한다.

**본문 초고를 쓰기 전에 그림의 메시지를 시험한다.** Results를 쓰기 전에 핵심 그림 후보를 스케치해 보면 필요한 비교와 빠진 실험이 드러난다. Whitesides도 개요 단계에서 그림을 스케치해 데이터를 정리하라고 했다(2.2절).

**panel마다 색, 기호, 선 모양을 똑같이 쓴다.** 한 논문 안에서 method A는 늘 같은 색과 기호로 표시한다. 그림 3에서 파란 동그라미였던 방법이 그림 7에서 빨간 세모가 되면 심사위원은 범례를 다시 읽어야 한다.

---

## 27.5 좋은 그림 체크리스트

초안을 마친 그림마다 다음 항목을 확인한다.

- 축 라벨과 단위를 적었는가
- 캡션에 error bar의 뜻을 적었는가
- 색각 이상이 있는 독자도 구분할 수 있는 팔레트(viridis 계열이나 ColorBrewer의 팔레트)를 썼는가
- 캡션 첫 줄이 요점을 말하는 서술문인가
- panel마다 색과 기호가 같은가
- 선과 도형이 중심인 그림은 되도록 vector 형식(PDF/SVG)으로 저장하고 글꼴을 포함했는가. 사진이나 heatmap은 학회·학술지가 요구하는 해상도와 색 공간을 지켰는가

그 그림에 해당하는 항목 가운데 하나라도 통과하지 못했다면 그림은 아직 초안이다.

---

# Ch.28 — 표: 수치를 비교하는 자리

Ch.27에서 다룬 그림은 분포와 궤적, 정성 결과(qualitative result)를 보여 준다. 표는 수치를 비교할 때 쓴다. 분포가 중요한 자리에 표를 두면 분포가 보이지 않는다. 정확한 수치를 비교해야 하는 자리에 그림을 두면 심사위원은 막대 길이를 눈으로 재어 수치를 읽어 내야 한다.

[cxli233의 Friends Don't Let Friends Make Bad Graphs](https://github.com/cxli233/FriendsDontLetFriends)는 그림에서 되풀이되는 나쁜 패턴(안티패턴)을 목록으로 모았다. 표에서도 비슷한 실수가 비슷한 모양으로 되풀이된다. 이 장에서는 Ch.27처럼 표의 안티패턴과 좋은 패턴을 차례로 본다.

---

## 28.1 안티패턴

**강조 표시가 표마다 다르다.** 비교 표에서는 자기 방법을 bold로, baseline을 보통 글씨로 표시해 놓고, ablation 표에서는 가장 좋은 구성 요소에 밑줄을 긋는 식이다. 강조의 뜻이 표마다 바뀌면 심사위원은 표를 볼 때마다 캡션을 다시 읽어야 한다. `bold = best`, `underline = second best`는 흔히 쓰는 규약이지만 하나뿐인 표준은 아니다. 학회 템플릿과 접근성 지침을 확인해 규약을 고르고, 그 뜻을 캡션에 적는다.

**column이 너무 많다.** KITTI 시퀀스 11개를 모두 column에 넣으면 표가 지면 폭을 넘기 쉽다. 시퀀스를 row에, metric을 column에 두거나 그 반대로 두되, 한 논문 안에서는 한 방식을 지킨다. row 5~15개, column 3~7개는 초안을 점검할 때 쓰는 어림값이다. 읽기 쉬운 한계가 어디인지는 실제 지면과 글자 크기로 확인한다.

**세로선을 모든 column 사이에 긋는다.** LaTeX에서 모든 column 사이에 `|`를 넣으면 구획선이 데이터보다 먼저 눈에 들어온다. `booktabs` 패키지의 `\toprule`, `\midrule`, `\bottomrule`을 많이 쓴다. 세로선을 쓸지는 학회 템플릿과 column 묶음이 얼마나 복잡한지를 보고 정한다.

**글자가 너무 작다.** 표를 지면에 맞추려고 `\small`이나 `\footnotesize`를 거듭 쓰면 인쇄본에서도 화면에서도 읽기 어렵다. column 수와 문구부터 줄이고, 글자 크기는 학회가 허용하는 최소 크기 안에서만 줄인다.

**숫자의 소수점이 어긋난다.** 0.143과 0.07이 한 column에 있는데 소수점 위치가 다르면 눈으로 크기를 비교하기 어렵다. `siunitx` 패키지나 `\phantom{0}`으로 자릿수를 맞춰, 한 column 안의 소수점이 모두 같은 위치에 오게 한다.

---

## 28.2 좋은 패턴

**booktabs를 쓴다.** 표 위에 `\toprule`, header와 본문 사이에 `\midrule`, 표 아래에 `\bottomrule`을 긋는다. column을 묶을 때는 `\cmidrule{2-4}`를 쓴다. 장식선보다 데이터의 묶음이 먼저 보이게 하는 방법 가운데 하나다.

**강조 규약을 적는다.** 캡션 첫 줄이나 표 아래 각주에 "Bold marks the best, underline the second best in each column"처럼 적는다. 한 논문의 모든 표는 같은 규약을 쓴다.

**캡션을 세 부분으로 쓴다.**

1. **요점 한 줄.** "Method A shows lower ATE than the baselines on KITTI sequences 00-10."
2. **표 읽는 법.** bold와 underline의 뜻, dataset split, 몇 번 돌려 평균을 냈는지.
3. **통계.** 표준편차나 95% 신뢰구간, 표본 수 n, seed.

캡션에 요점이 없으면 표만 보고는 결론을 읽어 내기 어렵다. Ch.27 §27.3에서 그림 캡션에 권한 것과 같다.

**자기 방법의 행을 눈에 띄게 한다.** [Ch.26 §26.5](./chapter_26_results_discussion.md)에서 말한 음영은 LaTeX에서 `\rowcolor{gray!15}`로 넣는다.

---

## 28.3 표의 종류: 비교 표, ablation 표, hyperparameter 표

**비교 표.** row에는 방법을, column에는 dataset이나 시퀀스별 metric을 둔다. baseline을 몇 개 넣어야 한다는 규칙은 없다. 중심 주장과 직접 관련된 강한 비교 대상, 같은 평가 protocol로 잴 수 있는 방법을 넣는다. column이 많아지면 dataset별로 표를 나눈다. 아래 수치는 표의 배치를 보여 주려고 지어낸 값이다.

| Method | KITTI 00 ATE ↓ | KITTI 09 ATE ↓ | TUM fr1 ATE ↓ | Runtime ↓ |
|---|---|---|---|---|
| ORB-SLAM3 | 0.51 | 1.34 | 0.018 | 22 ms |
| LIO-SAM | 0.42 | 0.91 | — | 28 ms |
| **Ours** | **0.38** | **0.73** | **0.012** | **18 ms** |

**ablation 표.** row에는 뺀 구성 요소를, column에는 metric을 둔다. 전체 방법(full method)을 첫 행이나 마지막 행에 두고, 구성 요소를 하나씩 뺀 결과를 나란히 놓는다. Ch.26 §26.2의 표가 이 형태다.

**hyperparameter 표.** row에는 parameter를, column에는 값, 뜻, 민감도를 둔다. 민감도 column은 ablation이나 민감도 분석(sensitivity analysis)의 결과와 연결할 수 있다. `RTE 0.84 → 0.61` 같은 수치는 실제 분석으로 확인했을 때만 적는다. 아직 확인하지 않았다면 분석이 실린 절을 가리킨다.

---

## 28.4 그림으로 할지 표로 할지

정보를 그림에 담을지 표에 담을지는 다음 기준으로 정한다.

- **분포가 중요하면** 그림으로 그린다(strip plot, violin plot, box plot). row 5개, column 3개짜리 표로는 분포를 보여 주기 어렵다.
- **정확한 수치를 비교해야 하면** 표로 만든다. 심사위원이 그림의 막대 길이에서 수치를 읽어 내야 하면 비교가 부정확해진다.
- **궤적이나 공간 정보라면** 그림으로 그린다(궤적 시각화, heatmap, error map). 표로는 공간 정보를 전하기 어렵다.
- **여러 방법을 여러 기준으로 비교하면** 표로 만든다. 기준이 많을수록 표가 유리한 경우가 많다. 다만 column 수보다 독자가 무엇을 비교해야 하는지를 먼저 본다.

그림과 표가 같은 정보를 되풀이하기만 한다면 하나를 뺀다. 같은 KITTI 결과라도 그림은 어디서 실패하는지를 공간에 보여 주고 표는 정확한 metric을 보여 준다면, 둘을 함께 둔다. 이때는 각각이 무엇을 보여 주는지 캡션에 따로 적는다.

booktabs와 algorithm2e를 포함한 LaTeX 도구 목록은 [robotics-practice ch20 §20.8.5](https://alexjunholee.github.io/robotics-practice/guide.html#208-연구-실전)에 있다.

---

# Ch.29 — 문장 구조와 독자 기대

영어 논문이 잘 읽히지 않는다고 느끼면 어휘부터 바꾸고 싶어진다. [Gopen & Swan 1990](https://www.americanscientist.org/blog/the-long-view/the-science-of-scientific-writing)은 다른 곳을 본다. 대부분의 사람은 과학 글이 어려운 까닭을 개념과 데이터, 분석이 워낙 복잡해서 어쩔 수 없는 일로 여기지만, 두 저자는 정보를 문장의 어느 자리에 두었는지가 더 큰 원인이라고 본다. 독자가 기대하는 자리에 정보를 놓으면 내용을 단순하게 줄이지 않고도 글이 분명해진다.

글의 질을 높이면 생각의 질도 실제로 높아진다는 두 저자의 말은 [Ch.12 §12.1](./chapter_12_reader_expectations_diagnosis.md)에서 보았다. Gopen과 Swan은 글 끝에서, URF 단락을 뺀 나머지 예문을 고치다 보니 원문 구조에 가려 있던 개념의 빈틈이 드러났다고 썼다. 문장 구조를 점검하면 생각도 함께 점검하게 된다.

두 저자는 독자 기대에서 끌어낸 원칙들을 규칙으로 여기지 말라고 덧붙였다. 어떤 기대든 효과를 노리고 어길 수 있다. 다만 글을 잘 쓰는 사람은 대부분의 문장에서 기대를 지키기 때문에, 어긴 곳이 일부러 어긴 곳으로 읽힌다.

---

## 29.1 문장 안의 위치

Gopen과 Swan은 글 끝에 원칙 일곱 개를 정리했다. 그중 stress position, topic position, 주어와 동사의 거리, 이미 나온 정보와 새 정보의 순서는 [Ch.12 §12.2](./chapter_12_reader_expectations_diagnosis.md)에서 진단 1–4로 보았다.

> ❌ The proposed method achieves 14% improvement in this paper.
>
> ✓ In this paper, the proposed method improves accuracy by 14%.

"in this paper"는 앞 내용과 이어 주는 말이라 문장 앞(topic position)에 둔다. 문장 끝에는 14%를 둔다. 14%는 어순을 보여 주려고 지어낸 수치다.

**행위는 동사로 쓴다.** 문장이 말하는 행위를 동사 자리에 둔다. 행위를 명사로 바꾸면 동사 자리가 비어 버린다.

> ❌ We performed an evaluation of the algorithm on KITTI.
>
> ✓ We evaluated the algorithm on KITTI.

첫 문장에서는 별 뜻 없는 performed가 동사 자리를 차지하고, 실제 행위인 evaluation은 명사구 안에 묻혔다.

---

## 29.2 한 단위에 한 가지

Gopen과 Swan은 크기와 상관없이 글의 단위 하나는 한 가지 일을 하거나 한 가지 요점을 말해야 한다고 했다. 문장도 마찬가지다. 이 책에서는 이렇게 점검한다. stress position에 놓일 만큼 무게 있는 정보가 한 문장에 둘 이상이면 두 문장으로 나눈다.

문장을 길게 써야 할 때는 쌍점이나 쌍반점으로 두 번째 stress position을 만든다. 두 저자는 URF 예문을 고치면서 쌍반점으로 두 번째 강조 자리를 만들었다. 이때 쌍반점 앞부분은 혼자서도 완전한 문장이어야 하고, 그 끝에도 강조할 정보가 와야 한다.

---

## 29.3 한국어로 생각하고 영어로 쓸 때 생기는 함정

Gopen과 Swan은 미국 전문 글쓰기를 두고 이 글을 썼다. 한국어 모어 화자에게는 모국어 구조에서 오는 함정이 더 있다.

**동사를 끝으로 미룬다.** 한국어는 동사가 문장 끝에 온다. 이 습관대로 영어를 쓰면 주어와 동사 사이가 길어진다.

> ❌ The proposed method, which combines geometric ICP with a learned residual network trained on \(N\) sequences from benchmark \(B\), reduces ATE on the benchmark.
>
> ✓ The proposed method reduces ATE on benchmark \(B\). It combines geometric ICP with a learned residual network trained on \(N\) sequences.

주어 바로 뒤에 동사를 두고, 덧붙이는 설명은 다음 문장으로 뺀다.

**"은/는"과 영어 topic position은 다르다.** 한국어 "은/는"은 주제를 내세우기도 하고 대조를 나타내기도 한다. 영어 topic position은 앞 문장과 이어 주는 자리다. 대조할 내용이 없는데도 단락 첫머리에 "On the other hand"를 습관처럼 붙이는 실수도 있다. 이럴 때는 앞 내용을 이어 받는 말을 두어야 흐름이 매끄럽다.

**행위를 명사로 바꾼다.** "~의 수행", "~의 분석" 같은 한국어 학술체를 영어로 옮기면 `the performance of`, `the analysis of`가 되기 쉽다. 행위가 중요한 문장이라면 동사가 명사 안에 묻히지 않았는지 본다. 개념 자체를 가리키는 명사는 그대로 두고, 핵심 행위를 감추는 명사만 동사로 바꾼다.

**there 구문을 남발한다.** "there are several methods that …"로 시작하면 문장 첫머리가 아무것도 가리키지 않는다. 앞 내용과 이어 줄 자리가 비고, several methods는 문장 안에서 갈 곳을 잃는다. "Prior work explores several methods …"로 쓰면 prior work가 앞 내용을 이어 받는다.

한국어 문장의 어순을 그대로 옮기지 말고, 다 쓴 영어 문장을 보며 확인한다. 무엇이 앞과 이어지는 정보이고 무엇이 새 정보인지, 독자가 무엇을 강조해 읽을지를 topic position과 stress position에서 본다.

---

## 29.4 자기 문장 점검하기

단락 하나를 다 쓰면 다음을 본다.

**문장 첫머리를 이어 본다.** 문장마다 첫 명사구만 뽑아 한 줄로 늘어놓는다. 이 줄이 서로 이어져야 한다. 문장마다 첫 명사구가 새것이라면 앞 문장과의 고리가 끊긴 것이다.

**문장 끝을 본다.** 문장마다 마지막 명사구만 뽑는다. "this paper", "the proposed method", "our approach" 같은 상투구가 문장 끝에 와 있으면 자리를 옮긴다.

**소리 내어 읽는다.** 주어와 동사가 멀면 읽다가 숨이 끊긴다. Knuth도 Mathematical Writing에서 문장에는 리듬이 있으니 쓴 글을 읽어 보고 매끄럽지 않으면 고치라고 했고, 학생 답안을 평하면서 "소리 내어 읽어 보라(Read your words aloud to yourself)"고 했다.

URF/ATPase 단락을 Gopen과 Swan이 어떻게 고쳤는지는 [`gopen_swan_urf_rewrite.md`](./excerpts/excerpt_03_gopen_swan_urf_rewrite.md)에 발췌하고 줄마다 분석해 두었다.

---

**출처.** [Gopen & Swan 1990](https://www.americanscientist.org/blog/the-long-view/the-science-of-scientific-writing) — stress position, topic position, 주어와 동사의 거리, 이미 나온 정보와 새 정보의 순서, 행위를 동사로 쓰기, 한 단위에 한 가지, 원칙을 규칙으로 여기지 말라는 단서. 한국어 모어 화자의 함정 네 가지와 점검 방법은 이 장에서 정리했다. 소리 내어 읽기는 [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1 point 7과 §5.

# Ch.30 — 수식·정리·증명 쓰기

[Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1 point 13은 "처음 읽을 때 수식을 훑고 넘어가는 독자가 많다"고 적고, 그러니 간단한 수식만 남기고 나머지를 모두 "blah" 같은 소리로 바꾸어도 문장이 매끄럽게 읽혀야 한다고 했다. 이 장에서는 이것을 'blah' 테스트라고 부른다.

수식 다섯 줄을 연달아 늘어놓고 그 사이에 설명을 한 줄도 쓰지 않은 유도 과정은 이 원칙을 어긴다. 처음 읽는 심사위원은 그 페이지에서 막히기 쉽다. Knuth는 point 10에서 숙제 답안처럼 수식만 나열하지 말고 설명으로 개념을 이어 가라고 했다.

---

## 30.1 수식을 문장에 넣는 법

**R1. 이웃한 수식 사이에는 단어를 넣는다(point 1).** 두 수식을 쉼표로만 이으면 한 수식이 어디서 끝나고 다음 수식이 어디서 시작하는지 바로 알아보기 어렵다.

> ❌ Consider $S_q$, $q < p$.
>
> ✓ Consider $S_q$, where $q < p$.

**R2. 문장을 기호로 시작하지 않는다(point 2).**

> ❌ $X$ denotes the rotation matrix.
>
> ✓ Let $X$ denote the rotation matrix.

문장 첫머리에는 단어를 둔다. Ch.29의 topic position 원칙과도 맞는다.

**R3. 본문 문장에 ∴, ⇒, ∀, ∃를 쓰지 않는다(point 3).** Knuth는 이런 기호를 해당하는 단어로 바꾸라고 했다. 논리학 글은 예외다. 본문 문장에 `∴`가 끼어 있으면 심사위원은 기호를 다시 말로 풀어 읽어야 한다.

**R4. displayed equation은 앞뒤 문장의 일부다(points 4, 23).** 정리 바로 앞 문장은 완결된 문장이거나 쌍점으로 끝나야 한다(point 4). 문장 중간에 수식을 따로 세울 때는 그 앞에 쌍점을 습관처럼 찍지 않는다. Knuth는 point 23에서 그런 쌍점을 틀렸다고 했다. 수식 뒤의 문장부호도 문장에 맞춘다.

> displayed equation에서 문장이 끝나면 수식 뒤에 마침표를 찍는다.
> displayed equation 뒤로 문장이 이어지면 쉼표를 찍거나 아무것도 찍지 않는다.

**R5. 번호 붙은 이름은 대문자로 시작한다(point 19).** "Equation (5)", "Theorem 2", "Lemma 3.1"처럼 쓴다.

**R6. 정의는 서로 보완하는 두 방식으로 쓴다(point 11).** Knuth는 특히 정의를 내릴 때 같은 것을 두 번, 서로 다른 방식으로 말해 보라고 했다. 변수는 처음 나올 때 최소한 비공식적으로라도 정의해야 한다. "Let $\mathbf{T} \in SE(3)$ denote the rigid-body transform from sensor frame to world frame."에서는 수식과 말이 같은 정의를 두 방식으로 전한다.

**R7. 중요한 수식은 따로 한 줄에 세우고 번호를 붙인다(point 16).** Knuth는 중요한 수식을 따로 세우고, 멀리서 참조할 수식이 있다면 가장 중요한 수식 모두에 번호를 붙이라고 했다. 실제로 참조하지 않는 수식이라도 그렇다. 다른 대목에서는 모든 displayed equation에 번호를 붙이는 것은 대개 좋지 않다고도 했다.

**R8. 한 기호를 두 가지 뜻으로 쓰지 않는다(point 14).** $R$을 회전행렬로도, residual로도, reward로도 쓰는 원고가 있다. 한 문서에서는 한 기호를 한 뜻으로만 쓴다. 매크로로 표기를 관리하는 법은 [Ch.31](./chapter_31_notation_hygiene.md)에서 다룬다.

**R9. "that"을 빼지 않는다(point 8).**

> ❌ We show $X$ converges.
>
> ✓ We show that $X$ converges.

Knuth는 독자가 문장 구조를 파악하는 데 도움이 될 때 "that"을 빼지 말라고 했다.

**R10. "we"를 쓰고 "I"는 피한다(point 6).** Knuth는 수동태를 피하는 데 "we"가 쓸모 있을 때가 많다고 했다. 다만 이 "we"는 "당신과 나 함께"라는 뜻일 때 쓰고, "I"를 격식 있게 바꾼 말로 쓰지는 말라고 하며, 저자와 독자의 대화로 생각하라고 했다. 대부분의 기술 글에서는 저자 개인이 논점과 관련 있는 경우가 아니면 "I"를 피해야 한다고 했다.

---

## 30.2 정리와 증명

**정리는 그 자체로 읽혀야 한다.** Knuth는 point 5에서 정리문은 대개 앞 본문의 가정에 기대지 않고 그 자체로 완결되어야 한다고 했다. 정리에 쓰인 기호는 정리문 안에서 정의하거나 어디서 정의했는지 밝힌다. 앞 단락을 다시 읽어야 정리문을 이해할 수 있다면 완결된 정리문이 아니다.

> ❌ **Theorem 1.** Under the conditions above, the estimator converges.
>
> ✓ **Theorem 1.** Let $\mathbf{x}_{k+1}=\mathbf{A}\mathbf{x}_k$, where $\mathbf{x}_0\in\mathbb{R}^n$, $\mathbf{A}\in\mathbb{R}^{n\times n}$, and $\lVert\mathbf{A}\rVert_2<1$. Then $\lVert\mathbf{x}_k\rVert_2\leq\lVert\mathbf{A}\rVert_2^k\lVert\mathbf{x}_0\rVert_2$, and hence $\mathbf{x}_k\to\mathbf{0}$ as $k\to\infty$.

**정리를 내놓기 전에 왜 필요한지 밝힌다.** Knuth는 point 4와 12에서 정리 앞 문장을 앞의 논의와 이어 주는 동기 설명으로 쓰고, 독자가 뒤에 올 내용을 기다리게 하라고 했다. 몇 문장을 쓰느냐보다 독자가 이 결과가 어떤 역할을 하는지 알게 하는 것이 중요하다.

**Lemma, Theorem, Corollary는 급이 다르다.** Lemma는 주장을 세우는 데 쓰는 중간 결과다. Theorem은 논문의 핵심 결과다. Corollary는 Theorem에서 바로 따라 나오는 결과다. 중간 결과까지 모두 Theorem으로 표시하면 급이 뒤섞여 심사위원이 진짜 주요 결과를 찾기 어렵다.

**증명 안에 길잡이 문장을 둔다.** Knuth는 학생 답안 가운데 읽기 쉬웠던 증명이 "The lemma is half proved.", "We divide the proof into two parts, first proving ⟨blah⟩ and then proving ⟨grunt⟩." 같은 문장을 담고 있었다고 소개했다. 증명이 길거나 논리 단계가 여럿이면 이런 길잡이 문장을 둔다. 반 페이지 정도를 기준으로 삼을 수 있지만 어림값일 뿐이다.

**직접 증명할 수 있으면 직접 증명한다.** Knuth는 §3에서 연습 문제의 증명이 쓸데없이 귀류법을 썼다고 지적하고 직접 증명으로 다시 썼다. 귀류법을 쓰면 독자는 증명이 끝날 때까지 부정한 명제를 머릿속에 들고 있어야 한다.

**증명 끝 표시(∎)는 학회와 문서 클래스, 템플릿의 규약을 따른다.** LaTeX의 proof 환경이 표시를 자동으로 넣는다면 그 표시만 쓴다.

---

## 30.3 로보틱스·CV에서 자주 쓰는 수식

**SE(3)와 Lie group 표기.** $\mathbf{T} \in SE(3)$, $\boldsymbol{\xi} \in \mathfrak{se}(3)$처럼 쓴다. 한 논문 안에서 대소문자, 굵은 글씨, hat 표기를 통일한다. 회전행렬을 한 곳에서는 $\mathbf{R}$로, 다른 곳에서는 $R$로 쓰면 심사위원은 둘이 다른 양인지 따져 봐야 한다. [Ch.31](./chapter_31_notation_hygiene.md)에서 매크로로 통일하는 법을 다룬다.

**최적화 문제.**

$$\mathbf{x}^\star = \arg\min_{\mathbf{x}} f(\mathbf{x}) \quad \text{s.t.} \quad g(\mathbf{x}) = 0$$

`\text{s.t.}`와 `\text{subject to}` 가운데 하나를 골라 문서 전체에 쓴다. 처음 나올 때는 수식이 무엇을 뜻하는지 말로 한 번 풀어 쓴다.

**확률 수식.** $p(\mathbf{x} \mid \mathbf{z})$에서 `\mid`와 `|` 가운데 하나로 통일한다. Bayes filter의 단계마다 prior, likelihood, posterior가 무엇인지 말로 밝힌다. R6에서 말한 두 방식 정의가 여기에도 들어맞는다.

**잔차와 loss 정의.** $\mathbf{r}_i = \mathbf{z}_i - h(\mathbf{x})$ 같은 잔차를 정의할 때는 인덱스 $i$가 무엇을 도는지 말로 밝힌다. 예를 들어 "for each measurement $i \in \{1, \ldots, N\}$"처럼 쓴다. 인덱스만 적어 두면 독자는 무엇을 더하는지 짐작해야 한다.

**수식을 줄바꿈할 때 등호의 위치.** 문장 안의 수식은 등호 뒤에서 줄을 바꾸고, 따로 세운 수식은 등호 앞에서 줄을 바꾼다. Knuth가 §8에서 소개한 조판 관례다.

---

## 30.4 자기 유도 과정에 'blah' 테스트 해 보기

자기 원고에서 유도 과정이 담긴 페이지 하나를 골라, 간단한 수식만 남기고 나머지를 'blah'로 바꾸어 본다. 그래도 문장이 이어져야 한다. 흐름이 끊기는 곳이 수식 사이에 설명이 빠진 자리다.

Knuth는 §2에서 문체가 엉망인(atrocious) 학생 증명을 내놓고, §3에서 이를 다듬은 답안을 보여 준다. 발췌와 분석은 [`knuth_proof_rewrite.md`](./excerpts/excerpt_04_knuth_proof_rewrite.md)에 있다.

# Ch.31 — 표기 위생

[Ch.30](./chapter_30_math_and_proofs.md)에서는 문장 안에 수식을 넣는 법을 다뤘다. 이 장에서는 논문 전체에서 표기를 일관되게 지키는 법을 다룬다. 두 장 모두 [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1의 27개 항목에서 출발한다.

같은 기호가 다른 뜻으로 쓰이면 심사위원은 일부러 그렇게 쓴 것인지 오타인지 따져 봐야 한다. 그만큼 내용을 따라갈 힘이 줄어든다. 표기를 깔끔하게 관리하면 독자의 부담이 준다.

기호를 쓸 때마다 직접 입력하다 실수가 생기기도 한다. 매크로 없이 본문 곳곳에 $\mathbf{R}$을 직접 입력하다 보면 한 곳만 $R$로 적기 쉽다. 그러면 심사위원은 그것이 오타인지 의도인지 알 수 없다. 표기는 도구로 묶어 관리하는 편이 낫다.

---

## 31.1 Notation table: 기호를 한곳에 모은 표

**기호가 많다면 Method 앞부분에 notation table을 둔다.** [Ch.25 §25.2](./chapter_25_method.md)와 같은 권고이고, 표의 예시도 그 절에 있다. 예시의 네 열 가운데 필요한 것만 고른다.

**표 위치.** Method 앞부분이 아니어도, 독자가 기호를 처음 여럿 만나는 대목보다 앞이면 된다.

**한 기호에는 한 뜻만 준다.** $R$을 회전, residual, reward에 한꺼번에 쓰는 논문이 있다. [Ch.30 R8](./chapter_30_math_and_proofs.md)에서도 같은 것을 권했다. notation table을 만들면 이런 겹침이 눈에 띈다.

---

## 31.2 LaTeX 매크로로 표기 묶기

**자주 쓰고 나중에 바뀔 수 있는 표기를 매크로로 정의한다.** 기호를 매번 직접 입력하지 않고 매크로 한 줄로 정의해 두면, 그 한 줄만 고쳐 논문 전체에 반영할 수 있다. 한 번만 쓰는 기호까지 매크로로 바꾸면 TeX 원본이 오히려 읽기 어려워진다.

```latex
% 회전·변환 (Lie group)
\newcommand{\R}{\mathbf{R}}
\newcommand{\T}{\mathbf{T}}
\newcommand{\SE}[1]{SE(#1)}
\newcommand{\so}[1]{\mathfrak{so}(#1)}

% Bold vector
\newcommand{\xb}{\mathbf{x}}
\newcommand{\yb}{\mathbf{y}}
\newcommand{\zb}{\mathbf{z}}

% 통계
\newcommand{\E}{\mathbb{E}}
\newcommand{\Var}{\mathrm{Var}}
\newcommand{\Cov}{\mathrm{Cov}}
```

**매크로가 없으면 고치기 어렵다.** 회전 표기를 $\mathbf{R}$에서 $R$로 바꾸려면 매크로 정의 한 줄만 고치면 된다. 기호를 본문에 직접 입력한 논문은 찾아 바꾸기로 모든 곳을 고쳤는지 확신하기 어렵다. 한 곳을 놓치면 그대로 심사위원 눈에 띈다.

**매크로를 종류별로 묶는다.** Lie group, 굵은 vector, 통계, dataset 이름(`\KITTI`, `\TUM`)처럼 종류별로 묶어 두면 어떤 매크로가 있는지 찾기 쉽다.

---

## 31.3 단위와 차원

**모든 물리량에 단위를 적는다.** runtime이 ms인지 s인지, drift가 m인지 %인지가 본문과 표, 그림에서 모두 같아야 한다. 같은 metric의 단위가 표마다 다르면 심사위원은 표를 볼 때마다 단위를 환산해야 한다.

**단위를 적는 법.** 본문에서 처음 나올 때 `runtime ($\mathrm{ms}$)`, `drift ($\mathrm{m}$)`처럼 밝히고, 표와 그림의 축에도 적는다. 분야나 학회가 SI 단위를 요구하는지도 확인한다.

**차원을 밝힌다.** vector의 차원($\mathbb{R}^3$)과 matrix의 차원($\mathbb{R}^{m \times n}$)을 처음 나올 때 적는다. 독자가 본문에서 차원을 짐작해야 한다면 고쳐야 할 곳이다. notation table에 차원 열을 두면 빠뜨리지 않는다.

---

## 31.4 인덱스와 그 범위

**인덱스 변수는 한 뜻으로 쓴다.** 한 논문에서 $i$가 어떤 곳에서는 measurement를, 다른 곳에서는 camera view를 가리키면 심사위원은 어느 쪽인지 따져 봐야 한다. $i$를 measurement 인덱스로 정했다면 논문 끝까지 그 뜻으로 쓴다. Knuth도 point 14에서 특별한 이유가 없다면 같은 것을 가리키는 인덱스를 곳마다 바꾸지 말라고 했다.

**관례의 예.** 분야와 논문마다 다르지만 로보틱스와 CV에서는 흔히 이렇게 쓴다.

- $i$ — measurement / observation
- $j$ — landmark / keypoint / track
- $k$ — time / frame
- $n$ — count (총 개수)

한 논문 안에서 일관되기만 하면 이 예를 따르지 않아도 된다. 관례를 따르는 것보다 기호가 처음 나올 때 뜻과 범위를 함께 적는 것이 먼저다.

**합의 범위를 밝힌다.** $\sum_{i=1}^N$이라고 썼다면 $N$이 무엇의 개수인지 본문에서 한 번 밝힌다. Ch.30 §30.3의 잔차·loss 정의에서도 같은 것을 권했다.

---

## 31.5 분야별 기본 관례

분야마다 널리 쓰는 표기가 있다. 아래는 자주 보이는 예일 뿐 표준을 모두 모은 목록은 아니다.

**로보틱스/SLAM**: $\mathbf{T} \in SE(3)$ 변환, $\mathbf{R} \in SO(3)$ 회전, $\boldsymbol{\xi} \in \mathfrak{se}(3)$ Lie algebra, $\mathbf{p}$ point, $\mathbf{x}$ state, $\mathbf{z}$ measurement.

**CV**: $\mathbf{x}$ image coordinate, $\mathbf{X}$ world coordinate, $\mathbf{K}$ intrinsic, $\mathbf{P}$ projection.

**ML/통계**: $\theta$ parameter, $p(\cdot)$ distribution, $\mathcal{L}$ loss, $\mathcal{D}$ dataset.

새 표기가 관례와 부딪치면 독자가 헷갈린다. 예를 들어 $\mathbf{T}$로 training set을 가리키면, $\mathbf{T}$를 좌표 변환으로 읽어 온 심사위원은 볼 때마다 뜻을 바꿔 읽어야 한다. 새 기호는 널리 쓰는 관례와 겹치지 않게 고른다.

---

## 31.6 자기 진단

자기 원고에서 다음을 점검한다.

1. **기호 뽑아 보기.** 본문에 나오는 수학 기호를 모두 한 페이지에 뽑아 본다. 같은 기호를 두 뜻으로 쓴 곳이 있는지, notation table에 빠진 기호가 있는지 본다.
2. **단위 뽑아 보기.** 모든 표의 셀 값과 그림의 축 라벨을 뽑는다. 단위가 빠진 곳이 있는지, 같은 metric의 단위가 표마다 다른지 본다.

원고 전체를 훑는 점검은 원고가 어느 정도 굳은 뒤에 한다. 초고를 쓰는 동안에는 기호 목록을 함께 고쳐 나가고, 마지막 교정에서 빠진 것과 겹치는 것을 다시 확인한다.

---

**출처.** [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1 point 11(변수는 처음 나올 때 정의한다), point 14(한 표기를 두 대상에 쓰지 않고, 같은 대상에는 같은 표기를 쓴다). notation table, 매크로, 단위·차원·인덱스 점검은 이 장에서 이 두 항목을 넓혀 정리했다. 분야별 표기는 관례의 예일 뿐 지켜야 할 규정은 아니다.

# Ch.32 — 개정과 답변서

심사위원 의견을 처음 받으면 화부터 나기도 한다. "리뷰어가 내 논문을 제대로 안 읽었다"는 생각이 먼저 든다. 그 생각이 맞을 때도 있다. 다만 그 생각대로 답변서를 쓰면 답변서가 변호문이 된다.

심사위원의 의견은 내 글이 다른 사람에게 어떻게 읽혔는지 알려 주는 자료이기도 하다. 화만 내고 끝내면 그 자료를 버리는 셈이다. [임형태 박사](https://github.com/LimHyungTae/paper-writing-checklist)는 논문에서 "이 세상에 없던 지식을 타인이 읽고도 오해 없이 명확하게 이해할 수 있도록 하는 것이 무엇보다 중요"하다고 적었다. 심사위원이 오해했다면 그 목표에 아직 못 미친 것이다. 답변서는 이 전제에서 출발한다.

---

## 32.1 심사위원 의견의 네 유형

유형마다 답변의 어조와 본문을 고칠지가 달라진다. 의견을 먼저 유형별로 나눠야 comment마다 맞는 어조로 답할 수 있다.

**유형 1 — Factual error.** 수식, 실험 설정, 인용, 수치가 분명히 틀린 경우다. 오류를 그대로 인정하고 바로 고친다. 변호하려 들면 심사위원을 적으로 돌린다.

> "We thank the reviewer for catching this. Equation (7) was incorrect; the corrected derivation is now in §3.2 (page 5)."

**유형 2 — Presentation 요구.** 그림을 더하거나, 표를 다시 짜거나, 문장 순서를 바꾸거나, 정의를 밝혀 달라는 요청이다. 타당한 요청은 받아들이고 고친 위치를 정확히 알린다. 지면 한도를 넘으면 venue 정책이 허용하는 보충자료로 옮기거나 다른 부분을 줄일 방법을 찾는다. 받아들일 수 없는 요청이라면 지면 한계나 논문 범위(scope) 같은 구체적인 이유를 대고, 대신 할 수 있는 보완을 제시한다.

**유형 3 — Scope/contribution 의문.** "이게 왜 새로운가?", "X와 무엇이 다른가?" 같은 질문이다. 핵심 contribution을 한두 문장으로 다시 밝히고 인용과 실험으로 근거를 댄다. 본문의 서론과 Related Work도 보강한다. comment에만 답하고 본문을 그대로 두면 다음 심사위원도 같은 질문을 한다.

**유형 4 — 단순 오해.** 심사위원이 본문을 분명히 잘못 읽은 경우다. 내 글이 불분명했다고 인정하고, 본문 어디를 어떻게 고쳤는지 알린다.

> "We realize that §4.1 was not sufficiently clear; we have rewritten the paragraph to emphasize that …"

답변에서는 심사위원의 잘못("the reviewer misread X")을 짚기보다 본문을 고친 이야기를 한다. 심사위원 한 명이 잘못 읽은 곳은 다른 독자도 잘못 읽을 수 있으니 그 부분부터 다시 본다. 다만 comment가 원고에 없는 내용을 전제한다면, 해당 본문 위치를 들어 사실관계를 차분히 바로잡는다.

---

## 32.2 무례하게 들리는 단어 바꾸기

몇몇 단어는 답변서의 어조를 단번에 망친다.

**주의할 표현과 대안.**

- "outperform" — 임형태 박사는 이 단어를 논문에서 "절대로" 쓰지 말자고 했다. baseline 저자가 심사위원일 가능성이 높아서다. → "showed lower error"처럼 완곡하게 쓰고 metric·dataset·조건을 함께 적는다
- "fail to" — 심사위원의 행동에 쓰면 모욕으로 들린다. → "may have been unclear because"
- "obviously / clearly" — 독자를 무시하는 말로 들린다. → 지운다
- "the reviewer is mistaken" → "we have clarified that …"
- "as we already stated" — 짜증이 묻어난다. → "to make this clearer, we have added …"

[Ch.12 §12.2](./chapter_12_reader_expectations_diagnosis.md)에서 본 stress position 원칙이 여기에도 적용된다. 무례한 단어가 문장 끝에 오면 무례함이 더 두드러진다. 단어만 바꿔서 안 되면 문장을 통째로 다시 쓴다.

인사말이 길면 독자가 변경 사항에 늦게 닿는다. "We thank the reviewers for their comments."처럼 짧게 시작하고 곧바로 주요 변경 사항으로 넘어간다.

---

## 32.3 답변서의 세 부분

**첫 부분 — 감사와 변경 요약.** 5~8줄로 쓴다. 첫 줄에 한 문장으로 감사하고, 이어서 주요 변경(major change)에 번호를 붙여 적는다.

> "We thank the reviewers for their constructive feedback. The major changes are: (1) we added experiments on MulRan (§5.3), (2) we clarified the relation to Vizzo et al. 2023 (§2.2), (3) we corrected Equation (7) (§3.2)."

**둘째 부분 — 항목별 답변.** 심사위원별로 묶고, 그 안에서 comment별로 나눈다. comment마다 다음을 쓴다.

1. **Comment 원문.** italic이나 quote 블록으로 옮긴다.
2. **Response.** 우리의 답이다.
3. **Change in manuscript.** 본문 어디를 어떻게 고쳤는지 페이지, 섹션, 수식 번호로 적는다.

세 번째 항목은 빠지기 쉽다. 답변에 "we agree …"만 있고 본문에서 바뀐 곳이 없으면 심사위원이 변경 사항을 직접 찾아야 한다. 그러면 다음 round에 같은 comment가 다시 오기 쉽다.

**셋째 부분 — 마무리.** 한두 문장으로 쓰고, 인사는 한 번만 한다.

> "We hope these revisions address the reviewers' concerns."

**고친 본문 표시는 venue와 editor의 지침을 따른다.** 변경 추적 PDF, 색상 표시, clean manuscript 가운데 무엇을 요구하는지 확인한다. 따로 지침이 없으면 답변서에 변경 위치를 page·section·line으로 적는다.

**길이.** comment당 100~200단어는 이 장이 제안하는 출발점일 뿐 정해진 한계가 아니다. venue가 정한 전체 word·character 제한을 먼저 따른다. 답변이 길어지면 결론, 근거, 본문 변경 내용을 되풀이하지 않았는지 살핀다.

---

## 32.4 원고를 고칠 때 결론에서 피할 것

원고를 고칠 때 Conclusion과 Future work에서 거절 사유가 되풀이되기도 한다. [엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)은 Conclusion을 쓸 때 저지르는 실수와 영어 교정에 관해 다음과 같이 적었다.

- **Conclusion을 Abstract처럼 쓰는 실수.** Abstract는 논문을 읽지 않은 사람이 처음 읽는 글이고, Conclusion은 논문을 다 읽은 사람에게 전체를 정리해 주는 글이다. 그래서 Abstract는 문제 제기와 연구의 중요성·기여에, Conclusion은 실험으로 얻은 지식과 그 의의에 무게를 조금 더 두어야 한다.
- **Conclusion에서 새 이야기를 꺼내는 실수.** 본문에서 주장한 것보다 한 걸음 더 나아가는 것도 마찬가지로 부적절하다.
- **Future work에 너무 많은 것을 늘어놓는 실수.** 이 분야 사람들은 Future work가 "OOO은 안 했음"이라는 뜻임을 안다. 그래서 하지 못한 것을 방어하는 방법으로 좋지 않다. 연구의 한계는 결과 논의 끝에 솔직히 밝힌다.
- **원어민 영어 교정에 기대는 실수.** 교정자는 내용을 이해하지 못한 채 문법을 고치므로, 저자와 대화가 없으면 교정이 오히려 오해를 만들어 내기 일쑤다. 저자 스스로 좋은 영어를 쓰도록 노력해야 한다.

Whitesides도 Conclusions 절은 요약이 아니어야 하며, 한 단계 높은 분석을 더하고 연구의 의의를 밝혀야 한다고 했다. 심사위원의 지적이 결론에 들어갔어야 할 내용을 가리킨다면 답변서보다 본문의 그 부분을 먼저 고친다.

[최윤섭 박사의 「첫 번째 논문을 최대한 빨리 써라」](https://gradschoolstory.chkwon.net/yoonsup/first-paper/)에도 리비전 이야기가 나온다. 그가 주도한 논문은 출판한 저널에서 리비전을 세 번 거쳤고, 추가 실험과 논문 수정에만 6개월이 걸렸다. 그는 리뷰어의 지적에 어떤 논리와 실험으로 대응할지 정하는 전략이 중요하다고 했다.

심사위원이 ablation 실험을 더 요구했다면 AI에게 실험 설계 초안을 부탁할 수 있다. 내 모델이 baseline보다 무엇을 개선했는지 보이려면 어떤 ablation이 필요한지 묻는다. 결과 표가 나온 뒤에 그 표로 어떤 분석을 할 수 있는지 물어도 된다. AI는 내가 놓친 관점을 짚어 주는 보조 도구로만 쓴다.

> AI가 제안한 ablation을 그대로 본문에 넣지 않는다. AI는 내 연구의 contribution과 맞지 않는 ablation을 제안하기도 한다. 실험 설계는 연구자가 최종 판단한다.

AI가 만든 초안이 내 contribution 주장과 어긋나지 않는지 확인한다. 확인하면서 이 ablation이 contribution을 어떻게 뒷받침하는지 한 줄로 적어 답변서에 넣는다.

---

## 32.5 특수한 경우

**Major revision.** 본문을 크게 보강해야 하는 경우다. 이 장에서는 8~12주를 예로 들지만, 실제 기한은 editor letter에 적혀 있다. 감정이 가라앉을 시간을 둔 뒤 §32.1의 분류부터 시작하고, 공식 마감 안에 끝낸다.

**Minor revision.** 대개 사실, 표현, 설명을 국소적으로 고친다. 그래도 공식 기한과 필요한 검증에 맞춰 일정을 잡는다.

**Reject (with encouragement to resubmit).** decision letter가 허용하는 경로와 새 투고 요건을 확인한다. 심사 의견을 claim, evidence, scope 수준에서 반영한다. 같은 venue에 다시 낼지 다른 venue로 옮길지는 논문이 얼마나 바뀌었는지와 각 venue의 정책을 보고 정한다. 다시 내면 새 심사위원이 배정될 수도 있다.

**Conference rebuttal.** page·word·character 제한과 새 실험을 허용하는지는 venue와 연도마다 다르다. CVPR, NeurIPS, ICRA가 같은 규칙을 쓴다고 가정하지 말고 그해 author instructions를 확인한다. 답변을 supplementary에 둘 수 있는지도 공식 정책을 따른다.

**24시간 미루기.** 리뷰를 받은 뒤 첫 24시간은 답변을 쓰지 않는다. 화와 억울함이 가라앉은 뒤 §32.1의 분류부터 시작한다. conference rebuttal처럼 마감이 촉박하면 어렵지만, journal revision에서는 권한다.

---

## 32.6 마지막 점검 — 심사위원이 되어 답변서 읽기

답변서를 다 쓰면 되도록 시간을 두었다가 심사위원의 눈으로 다시 읽는다. 24시간은 일정의 예일 뿐 제출 규칙이 아니다. 다음을 확인한다.

먼저, 변호처럼 읽히는 곳이 있는지 본다. "we already stated", "the reviewer fails to", "this is obvious" 같은 말투가 남아 있지 않은지 확인한다.

다음으로, comment마다 Change in manuscript 항목이 채워져 있는지 본다. 이 항목이 빈 comment에는 아직 답하지 않은 것이다.

둘 다 문제없으면 답변서를 보낸다.
