# Ch.14 — 코드 동반 읽기

SLAM·CV 논문 가운데는 코드를 공개한 사례가 많지만, 공개가 모든 논문의 기본값이나 의무는 아니다. 공식 저장소가 있는 논문은 원고와 코드를 함께 읽을 때 구현 세부와 재현 조건을 더 깊이 확인할 수 있다. 같은 한 편이 두 학생에게 다른 깊이로 남는다.

[Ch.13](./chapter_13_reading_math_proofs.md)에서 dense math를 어느 패스에 어디까지 펼치는가를 정했다. 논문에 담기지 않은 디테일이 GitHub 저장소·issue tracker·PR comment에 자주 풀려 있는 만큼, 재구현 작정의 읽기는 논문만으로 끝낼 수 없다. 논문은 what을 적고, GitHub은 how를 담는다.

---

## 14.1 논문과 저장소의 거리

Keshav 3rd pass — virtual re-implementation — 은 논문을 바탕으로 저자의 가정과 작업을 재구성하는 읽기다. 공개 구현이 있는 논문에서는 코드와 issue tracker를 함께 살펴 이 읽기를 확장할 수 있다. 논문 §3 방법에 적힌 알고리즘의 골격과 실제 구현의 hyperparameter·동작 조건이 어떻게 이어지는지 확인하는 것이다.

학생이 자주 빠지는 함정은 공식 저장소가 있는데도 논문만 읽고 구현까지 이해했다고 결론을 내리는 일이다. 1st·2nd pass 뒤 저장소를 열지 않으면, 나중에 thesis의 baseline으로 실행할 때 필요한 환경·전처리·parameter 정보가 빠질 수 있다.

분야 senior가 자기 블로그에 해설형 자료를 남기는 이유도 같다. 김기섭 교수의 SLAM 14편 블로그(FAST-LIO Fast 한 이유·Pose-graph SLAM Tutorial 같은 형식)가 한 사례다. 논문만으로는 코드가 왜 이렇게 빠른지 잡히지 않을 때, issue·코드·직접 빌드 결과와 논문을 함께 보며 그 이유를 풀어 적은 형식이다. 이런 자료 한 편을 두 시간에 걸쳐 엮는 일은 senior가 하는 읽기 방식으로 자리 잡았다.

---

## 14.2 코드 동반 사이클 — 4단계 일주일

한 편을 재구현·실행 단계까지 끌고 가는 사이클은 네 단계로 잡을 수 있다. 아래 시간은 이 장이 제안하는 첫 계획값이며, 저장소 규모·dependency·hardware에 따라 크게 달라진다. 한 세션에 다 끝내려 들지 않고 단계를 나눈다.

**단계 1 — 논문 Keshav 1st·2nd pass (1-2시간).** GitHub은 아직 안 연다. 5 Cs 한 줄이 잡히고 초록의 broad-narrow-broad가 통과하는지 확인한 후 다음 단계로 넘어간다. 이 단계에서 논문의 맥락이 제대로 잡히지 않는다면, 무리하게 코드를 열기보다 논문 독해를 먼저 보완해야 한다.

**단계 2 — 저장소 둘러보기 (30분).** README·디렉토리 구조·entry script 위치를 한 번 훑는다. 이 단계의 출력은 어디서 시작해서 어디로 가는가의 한 줄 답이다. SLAM 코드라면 "main에서 sequential하게 관측을 받아 odometry 모듈로 넘기고 mapping이 받아 keyframe을 뽑는다" 같은 한 줄이 들어간다.

**단계 3 — 직접 빌드 + 한 번 돌려본다 (초기 예산 2-4시간).** docker 또는 native에서 빌드한다. 첫 build error에서 예산을 넘길 수 있다. CMake·OpenCV·CUDA·ROS 버전이 어긋나는지 확인하고, issue tracker에서 같은 환경의 보고가 있는지 찾는다. 알려진 함정이 모두 issue에 있다는 보장은 없다.

**단계 4 — 논문과 코드 1:1 대응 (2-4시간).** 논문 §3 방법의 한 단락이 코드의 어느 함수에 있는가? 매핑 노트를 만든다. 논문 안의 수식 2와 코드의 line 47-83이 짝지어지면 그 한 점이 본인 안에 박힌다. 다만 모든 단락·수식을 매핑하지 않는다. 단계 4의 매핑은 Ch.13 §13.2의 결정적 한두 줄이 코드에서 어디에 놓이는지 찾는 작업이고, 그 한두 점이 본인의 thesis가 돌아갈 좌표가 된다.

단계 1-4를 한 세션에 다 끝내려 들지 않는다. 규모가 큰 저장소는 실행과 대응표 작성만으로 여러 작업일이 들 수 있다.

---

## 14.3 issue·PR을 읽기 자료로 본다

GitHub issue tracker에는 사용자가 보고한 알려진 함정이 모인다. 본인이 build에서 막혔을 때 먼저 같은 오류를 검색하되, 답이 없거나 오래된 답일 가능성도 남겨 둔다. 같은 자료가 코드의 design 결정을 설명할 때도 있다. 왜 이 모듈을 multi-thread로 만들지 않았는지가 issue 토론에 남는 식이다.

PR comment에는 논문에 없는 디테일이 들어간다. 왜 hyperparameter A를 0.05가 아니라 0.1로 바꿨는가가 PR에서 한 줄로 풀려 있으면, 논문 §4 실험의 한 줄 "set α = 0.1"보다 더 많은 정보를 던진다. 논문이 실험 결과를 적은 글이라면, PR은 그 결과에 도달하기까지 거친 시도 중 살아남은 한 결정을 적은 글이다.

issue·PR은 막혔을 때뿐 아니라 단계 4 매핑 작업에서도 읽기 자료로 둔다. 정독의 양식은 단순하다.

| 항목 | 출력 |
|---|---|
| 닫힌 issue 상위 5개 | 자주 막히는 함정 + 처방 |
| merge된 PR 상위 5개 | 결정적 design 변경 이유 |
| open issue 상위 3개 | 현재 알려진 한계 |

이 세 출력은 논문의 limitation 섹션을 실제 구현과 사용 조건에서 보완하는 자료가 된다. 논문의 limitation 섹션이 저자가 설명한 한계라면, issue tracker의 open issue에는 사용자가 부딪힌 문제와 아직 확인되지 않은 보고가 함께 있다. 재현 여부와 적용 버전을 확인한 뒤 해당 시스템의 한계로 해석한다.

---

## 14.4 분야 쪽 논의 — 정전 저장소 1편이 우선

분야의 정전 저장소가 robotics-practice ch20 §20.6 유용한 GitHub 저장소에 정리되어 있다. SLAM 쪽이라면 ORB-SLAM3, FAST-LIO2, LIO-SAM, RTAB-Map이 머리에 놓이고, CV 쪽이라면 SAM, DINOv2, NeRF Studio, COLMAP가 같이 들어간다.

한 분야 신입에게는 대표 저장소 한두 편을 네 단계 사이클로 끝내고, 논문과 저장소가 지정한 benchmark에서 결과를 비교하는 작업이 유용하다. KITTI·TUM·EuRoC는 SLAM에서 널리 쓰이는 예지만, 센서 구성과 task가 본인 문제에 맞는지 먼저 확인한다. robotics-practice ch20 §20.7의 중급 마일스톤도 이 작업을 제안한다.

신입이 자기 코드를 처음부터 모두 짜기 전에, 대표 저장소 한 편을 끝까지 따라가면 셋업·디버깅·logging의 구체적인 예를 얻을 수 있다. 「대학원노트」 [Ch.11 「도구 함정」](../grad-notes/chapter_11_tool_trap.md)의 작게 시작하라 관점과 같은 결이다. 한 편을 실행해 본 뒤 그대로 쓸 부분과 바꿀 부분을 결정한다.

---

## 14.5 AI 보조 도구 — 코드 동반 읽기의 가속

논문과 코드의 1:1 매핑은 AI에 위임하기 좋다. "이 논문의 'we apply pre-integration on IMU measurements between keyframes' 줄이 코드의 어느 함수에 있는지 찾아줘" 같은 질문을 던지면, AI가 후보 함수 2-3개를 짚어 준다. 본인이 그 후보를 검증하면, 본인이 코드를 처음부터 grep하던 한 시간이 줄어든다.

PR comment의 분야 표현을 직역하다 막혔을 때도 AI가 한 번에 풀어 준다. PR comment의 영어는 분야 전문용어가 빽빽하고 비격식 어조가 섞여 있어, 본인이 한 단락을 다섯 번 읽고도 안 잡힐 때가 있다. AI에 "이 PR comment의 핵심 결정 + 그 이유를 한 단락으로 풀어 줘"를 던지면, 본인이 그 결정의 위치를 한 번에 잡는다.

AI가 만든 논문-코드 매핑은 본인이 한 번 더 검증한다. line 번호가 틀리거나, 비슷해 보이지만 실제로는 다른 함수를 짚을 수 있기 때문이다. 검증하지 않은 매핑을 노트에 남기면 나중에 thesis 근거를 되짚을 때 잘못된 위치를 따라갈 수 있다.

> 코드 작성 도구가 널리 쓰이는 지금도, 만 줄짜리 문서를 읽고 맥락을 파악하는 일은 사람에게 남아 있다. 잘 읽는 사람이 도구도 잘 다룬다.
>
> — robotics-practice ch22 §22.5

논문-코드 매핑에는 사람이 읽고 결정해야 하는 작업이 남는다. 코드는 AI가 짜고, 그 코드와 논문을 어떻게 짝지을지는 본인이 결정한다. 그 결정의 누적이 5년 후 본인의 분야 senior 위치를 만든다.

---

**출처.** [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf) §2.3 (3rd pass · virtual re-implementation), robotics-practice ch20 §20.4 (필독 논문 리스트)·§20.6 (유용한 GitHub 저장소)·§20.7 (중급 마일스톤)·ch22 §22.5 (AI 시대 참조). [김기섭 교수 SLAM 14편 블로그](https://gisbi-kim.github.io/) — 분야 정독+구현 사례. 「대학원노트」 [Ch.11 (도구 함정)](../grad-notes/chapter_11_tool_trap.md) — 작게 시작하라 관점 연결. 4단계 사이클, issue와 PR을 독해 자료로 활용하는 관점, AI 보조 도구 정책은 실무적인 코드 분석을 돕기 위해 본문에서 체계적으로 구성했다.

# Ch.15 — AI 시대의 노트와 인용 관리

읽은 논문의 세부 내용은 시간이 지나면 흐려진다. 3개월과 6개월 같은 고정 망각 주기에 근거가 있는 것은 아니다. 핵심은 언제 다시 꺼내 보더라도 왜 이 논문을 남겼는지 바로 확인할 수 있게 기록하는 일이다. 노트는 그 결정을 남긴다.

AI가 논문을 다시 열어 요약해 줄 수 있는 시대에는 긴 요약의 가치가 줄어든다. 대신 세 가지가 중요해진다. 어떤 claim이 있었는가. 그 claim의 근거가 논문 어디에 있었는가. 그 claim이 내 작업에서 어떤 결정을 바꾸는가. 이 세 가지는 AI가 대신 보관해 주지 않는다. 사람이 확인하고 적어 둬야 한다.

[Ch.9](./chapter_09_lit_survey_workflow.md)에서 자료가 입력 파이프라인으로 들어왔다면, 이제는 그 자료를 저장하고 재호출할 차례다. [Ch.8](./chapter_08_five_cs.md)의 5 Cs가 1st pass의 출력 양식이라면, 여기에 근거 위치와 결정 층위를 더한다.

---

## 15.1 노트 양식 — 5 Cs + 3 추가 칸

[Ch.8](./chapter_08_five_cs.md)의 5 Cs (종류·맥락·타당성·기여·명료성)가 한 편의 1st pass 출력이라면, 노트에 기록할 때는 그 위에 세 칸을 더한다.

**5+1 — 근거 위치.** 자기 글에서 쓸 만한 claim 하나와 그 claim의 위치를 적는다. 쪽·섹션·그림·표·식 번호 중 하나가 붙어야 한다. 원문을 그대로 인용해야 할 대목에 한해 짧은 발췌를 남기되, 대다수 내용은 연구자 자신의 언어로 재구성한 주장과 해당 위치를 기록하는 것으로 족하다. 나중에 서론을 쓸 때 필요한 것은 "이 주장을 어느 표가 받쳤는가"에 답하는 한 줄이다.

**5+2 — 본인 작업과의 거리.** 이 한 편이 자기 thesis와 어떤 관계인가? 네 분류가 있다. baseline 후보, related work, 반박 대상, 무관. 무관도 분류의 한 항목이다. 무관임을 적어두는 작업이 6개월 후 왜 이 한 편을 cite 안 했는가에 답하는 자료가 된다.

**5+3 — 다음 행동.** 중단·보류·진행 ([Ch.8 §8.6](./chapter_08_five_cs.md)의 결정 게이트). 진행할 경우 언제 다시 검토할지 구체적인 재방문 일정을 덧붙인다. 보류 큐에는 다시 돌아올 시점도 함께 적어야 한다. 그래야 해당 시점의 weekly digest 블록에서 그 자료를 다시 찾을 수 있다.

노트는 한 편당 한 페이지를 출발 상한으로 삼을 수 있다. 정독 자료가 필요하면 별도 파일을 만들고, 요약 노트에는 claim·근거 위치·내 작업과의 거리를 남긴다. 한 페이지는 편집 예시이지 보편 상한이 아니며, 중요한 것은 요약과 정독 자료의 역할을 구분해 나중에 정독 여부를 식별할 수 있게 하는 일이다.

노트 파일명은 저자-연도-키워드 형식이 검색 가능성이 높다. ASCII 키워드를 박는 편이 grep·검색에서 마찰이 적다. 분야 쪽 논의라면 `mur-artal-2015-orbslam.md` 같은 식의 키가 흔히 쓰인다.

---

## 15.2 인용 관리 — reference manager는 본체가 아니다

참고문헌 관리 도구는 원 출처의 서지 정보를 모아 인용 양식에 맞게 변환하는 데 쓴다. 서지 정보의 본체는 DOI·arXiv·OpenReview 및 학회와 출판사 페이지에 위치하며, 참고문헌 관리 도구는 이를 논문 양식에 맞춰 내보내는 포맷팅 계층 역할을 수행한다.

손으로 BibTeX를 typing하지 않는다. 자동 생성 출처는 DOI, arXiv, CrossRef, Semantic Scholar, OpenAlex, venue page다. Google Scholar의 export는 빠르지만 필드가 비거나 venue 정보가 거칠게 들어오는 일이 있으므로 최종본의 기준으로 두지 않는다.

자동 생성된 항목도 한 번은 본인이 확인한다. 확인할 것은 많지 않다.

| 항목 | 확인할 것 |
|---|---|
| ID | DOI 또는 arXiv ID가 맞는가 |
| 저자 | 첫 저자·마지막 저자·철자가 맞는가 |
| venue | 학회/학술지 이름과 연도가 맞는가 |
| 버전 | arXiv 사전 출판본인지, peer-reviewed version인지 구분되는가 |
| key | 같은 논문이 두 key로 중복되지 않았는가 |

참고문헌 관리 도구는 연구실 관행이나 공동 저자의 환경에 맞춰 쓰면 된다. 다만 그것이 노트 시스템의 중심이 되어서는 안 된다. PDF 파일과 주석을 많이 모았다는 사실은 지식이 쌓였다는 뜻이 아니다. 지식은 확인한 claim과 그로 인해 내 작업에서 바뀐 결정으로 남는다.

100편을 넘기는 라이브러리에서도 핵심은 도구 이름이 아니다. 같은 논문이 하나의 canonical key로만 존재하고, 인용 metadata가 source-of-truth URL과 연결되어 있고, build 단계에서 참고문헌 오류를 잡을 수 있으면 충분하다. reference manager는 그 조건을 만족시키는 여러 방법 중 하나다.

---

## 15.3 paper packet + AI 질의

한 편을 저장할 때의 단위는 PDF가 아니라 paper packet이다. packet에는 논문 URL, DOI/arXiv ID, PDF, 코드 저장소, project page, supplementary, OpenReview thread, dataset link가 들어간다. PDF는 그중 하나일 뿐이다. PDF 위의 표시는 임시 읽기 흔적으로 쓸 수 있지만, 재호출을 위한 claim·근거 위치·식별자는 별도로 남긴다.

AI 보조 도구는 세 갈래로 붙는다.

**갈래 1 — 0차 5 Cs 후보.** paper packet을 AI에 넣고 "5 Cs를 채우되 각 항목마다 근거 위치를 붙이고, 근거가 없으면 없음이라고 적어라"를 묻는다. 본인은 그 결과를 검증하는 작업으로 1st pass를 시작한다.

**갈래 2 — 참고문헌 후보.** 참고문헌 목록과 forward citation graph를 AI에 주고 "내 thesis 키워드와 가까운 5편을 고르되, 왜 가까운지 한 줄씩 적어라"를 묻는다. 다음 입력 pipeline의 후보가 거기서 만들어진다. 후보를 고르는 일은 AI에 맡길 수 있지만, 후보를 읽을지 말지의 결정은 본인이 한다.

**갈래 3 — related work 비교표.** 논문 A와 논문 B의 차이점을 한 표로 정리해 달라고 AI에 요청한다. 표의 칸은 방법·가정·데이터셋·metric·한계·내 작업과의 거리 정도면 충분하다. 본인이 source 위치를 확인한 후에만 그 표가 자기 글의 related work 단락의 골격이 된다.

AI가 만든 5 Cs 노트는 초안이다. 그대로 보관하지 않는다. 최종 노트에는 AI 문장을 남기는 대신, 본인이 확인한 claim과 위치를 남긴다. hallucination의 가장 위험한 형태는 그럴듯한 인용 위치다. section·표·식 번호가 맞지 않으면 그 항목은 버린다.

---

## 15.4 검색과 재호출 — 태그보다 질문

노트는 시간이 지나도 재호출될 수 있어야 한다. 검색은 태그 하나에만 의존하지 않고 plain text, citation key, DOI/arXiv ID, embedding search, grep을 필요에 따라 함께 쓴다. 그래서 태그 수보다 claim과 식별자가 들어간 검색 가능한 문장이 더 중요하다.

태그는 최소한으로 둔다.

| 축 | 값 |
|---|---|
| 분야 | slam · cv · dl · vfm · vla |
| 모드 | skim · read · implement · cite |
| 거리 | baseline · related · rebuttal · out |

세 축을 조합해 한 편을 분류하면, 내 thesis의 baseline 후보 SLAM 논문 5편을 한 번에 찾을 수 있다. 더 세밀한 분류는 related work 비교표에서 처리한다.

정기 청소에서는 claim ledger를 정리한다. 한 달에 한 번 30분은 이 장이 제안하는 출발 예시다. 노트에서 서로 충돌하는 claim, 같은 baseline을 공유하는 논문, 내 hypothesis를 바꾼 논문을 각각 한 줄씩 뽑는다. "논문 A와 논문 B는 모두 가정 X에서 시작하지만 metric Y에서 갈라진다" 같은 한 줄이, 본인의 thesis가 놓일 곳을 만들어 간다.

흥미로운 한 편이 노트에 박힌 채 사용되지 않으면 그 한 편이 없는 것과 같다. Whitesides가 글쓰기 관점에서 적은 한 줄 — "어떤 프로젝트도 결코 '완료'되지 않는다. 흥미롭지만 미발표인 것은 존재하지 않는 것과 같다" — 이 노트 시스템에서도 같은 명제가 된다. 읽은 것을 글로 옮기지 않으면, 읽기는 금방 사라진다.

노트 → 글쓰기로의 흐름은 단순하다. 자기 논문의 related work 한 단락은 관련 노트를 골라 한 표로 묶는 작업에서 시작할 수 있다. 예를 들어 관련 논문 6편을 묶어 볼 수 있지만, 필요한 범위는 claim에 따라 달라진다. 표의 각 칸 — 방법·가정·한계·본인 작업과의 거리 — 이 단락의 문장으로 풀려 나간다. 이 흐름은 [Ch.23 (Introduction)](./chapter_23_introduction.md)·[Ch.24 (Related Work)](./chapter_24_related_work.md)에서 다시 쓰인다.

노트는 자료를 담은 외장 working memory에서 thesis의 글 골격으로 옮겨 간다. 기간·편수·문장 수의 고정 대응은 없다. 직접 확인한 claim과 근거 위치가 있는 노트만 논문의 related work와 가설 설계에 들어간다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §I (in-progress vs published — "흥미롭지만 미발표인 것은 존재하지 않는 것과 같다") — 노트 시스템의 관점 거울. [Ch.23 (Introduction)](./chapter_23_introduction.md) — 노트 → 글쓰기 흐름의 출구. 5 Cs에 세 칸을 더한 확장 노트 양식, paper packet의 구성 요소, AI 보조 도구의 검증 기준, claim ledger 운영법은 연구 노트의 축적과 활용을 돕고자 본문에서 새로 설계한 프레임워크다. 페이지 상한·정기 점검 시간·비교 편수는 본문에 밝힌 편집 예시다.

# Ch.16 — 마음가짐

글쓰기는 정해진 형식 안에서 같은 단위를 반복해 쌓는 일이다. 재미없고 체계화된 절차에 가깝다. Part 2에서는 마음가짐, outline, 시간 배분, CCC, 소제목·결론, 단락 흐름을 차례로 다룬다.

논문을 처음 쓰는 학생이 가장 먼저 버려야 할 것은 학부 시험의 채점 방식이다. 학부 시험에는 100점이라는 천장이 있었지만, 논문에는 그 천장이 없다. 만점이 없는 글에 만점을 노리면 수정이 한없이 길어진다.

같은 권고를 다른 각도에서 풀어낸 글이 [최윤섭 박사 「첫 번째 논문을 최대한 빨리 써라」](https://gradschoolstory.chkwon.net/yoonsup/first-paper/)다. 실험 능력과 논문 출판 능력은 같지 않다. 실험과 집필·투고에는 서로 다른 경험이 필요하므로, 출판 과정도 일찍 겪어 볼 이유가 있다. 박사 말년에 첫 논문을 처음 시도하면 졸업 지연 위험이 그대로 따라온다.

> "방귀도 자꾸 뀌어야 똥이 나온다."

최윤섭 박사는 이 한 줄로 첫 논문을 작은 단위로 자주 시도해 글쓰기 회로를 트라고 권한다. 같은 글의 일화(첫 논문 수락까지 계획보다 2년 초과, 3회 리젝, 6개월 리비전)는 첫 결실이 맺어지기까지 거쳐야 하는 현실적인 시간 곡선을 가감 없이 보여 주는 사례다. 이러한 지난한 과정은 완벽한 만점을 기대하는 수험생식 사고방식과 정면으로 배치되기 마련이다. 리비전 중 추가 실험에 약 2개월을 쓴 이 일화에서 드러나는 대응 원칙은 [Ch.32](./chapter_32_revision_rebuttal.md)에서 다룬다.

---

## 16.1 Reject의 complement

acceptance rate와 심사 절차는 venue·track·연도마다 다르다. 이 절의 "reject의 complement"는 특정 합격률을 사실로 두는 모형이 아니라, 기여를 주장하는 동시에 치명적인 결함도 먼저 줄이라는 점검 태도다.

이 점검 태도로 글쓴이의 우선순위를 정해 볼 수 있다. 먼저 reject 사유를 줄여야 한다. [임형태 박사](https://github.com/LimHyungTae/paper-writing-checklist)는 이 마인드를 "accept를 노리는 것이 아니라 reject의 complement를 노리는 것"이라 정리했다.

reject 사유는 거창하지 않다. notation 불일치, baseline 비교 누락, 그림 1이 한눈에 메시지를 전달하지 못하는 문제, "ensure consistency" 같은 vague phrasing의 반복이 그 사례다. 이 중 하나만 있어도 reject 사유로 잡힌다.

[김기섭 교수 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html)가 같은 권고를 견고한 기초의 관점으로 적었다.

> "첫 논문에서 Nature를 노리는 것보다, '리젝 이유가 없는 논문'을 목표로 하는 편이 현실적이다."

화려한 novelty와 빈틈없는 완성도는 순서 문제다. 첫 논문에서 둘을 동시에 노리면 reject 사유가 늘어나고, 빈틈없는 완성도부터 잡은 학생은 다음 논문에서 novelty를 더 위에 올릴 수 있다. 같은 글의 "하나의 논문에는 하나의 핵심 메시지만"이라는 권고도 같은 관점에서 나왔다. 두 메시지가 한 논문에 섞이면 두 곳에서 reject 사유가 동시에 자란다.

---

## 16.2 form 안에서 작업한다

논문은 형식의 비중이 큰 글이다. 새로운 형식이 가치가 되는 소설·시와 다르다. 첫 논문에서 그림 디자인이나 문장 구조에 새로운 시도를 한 학생이 reject 사유를 스스로 만든 사례가 흔하다.

해결책은 좋은 본보기를 정해 구조를 분석하는 일이다. 인용 수에 고정 문턱을 두기보다 본인 문제와 가까우며 명료하게 쓰인 대표 논문을 고른다. 임형태 박사는 박사 시절 [He et al. 2016](https://arxiv.org/abs/1512.03385) ResNet 논문의 문단을 필사하며 영어 글쓰기를 익혔다고 적었다.

분야별 추천도 있다. 로보틱스라면 [Cyrill Stachniss 그룹](https://scholar.google.com/citations?user=8vib2lAAAAAJ&hl=en) 논문이 자주 추천된다. "논문은 이야기책처럼 술술 읽혀야 한다"는 확고한 신조 아래, 구조 설계부터 문장 다듬기까지 명료성을 일관되게 관철하는 그룹으로 잘 알려져 있다.

[엄태웅 대표 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)는 같은 권고를 이렇게 옮겼다.

> "일단 쓰기부터. 영어가 어렵다면 한글로라도."

[Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §I의 "start writing early" 권고가 한국어 문맥에 그대로 옮겨진 한 줄이다. 영어 문장을 다듬느라 내용을 적는 단계가 늦어지는 것은 한국 연구자가 자주 빠지는 함정이다. 한글 초고를 거쳐도 좋다는 권고가 그 함정 앞에 놓인다.

---

## 16.3 교정은 도구와 나눈다

원고의 오타·수일치·인덱스 오류·인용 누락·깨진 참고문헌 같은 결함은 본인이 꼼꼼하다는 자기 평가만으로 잡히지 않는다. 한두 종류의 결함이 생기기 쉬우므로 한 사람의 눈만 믿어서는 안 된다.

그래서 도구와 나누어 확인한다. LaTeX는 표기 일관성을, Grammarly는 문법을, ChatGPT는 줄 단위 교정을 맡는다. ChatGPT를 쓸 때는 전체를 한 번에 넘기지 않고 한 섹션씩 LaTeX 원본 코드를 제공하는 편이 더 정확하다. 아래는 임형태 박사가 공유한 프롬프트다.

```
아래는 논문의 ${SECTION} 부분이야

(본문 내용)

위 문장들에서 오탈자, 수일치, 문법 오류만 line-by-line으로 알려 줘.
%로 시작하는 줄은 주석이므로 무시.
```

공동 저자에게 원고를 보내기 전에 본인이 먼저 표면 오류를 점검하는 것은 협업자의 시간을 아끼는 기본 예절이다. 이 단계를 건너뛰면 공동 저자가 논리보다 오탈자·표기 오류를 먼저 잡느라 시간을 쓰게 된다.

---

## 16.4 영어 수준과 글쓰기 스타일

영어 과학 글쓰기에서 능동태와 `we`는 허용되며, 무조건 수동태로 바꿀 필요는 없다. [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1 point 6은 저자와 독자가 함께 논의를 따라간다는 뜻의 `we`가 수동태를 피하는 데 유용하다고 설명한다. 다만 `we`를 `I`의 형식적 대체어로 쓰지는 말라고 단서를 붙인다.

문장의 수준을 가늠할 때 '원어민 수준' 같은 막연한 감각에 매달리기보다, 연구팀의 스타일 가이드와 문장이 수행하는 기능적 명확성을 확고한 기준으로 삼아야 한다. 지도교수·공동 저자와 능동태, 대명사, 용어 표기를 미리 합의하고 원고 안에서 일관되게 쓴다. 의미가 달라지거나 문장이 불명확해지는 선택에는 근거를 들어 의견을 낸다.

---

## 16.5 Context-Content-Conclusion 단락 구조

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 3은 단락의 기본 구조로 Context-Content-Conclusion을 제안한다. 첫 문장은 맥락, 본문은 내용, 마지막 문장은 결론을 담는다. 저자들은 같은 패턴을 단락 → 섹션 → 논문 전체로 확장한다.

단락 길이는 진단 신호일 뿐 규칙이 아니다. 유난히 길거나 짧은 단락은 맥락·내용·결론 가운데 무엇이 빠졌는지 확인한다. 한 줄로 메시지를 답할 수 없는 단락에는 두 메시지가 섞여 있을 수 있으므로 둘로 나누어 점검한다.

---

## 16.6 읽히는 빈도와 시간 배분

논문에서 제목·초록·그림은 본문보다 더 많은 독자에게 노출되고, 방법은 상대적으로 적게 읽힌다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 9는 이 차이에 맞춰 시간을 배분하라고 권한다. 원문은 제목 한 시간, 초록 두 시간 같은 고정 시간표를 제시하지 않는다.

점검용으로 시간을 기록해 보면 방법에 거의 전부를 쓰고 제목·초록·그림은 마감 직전에 다루는 불균형이 드러날 수 있다. 이때는 특정 90:10 비율을 기준으로 삼지 말고, 제목·초록·그림·outline에 별도 작업 시간을 먼저 예약한다.

# Ch.17 — 아웃라인부터 시작하기

[George Whitesides의 "Writing a Paper" (2004)](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 글쓰기를 연구의 기획 도구로 정의한다. Whitesides는 데이터가 다 모인 뒤에야 논문을 쓰기 시작하면 이미 늦었다고 진단했다.

---

## 17.1 아웃라인을 데이터 구조로 다루기

Whitesides가 글쓰기의 시작점으로 잡는 단계는 "mostly plan"이다. 가설은 있고 데이터는 거의 없는 단계. 이 시점에 outline을 처음 쓰고, 데이터가 들어올 때마다 outline을 다듬는다. "mostly outline"에 도달했을 때 비로소 본문을 시작한다.

이 과정에서 outline은 연구의 구조 자체가 된다. Whitesides는 outline 항목이 짧은 구로 남아 있어야 한다고 적었다. 완전한 문장으로 쓰기 시작하면 이미 글쓰기 모드에 진입한 것이고, 그 시점부터 구조 변경 비용이 갑자기 올라간다.

그래서 데이터를 채워 넣을 칸에는 `[DATA NEEDED]`나 `[HYPOTHESIS]` 같은 마커를 그대로 남긴다. 빈 칸이 보여야 어떤 실험이 빠졌는지 드러난다. outline-as-data라는 표현이 이 점을 가리킨다.

---

## 17.2 7-슬롯 골격

Whitesides가 §I에 제시하는 outline 슬롯의 순서는 다음과 같다.

1. Title
2. Authors
3. Abstract — 나중에
4. Introduction
5. Results & Discussion (combined)
6. Conclusions
7. Experimental

Abstract를 마지막에 쓰는 이유를 Whitesides는 직접 적었다. 본문이 안정되기 전에 쓴 초록은 "이 논문이 무엇을 말하는지"에 대한 거짓말이 되기 쉽다는 진단이다. 본문이 두 번 이상 크게 흔들릴 수 있는 단계라면 초록은 보류하는 쪽이 안전하다.

Introduction에는 다섯 가지 요소가 들어간다. (a) objectives, (b) justification, (c) background, (d) reader guidance, (e) summary preview. Whitesides는 첫 단락 또는 두 번째 단락까지는 outline 단계에서도 완성된 문장으로 쓰라고 권했다. 본문 전체의 톤이 여기서 정해진다.

Results & Discussion은 합쳐 쓰되 중요도순으로 배치한다. "독자는 당신이 거기에 어떻게 도달했는지에 관심이 없다"는 표현이 §I에 박혀 있다. 시간순은 연구실 노트의 순서고, 논문의 순서가 아니다.

Conclusions는 한 단계 위의 분석이다. [Ch.20](./chapter_20_subheadings_and_conclusions.md)에 그 정의의 적용법이 있다.

---

## 17.3 4-5회 반복 주기

Whitesides는 자신들의 원고 작성에서 outline에 합의하기까지 보통 4-5회를 반복한다고 적었다. 이 횟수는 해당 그룹의 사례이지 모든 논문에 적용할 고정 규칙이 아니다. 핵심은 한 번에 확정하지 않고 가설·그림·필요한 실험이 맞물릴 때까지 outline을 반복한다는 데 있다.

Whitesides는 보통 4-5회 반복한다고 적지만 회차별 작업을 아래처럼 고정하지는 않았다. 작업 계획을 돕기 위해 결정을 다음처럼 나눈다.

- **1회차.** 가설과 핵심 결과를 7-슬롯에 거칠게 박는다. 대부분의 칸은 `[DATA NEEDED]` 또는 `[HYPOTHESIS]` 마커로 남는다.
- **2-3회차.** 그림과 표를 슬롯에 끼워 넣는다. 이 단계에서 빠진 실험이 자주 드러난다. 추가 실험을 결정하는 시점이 보통 여기다.
- **4-5회차.** subheading을 claim-style로 다듬고, 슬롯 사이의 흐름을 점검한다.

회차 사이 24시간은 휴식과 거리 두기(cooldown)를 위한 출발값이다. 같은 날 다시 보더라도 새 데이터나 공동 저자 의견이 들어왔다면 의미가 있고, 마감과 실험 주기에 따라 간격을 조정한다.

---

## 17.4 미발표 결과는 존재하지 않는 것과 같다

Whitesides는 §I에 "Interesting and unpublished is equivalent to nonexistent"라고 적었다. 흥미롭지만 발표되지 않은 결과는 존재하지 않는 것과 같다는 뜻이다.

이 진단은 outline 단계에 직접 작용한다. 한 논문에 모든 데이터를 우겨넣으려는 충동을 제어한다. outline에서 이번 논문에 들어가지 않을 결과를 명시적으로 빼내고, 다음 논문의 씨앗으로 따로 보관한다.

기준은 단순하다. 오직 핵심 가설과 직접 맞물리는 결과만을 본문에 수록하고, 나머지 결과는 다음 연구를 위한 아웃라인으로 돌려 보관한다. Whitesides는 이를 "good science is opportunistic and revisionist"로 적었다.

---

## 17.5 골조와 흐름은 층위가 다르다

Whitesides의 outline-first 방법과 [Joshua Schimel의 Writing Science (2012)](https://global.oup.com/academic/product/writing-science-9780199760244)의 story-first 방법이 충돌한다는 인상을 받는 학생이 있다. Whitesides는 데이터에서 올라오는 상향식 골조를, Schimel은 서사 구조(OCAR/ABDCE)를 먼저 권한다는 차이에서다.

둘은 층위가 다르다. Whitesides의 접근이 슬롯 단위의 뼈대를 세우는 공정이라면, Schimel의 방법론은 그 뼈대 위에 서사적 긴장감과 매끄러운 전개를 입히는 작업이다. 초반에 Whitesides의 슬롯으로 누락을 살피고, 후반에 Schimel의 서사 구조로 흐름을 점검하는 방식이다. 회차 번호는 프로젝트마다 달라진다.

층위가 다르다는 입장의 근거는 Whitesides 자신이 §II에서 "good papers tell stories"를 인정했다는 점이다. 다만 그가 권하는 시작점이 outline 골조라는 차이일 뿐이다.

---

## 17.6 도입 문단을 따라 써 보기

[KISS-ICP (Vizzo et al., RA-L 2023)](https://arxiv.org/abs/2209.15397)의 Introduction 도입부는 Whitesides의 요소를 추적해 볼 사례다. 첫 단락과 이어지는 기여 설명에서 objective, justification, background, 독자 안내, 결과 preview가 어디에 놓이는지 표시한다. "we show that point-to-point ICP, configured carefully, suffices"라는 문장은 연구 결과를 압축해 보여 주는 summary claim에 해당한다. 이는 논문 후반부의 목차를 안내하는 reader guidance와 명확히 구분해야 하는 요소다.

발췌의 [`kiss_icp_intro_hook.md`](./excerpts/excerpt_01_kiss_icp_intro_hook.md)에 발췌와 분석이 들어 있다. outline 골조가 글로 변하는 과정을 한 번 따라 써 보면 좋다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §I outline structure, §II actionable rules. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 9 (연결). [Schimel 2012](https://global.oup.com/academic/product/writing-science-9780199760244) (사이드바 비교용). 24h cooldown과 KISS-ICP 적용은 본문에서 정리.

# Ch.18 — 시간 배분과 피드백 루프

방법 섹션을 오래 다듬었는데도 심사 의견이 제목·초록·큰 그림의 불명확성을 먼저 지적할 수 있다. 가장 많이 노출되는 부분과 가장 많이 다듬은 부분이 어긋난 결과다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 9와 rule 10이 이 어긋남을 정면으로 다룬다.

---

## 18.1 가장 많이 읽히는 것에 가장 많이 투자한다

Mensh-Kording rule 9는 독자 노출도의 비대칭성에 주목한다. 제목과 초록, 그림은 논문 전체에서 가장 폭넓은 독자층을 만나지만, 방법 섹션은 재현이나 세부 구현을 검토하는 소수의 독자만 읽는 경향이 짙다. 원문은 1000명·100명·5명 같은 독자 수를 제시하지 않는다. 독자 수를 임의로 만들기보다 실제 page view를 알 수 없는 상황에서도 노출 순서가 다르다는 점만 시간 배분에 반영한다.

다음 순서를 첫 점검표로 삼는다. 분야와 원고 종류에 따라 조정한다.

> Title > Abstract > Figure(특히 Fig 1) > Outline > Introduction > Results > Discussion > Method > Related Work

방법을 읽는 독자가 상대적으로 적다는 설명이 방법을 부정확하게 써도 된다는 뜻은 아니다. 정확성은 유지하되 윤문에 시간을 쓰지 말라는 권고에 가깝다. 방법의 목적은 재현이다.

---

## 18.2 비율 가이드

논문 한 편의 글쓰기 시간을 100%로 보면 다음 비율을 하나의 출발점으로 삼을 수 있다. 이는 Mensh-Kording 원문의 수치라기보다, 효율적인 작업 계획을 돕기 위한 실무적 권장 지표다.

| 항목 | 비율 |
|---|---|
| Title + Abstract | 15-20% |
| Figures (특히 Fig 1과 main result figure) | 25-30% |
| Outline iteration ([Ch.17](./chapter_17_outline_first.md)) | 15-20% |
| Introduction | 15% |
| Results & Discussion | 10-15% |
| Method + 부록 | 5-10% |

경고용 반례는 방법에 절반 넘는 시간을 쓰면서 Title·초록·그림에는 합쳐 10%만 쓰는 계획이다. 이 수치는 실제 통계치라기보다 흔히 저지르는 시간 배분의 불균형을 가시화한 예시다. 본인의 실제 작업 시간을 기록해 같은 편향이 있는지 확인한다. 학부 시험 답안에서는 풀이 과정이 점수를 받지만, 논문에서는 방법이 결과를 정당화하는 여러 요소 중 하나다.

---

## 18.3 Test reader 운영법

Rule 10은 여러 사람에게서 피드백을 받고 story·outline·문장을 반복해 고치라고 권한다. 원문이 "같은 사람에게 여러 번 보여 주지 말라"고 규정하지는 않는다. 초기 독자의 생생한 반응을 확인하기 위해 단계별로 새로운 테스트 리더를 참여시키며, 기존 공동 저자를 통해서는 논리 전개의 개선 추이를 점검한다.

단계별로 독자를 달리한다.

- **Outline 단계** — 같은 분야 동료 1명. 구조가 말이 되는지를 검증한다.
- **초고 단계** — 다른 세부 분야 동료 1명. gap funnel이 자기 분야 밖에서도 작동하는지 검증한다.
- **수정 단계** — 비전공 대학원생 1명. 초록만 보여 주고 "이 논문이 무엇을 푸는지 한 문장으로 말해 달라"고 요청한다.

독자에게 "이 부분 괜찮아?" 같은 닫힌 질문을 던지면 의례적인 답만 돌아오기 쉽다. 대신 "이 논문이 무슨 문제를 푸는지 한 문장으로 설명해 달라"는 식의 재구성 질문을 건네야 글의 전달력을 제대로 검증할 수 있다.

---

## 18.4 막연한 피드백의 진단

독자에게서 막연한 답("좋네요", "뭔가 어렵다", "잘 모르겠다")이 돌아오면 큰 그림이 전달되지 않았다는 신호다. 구조 수준의 결함을 단어로 고치려는 대응은 잘못된 곳을 손보는 일이다. 단어를 다듬어도 구조가 그대로면 다음 독자도 같은 막연한 답을 돌려준다.

진단 분기는 다음과 같다.

- "초록만 보고 무슨 논문인지 모르겠다" — Title·초록 전면 재작업. [Ch.22](./chapter_22_title_abstract.md)에서 다룬다.
- "왜 이게 중요한지 모르겠다" — Introduction의 gap funnel 결함. [Ch.23](./chapter_23_introduction.md)에서 진단법을 다룬다.
- "방법은 알겠는데 결과가 와닿지 않는다" — Results의 declarative subheading을 먼저 점검한다. [Ch.26](./chapter_26_results_discussion.md)에서 처방한다.

각 분기는 구조 단위의 재작업을 요구한다. 단어 수준에서 멈추면 같은 reject가 반복된다.

---

## 18.5 피드백 빈도와 간격

Outline 반복과 초고 수정 사이에 간격을 두면 직전에 쓴 문장의 잔상에서 벗어나는 데 도움이 된다. outline 사이 24시간, 초고와 수정 사이 48시간을 일정의 출발값으로 둘 수 있지만 보편적인 최소 시간은 아니다. 마감과 협업 주기에 맞춰 조정한다.

마감 직전 새 독자를 투입할 때는 큰 구조 변경을 처리할 시간이 있는지 먼저 본다. 일반적으로 마감 일주일 전부터는 논문의 거시적 구조를 동결한 뒤, 원고를 이미 숙지한 공동 저자와 함께 표면적 오류를 최종 점검한다. 다만 venue 일정과 팀 규모에 따라 이 잠금 시점은 달라진다.

---

## 18.6 반복해서 점검할 신호

섹션별 수정 횟수의 불균형, 초록보다 방법만 계속 고치는 패턴, 피드백이 단어 수준에만 머무는 패턴은 §1 우선순위 위반의 신호다. 단락 수준의 결함은 비교적 빨리 보이지만, 섹션·논문 전체의 결함은 독자를 바꿔 다시 봐야 한다.

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 9 (시간 배분), rule 10 (피드백 루프). [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) (cooldown 정신 차용). 시간 배분 비율 지표와 단계별 피드백 운영법, 진단 분기표, 마감 전 쿨다운 절차는 집필 효율을 극대화하고자 본문에서 체계적으로 정리한 기준이다.

# Ch.19 — CCC: 단락·섹션·논문의 프랙털

한 단락도 잘 닫지 못하는 학생이 논문 전체를 닫아야 한다는 요구를 받는다. 닫는 문제가 같은 형태로 세 번 반복된다는 점만 보이면 처방은 한 가지로 줄어든다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 3이 그 한 가지를 Context-Content-Conclusion(CCC)으로 정식화했다.

---

## 19.1 독자의 두 질문

독자가 한 단락이나 섹션을 읽기 시작할 때는 두 가지 질문을 동시에 던진다. "왜 이걸 읽고 있지?"와 "그래서 어쩌라고?"다. 앞 질문은 context가 없어서, 뒤 질문은 conclusion이 없어서 생긴다. CCC는 두 질문에 동시에 답하는 최소 골격이다.

신입생들이 자연스럽게 따라가는 구조는 시간순(chronological)이다. "처음에 A를 시도했는데 실패했고, 그래서 B로 갔는데 이건 또 다른 문제가 있어서, 결국 C에 도달했다." 이 구조는 연구실 노트에는 적합하지만, 논문에서는 핵심 claim과 근거의 논리 순서를 가릴 수 있다. Mensh-Kording rule 3은 글쓴이가 자신의 작업을 시간순으로 기록하고 싶어 하는 것은 자연스럽지만, 독자는 결과에 도달한 경로보다 최종 claim과 그것을 받치는 논리에 관심이 있다고 적는다.

CCC가 시간순의 대안으로 들어선다. 첫 문장에서 context를 박고, 본문에서 novel content를 풀고, 마지막 문장에서 takeaway를 닫는다. 시간순이 과정을 그대로 노출한다면, CCC는 과정의 결과만 전달한다.

---

## 19.2 세 층위의 프랙털

같은 패턴이 단락·섹션·논문 세 스케일에 그대로 반복된다.

- **단락.** 첫 문장 = topic/context. 가운데 문장들 = novel content. 마지막 문장 = takeaway.
- **섹션.** 도입 1단락 = 섹션의 목적과 위치. 본문 단락들 = develop. 마무리 단락 = land.
- **논문 전체.** Introduction = context. Results = content. Discussion = conclusion.

세 스케일 어느 한 곳이라도 깨지면 fractal이 무너진다. 단락이 잘 닫혀 있어도 섹션이 시간순이면 독자는 길을 잃는다. 섹션이 CCC를 따라가도 단락마다 첫 문장이 결과로 시작하면 독자는 매번 "왜 이걸 읽지?"를 다시 묻는다.

세 층위의 반복은 인지 부하를 줄인다. 같은 골격을 세 번 반복하면 독자의 작업 기억은 같은 패턴을 인식하며 논문 전체를 따라간다. 패턴이 모든 층위에서 일치할 때 인식 비용이 가장 낮다.

---

## 19.3 초록 — 완결된 CCC

초록은 세 요소 모두를 짧은 자기완결 단위 안에 담아야 한다. 한 문단이든 venue가 허용한 여러 문단이든 context·content·conclusion이 초록 안에서 닫혀야 한다. Mensh-Kording rule 5는 이를 "key fits its lock" 비유로 적었다. 결과(key)가 갭(lock)에 정확히 들어맞아야 초록이 완성된다는 뜻이다.

이 비유는 작업 순서에도 적용된다. 초록을 처음에 쓰면 lock(갭)이 흔들리는 동안 key를 깎는 일이 된다. 본문이 안정된 뒤에 초록을 쓰는 [Whitesides의 권고](./chapter_17_outline_first.md)와 같은 결론에서 만난다.

초록의 자기완결성은 다른 섹션과의 차이도 만든다. 섹션 단위에서는 다음 섹션의 도입이 이전 섹션의 결론을 이어받지만, 초록은 자기 안에서만 닫혀야 한다. 외부 참조가 초록에 들어가면 자기완결성이 깨진다.

---

## 19.4 Tension — 문장 stress vs 단락 CCC

[Gopen & Swan 1990](https://www.americanscientist.org/sites/americanscientist.org/files/20053191534_306.pdf)의 stress position 규칙은 새 정보를 문장 끝에 둔다. Mensh-Kording rule 3은 takeaway를 단락 끝에 둔다. 두 규칙은 같은 "끝"을 서로 다른 층위에서 가리킨다. 처음에는 충돌처럼 보일 수 있지만 실제로는 충돌하지 않는다.

독자의 기대가 끝에서 충족된다는 한 원리가 문장과 단락 양쪽에 작동한 결과다. 단락의 마지막 문장 안에서도 stress position 규칙은 그대로 살아 있고, 그 문장의 끝에 단락 전체의 takeaway가 놓인다.

둘 다 끝을 노린다. 층위가 다르고 끝이 가리키는 단위도 다르지만, 독자의 기대 방향은 같다. 충돌하지 않는 두 규칙이 단락의 마지막 문장 끝에서 만난다.

---

## 19.5 흔한 실수 5종

CCC가 깨지는 패턴은 비교적 정형화되어 있다.

- 단락 첫 문장에 결과부터 박는 경우 — context 슬롯이 비어 있고, 독자는 "왜 이걸 읽지?"를 묻는다.
- 단락 마지막 문장이 다음 단락의 도입으로 새는 경우 — conclusion 칸에 transition을 두면 takeaway가 사라진다. 가장 빈번한 결함이다.
- 섹션 도입 단락 없이 §2.1로 바로 진입하는 경우 — 섹션 스케일의 context가 비어 있다.
- Discussion에 새 결과가 등장하는 경우 — content 스케일과 conclusion 스케일이 섞인다. Discussion은 새 결과를 두는 곳이 아니다.
- Conclusion이 Results의 요약인 경우 — [Ch.20](./chapter_20_subheadings_and_conclusions.md)에서 따로 다룬다.

이 다섯은 체크리스트로 반복 점검할 수 있다. 단락 단위 결함은 비교적 빨리 보이지만, 섹션·논문 스케일의 결함은 결국 사람의 진단이 필요하다.

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 3·4·5. [Gopen & Swan 1990](https://www.americanscientist.org/sites/americanscientist.org/files/20053191534_306.pdf) (stress position). 두 원칙 간의 긴장을 조율하는 관점은 집필 실무를 고려해 본문에서 새롭게 제시했다.

# Ch.20 — 정보가 담긴 소제목과 결론 ≠ 요약

논문 본문을 끝까지 읽는 독자는 소수다. 다수는 소제목만 훑고 그림으로 내려간다. 그들에게 논문의 핵심 메시지를 전달하려면 소제목 자체가 주장을 담아야 한다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §III가 이 점을 정면으로 짚는다.

---

## 20.1 소제목에 주장이 필요한 이유

훑어 읽는 독자는 본문보다 소제목과 그림 캡션을 먼저 볼 수 있다. 이 독자에게 "Loop Closure Experiments"라는 소제목은 실험 주제만 알려 준다. 같은 곳에 "Loop closure recall improves 14% with multi-scale BEV"가 들어가면 그 한 줄로 핵심 메시지가 전달된다. 여기와 아래 표에 제시된 수치는 주장이 담긴 소제목의 문장 구조를 설명하기 위한 예시 데이터다.

소제목이 모이면 논문의 목차이자 골격이 된다. Whitesides가 §III에 적은 권고를 다른 표현으로 옮기면 "소제목만 읽어도 논문의 핵심 메시지를 재구성할 수 있어야 한다"가 된다. 이 조건이 깨진 논문은 훑어 읽는 단계에서 reject 사유를 만든다.

topic-style heading("Network Architecture", "Ablation Study")은 분야의 관행으로 굳어 있어 거부감이 적다. 다만 그 관행이 정보 전달의 기회를 놓치고 있다는 진단이 Whitesides의 입장이다.

---

## 20.2 Before / After 5쌍

로보틱스 분야 헤딩 5쌍을 비교하면 패턴이 보인다.

| Before (topic) | After (claim) |
|---|---|
| Loop Closure Experiments | **Loop closure recall improves 14% with multi-scale BEV** |
| Ablation Study | **Removing geometric prior degrades RTE by 38% on KITTI-08** |
| Comparison with Baselines | **Our method matches LIO-SAM accuracy at 1/3 the runtime** |
| Network Architecture | **A two-branch encoder separates appearance from geometry** |
| Dataset and Metrics | **We evaluate on KITTI-360 and VIVID with rotation/translation error** |

After 쪽 다섯 헤딩의 공통점은 동사와 대상이 명시되어 있다는 점이다. "improves 14%", "degrades RTE by 38%", "matches at 1/3 runtime", "separates appearance from geometry"가 한 줄에 박혔다. 동사가 빠진 명사구만 남으면 헤딩은 정보를 잃는다.

---

## 20.3 작성 절차 3단계

claim-style 헤딩 한 줄을 만드는 절차는 다음과 같다.

1. 본문 핵심 결론을 한 문장으로 적는다.
2. SVO로 다듬고, 명사구 안의 수식 관계도 확인한다. Whitesides §III의 '명사의 형용사적 용법 지양' 규칙에 따라, 가령 "ATP formation" 대신 전치사구를 활용한 "formation of ATP" 형태를 권장한다.
3. venue template와 지면 폭 안에서 한 줄로 읽히도록 줄인다. 60-80자를 초안의 출발 범위로 둘 수 있지만 보편적인 길이 규칙은 아니다. 숫자보다 claim의 완결성과 같은 층위 헤딩의 평행성을 먼저 본다.

이 절차는 outline iteration 4-5회차에 들어가는 작업이다. 1-3회차에서는 헤딩이 placeholder로 남아 있어도 된다. claim-style로 다듬는 작업은 본문 결론이 안정된 뒤에야 비로소 의미가 있다.

---

## 20.4 Conclusions ≠ Summary

Conclusions 섹션에 Results의 숫자를 다시 나열하는 패턴이 가장 흔한 결함이다. "In summary, we showed A, B, and C."로 시작하는 Conclusions는 abstract와 Results에 이미 있는 정보를 한 번 더 반복한다. 독자에게 새 정보가 0이다.

Whitesides가 §III에 적은 정의는 명확하다. Conclusions는 higher-level analysis다. 결과들이 합쳐 무엇을 말하는지, 분야에 어떻게 기여하는지, 어떤 가설이 살아남고 어떤 가설이 죽었는지가 들어간다. 각 항목은 간결한 구의 형태로 작성하되, 단순한 사실 나열을 넘어 새로운 학술적 통찰을 온전히 담아내야 한다.

Discussion 섹션이 별도로 있는 논문이라면 Conclusions는 더 짧아질 수 있다. 3-5개의 짧은 요점을 초안 출발값으로 삼을 수 있지만 venue 형식과 기여 수에 따라 달라진다. Discussion이 없는 형식이라면 Conclusions가 해석과 한계까지 흡수해 길어진다. 어느 쪽이든 Results의 숫자만 되풀이하는 요약에 머물러서는 안 된다.

---

## 20.5 흔한 실수

Conclusions·heading 양쪽에서 반복되는 실수는 다음과 같다.

- "In summary, we showed A, B, and C." — A·B·C는 이미 abstract와 Results에 있다. 한 단계 위로 올라가지 않았다.
- Conclusions에 future work 한 줄만 달랑 쓰는 경우 — higher-level analysis가 비어 있다. future work는 Conclusions의 마지막 구에만 들어간다.
- 헤딩 길이가 들쭉날쭉한 경우 — 한 섹션 안에 10자 헤딩과 90자 헤딩이 섞이면 평행성이 깨진다. 같은 스케일의 헤딩은 길이가 비슷해야 skim에서 리듬이 살아난다.
- claim-style 헤딩에서 동사가 빠지는 경우 — "BEV-based Loop Closure"는 명사구다. claim이 되려면 동사가 들어가야 한다.

---

## 20.6 점검 절차

claim-style 헤딩은 본문 한 섹션에서 결론 문장을 먼저 추출한 뒤 만든다. 그 문장을 SVO로 다듬고, 길이 제약 안에서 잘라 내며, 같은 섹션 안의 헤딩 길이와 문장 구조를 맞춘다. outline iteration 후반부에서 사람이 손으로 반복해야 하는 절차다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §III (information-rich subheadings, conclusions as higher-level analysis). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 7 (declarative statements, 보조). 로보틱스 분야를 위한 5쌍의 소제목 대비 예시는 본문에서 독자적으로 재구성한 자료다.

# Ch.21 — 문단 흐름

문장 단위는 다듬었는데 한 단락을 읽으면 흐름이 끊긴다고 느끼는 학생이 있다. 같은 단락의 다섯 문장을 따로따로 보면 멀쩡하지만, 이어 붙이면 어딘가가 어긋난다. 그 어긋남은 [Ch.29](./chapter_29_reader_expectations.md)의 stress·topic 5원칙이 단락 층위에서 깨질 때 생긴다.

[Gopen & Swan 1990](https://www.americanscientist.org/article/the-science-of-scientific-writing) §III의 원칙은 old before new다. 한 문장 안에서 작동하는 이 원칙은 한 단락 안에서도 같은 형태로 작동한다. Ch.19의 CCC가 어디에 무엇이 들어가는지 보여 주는 자리표라면, 여기서는 문장이 어떻게 흐르는지 본다.

---

## 21.1 두 층위가 동시에 작동한다

한 단락을 읽는 독자의 작업 기억은 두 층위를 동시에 처리한다. 문장 층위에서는 topic position(첫 자리)이 backward link를 걸고 stress position(끝 자리)이 새 정보를 받는다. 단락 층위에서는 첫 문장이 진입점이 되고 마지막 문장이 takeaway를 받는다.

두 층위가 같은 패턴(old → new)을 공유한다. 흐름이 자연스러운 문단은 두 층위에서 같은 방식의 인지 부담만 요구한다. 한 층위가 깨지면 독자는 매 문장에서 왜 이 정보가 지금 들어오는지를 다시 추측해야 한다. 그 추측이 쌓이면 문단 끝에서 takeaway가 무엇인지 흐려진다.

학생들이 가장 자주 어기는 곳이 단락 층위다. 문장 단위는 [Ch.29](./chapter_29_reader_expectations.md)의 5원칙으로 어느 정도 다듬어지지만, 문장 사이를 어떻게 묶는가는 별도의 작업으로 인식되지 않은 채 남는 경우가 많다.

---

## 21.2 Topic chain — 문장 간 backward link

**각 문장의 첫 명사구가 앞 문장의 어딘가와 연결되어야 한다.** 직전 문장의 stress position에 등장한 명사구가 다음 문장의 topic position을 받는 패턴이 가장 자연스럽다.

> ❌ The proposed method achieves 14% improvement on KITTI. Many sequences are challenging due to dynamic objects. Loop closure is critical.
>
> ✓ The proposed method achieves 14% improvement on KITTI. The improvement holds across sequences with dynamic objects, where loop closure is most critical.

예문의 14% 향상 수치는 문맥 간 연결 구조를 설명하기 위해 설정한 예시값이다.

❌ 쪽은 세 문장의 첫 명사구가 the proposed method · many sequences · loop closure로 끊긴다. 서로 연결되지 않는다. ✓ 쪽은 둘째 문장의 the improvement가 첫 문장의 improvement를 받는다. 둘째 문장 안에서는 where절이 앞의 sequences를 이어받는다.

**첫 명사구는 직전에 등장한 명사·대명사·요약 명사구를 받는다.** "this", "the result", "such configurations" 같은 요약 명사구가 backward link를 만드는 도구다.

---

## 21.3 Stress chain — 새 정보의 누적

**문장 끝(stress position)의 새 정보가 다음 문장 첫 자리(topic position)로 흘러간다.** 이 받기는 단락 안에서 정보를 누적하는 한 방법이다.

> ✓ Geometric ICP failed on textureless walls. These walls dominate indoor scans, where photometric gradients are weak. Weak gradients motivate hybrid methods.

세 문장의 stress는 각각 textureless walls · weak gradients · hybrid methods다. 다음 문장의 topic이 직전 stress를 받아 단락이 한 방향으로 흐른다. 단락의 마지막 stress에 hybrid methods가 도달하면, 그 끝점이 단락 전체의 takeaway 후보가 된다. Ch.19 §19.1의 conclusion 위치와 정확히 일치한다.

**매 문장 끝에 보일러플레이트가 들어서면 stress chain이 비어 있다.** "in this paper", "of our approach" 같은 표현이 매 문장의 stress를 차지하면 어느 자리에 새 정보가 들어갔는지가 흐려진다. [Ch.29](./chapter_29_reader_expectations.md)의 stress position 진단과 같은 축에 있다.

---

## 21.4 흔한 결함 4종

**Topic 끊김.** 문장 첫 자리에 새 명사가 연속으로 등장. backward link 0. 진단법 — 한 단락의 첫 명사구만 추출해 한 줄로 나열, 그 줄이 흐르는지 본다.

**Stress 흩뿌리기.** 보일러플레이트가 매 문장 끝을 점유. 새 정보가 어디에 있는지 흐릿. 진단법 — 한 단락의 마지막 명사구만 추출해 한 줄로, 새 정보가 누적되는지 본다.

**메시지 둘.** 한 단락에 takeaway 후보가 둘. [Ch.11 §11.2의 두 번째 진단](./chapter_11_ccc_lens.md)과 같은 결함. 쪼갠다.

**접속사 남발.** "However", "Moreover", "Therefore"를 매 문장 첫 자리에 박는 패턴. backward link를 접속사가 대체하면 topic chain이 빈다. 정보의 관계를 표시할 때만 접속사를 남긴다.

---

## 21.5 자기 진단 — 두 줄 추출법

자기 단락 한 토막을 가지고 다음 두 작업을 돌려 본다.

1. 각 문장의 첫 명사구만 추출해 한 줄로 나열. 이 줄이 topic chain.
2. 각 문장의 마지막 명사구만 추출해 한 줄. 이 줄이 stress chain.

두 줄을 나란히 놓는다. topic chain이 끊기지 않고 흐르는가. stress chain이 새 정보를 누적하는가. 둘 중 하나라도 끊기면 그곳이 흐름 결함이 있는 자리다.

[Ch.29](./chapter_29_reader_expectations.md)의 reverse-read 진단을 단락 층위로 넓힌 도구다. 같은 도구를 읽기에 적용한 사례가 [Ch.12 reader expectations 진단](./chapter_12_reader_expectations_diagnosis.md)에 있다. 쓰기와 읽기 양쪽에서 같은 두 줄 추출이 작동한다.

---

## 21.6 CCC와의 관계

Ch.19의 CCC가 자리표라면 이 장의 두 줄 추출법은 흐름표다. 두 관점은 서로 보완한다.

CCC 골격이 잡힌 단락도 topic chain·stress chain이 무너질 수 있다. 첫 문장에 context가 잘 박혀 있어도, 그다음 문장의 topic이 첫 문장 stress를 받지 않으면 흐름이 깨진다. CCC가 깨진 단락은 두 줄 추출에서 stress chain의 마지막이 takeaway가 아닌 단어에 도달한다.

두 진단은 순서로 적용한다. CCC 자리표를 먼저 확인하고, 칸이 채워졌으면 두 줄 추출로 흐름을 검증한다. 칸이 비어 있는데 흐름부터 다듬으면 빈 칸이 그대로 남는다.

---

**출처.** [Gopen & Swan 1990](https://www.americanscientist.org/article/the-science-of-scientific-writing) §III — old before new가 paragraph 층위에도 작동. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 3 연결. 두 층위의 통합적 관점과 두 줄 추출 진단법은 단락 퇴고를 실질적으로 돕기 위해 본문에서 새롭게 체계화했다.

# Ch.22 — 제목과 초록

심사위원에게 배정되는 원고 수와 심사 workflow는 venue마다 다르다. 다만 [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)의 1st pass처럼 제목·초록·서론을 먼저 읽는 독자가 많다. 제목과 초록은 독자가 본문에 들어가기 전에 논문의 큰 틀을 전해야 한다.

[Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §IV가 둘을 한 묶음으로 다룬 이유도 이 비대칭에서 나온다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 1과 rule 5가 각각 제목과 초록의 골격을 정의해 둔다. Ch.16 §16.6의 readership-weighted budget이 둘에 가장 큰 시간 비중을 할당하라고 권하는 것도 같은 이유다.

---

## 22.1 제목 — 기여를 담은 한 문장

**제목은 논문의 기여를 한 문장으로 압축한다.** Mensh-Kording rule 1은 본인 논문이 분야에 무엇을 더했는지가 제목 한 줄에 드러나야 한다고 적었다.

**제목에서 기여의 방향이 보여야 한다.** "BEV-based Loop Closure"는 주제만 말한다. "BEV-based loop closure halves recall failures on KITTI"처럼 동사·효과·대상을 넣으면 결과형 제목이 된다. 여기 제시된 수치는 제목의 작성 문형을 예시하기 위한 가상 데이터다. 분야 관행상 명사구 제목을 쓰더라도 무엇을 새로 보였는지가 드러나는지 확인한다.

**길이는 venue 규정과 명료성으로 정한다.** 모든 분야에 통하는 12-15단어 규칙은 없다. 기여를 식별하는 데 필요한 말은 남기고, 검색 결과에서 잘려도 뜻이 무너지지 않게 앞부분을 다듬는다.

**Keyword 선택.** contribution과 직결되는 핵심 용어를 제목에 넣는다. 검색·인덱싱에 쓰이는 실제 분야 용어를 고르되, 정해진 개수나 같은 단어의 반복을 목표로 삼지 않는다.

---

## 22.2 초록 — 완결된 CCC

**초록은 자기 안에서 닫혀야 한다.** Mensh-Kording rule 5는 key fits its lock이라는 비유를 썼다. 결과(key)가 정확히 갭(lock)에 들어맞아야 초록이 완성된다. Ch.19 §19.3의 자기완결성과 같은 축에 있다.

**다섯 칸이 한 단락 안에 들어간다.**

1. **Field gap** — 분야 전체의 큰 빈틈 한 줄.
2. **Paper gap** — 본 논문이 메우는 정확한 자리 한 줄.
3. **Approach** — 그 자리를 어떻게 메우는가 한두 줄.
4. **Result** — 핵심 결과. 정량 연구라면 대표 수치를 넣고, 이론·질적 연구라면 검증된 중심 결론을 넣는다.
5. **Implication** — 분야에 무엇을 의미하는가 한 줄.

**외부 참조를 두지 않는다.** "Fig. 3 shows …", "in Sec. 4 we …" 같은 본문 참조가 초록에 들어가면 자기완결성이 깨진다. 초록만 떼어 독립된 원고로 읽어도 자족적이어야 한다.

**길이는 venue의 word limit를 따른다.** 150-250단어는 여러 분야에서 흔히 볼 수 있는 작업 범위일 뿐 보편 규칙이 아니다. 다섯 칸을 빠짐없이 담되 같은 맥락을 되풀이하지 않는다.

---

## 22.3 작성 순서 — 본문이 안정된 뒤

**초록은 맨 마지막에 쓴다.** Whitesides §IV의 권고다. 본문이 흔들리는 동안 초록을 깎는 일은 lock이 흔들리는 동안 key를 깎는 것과 같다. 본문 outline 4-5회차가 안정된 뒤에야 초록 작업을 시작할 수 있다.

제목도 같은 시점에 있다. outline iteration 1-3회차에서는 placeholder로 남아 있어도 된다. claim style로 다듬는 작업은 본문 결론이 안정된 뒤에야 의미가 자란다 — Ch.20 §20.3의 작성 절차와 같은 관점.

**시간 배분.** Ch.16 §16.6의 readership-weighted budget을 따른다. 제목과 초록에 별도 작업 시간을 잡되, 원 출처는 제목 한 시간·초록 두세 시간 같은 고정값을 제시하지 않는다. 실제 기록에서 본문 한 섹션에는 오래 쓰면서 초록은 마감 직전에만 다듬었다면 다음 원고의 예산을 조정한다.

---

## 22.4 arXiv 시대 — 자동화 파이프라인의 첫 관문

[김기섭 교수 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html)가 같은 문제를 arXiv 자동화의 관점으로 적었다. 이 절에서는 그 논점을 제목과 초록이 검색·추천·인덱싱 단계에서 먼저 노출된다는 말로 정리한다.

이 진단은 §1·§2의 권고에 검색·인덱싱 층위를 더한다. 서비스별 추천 알고리즘은 공개 범위가 다르므로 특정 token 수나 keyword density가 노출을 보장한다고 말할 수 없다. 다만 제목과 초록에 실제 분야 용어와 기여가 명료하게 들어가야 검색 결과에서도 논문을 식별할 수 있다.

**초록의 첫 1-2문장은 여러 색인 화면에서 독자에게 먼저 보이는 부분이다.** 첫 두 문장에서 field와 paper gap을 구체화하고, 접근과 결과가 이어질 자리를 만든다. 자동 요약기나 추천기가 정확히 어느 문장을 쓰는지는 서비스마다 다르므로 노출을 보장하는 공식처럼 다루지 않는다.

검색·인덱싱을 위해 기여와 분야 용어를 명료하게 쓰는 일은 사람 독자의 이해에도 도움이 된다. 다만 추천 알고리즘을 추측해 문장을 만드는 대신 사람에게 정확한 제목과 자족적인 초록을 쓰는 것을 기준으로 둔다.

---

## 22.5 흔한 실수 4종

**제목에서 기여가 모호함.** "A New Method for Loop Closure"는 어떤 점이 새로운지 드러나지 않아 contribution이 암시만 된다. 심사위원이 본문을 읽어야 contribution이 추출되는 결함.

**Abstract가 본문 도입처럼.** context만 길게 늘이고 핵심 결과가 들어가지 않는 패턴. 정량 연구라면 대표 수치가, 이론·질적 연구라면 중심 결론이 들어가야 자기 안에서 닫힌다.

**Abstract에 외부 참조.** 본문의 그림·section을 가리키는 reference가 들어가면 곧 self-contained 위반.

**제목에 두 contribution.** 첫 논문이면 contribution이 한 줄로 압축되지 않은 시점. Ch.16 §16.1의 하나의 논문에는 하나의 메시지 권고와 같은 관점. contribution 둘이 제목에 동시에 박히면 두 곳에서 reject 사유가 자란다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §IV — abstract 작성 순서·자기완결성. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 1 (제목 = contribution 한 문장) + rule 5 (abstract = key fits its lock). [김기섭 교수 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html) — arXiv 자동화·제목 first filter. 제목과 초록 작성 시 자주 범하는 네 가지 실수는 실무 검토를 위해 본문에서 유형별로 분류했다.

# Ch.23 — 서론은 어떻게 좁혀지는가

논문을 처음 훑을 때 서론은 판단의 큰 틀을 잡는 중요한 자리다. [Keshav (2007)](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)의 1st pass는 제목·초록·서론을 주의 깊게 읽고, 소제목·결론·참고문헌도 함께 훑으라고 한다. 원문이 첫 한 장만 읽으라고 한 것은 아니다. 서론이 불명확하면 독자는 문제와 기여를 파악하기 어렵다.

학생들이 가장 자주 하는 실수는 서론을 Related Work의 축약본으로 채우는 것이다. 인용을 줄줄 늘어놓고, 끝에서 "we propose …"로 건너뛴다. 심사위원은 이 형식에서 왜 이 논문이 존재하는지 답을 얻지 못한 채 기여 문장에 도달한다.

두 프레임을 겹쳐 쓰면 이 문제를 풀 수 있다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §III의 5요소는 무엇이 들어가야 하는지 보여 주는 자리표이고, [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 6의 gap funnel은 어떤 순서로 좁혀 가는지 보여 주는 흐름표다.

---

## 23.1 서론의 다섯 슬롯

Whitesides가 §III에 제시한 다섯 칸은 다음과 같다.

1. **Objectives** — 무엇을 했는가. 한 문장으로 답할 수 있어야 한다.
2. **Justification** — 왜 했는가. objective의 연구 동기를 명시한다.
3. **Background** — 독자가 알아야 하는 최소 사전 지식. 교과서 수준의 장황한 해설은 피하고 각주 분량으로 압축할 필요가 있다.
4. **Reader guidance** — 독자가 무엇에 주목하며 논문을 읽어야 하는지. 연구의 주요 대목과 전략을 안내한다. "In Sec. 2 we describe …" 같은 구성 안내도 그 한 방식이다.
5. **Summary preview** — 핵심 결과를 간결히 제시한다. 초록과는 차별화된 함의를 띤다.

Whitesides는 아웃라인 단계에서 서론 첫 1-2단락을 완전한 문장으로 써 두고, 특히 첫 문장에 연구의 목표와 중요성을 간결하게 담으라고 권한다. 다섯 요소는 서론 전체가 갖출 내용으로 제시하며, 모두를 첫 두 단락에 넣으라는 배치 기한은 두지 않는다.

5요소는 심사위원의 시점에서 reverse-read로 점검한다. 자기 서론 전체에서 다섯 칸에 해당하는 내용을 한 줄씩 추출해 본다. Reader guidance는 섹션 순서뿐 아니라 독자가 주목할 대목과 연구 전략을 안내하는 역할도 포함한다.

---

## 23.2 Gap funnel — 3단 중첩

5요소가 정적인 자리표라면, gap funnel은 동적인 깔때기다. Mensh & Kording rule 6이 Introduction의 흐름을 세 계단의 빈틈으로 정의했다.

- **Field gap**. 분야 전체가 풀지 못한 큰 문제. 한 줄.
- **Subfield gap**. 그 분야의 specific 영역에서의 한계. 한두 줄.
- **Paper gap**. 본 논문이 정확히 메우는 빈틈. 한 줄.
- **→ 기여**. 그 빈틈을 어떻게 메웠는가.

빈틈은 단계마다 좁아진다. field gap은 넓게 시작하고, paper gap에서 한 점으로 수렴한다. 심사위원은 이 깔때기를 따라 내려오면서 "이 논문이 정확히 어디를 메우는가"를 자연스럽게 이해한다.

학생들이 가장 흔하게 빠뜨리는 칸은 paper gap이다. subfield gap에서 곧장 기여로 건너뛰면 깔때기 한 단이 비고, 심사위원은 "왜 이 방법으로 메웠는가"에 대한 답을 본문 어디서도 얻지 못한다. 가장 좁은 단이 비면 깔때기 전체가 무너진다.

---

## 23.3 한국어 서론의 여섯 단계

같은 흐름을 한국어 설명으로 풀어낸 글이 [엄태웅 대표 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)의 Introduction 6단이다.

> 1. 큰 문제 — 분야 전체가 푸는 문제.
> 2. 점진적 스코프 축소 — 그 분야 안에서 본 논문이 향하는 자리.
> 3. 선행 연구 — 그 자리에서 쌓인 시도들.
> 4. 한계 — 선행 연구가 풀지 못한 자리.
> 5. 본 연구 기여 — 한계를 메우는 본 논문의 시도.
> 6. 논문 구성 — 다음 섹션 안내.

이 6단은 §2의 gap funnel 3단(field → subfield → paper)과 §1의 Whitesides 5요소를 한 절차에 합친 한국어 적용 사례다. 1·2·3·4가 gap funnel을 점진적으로 좁히고, 5가 contribution과 summary preview를 채우며, 6이 Whitesides의 reader guidance 칸을 명시한다. 여기서 6번(논문 구성)은 reader guidance를 구성 안내로 구현한 한 방식이다.

엄태웅 대표는 같은 글에서 정확한 수치는 알 수 없다고 전제한 뒤, 자신의 경험상 많은 논문이 Abstract와 Introduction 단계에서 더 읽을 가치가 있는지 판단된다고 적었다. 이어 두 섹션에 노력의 40-50%를 투자할 가치가 있다고 권한다. 이러한 수치는 엄밀한 표본 조사에서 도출된 통계치라기보다, 저자의 실무적 경험에 기반한 시간 배분 휴리스틱이다. Ch.16 §16.6의 readership-weighted budget(Mensh-Kording rule 9)과 같은 방향의 조언으로 읽는다.

---

## 23.4 두 프레임의 매핑

5요소와 gap funnel은 중첩으로 작동한다.

| Whitesides 5요소 | Gap funnel 위치 |
|---|---|
| Background | Field gap + Subfield gap |
| Justification | Subfield gap → Paper gap |
| Objectives | Paper gap을 메우려는 시도의 명시 |
| Summary preview | 기여 |
| Reader guidance | (구조적 도움말, funnel과 별개 축) |

이 매핑이 작업 순서를 정한다. outline 단계에서 gap funnel로 흐름을 결정하고, 초고 단계에서 5요소로 칸을 점검한다. 두 단계를 합치면 한쪽이 다른 쪽을 가린다.

---

## 23.5 서론의 사례

[KISS-ICP (Vizzo et al., RA-L 2023)](https://arxiv.org/abs/2209.15397)의 Introduction은 여러 단락에 걸쳐 문제와 접근을 좁혀 간다. 첫 단락은 모바일 로봇에서 odometry가 중요한 이유를 설명하고, ICP 계열 방법이 특정 운동이나 환경을 가정하는 한계를 짚는다. 서로 다른 센서와 환경에서 별도 조정 없이 쓸 수 있는 LiDAR odometry가 부족하다는 것이 이 단락의 문제다. 둘째 단락은 고전적인 point-to-point ICP로 돌아가 같은 parameter 집합을 여러 조건에 쓰겠다는 접근을 제시한다.

5요소도 서론 전체에서 찾아야 한다. Background와 justification은 첫 단락의 기존 방법과 적용 범위 설명에, objective는 둘째·셋째 단락의 접근과 핵심 기여에 나타난다. 셋째 단락의 구성 요소 설명은 독자가 방법에서 주목할 대목을 안내하는 reader guidance로 읽을 수 있다. 넷째 단락은 세 가지 핵심 주장을 열거하고 실험 결과를 예고하는 summary preview를 맡는다. 다음 섹션의 순서를 안내하는 문장과는 구분한다.

발췌와 줄별 분석은 발췌 [`kiss_icp_intro_hook.md`](./excerpts/excerpt_01_kiss_icp_intro_hook.md)에 있다.

---

## 23.6 흔한 실수 4종

**첫 문장이 trend 나열로 시작.** "Recently, deep learning has revolutionized …" 류. field gap 대신 모호한 분야 분위기로 시작하면 깔때기가 열리지 않는다. 첫 문장은 문제에서 연다.

**Background가 textbook 분량.** 3단락을 넘어가면 background의 범위를 벗어나 mini-survey로 변질된다. Related Work 섹션이 따로 있다. Introduction의 background는 paper gap을 이해하기 위한 최소량만.

**Reader guidance 누락.** "In Sec. 2 we …" 한 단락이 통째로 빠진 Introduction이 흔하다. Whitesides가 5요소에 명시적으로 박아 둔 칸이다. 한 단락 또는 한 문장이라도 들어가야 한다.

**Objective와 기여가 같은 표현으로 반복.** 첫 단락의 objective 문장과 기여 절의 첫 항이 동일한 어구이면 둘 중 하나가 잉여다. objective는 시도를, contribution은 결과를 적는다.

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 6 — 점점 구체화되는 gap 구조. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §II–§III — 5요소와 first-paragraph-in-full 권고. [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf) — 1st pass의 읽기 순서. [엄태웅 대표 「논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/) — Introduction 흐름과 40-50% 투자 권고. 두 프레임 간의 유기적 연결과 KISS-ICP 적용 분석은 본 장에서 새롭게 엮어낸 부분이다.

# Ch.24 — Related Work: 분류와 비판의 자리

Ch.23의 서론이 왜 이 논문이 존재하는가에 답한다면, Related Work는 그 주변에서 누가 무엇을 시도했는가에 답한다. 두 섹션이 함께 심사위원의 1차 판단을 받는다. 두 섹션의 분담이 무너지면 한쪽은 분야 분위기만 늘어놓게 된다.

Related Work를 연도순 인용 나열로만 채우면 어떤 차원에서 연구들을 비교하는지 보이지 않는다. "Smith et al. 2018 did A. Lee et al. 2019 did B. ..." 식으로 단락이 흐르면 본인 방법의 위치도 끝까지 잡히지 않는다. 이 결함 하나가 언제나 reject를 결정한다고 단정할 수는 없지만, novelty와 baseline coverage를 의심하게 만든다.

Ch.16 §16.1의 reject의 complement 관점이 여기에 직결된다. 나열식 목록과 핵심 baseline 누락은 심사에서 반복해서 점검되는 결함이다.

---

## 24.1 분류축 — 나열식 목록 피하기

**Related Work의 골격은 분류축이다.** 본인이 정한 축 위에 선행 연구를 위치시키는 것이 Related Work의 중심 작업이다. 축을 잡지 않은 채 인용을 나열하면 나열식 목록이 된다.

**분류축 후보.** 분야마다 다르지만 로보틱스·CV에서는 다음 네 종류가 자주 등장한다.

- 입력 modality — LiDAR · RGB · RGB-D · IMU 융합
- 표현 방식 — sparse · dense · neural field
- 학습 의존도 — geometric · learned · hybrid
- 적용 scenario — 실내 · 야외 · 동적 환경

**이차원 표.** 연구 수가 많고 두 축이 실제 차이를 설명한다면 행과 열로 분류표를 만들 수 있다. 이는 분야 표준이나 필수 형식이 아니라 사고 도구다. 본인 방법이 표에서 비어 있던 칸에 들어가면 paper gap 후보가 시각적으로 드러나지만, 빈 칸 자체가 연구 가치나 novelty를 증명하지는 않는다.

이차원 표가 분류를 더 명료하게 만든다면 Related Work에 넣는다. 축이 하나이거나 연구 수가 적다면 산문이 더 낫다. 표를 쓰든 산문을 쓰든 분류 기준과 본인 방법의 위치를 독자가 추측하게 두지 않는다.

---

## 24.2 비판의 강도 — 정확하되 정중히

**비판은 방법의 한계에 한정한다.** 저자에 대한 비난·저평가 금지. "Smith et al.'s approach is naive"는 심사위원 입장에서 저자 비난으로 읽힌다. "Smith et al.'s approach assumes static environments"가 방법의 한계에 한정한 표현이다.

**Vague phrasing 점검.** "may suffer from", "is limited in some scenarios", "could be improved"만으로 끝내면 한계의 범위를 알 수 없다. 출처가 보고한 dataset·조건·metric을 구체적으로 적되, 원 논문이 보고하지 않은 수치를 만들어 넣지 않는다.

> ❌ Method X may suffer from drift in long sequences.
>
> ✓ Method X reports $d_1$ drift on sequence A, compared with $d_2$ on the shorter sequences [citation].

✓ 쪽의 $d_1$, $d_2$, sequence 이름은 실제 출처에서 확인해 채운다. 조건과 수치, 인용을 함께 적어 비판의 근거를 추적할 수 있게 한다.

**비판이 강할수록 근거도 강해야 한다.** 본인 실험이나 선행 연구가 보고한 한계를 인용한다. 근거 없이 비판만 강하면 심사위원은 본인 방법의 우위를 만들기 위해 비교를 비튼 것은 아닌지 의심한다.

---

## 24.3 핵심 baseline 누락의 비용

**본인 방법과 가장 가까운 baseline을 빠뜨리면 novelty와 공정 비교가 흔들린다.** Related Work에 등장하지 않은 baseline은 실험 섹션에서도 빠질 수 있다. 누락이 심사 결과에 미치는 정도는 논문의 주장과 venue에 따라 다르지만, 왜 비교하지 않았는지는 설명해야 한다.

**Coverage 기준.** 고정된 5편·3-5편 최소선은 없다. 문제 정의를 만든 anchor, 가장 가까운 방법, 같은 benchmark의 강한 비교군, 최근의 직접 관련 연구가 빠지지 않았는지 claim별로 확인한다. 최신 연구의 범위는 검색 종료일을 적어 경계를 분명히 한다.

**본인 연구실 self-citation 편중.** 본인 연구실 논문만 골라 인용하면 분야의 범위를 비뚤게 제시할 수 있다. 모든 분야에 통하는 30% 안전선은 없다. 각 self-citation이 현재 주장에 직접 필요한지 확인하고, 독립 연구 그룹의 가장 가까운 선행 연구도 같은 기준으로 찾는다.

분야별 탐색의 출발점으로 [robotics-practice ch20 §20.8.1](https://alexjunholee.github.io/robotics-practice/guide.html#2081-논문-쓰기-link)의 baseline catalog를 링크해 둔다. 목록을 그대로 최소 인용 세트로 쓰지 말고, 검색 종료일과 본인 claim에 맞춰 공식 proceedings·논문에서 갱신한다.

---

## 24.4 흔한 실수 4종

**나열식 목록.** 인용을 연도순으로 나열하고 분류축을 두지 않으면, 심사위원은 어떤 차원에서 비교하는지 알 수 없다.

**핵심 baseline 누락.** 본인 방법의 1차 비교 대상이 빠지면 novelty와 공정 비교를 설득하기 어렵다.

**과대 비교.** "we outperform all prior work"를 Related Work에서 선언. 결과 섹션의 몫을 미리 가져온 형태. Ch.19 §19.5의 content와 conclusion 스케일이 섞이는 결함과 같은 축.

**Self-citation 편중.** 본인 연구실 논문만 골라 인용하면 분야 합의를 비뚤게 제시한 것으로 보인다.

---

## 24.5 Ch.23과의 분담

Ch.23의 Introduction에서 paper gap이 한 줄로 박혔다면, Related Work는 그 paper gap의 주변을 본격적으로 펼친다. 두 섹션의 분담이 다음과 같이 작동한다.

| 항목 | Introduction (Ch.23) | Related Work (Ch.24) |
|---|---|---|
| 길이 | paper gap을 여는 데 필요한 범위 | 분류와 위치를 설명하는 데 필요한 범위 |
| 인용 수 | 핵심 주장에 직접 필요한 인용 | 분류축의 주요 계열과 직접 비교군을 덮는 인용 |
| 골격 | gap funnel 3-tier | 분류축(필요하면 이차원 표) |
| 비판 | 한 줄, 빈틈 명시만 | 본격, 수치 근거 |
| 본인 방법 | 한 문장 contribution | 표 위의 한 칸 |

이 분담이 무너지는 가장 흔한 패턴이 Introduction에 prior work 30편을 인용하는 결함이다. Ch.23 §23.6의 흔한 실수인 Background가 textbook 분량인 것과 같은 결함이다. Related Work를 Introduction에 합칠 때도 문제 제기와 기존 연구 분류의 역할이 뒤섞이지 않도록 해야 한다.

---

**출처.** [Gopen & Swan 1990](https://www.americanscientist.org/article/the-science-of-scientific-writing) — 단락 층위 흐름(간접). [robotics-practice ch20 §20.8.1](https://alexjunholee.github.io/robotics-practice/guide.html#2081-논문-쓰기-link) — 분야별 baseline 탐색의 출발점. 분류축·이차원 표·coverage 점검은 이 장의 작업 도구이며, 고정 인용 수나 self-citation 비율을 표준으로 두지 않는다.

# Ch.25 — 방법 섹션

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 9은 Method보다 제목·초록·그림을 더 많은 독자가 본다고 지적한다. 다만 Method를 읽는 독자는 재현성·정확성·공정성을 세밀하게 검토할 수 있다. 필요한 정보가 빠지면 claim의 근거가 약해진다.

Method를 시간순 연구실 노트로 쓰면 최종 방법의 논리가 가려질 수 있다. "처음에 X를 시도했는데 안 돼서 Y로 갔고, Y가 또 한계가 있어서 Z에 도달했다"는 과정은 연구 노트에 남긴다. Method에서는 재현에 필요한 최종 절차와 선택 근거를 논리 순서로 배치한다.

---

## 25.1 Results-driven structure — 결과를 받기 위한 골격

**Method 섹션의 골격은 Results에 필요한 절차를 거슬러 짚어 구성한다.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §V·§VI의 권고다. Results의 각 그림·표를 만든 절차가 Method의 각 서브섹션으로 이어진다.

이 관점에 따라 Results outline을 먼저 잡고, 그 outline에서 Method outline을 역으로 만든다. Ch.26에서 다룰 main result table·ablation table·qualitative figure 각각이 Method의 어느 sub-section과 짝지어지는지는 outline 단계에서 정한다.

**Method의 소제목.** Ch.20의 주장형 소제목은 Method에서 조금 약해진다. "Section 3.1 Feature Extraction"보다 "Section 3.1 Multi-scale BEV feature extraction"이 정보 밀도가 높지만, Results의 소제목만큼 결과가 들어갈 곳은 아니다. 명사와 기법명을 중심으로 쓴다.

---

## 25.2 Notation table — 추적 가능한 표기

**표기가 많다면 Method 도입에 notation table을 둔다.** 핵심 기호를 표에서 한 번 정의하고 본문 첫 등장에서도 뜻을 알 수 있게 쓴다. 기호가 몇 개뿐이라면 별도 표를 두지 않고 본문 산문 정의만으로 충분하다.

**표 구성.** 다음 네 열은 이 장이 제안하는 예시다. venue template와 기호 수에 맞춰 줄인다.

| Symbol | Meaning | Dimension/Unit | First introduced |
|---|---|---|---|
| $\mathbf{T}_k$ | sensor pose at time $k$ | $SE(3)$ | §3.1 |
| $\mathbf{r}_i$ | reprojection residual for measurement $i$ | $\mathbb{R}^2$ | §3.2 |
| $\lambda$ | regularization weight | scalar | §3.3 |

**한 기호의 두 의미 금지.** $R$이 회전행렬·residual·reward로 동시에 쓰이는 논문이 흔하다. 한 기호 한 의미는 [Ch.30 R8](./chapter_30_math_and_proofs.md)의 원칙이고, 강제력 있는 통일은 [Ch.31](./chapter_31_notation_hygiene.md)의 매크로 위생에서 다룬다.

---

## 25.3 Algorithm pseudocode — 재현성을 확보하는 도구

**단계 순서·분기·반복이 핵심이면 pseudocode를 제시한다.** `algorithm2e`는 실무에서 널리 활용되는 편리한 LaTeX 패키지다. venue template이 지정한 환경을 우선 따르고, 선택지가 열려 있으면 [robotics-practice ch20 §20.8.5](https://alexjunholee.github.io/robotics-practice/guide.html#2085-도구)의 예를 참고한다.

**Pseudocode 구조.**

- **Input** 한 줄. 어떤 데이터·어떤 hyperparameter를 받는가.
- **Output** 한 줄. 어떤 결과·어떤 형태로 반환하는가.
- **본문 step** 줄별로. 본문 수식이 등장하는 step에는 식 번호로 reference.

**계산 복잡도.** 입력 크기에 따른 비용을 의미 있게 분석할 수 있다면 pseudocode 뒤나 본문에 명시한다. 이론적 복잡도와 실제 runtime은 서로 다른 근거이므로 둘을 대신 쓰지 않는다. `빠르다`고 주장한다면 hardware·implementation·입력 크기와 측정 protocol도 함께 적는다.

---

## 25.4 Hyperparameter table — 변인의 명시

**재현에 필요한 hyperparameter를 한곳에서 찾게 한다.** 수가 많으면 표나 공개 config로 정리하고, 핵심 값은 본문에서도 설명한다. "we use learning rate 1e-4 ... batch size 32 ... 그리고 또 ..."가 여러 곳에 흩어지면 어떤 설정으로 결과를 냈는지 추적하기 어렵다.

**표 구성.** parameter · 값 · 의미 · 변경 시 영향(sensitivity)을 적는다. 마지막 열은 ablation 섹션과 직결된다. Ch.26의 ablation 표가 sensitivity 열을 검증한다.

**Dataset별로 다른 hyperparameter.** dataset × parameter 이차원 표로. 한 hyperparameter가 dataset에 따라 다르면 어떤 dataset에서 어떤 값이 기본인가가 명시되어야 한다.

---

## 25.5 흔한 실수 5종

**시간순 서술.** "처음에 X 시도, 실패, Y로 변경, 또 실패, Z 도달" 식의 서술은 연구실 노트에 가깝고 Method 섹션의 논리를 흐린다.

**Notation 흩뿌리기.** 본문에서 처음 등장한 자리에서만 정의. 다시 찾으려면 backtrack해야 한다. 기호가 많다면 notation table로 모아 찾게 한다.

**Hyperparameter 본문 흩뿌리기.** 표나 공개 config 등으로 모아 두지 않아 심사위원이 한눈에 파악할 수 없다.

**Pseudocode 부재.** 단계 순서·분기·반복이 핵심인데도 본문 수식만으로 재현을 시도하면 step 순서와 loop 구조가 모호해진다.

**계산 복잡도 누락.** 의미 있는 복잡도 분석이 가능한데 runtime만 보고하면 심사위원은 빠른 이유를 확인할 수 없다.

---

## 25.6 Ch.26과의 짝짓기

Method의 각 서브섹션이 Results의 서브섹션과 짝지어지면, 두 섹션의 일관성을 심사위원이 1차로 검증할 수 있다. 다음 두 패턴에서 짝이 가장 자주 어긋난다.

- **Method에는 있는데 Results에는 없는 component.** "we use multi-scale fusion"이 Method §3.2에 있는데 Results의 어느 그림에서도 검증되지 않은 결함. ablation 부재로 이어진다 — Ch.26 §26.2.
- **Results에는 있는데 Method에는 없는 component.** Results §4에서 ablation 표에 "w/o geometric prior" row가 등장했는데 Method에는 geometric prior 정의가 없는 결함. notation·정의 누락.

두 패턴은 outline 단계에서 Method ↔ Results 짝을 표시하면 일찍 발견할 수 있다. outline을 다듬는 후반부에 각 sub-section 옆에 대응하는 결과를 명기해 두면, 누락된 구성 요소나 검증 공백을 확실히 걸러낼 수 있다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §V·§VI — Method 작성과 실험 절차 기록. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rules 7·9 — 결과 논리의 outline과 시간 배분. [robotics-practice ch20 §20.8.5](https://alexjunholee.github.io/robotics-practice/guide.html#2085-도구) — LaTeX 도구 예시. notation table·pseudocode·hyperparameter table은 필요에 따라 유연하게 선택하는 실무 서술 도구다.

# Ch.26 — 결과와 논의

Results와 Discussion의 분리 여부는 venue와 논문 형식에 따라 다르다. 두 섹션을 합치더라도 결과의 명시와 해석을 문단 안에서 구분해야 어느 줄이 관측이고 어느 줄이 해석인지 추적할 수 있다. Ch.19 §19.5에서 다룬 content와 conclusion 층위의 혼합이 여기서 다시 나타난다.

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 7은 Results의 논리 구조를, rule 8은 Discussion의 해석·한계·의의를 다룬다. Results에는 주장을 뒷받침하는 그림·표·관측을 주로 배치하며, Discussion을 통해 그 결과의 심층적 해석과 한계를 다룬다. 새 결과를 어디에 둘지는 venue 형식에 따르되, 해석의 근거가 되는 관측을 독자가 찾을 수 있어야 한다.

---

## 26.1 Results의 골격 — Method와의 대응

**Results의 각 서브섹션은 Method의 서브섹션 배치와 긴밀히 대응한다.** Ch.25 §25.1에서 본 짝짓기의 결과다. Method의 절차가 Results의 그림·표를 만들고, 그 그림·표가 다시 Results의 서브섹션 골격을 정한다.

**이 장의 출발 골격은 4단이다.** 모든 논문에 네 항목이 필요한 것은 아니며 중심 claim에 맞춰 고른다.

1. **Main result 비교** — 핵심 비교 표. 본인 방법이 가장 가까운 기존 방법, 공개된 최신 비교군과 비교해 어디에 있는가.
2. **정성적 그림 1-2개** — 정량적 비교가 못 보여 주는 부분(궤적 시각화·실패 사례 비교 등).
3. **Ablation** — component별 효과 검증.
4. **Failure case** — 본인 방법이 깨지는 지점. limitation 섹션과 짝짓기.

**소제목은 주장형으로 쓴다.** Ch.20의 권고가 가장 강하게 작동하는 곳이 Results다. "Loop closure recall improves 14% with multi-scale BEV"는 소제목 작성 형식을 보여주기 위해 든 예시다. 실제 소제목에는 검증된 결과만 넣는다.

---

## 26.2 Ablation — 변인 통제

**Component별 기여를 주장한다면 ablation이 필요하다.** 어떤 component가 어떤 효과를 만드는지 주장하면서 이를 분리해 검증하지 않으면 실제로 어느 부분이 작동하는지 추적할 수 없다. ablation이 모든 논문에 의무인 것은 아니지만, component-level claim에는 그에 맞는 검증이 따라야 한다.

**Ablation 표 구성.** 행에는 제거한 component(또는 변경한 변인)를, 열에는 결과 metric을 둔다. Full method는 첫 행이나 마지막 행에 둔다. 아래 수치는 표의 레이아웃을 설명하기 위해 구성한 예시 데이터다.

| Variant | KITTI ATE (m) ↓ | KITTI RTE (%) ↓ | Runtime (ms) ↓ |
|---|---|---|---|
| **Ours (full)** | **0.42** | **0.61** | **18** |
| w/o geometric prior | 0.58 | 0.84 | 15 |
| w/o multi-scale fusion | 0.51 | 0.73 | 14 |
| w/o loop closure | 0.71 | 1.12 | 12 |

**Component는 한 번에 하나씩 제거한다.** 두 component를 동시에 제거하면 심사위원은 어느 쪽의 효과인지 추적할 수 없다. 두 component의 상호작용을 보고 싶으면 별도 행(w/o A + B)을 추가한다.

---

## 26.3 통계 유의성과 공정 비교

**반복 가능한 확률적 실험에는 변동성을 함께 보고한다.** 표본과 estimand에 맞춰 std, standard error, confidence interval, 분포 그림 가운데 적절한 것을 고른다. 실행 횟수는 계산 비용, 통계적 분산, 분야의 표준 프로토콜을 종합적으로 고려해 결정한다. seed와 집계 방법도 명시한다.

**Hyperparameter 비교 기회를 공정하게 둔다.** 본인 방법만 넓게 탐색하고 baseline은 검증 없이 기본값으로 두면 비교가 본인 방법에 유리해진다. 방법마다 탐색 공간이 다를 수 있으므로 기계적으로 같은 trial 수만 강제하지 말고, 공식 설정·검증 protocol·탐색 공간·계산 budget을 모두 보고한다.

**Dataset split·evaluation protocol을 일치시킨다.** 공식 benchmark나 직접 비교 논문이 지정한 split과 metric을 확인한다. 다른 split을 쓴다면 이유를 설명하고, baseline도 같은 protocol에서 다시 평가했는지 밝힌다. KITTI처럼 task마다 공개 ground truth와 test server 구성이 다른 dataset은 해당 task의 공식 지침을 따른다.

**Best 열의 개수로 논문을 평가하지 않는다.** 사전에 정한 주 metric과 claim에 필요한 trade-off를 본다. 정확도·runtime·memory·robustness 가운데 무엇을 개선했고 무엇을 양보했는지 Discussion에서 설명한다.

---

## 26.4 Discussion — 결과의 해석

**Discussion 골격 4단.** Mensh-Kording rule 8에 근거한다.

1. **핵심 발견의 원인.** 결과가 왜 그런 형태로 나왔는가.
2. **분야 합의와의 관계.** Related Work의 분류축 위에서 본인 결과가 어디에 위치하는가.
3. **한계.** 방법의 가정·실험 범위·계산 복잡도.
4. **다음 단계.** 짧게.

**한계를 명시한다.** 별도 Limitation 섹션의 필요 여부는 venue policy를 따르지만, 방법의 가정·실험 범위·계산 비용은 Discussion이나 지정된 섹션에서 밝혀야 한다. "한계가 없다"는 선언 대신 현재 검증이 닿는 범위를 적는다.

**한계 기본 세 항목.** 방법의 가정(예: static environment 가정), 실험 범위(예: 실내 dataset만 검증), 계산 복잡도(예: $O(N^2)$ memory). 분야별로 추가.

**Results와 Discussion을 나누는 형식에서는 새 결과를 Results에 둔다.** 새 숫자, 새 그림, 새 ablation은 Results의 몫이다. Discussion에 해석 대신 추가 실험 결과가 끼어들면 두 섹션의 고유한 분담이 무너진다.

---

## 26.5 분야별 벤치마크 후보

분야별로 널리 쓰이는 benchmark와 metric이 있지만 task·sensor·연도에 따라 달라진다. 아래 표는 후보를 찾는 출발점이지 공식 표준 목록이 아니다. 실제 제출에서는 benchmark의 공식 evaluation page와 직접 비교 논문의 protocol을 확인한다.

| 분야 | 데이터셋 후보 | 지표 후보 |
|---|---|---|
| Visual SLAM | KITTI · TUM RGB-D · EuRoC | ATE · RTE |
| LiDAR SLAM | KITTI · MulRan · Newer College | ATE · RTE · Loop closure recall |
| 3D 재구성 | ScanNet · Tanks and Temples · Replica | F-score · 정확도 · 완전성 |
| Object detection | COCO · LVIS · Open Images | mAP · AP@[0.5:0.95] |

**방법별 결과 비교표에서는 표 직전 단락에 읽는 법을 한 줄로 설명한다.** "Bold marks the best in each column. Underline the second best." 한 줄이 빠지면 심사위원이 매번 캡션을 backtrack한다. Ch.28 §28.2에서 더 자세히.

**본인 방법 row 강조.** 음영 또는 별표. 표 아래 footnote에 Our method 라벨. 심사위원의 skim 단계에서 어느 row가 본인 방법인가가 한눈에 잡혀야 한다.

ablation·변인 통제·통계 유의성·공정 비교의 분야별 사례는 [robotics-practice ch20 §20.8.2](https://alexjunholee.github.io/robotics-practice/guide.html#2082-실험-설계와-ablation)에 정리되어 있다.

---

## 26.6 흔한 실수 5종

**Ablation 부재.** component별 기여를 주장하지만 효과를 분리해 검증하지 않음.

**반복 가능한 확률적 실험의 단일 run.** std/CI 부재. 우연성 미통제.

**불공정 비교.** hyperparameter budget·dataset split 비대칭.

**결과와 해석의 구분 누락.** content와 conclusion 스케일 혼합.

**Limitation 누락.** 검증 범위가 불분명해진다.

---

# Ch.27 — 그림: 안티패턴과 좋은 패턴

[Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)은 2nd pass에서 그림·도표를 주의 깊게 보고 축과 error bar를 확인하라고 한다. 1st pass의 항목에 그림이 명시된 것은 아니다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 9도 그림이 본문보다 더 많은 독자에게 노출된다는 이유로 시간을 더 배분하라고 권한다.

[Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) §V는 그림 하나를 5-10회 스케치하는 자신들의 작업 방식을 예로 든다. 핵심은 첫 스케치를 성급하게 확정하기보다, 시각화 논리가 명확해질 때까지 다양한 판본을 대조하라는 조언이다. 여기서 제시된 횟수는 Whitesides 연구실의 구체적 작업 관행을 보여주는 실례다.

학생들이 첫 그림을 matplotlib 기본 설정 그대로 PDF에 넣는 경우가 흔하다. 안티패턴 카탈로그는 [cxli233 (GitHub)의 Friends Don't Let Friends Make Bad Graphs](https://github.com/cxli233/FriendsDontLetFriends)에 정리되어 있다. 여기서는 그 카탈로그를 로보틱스·CV 사례에 적용하고 Whitesides의 작업 과정과 함께 살펴본다.

---

## 27.1 차트 안티패턴

**Mean separation에 bar plot.** 평균 차이를 막대로 그리면 분포가 보이지 않는다. 두 막대의 차이가 sample size 때문인지, variance 때문인지, 실제 평균 차이 때문인지 구별할 수 없다. KITTI 시퀀스별 RTE 평균을 method A·B의 막대 두 개로 그리는 그림이 흔한 사례다. 시퀀스별 점을 strip plot으로 깔고, 그 위에 평균 막대나 box plot을 얹는다.

**Small n에 violin plot.** Violin은 KDE에 의존하므로 표본이 적을 때 bandwidth 선택이 모양을 크게 바꿀 수 있다. 모든 분포에 통하는 `n≥10` 문턱은 없다. 점을 직접 보여 주고, violin을 쓴다면 표본 수와 bandwidth를 함께 검토한다. KITTI 몇 개 시퀀스처럼 각 관측을 모두 보일 수 있을 때는 strip plot이 더 정직할 수 있다.

**Unidirectional 데이터에 bidirectional color.** RdBu, coolwarm 같은 발산형 colormap은 0을 중심으로 의미 있는 양/음에만 쓴다. 0-100% recall에 RdBu를 쓰면 50%가 "중립"으로 보이는데, recall 50%는 중립이 아니다. 단방향 양수 데이터에는 viridis, magma 같은 perceptually uniform sequential colormap을 쓴다.

**Pie chart.** 비슷한 비율 여러 개를 각도로 비교하기는 어렵다. 정확한 순위와 차이가 중요하면 정렬한 가로 막대가 낫다. 항목 수에 고정 문턱을 두기보다 라벨이 겹치고 차이를 읽기 어려운지 확인한다.

**Rainbow scale (jet).** 비단조적 휘도 분포로 인해 색각 이상 독자의 판독을 방해할 뿐 아니라, 실제 데이터에 없는 인지적 인공 경계를 유발할 위험이 있다. Matplotlib은 2.0 버전부터 기본 컬러맵을 viridis로 전환했다. depth나 error map을 작성할 때는 데이터의 순차적 혹은 발산적 특성을 먼저 분류한 뒤, 인지적 균일성이 보장된 팔레트를 채택해야 한다.

---

## 27.2 라벨·축·통계 안티패턴

**Axis label 누락 또는 단위 누락.** 가로축이 시간인지 frame index인지, 단위가 second인지 millisecond인지 그림만 보고 답이 안 나오면 결과를 해석할 수 없다. 세로축도 동일하다. drift가 m인지 %인지, RTE가 m/s인지 m/frame인지 밝힌다.

**Error bar 정의 누락.** 막대 위에 ± 표시만 있고 그게 std인지 sem인지 95% CI인지 캡션에서 안 밝히면 그림을 통계적으로 해석할 수 없다. 캡션 한 줄이 빠져서 결과의 불확실성을 판단하지 못하는 경우다.

**Significance 표기 정의 누락.** `*`, `**`, `***`이 어떤 test의 어떤 p-threshold인지 캡션에 명시한다. 학생들이 별표만 그리고 test 이름을 빼는 일이 흔하다.

---

## 27.3 캡션은 self-explanatory해야 한다

Whitesides §V는 본문을 다시 펼치지 않고도 캡션만으로 그림을 이해할 수 있어야 한다고 적었다. 심사위원이 본문을 읽지 않고 그림만 훑을 때도 캡션이 takeaway를 전달해야 한다. 본문에 기대는 캡션은 그림만 훑을 때 제 역할을 하지 못한다.

캡션의 권장 구조는 세 부분으로 나뉜다.

1. **한 줄 takeaway.** "Method A는 KITTI 시퀀스 00-10 전반에서 method B 대비 RTE가 14% 낮다" 같은 서술문으로 쓴다. 여기서 14%는 서술 구조를 예시하기 위해 설정한 수치다.
2. **데이터·축·기호 정의.** 점이 무엇이고, 색이 무엇이며, error bar가 무엇인지.
3. **통계·n.** sample size, test, p-threshold.

---

## 27.4 그림 제작 과정

**여러 버전을 스케치하고 비교한다.** Whitesides 그룹의 5-10회는 반복의 효용을 보이는 사례다. 종이의 거친 스케치로 메시지와 비교군을 먼저 점검하고, 그림 코드는 구조가 잡힌 뒤에 작성한다. 스케치 횟수와 코드로 옮기는 시점은 그림의 복잡도에 맞게 정한다.

**그림의 메시지를 본문 초고 전에 시험한다.** Results 절을 쓰기 전에 핵심 그림 후보를 종이에 여러 번 그려 보면 필요한 비교와 빠진 실험이 드러난다. 후보 수와 작업 순서는 연구 형태에 맞춰 조정한다.

**Panel 간 색·기호·선 종류 일관.** 한 논문 안에서 method A는 늘 같은 색과 기호로 표시한다. 그림 3에서 파란 동그라미였다가 그림 7에서 빨간 세모가 되면 심사위원은 두 번 읽어야 한다.

---

## 27.5 좋은 그림 체크리스트

초안이 끝난 그림 한 컷에 다음 여섯 항목을 적용한다.

- Axis label과 단위 명시
- Error bar 정의 캡션에
- Colorblind-safe palette (viridis 계열, 또는 ColorBrewer 종류)
- 캡션 첫 줄이 declarative takeaway
- Panel 간 색·기호 일관
- 선·도형 중심 그림은 가능한 경우 vector(PDF/SVG)와 embedded font, 사진·heatmap은 venue가 요구하는 해상도와 색 공간

여섯 항목 중 해당 그림에 적용되는 항목을 모두 통과하지 못했다면 그림은 아직 초안이다.

---

# Ch.28 — 표: 비교의 자리

Ch.27의 그림이 분포·궤적·qualitative를 보여 준다면, 표는 수치 비교를 맡는다. 두 매체의 선택 기준이 다르므로 그림을 표로 옮기거나 표를 그림으로 옮기면 한쪽의 장점이 약해진다. 분포가 중요한 곳에 표를 두면 분포가 사라지고, 정확한 수치 비교가 중요한 곳에 그림을 두면 심사위원이 bar 길이에서 수치를 추출해야 한다.

[cxli233 (GitHub)의 Friends Don't Let Friends Make Bad Graphs](https://github.com/cxli233/FriendsDontLetFriends)가 그림 안티패턴을 목록으로 정리한 것처럼, 표 안티패턴도 분야에서 정형화된 형태로 반복된다. Ch.27과 같은 방식으로 표의 안티패턴과 좋은 패턴을 살펴본다.

---

## 28.1 안티패턴 5종

**강조 표시 일관성 부재.** 본인 방법은 bold, baseline은 plain으로 표시하면서 ablation 표에서는 best component에 underline을 쓰는 식이다. 한 논문 안에서 강조의 의미가 표마다 바뀌면 심사위원이 매번 캡션을 되짚어야 한다. `bold = best`, `underline = second best`는 흔한 규약이지만 유일한 표준은 아니다. venue template와 접근성을 확인하고 선택한 의미를 캡션에서 밝힌다.

**너무 많은 column.** KITTI 11 시퀀스를 모두 column에 넣으면 표가 지면 폭을 넘을 수 있다. 시퀀스를 row로, metric을 column으로 두거나 그 반대로 두되 일관성을 지킨다. 5-15 row × 3-7 column은 초안 점검용 범위일 뿐 가독성의 보편 한계가 아니다. 실제 지면과 글자 크기로 확인한다.

**Vertical line 남발.** LaTeX 기본 `|`를 모든 column 사이에 넣으면 구획선이 데이터보다 두드러질 수 있다. `booktabs`의 `\toprule`, `\midrule`, `\bottomrule`은 널리 쓰이는 선택지다. vertical line을 쓸지는 venue template와 복잡한 column grouping의 필요를 보고 정한다.

**지나치게 작은 폰트.** 표를 맞추려고 `\small`·`\footnotesize`를 반복 적용하면 인쇄와 화면에서 읽기 어려워진다. 먼저 column 수와 문구를 줄이고, venue가 허용하는 최소 글자 크기 안에서만 조정한다.

**숫자 정렬 부재.** 0.143과 0.07이 한 column에 섞여 있는데 소수점 위치가 안 맞으면 시각적 비교가 깨진다. `siunitx` package 또는 `\phantom{0}`으로 자릿수를 맞춘다. 한 column 안에서 모든 숫자의 소수점이 같은 위치에 와야 한다.

---

## 28.2 좋은 패턴

**Booktabs.** `\toprule`(표 상단), `\midrule`(header와 body 사이), `\bottomrule`(표 하단)을 쓰고, column 그룹에는 `\cmidrule{2-4}`를 쓸 수 있다. 장식선보다 데이터 grouping이 먼저 보이게 만드는 한 가지 구현이다.

**강조 규약 명시.** 캡션 첫 줄이나 표 하단 footnote에 "Bold marks the best, underline the second best in each column"처럼 적는다. 한 논문의 모든 표가 같은 규약을 공유한다.

**캡션 구조 3단.**

1. **한 줄 takeaway.** "Method A consistently outperforms baselines on KITTI sequences 00-10."
2. **표 읽는 법.** bold/underline 의미·dataset split·평균 횟수.
3. **통계.** std 또는 95% CI·n·seed.

**본인 방법 row 강조.** 음영(`\rowcolor{gray!15}`)이나 별표를 쓰고, 표 아래 footnote에 Our method라고 표시한다. 심사위원이 훑어 읽는 단계에서 어느 row가 본인 방법인지 한눈에 알아야 한다. Ch.26 §26.5와 같은 권고다.

---

## 28.3 세 종류 — 비교 표·ablation 표·hyperparameter 표

**비교 표.** row = 방법, column = dataset/sequence × metric. baseline 수에 고정된 5-10줄 규칙은 없다. 중심 claim과 직접 관련된 강한 비교군, 동일 protocol에서 평가 가능한 방법을 포함한다. column이 많아지면 dataset별로 표를 나눈다. 아래 수치는 표의 layout 구조를 설명하기 위해 설정한 예시 데이터다.

| Method | KITTI 00 ATE ↓ | KITTI 09 ATE ↓ | TUM fr1 ATE ↓ | Runtime ↓ |
|---|---|---|---|---|
| ORB-SLAM3 | 0.51 | 1.34 | 0.018 | 22 ms |
| LIO-SAM | 0.42 | 0.91 | — | 28 ms |
| **Ours** | **0.38** | <u>0.73</u> | **0.012** | **18 ms** |

**Ablation 표.** row = removed component, column = metric. 첫 행 또는 마지막 행이 full method (baseline). 한 component씩 제거. Ch.26 §26.2의 표 예시가 같은 형태.

**Hyperparameter 표.** row = parameter, column = value · meaning · sensitivity. 마지막 column은 ablation이나 sensitivity analysis와 연결할 수 있다. `RTE 0.84 → 0.61` 같은 수치는 실제 분석에서 확인된 경우에만 쓰고, 그렇지 않으면 분석 위치를 참조한다.

---

## 28.4 흔한 실수 4종

**강조 일관성 부재.** bold/underline의 의미가 표마다 다르면 한 논문 한 규약을 어긴다.

**Column 폭주.** row와 column 축을 잘못 잡아 시퀀스가 column에 몰리면 표가 가로로 넘친다.

**숫자 정렬 부재.** 소수점이 어긋나면 시각적 비교가 깨진다.

**캡션 한 줄 takeaway 부재.** 표만 보고 결론을 알 수 없다. Ch.27 §27.3의 그림 캡션 권고와 같은 내용이다.

---

## 28.5 Ch.27과의 결정 기준

그림과 표 중 어느 쪽에 정보를 박을지 결정하는 기준은 다음과 같다.

- **분포가 중요하면** 그림 (strip plot · violin · box). row 5개 column 3개 표는 분포를 못 보여 준다.
- **정확한 수치 비교가 중요하면** 표. 그림의 bar 길이에서 심사위원이 수치를 추출해야 하면 비교 정확도가 떨어진다.
- **Trajectory·spatial 정보면** 그림 (궤적 시각화·heatmap·error map). 표로는 공간 정보를 전달하기 어렵다.
- **방법 간 다차원 비교면** 표. 차원이 많아질수록 표가 유리할 수 있지만, column 수보다 독자가 해야 할 비교가 무엇인지 먼저 본다.

두 매체가 같은 정보만 중복하면 한쪽을 빼는 편이 낫다. 같은 KITTI 결과라도 그림이 공간적 실패 패턴을, 표가 정확한 metric을 보여 준다면 서로 보완한다. 각 매체가 답하는 질문을 캡션에서 분리한다.

LaTeX 도구(booktabs·algorithm2e)의 자세한 사용법은 [robotics-practice ch20 §20.8.5](https://alexjunholee.github.io/robotics-practice/guide.html#2085-도구)에서 확인할 수 있다.

# Ch.29 — 문장 구조와 독자 기대

영어 논문이 안 읽힌다고 느끼는 학생은 어휘를 더 어렵게 바꾸려 든다. [Gopen & Swan 1990](https://www.americanscientist.org/article/the-science-of-scientific-writing)의 진단은 정반대 방향을 가리킨다. 글의 어려움은 주로 정보가 배치되는 문장 구조에서 발생한다. 단어만 교체하는 접근으로는 실질적 효과를 거두기 힘들다. 독자가 기대하는 자리에 정보를 정렬하는 배치가 글의 명료성을 결정한다.

Gopen-Swan은 같은 논문에서 "글의 질을 개선하면 사고의 질이 개선된다"고 적었다. 구조를 다듬다 보면 개념의 빈틈이 드러난다는 뜻이다. 문장 구조 점검은 사고를 점검하는 도구이기도 하다.

다만 이 지침들은 기계적 규칙이라기보다 유연한 원칙에 가깝다는 단서가 붙는다. 글을 능숙하게 쓰는 사람은 필요할 때 원칙을 의도적으로 넘나든다. 어기는 위치가 일관되고, 그 선택의 분명한 이유를 이해하고 있기 때문이다.

---

## 29.1 문장 안의 위치 — 5대 원칙

**Stress position — 문장 끝에는 새 정보를 둔다.** 문장 끝이나 `;` `:` 직전이 강조 위치다. 독자는 거기에 도달할 때 닫힘(closure)을 느끼고 가장 강하게 기억한다. 보일러플레이트가 거기에 오면 강조가 사라진다.

> ❌ The proposed method achieves 14% improvement in this paper.
>
> ✓ In this paper, the proposed method improves accuracy by 14%.

"in this paper"는 backward link 역할을 하므로 topic position에 둔다. stress position에는 14%를 둔다. 여기서 14%는 문맥상의 어순 배치를 예시하기 위해 든 수치다.

**Topic position — 문장 머리에는 이미 등장한 것.** 문장 첫 단어는 관점을 정하고 backward link를 건다. 새 명사를 첫머리에 던지면 독자가 앞 단락과 연결할 단서를 잃는다.

**Subject-Verb proximity — 주어와 동사 사이는 짧게 둔다.** 주어와 동사 사이가 15단어를 넘으면 위험 신호다. 한국어 모어 화자인 학생이 관계절·전치사구를 끼워 넣다가 가장 자주 어기는 원칙이다. 독자는 동사를 만나기 전까지 주어를 작업 기억에 들고 있어야 한다.

**Old-before-New.** topic = old, stress = new. Gopen-Swan이 "미국 전문 글쓰기 1번 문제"라고 박은 원칙. 정보의 흐름 순서가 뒤틀리면 독자가 매 문장에서 왜 이 정보가 지금 들어오는지 추론하느라 인지자원을 소모하게 된다.

**Action-in-verb.** action은 verb 자리에 둔다. 명사화하면 verb 자리가 헐거워진다.

> ❌ We performed an evaluation of the algorithm on KITTI.
>
> ✓ We evaluated the algorithm on KITTI.

명사화는 행위를 약화한다. 동사 자리를 일반 동사 performed가 차지해 정작 행위인 evaluation이 명사구 안에 묻힌다.

---

## 29.2 단위 하나, 메시지 하나

한 문장 = 한 메시지도 Gopen-Swan의 원칙이다. 진단법은 단순하다. stress position에 놓일 후보가 둘 이상이면 그 문장이 너무 길다.

> "딸기 쇼트케이크로 시작해 브로콜리로 끝내는 식사는 없다."

stress position에 들어갈 만큼 무게 있는 명사구가 한 문장 안에 둘 이상 등장하면 식사 메뉴가 어긋난다. 끊어서 두 문장으로 만든다.

길게 갈 수밖에 없는 곳에서는 `:`나 `;`가 secondary stress를 만든다. punctuation이 만드는 medial closure다. 그 자리에도 무게 있는 명사구가 오도록 배치한다.

---

## 29.3 한국어 → 영어 — 모국어가 만드는 함정 4가지

Gopen-Swan은 영어 모국어 독자만 다룬다. 한편 한국어 모어 화자인 학생에게는 모국어 구조가 만드는 추가 함정이 있다.

**SOV → SVO 전환 실패.** 한국어는 동사가 끝에 온다. 머릿속에서 동사를 문장 끝까지 미루는 언어 습관이 영어 작문으로 이어지면서 주어와 동사 사이의 간격이 비대해진다.

> ❌ The proposed method, which combines geometric ICP with a learned residual network trained on \(N\) sequences from benchmark \(B\), reduces ATE on the benchmark.
>
> ✓ The proposed method reduces ATE on benchmark \(B\). It combines geometric ICP with a learned residual network trained on \(N\) sequences.

주어 다음에 바로 동사를 두고, 부연은 다음 문장으로 분리한다.

**"은/는" topic 표지 ≠ 영어 topic position.** 한국어의 "은/는"은 주제 제시와 대조의 기능을 동시에 수행한다. 영어의 topic position은 앞 문맥과의 연결(backward link)에 집중하는 자리다. 단락 첫머리에 습관적으로 "On the other hand"를 두는 실수가 잦지만, 대다수 맥락에서는 대조보다 논리적 연속성을 확보해야 backward link가 매끄럽게 유지된다.

**Nominalization 함정.** "~의 수행", "~의 분석" 같은 한국어 학술체가 영어로 옮길 때 `the performance of`, `the analysis of`로 굳어질 수 있다. 행위를 강조해야 하는 문장에서는 동사가 명사화에 묻히지 않았는지 확인한다. 개념 자체를 지칭하는 명사화는 살리되, 핵심 동작을 은폐하는 명사 표현은 동사 형태로 전환하는 편이 바람직하다.

**There-구문 남발.** "there are several methods that …"가 topic position을 유령으로 채운다. backward link를 거는 자리가 비고, several methods가 sentence body에서 떠다닌다. 그 대신 "Prior work explores several methods …"로 시작해 prior work가 backward link를 받게 한다.

한국어에서 의도한 old/new 정보의 관계와 강조가 영어 문장에서도 이어지는지 점검한다. "이 결과는 중요한데 …"처럼 미완성인 구절의 어순을 따라 옮기기보다, 완성된 영어 문장에서 독자가 무엇을 강조점으로 읽을지 topic position과 stress position을 확인한다.

---

## 29.4 자기 진단 — 자기 문장 reverse-read

한 단락을 다 쓴 뒤 다음 세 가지를 점검한다.

**Topic-flow 추적.** 각 문장의 첫 명사구만 추출해 한 줄로 나열한다. 그 체인이 끊기지 않고 이어져야 한다. 첫 명사구가 매 문장마다 새로운 것이라면 backward link가 무너졌다.

**Stress 점검.** 각 문장의 마지막 명사구만 추출한다. "this paper", "the proposed method", "our approach" 같은 보일러플레이트가 stress position을 차지하고 있으면 모두 재배치해 둔다.

**소리 내어 읽기.** 주어-동사 거리가 멀면 호흡이 끊긴다. Knuth가 Mathematical Writing에서도 같은 처방을 권한 만큼, 자기 글을 큰 소리로 읽는 작업이 두 자료의 권고에서 같은 위치를 차지한다.

URF/ATPase 단락의 before/after rewrite와 Gopen-Swan이 같은 논문 §III에 제시한 사례의 발췌·줄별 분석은 [`gopen_swan_urf_rewrite.md`](./excerpts/excerpt_03_gopen_swan_urf_rewrite.md)에 있다.

---

**출처.** [Gopen & Swan 1990](https://www.americanscientist.org/article/the-science-of-scientific-writing) — stress/topic position, subject-verb proximity, old-before-new, action-in-verb, "1번 문제" 인용, 쇼트케이크 비유. 한국어 모어 화자가 직면하는 네 가지 구조적 함정은 본문에서 독자적으로 분석해 체계화했다. Knuth와 공통되는 큰 소리로 읽기 처방은 [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html)와 교차.

# Ch.30 — 수식·정리·증명 쓰기

[Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html)은 독자가 수식이 들어간 단락을 어떻게 읽는지 관찰했다. 첫 독서에서는 수식을 훑어 넘기는 독자가 많다. 그래서 §1 point 13은 수식이 빠져도 산문이 흘러야 한다는 'blah' 테스트를 제시한다. 간단한 수식을 제외한 나머지를 'blah'로 바꾸어도 문장이 이어져야 한다는 뜻이다.

학생들이 가장 자주 어기는 곳이 여기다. displayed equation 다섯 줄을 연달아 놓고 between-equation prose를 한 줄도 쓰지 않은 derivation이 흔하다. 그러면 심사위원은 첫 독서에서 그 페이지를 통과하지 못한다. Nilsson이 §34에 적은 "쉽게 쓴 글일수록 읽기 어렵다"가 같은 문제를 가리킨다. 수식 사이의 산문은 공들여 다듬을수록 읽기 쉬워진다.

---

## 30.1 수식이 문장에 들어가는 법

**R1. 인접한 수식 사이에는 단어를 넣는다 (point 1).** 두 수식이 쉼표만으로 이어지면 어디서 한 수식이 끝나고 다음이 시작하는지 즉시 안 잡힌다.

> ❌ Consider $S_q$, $q < p$.
>
> ✓ Consider $S_q$, where $q < p$.

**R2. 문장은 수식으로 시작하지 않는다 (point 2).**

> ❌ $X$ denotes the rotation matrix.
>
> ✓ Let $X$ denote the rotation matrix.

문장 첫 자리에는 산문 단어를 둔다. Ch.29의 topic position 원칙과 같다.

**R3. 산문 안에 ∴ ⇒ ∀ ∃ 금지(point 3).** 논리 기호는 수식 안에서만 쓴다. 본문 문장 안에 `∴`를 끼워 넣으면 심사위원이 두 번 해석해야 한다.

**R4. Displayed equation은 둘러싼 문장의 일부다(points 10, 23).** 수식 앞에는 불필요한 colon을 두지 않는다. equation 끝의 마침표·쉼표도 문장 부호에 맞게 쓴다.

> displayed equation의 끝이 문장의 끝이면 수식 뒤에 마침표.
> displayed equation 다음에 산문이 이어지면 수식 뒤에 쉼표 또는 무부호.

**R5. 인용 형식(point 19).** "Equation (5)", "Theorem 2", "Lemma 3.1". 번호가 붙으면 첫 글자 대문자.

**R6. 정의는 서로 다른 두 방식으로 쓴다(point 11).** 수식과 산문을 함께 쓴다. "Let $\mathbf{T} \in SE(3)$ denote the rigid-body transform from sensor frame to world frame."에서는 수식과 산문이 같은 정의를 서로 다른 방식으로 제시한다.

**R7. 중요한 수식을 displayed로 두고, 멀리서 참조할 중요한 수식에는 번호를 붙인다(point 16).** 모든 수식에 번호를 붙이면 중요도의 위계가 흐려진다. 번호가 필요한 수식을 원고 전체에서 일관되게 고른다.

**R8. 같은 기호를 두 의미로 쓰지 않는다(point 14).** 로보틱스에서 흔한 충돌이다. $R$이 회전행렬·residual·reward로 동시에 쓰이는 문서가 있다. 한 문서 안에서는 한 의미로만 쓴다. [Ch.31](./chapter_31_notation_hygiene.md)의 매크로 위생과 직결된다.

**R9. "that"을 빼지 마라(point 8).**

> ❌ We show $X$ converges.
>
> ✓ We show that $X$ converges.

영어 논문에서 "that"을 생략하면 해석이 어려워질 때가 있다.

**R10. "we"를 쓰고 "I"는 피한다(point 6).** 여기서 `we`는 저자와 독자가 함께 논의를 따라간다는 뜻일 때 쓴다. 저자의 인격이 논점과 무관한 기술 글에서는 `I`를 피하라는 권고다. 한국 영어 교육에서 강조해 온 수동태 우선 관행과 충돌하지만, Ch.16에서 다룬 지도교수의 스타일을 따른다는 원칙과 같은 결정축에 있다.

---

## 30.2 Theorem·Lemma·Proof — 자기완결과 signposting

**Theorem statement는 자기완결적이다.** Knuth point 5의 핵심이다. 정리 안의 모든 기호가 정리문 안에서 정의되거나 명시 참조되어야 한다. 앞 단락을 다시 읽어야 statement가 이해되면 self-contained가 아니다.

> ❌ **Theorem 1.** Under the conditions above, the estimator converges.
>
> ✓ **Theorem 1.** Let $\mathbf{x}_{k+1}=\mathbf{A}\mathbf{x}_k$, where $\mathbf{x}_0\in\mathbb{R}^n$, $\mathbf{A}\in\mathbb{R}^{n\times n}$, and $\lVert\mathbf{A}\rVert_2<1$. Then $\lVert\mathbf{x}_k\rVert_2\leq\lVert\mathbf{A}\rVert_2^k\lVert\mathbf{x}_0\rVert_2$, and hence $\mathbf{x}_k\to\mathbf{0}$ as $k\to\infty$.

**Motivate before stating.** 정리 진술 직전에 왜 이 정리가 필요한지 짧게 짚는다. 구체적인 문장 수보다 독자가 이 결과의 역할을 알 수 있게 하는 것이 중요하다.

**Lemma·Theorem·Corollary는 위계가 다르다.** Lemma는 주장을 뒷받침하는 디딤돌 역할을 한다. Theorem은 논문의 핵심 정리를 진술하며, Corollary는 그로부터 유도되는 귀결에 해당한다. 한국 학생이 디딤돌도 Theorem으로 표시하는 일이 흔하다. 그러면 위계가 흐려져 심사위원이 실제 main result를 찾기 어렵다.

**증명 안의 signpost.** "We divide the proof into two parts." "The lemma is half proved." 증명이 길거나 논리 단계가 여러 개면 signpost를 둔다. 반 페이지는 편집 휴리스틱일 뿐 필수 기준이 아니다.

**Direct proof가 가능하면 contradiction부터 쓰지 않는다.** Knuth의 권고다. proof by contradiction은 독자에게 부정 명제를 작업 기억에 들고 있을 부담을 지운다. direct proof가 가능한 곳에서는 direct를 우선한다.

**증명 마침 표시(∎).** venue·class·template이 쓰는 규약을 따른다. LaTeX의 proof 환경이 자동으로 표시하는 경우 따로 중복하지 않는다.

---

## 30.3 로보틱스·CV 특화 패턴

**SE(3)·Lie group 표기.** $\mathbf{T} \in SE(3)$, $\boldsymbol{\xi} \in \mathfrak{se}(3)$. 한 논문 안에서 case·bold·hat을 통일한다. 회전행렬을 한 곳에서 $\mathbf{R}$, 다른 곳에서 $R$로 쓰면 심사위원이 다른 양인지 추측해야 한다. [Ch.31](./chapter_31_notation_hygiene.md)에서 매크로로 통일한다.

**Optimization 수식 패턴.**

$$\mathbf{x}^\star = \arg\min_{\mathbf{x}} f(\mathbf{x}) \quad \text{s.t.} \quad g(\mathbf{x}) = 0$$

`\text{s.t.}`인지 `\text{subject to}`인지 한 문서 안에서 통일한다. 처음 등장할 때 산문으로 한 번 풀어 쓴다.

**Probabilistic 수식.** $p(\mathbf{x} \mid \mathbf{z})$의 `\mid`와 `|`를 섞지 않는다. Bayes filter 단계마다 prior, likelihood, posterior가 무엇을 가리키는지 산문에서 명시한다. R6의 이중 표현이 적용된다.

**잔차·loss 정의.** $\mathbf{r}_i = \mathbf{z}_i - h(\mathbf{x})$ 같은 잔차 정의에서는 인덱스 $i$가 무엇을 순회하는지 산문에서 항상 밝힌다. "for each measurement $i \in \{1, \ldots, N\}$." 인덱스 변수만 두면 독자가 어떤 집합 위에서의 합인지 추측해야 한다.

**수식 줄바꿈에서 등호의 위치.** Inline 수식은 등호 뒤에서 행을 나눈다. Displayed 수식 환경에서는 등호 직전에 줄바꿈을 둔다. Knuth가 §1에 박은 typographic convention이다.

---

## 30.4 진단 — 자기 derivation의 'blah' 통과

자기 글의 derivation 한 페이지를 골라 간단한 수식을 제외한 나머지를 'blah'로 바꾸어 본다. 그 페이지가 산문으로서 흘러야 한다. 흐름이 끊기는 곳이 between-equation prose가 비어 있는 자리다.

Knuth는 §2-§3에서 같은 정리의 atrocious proof와 polished proof를 나란히 놓고 줄별로 비교한다. 발췌와 분석은 [`knuth_proof_rewrite.md`](./excerpts/excerpt_04_knuth_proof_rewrite.md)에 있다.

---

**출처.** [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) — Mathematical Writing §1의 27 points에서 추린 10개(points 1, 2, 3, 5, 6, 8, 10, 11, 13, 14, 16, 19, 23을 주제별로 묶음). atrocious-vs-polished proof는 §2-§3. Halmos box와 Nilsson 강연도 같은 문서에 실려 있다. 로보틱스·CV 분야에 특화된 다섯 가지 수식 작성 패턴은 본문에서 실무적 관점으로 체계화했다.

# Ch.31 — 표기 위생

[Ch.30 — 수식·정리·증명](./chapter_30_math_and_proofs.md)이 문장 안에 수식을 넣는 법을 다뤘다면, 여기서는 논문 전체의 표기를 일관되게 유지하는 법을 다룬다. 두 논의 모두 [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1의 27 points에서 출발한다.

심사위원이 같은 기호를 서로 다른 의미로 만나면 의도한 차이인지 오타인지 추측해야 한다. 이 추측이 작업 기억을 갉아먹는다. 표기 위생은 독자의 인지 부담을 낮춘다.

학생들이 가장 자주 빠지는 결함은 raw symbol을 매번 타이핑하는 패턴이다. macro 없이 본문 곳곳에 $\mathbf{R}$을 직접 입력하면, 한 곳만 $R$로 적어도 심사위원은 오타인지 의도인지 알기 어렵다. 표기 위생은 도구로 강제하는 편이 낫다.

---

## 31.1 Notation table — 한 곳에 한 번

**표기가 많다면 Method 도입에 notation table을 둔다.** 핵심 기호를 표와 본문 첫 등장 중 적절한 곳에서 정의한다. 기호가 몇 개뿐이라면 별도 표 없이 산문 정의로 충분하다. [Ch.25 §25.2](./chapter_25_method.md)와 같은 권고다.

**표는 다음 네 열에서 필요한 것을 고른다.** `First introduced`가 지면만 차지한다면 뺄 수 있다.

| Symbol | Meaning | Dimension/Unit | First introduced |
|---|---|---|---|
| $\mathbf{T}_k$ | sensor pose at time $k$ | $SE(3)$ | §3.1 |
| $\mathbf{r}_i$ | reprojection residual for measurement $i$ | $\mathbb{R}^2$ | §3.2 |
| $\lambda$ | regularization weight | scalar | §3.3 |

**표 위치.** 독자가 기호를 처음 많이 만나는 대목보다 앞에 둔다. 반드시 Method 도입의 마지막 단락일 필요는 없다.

**한 기호에 두 의미를 두지 않는다.** $R$이 회전·residual·reward로 동시에 쓰이는 논문이 흔하다. [Ch.30 R8](./chapter_30_math_and_proofs.md)과 같은 권고다. notation table로 이 문제를 명시적으로 확인할 수 있다.

---

## 31.2 LaTeX 매크로 — 강제력 있는 통일

**반복되고 바뀔 가능성이 있는 표기를 매크로로 정의한다.** raw symbol을 매번 타이핑하는 대신 매크로 정의 한 줄에 사용을 묶으면 한 곳을 수정해 논문 전체에 적용할 수 있다. 단발성 기호까지 무리하게 매크로로 치환하면 TeX 원본의 직관적 가독성이 저하될 수 있다.

```latex
% 회전·변환 (Lie group)
\newcommand{\R}{\mathbf{R}}
\newcommand{\T}{\mathbf{T}}
\newcommand{\SE}[1]{SE(#1)}
\newcommand{\so}[1]{\mathfrak{so}(#1)}

% Bold vector
\newcommand{\xb}{\mathbf{x}}
\newcommand{\yb}{\mathbf{y}}
\newcommand{\zb}{\mathbf{z}}

% 통계
\newcommand{\E}{\mathbb{E}}
\newcommand{\Var}{\mathrm{Var}}
\newcommand{\Cov}{\mathrm{Cov}}
```

**매크로 부재의 비용.** 회전을 $\mathbf{R}$에서 $R$로 바꾸고 싶으면 매크로 정의 한 줄만 수정하면 끝나는 한편, raw symbol을 본문에 직접 친 논문은 search-and-replace로도 모든 곳을 잡았다고 보장할 수 없다. 한 곳만 깜박한 결함이 그대로 심사위원에게 도달한다.

**매크로 그룹화.** Lie group, bold vector, 통계, dataset 이름(`\KITTI`, `\TUM`) 등 그룹별로 묶어 두면 본문에서 어떤 곳에 어떤 매크로를 쓰는지 잡기 쉬워진다.

---

## 31.3 Dimension 일관성 — 단위와 차원

**모든 물리량에 단위 표기.** runtime이 ms인지 s인지, drift가 m인지 %인지가 본문·표·그림 모든 곳에서 같아야 한다. 같은 metric의 단위가 표마다 다르면 심사위원이 매번 변환을 시도한다.

**단위 권고.** 본문 첫 등장 시 `runtime ($\mathrm{ms}$)`, `drift ($\mathrm{m}$)`처럼 밝히고 표·그림 축에도 적는다. 분야·venue가 SI 사용을 요구하는지 확인한다. 단위가 빠지면 수치를 해석할 수 없다.

**차원 명시.** vector 차원($\mathbb{R}^3$), matrix 차원($\mathbb{R}^{m \times n}$)이 처음 등장 시 명시. 본문에서 dimension이 추측되어야 하면 그 자체가 결함이다. notation table의 dimension column이 이 부분을 잡아 둔다.

---

## 31.4 Index 일관성 — 변수와 도메인

**Index 변수의 의미 일관.** 한 논문 안에서 $i$가 한 곳에서는 measurement, 다른 곳에서는 camera view를 가리키면 심사위원이 추측해야 한다. $i$를 measurement index로 정했다면 논문 전체에서 그 뜻을 유지한다.

**관습의 예.** 분야와 논문마다 다르지만 로보틱스·CV에서 다음과 같은 선택을 볼 수 있다.

- $i$ — measurement / observation
- $j$ — landmark / keypoint / track
- $k$ — time / frame
- $n$ — count (총 개수)

한 논문 안에서 일관되면 이 예를 따르지 않아도 된다. 기호의 뜻을 첫 등장에 명시하고 domain을 함께 적는 것이 관습보다 우선한다.

**합의 범위를 명시한다.** $\sum_{i=1}^N$이면 N이 무엇의 개수인지 산문에서 한 번 밝힌다. Ch.30 §30.3의 잔차·loss 정의와 같은 권고다. 인덱스 변수만 두면 독자가 어떤 집합 위에서의 합인지 추측해야 한다.

---

## 31.5 분야별 기본 관례

분야별로 널리 쓰이는 표기 관습이 있다. 아래는 자주 보이는 예이지 표준의 완전한 목록이 아니다.

**로보틱스/SLAM**: $\mathbf{T} \in SE(3)$ 변환, $\mathbf{R} \in SO(3)$ 회전, $\boldsymbol{\xi} \in \mathfrak{se}(3)$ Lie algebra, $\mathbf{p}$ point, $\mathbf{x}$ state, $\mathbf{z}$ measurement.

**CV**: $\mathbf{x}$ image coordinate, $\mathbf{X}$ world coordinate, $\mathbf{K}$ intrinsic, $\mathbf{P}$ projection.

**ML/통계**: $\theta$ parameter, $p(\cdot)$ distribution, $\mathcal{L}$ loss, $\mathcal{D}$ dataset.

새로운 표기가 관례와 충돌할 때 독자의 혼란이 가중된다. 가령 $\mathbf{T}$를 관습적인 좌표 변환 대신 학습용 데이터셋(training set)의 약어로 차용하면, 심사위원이 기대하는 의미 체계와 본문의 서술이 어긋나게 된다. 이러한 불일치는 매번 인지적 재조정을 요구하므로, 기존 표준 관례와 상충하지 않는 범위 내에서 새 기호를 도입해야 독자의 혼선을 줄일 수 있다.

---

## 31.6 흔한 실수 5종

**한 기호 두 의미.** $R$이 회전·residual 동시 사용. 가장 자주 잡히는 결함.

**정의의 위치가 불명확함.** 표기가 많은데 notation table이나 첫 등장 정의가 없어 backtrack해야 함.

**단위 누락.** 표·그림 축에 단위가 없어 수치를 해석할 수 없음.

**Index 변수 재배정.** $i$의 의미가 섹션마다 바뀜.

**매크로 부재.** raw symbol 매번 타이핑. 한 곳만 어긋난 결함이 살아남음.

---

## 31.7 자기 진단

자기 원고에서 다음 두 가지를 점검한다.

1. **Notation 추출.** 본문에 등장하는 모든 수학 기호를 한 페이지에 추출해 본다. 같은 기호가 두 의미로 쓰이는 곳이 있는가. notation table에 빠진 기호가 있는가.
2. **단위 추출.** 모든 표·그림의 축 라벨과 셀 값을 추출한다. 단위가 빠진 곳이 있는가. 같은 metric의 단위가 표마다 다른가.

두 작업의 전체 sweep은 원고가 안정된 뒤에 한다. 초고 중에는 notation 목록을 함께 갱신하고, 마지막 교정에서 누락과 충돌을 다시 확인한다.

수식 문법은 문장 안에서, 수식 위생은 논문 전체에서 작동한다. 둘은 같은 Knuth의 원칙에서 나왔지만 적용 층위가 다르다.

---

**출처.** [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1 point 11(변수 정의)·point 14(같은 대상에 일관된 표기) — notation table, 매크로, dimension/index 점검으로 확장했다. 분야별 표기 사례는 엄격한 강제 규정이라기보다 초기 설계를 보조하는 관습적 가이드라인이다.
