# 12장 독자 기대로 진단하기

초록 한 단락을 다섯 번이나 읽고도 뜻이 잡히지 않을 때, 한국어를 모어로 쓰는 학생은 대개 둘 중 하나를 의심한다. "내 영어 실력이 모자란가?" 아니면 "분야 배경이 너무 약한가?" [Gopen & Swan 1990](https://www.americanscientist.org/blog/the-long-view/the-science-of-scientific-writing)은 바로 그 통념을 정면으로 반박하며 글을 연다. 과학 논문이 어려운 까닭은 개념이 복잡해서가 아니라 정보를 배치하는 자리가 어긋났기 때문이며, 내용을 깎아내리지 않고도 정보의 위치만 바로잡으면 뜻이 훨씬 또렷하게 전달된다는 것이다. [11장](./chapter_11_ccc_lens.md)에서 단락과 섹션의 뼈대를 살폈다면, 이제는 문장 안으로 시선을 좁혀 독해가 막힌 책임이 독자에게 있는지 문장 구조에 있는지 진단해 볼 차례다.

---

## 12.1 안 읽히는 책임을 누구에게 둘까

과학 글을 읽다가 숨이 턱 막힐 때마다 자기 어휘력이나 배경지식부터 탓할 필요는 없다.

> **글이 안 읽히면 글의 구조도 점검한다.** Gopen과 Swan은 글의 질을 높이면 실제로 생각의 질도 높아진다고 적었다. 물론 이 말만으로 독해 실패를 모조리 글의 결함으로 돌릴 수는 없다. 다만 독자는 자기 능력을 자책하기 전에 문장 구조를 먼저 진단해 볼 수 있고, 저자 역시 같은 진단으로 자기 생각을 명료하게 가다듬을 수 있다.

실제로 Gopen과 Swan은 지진 재발 간격을 다룬 난해한 단락을 직접 고쳐 쓴 뒤, 처음 읽을 때 겪은 어려움의 대부분은 독자의 읽기 능력이 부족해서가 아니라 저자가 독자에게 필요한 문장 구조를 헤아리지 못한 탓이었다고 고백했다. 이어 그들이 분석한 분자생물학(URF) 단락에서는 전문용어를 모조리 [A], [B] 같은 임시 기호로 치환해 보았는데도 문장이 여전히 머리에 들어오지 않았다. 전문용어는 어려움의 작은 일부에 지나지 않았던 셈이다. 이처럼 어휘를 다 아는데도 읽히지 않는 단락을 만나면, 단어 뜻이 아니라 문장 안에서 각 정보가 어디에 놓였는지를 따져야 한다.

---

## 12.2 네 진단 도구로 한 문장씩 본다

큰 뼈대의 결함을 먼저 걷어 내야 작은 결함도 눈에 들어오므로, 문장은 stress → topic → subject-verb → old-new 순서로 진단한다.

**진단 1 — Stress position.** 영어 독자는 문장 끝(또는 콜론·세미콜론 바로 앞)에 놓인 정보에 저절로 힘을 실어 읽는다. 여기가 바로 강조 위치다. 진단 질문은 간단하다. "이 문장이 정말 강조하려는 단어를 하나만 짚으라면 무엇인가?" 그 핵심 단어가 문장 끝에 앉아 있다면 의도대로 읽힌다. 반대로 문장 끝을 "in this paper", "as shown above", "by the authors" 같은 상투어가 차지하고 있다면 가장 값진 강조 자리를 헛되이 날린 셈이다. Gopen과 Swan은 이를 식사 순서에 빗대어 "We do not start with the strawberry shortcake and work our way up to the broccoli"(딸기 쇼트케이크로 시작해 브로콜리로 끝내지 않는다)라고 꼬집었다.

**진단 2 — Topic position.** 문장 첫머리는 독자에게 이 문장을 어떤 관점에서 읽어야 할지 안내하고, 앞 문장과 다리를 놓는 자리다. 첫 명사구를 뽑아 보았을 때 앞 문장의 내용과 이어지는지 확인하자. 앞 문장과 맞물리는 구정보가 문장 첫머리는 물론 문장 어디에도 없다면, 독자는 끊어진 논리의 빈틈을 혼자 짐작해 메워야 한다. Gopen과 Swan은 바로 이 지점을 logical gap(논리의 빈틈)이라 불렀다.

**진단 3 — Subject-verb 거리.** 영어 독자는 주어가 나오면 곧바로 동사가 따라오기를 기다린다. 동사가 나와야 비로소 주어가 무엇을 하는지 파악할 수 있기 때문이다. 주어와 동사 사이에 긴 수식어구가 끼어들면, 독자는 그 부분을 상대적으로 덜 중요한 삽입구로 여겨 흘려 읽는다. 가독성 공식을 만든 사람들은 흔히 29단어 같은 기계적인 단어 수 제한을 내세운다. Gopen과 Swan은 이런 제한에 반대하며, 강조 위치의 개수보다 강조할 후보 정보가 더 많을 때 비로소 문장이 지나치게 길어진다고 정의했다. 주어 뒤에 `which …`, `that …` 같은 관계절이나 `by …` 같은 전치사구가 길게 매달려 동사가 한참 뒤에 나온다면, 주된 서술을 앞으로 끌어내고 덧붙이는 설명은 별도 문장으로 나눌지 살펴본다.

**진단 4 — Old-before-new.** Gopen과 Swan은 구정보와 신정보를 엉뚱한 자리에 두는 습관을 당시 미국 전문 글쓰기의 "No. 1 problem"으로 지목했다. 문장 첫머리에는 앞 내용과 이어지는 구정보(old)가 오고, 뒤쪽 강조 자리로 갈수록 새로운 정보(new)가 실려야 글이 물 흐르듯 넘어간다. 두 사람은 이를 기계적인 공식이 아니라 원칙(principle)이라 부르며, "구정보는 topic 위치에, 신정보는 stress 위치에"라는 단순 규칙으로 오해해서는 안 된다고 선을 긋는다. 정의상 문장의 모든 요소는 구정보 아니면 신정보이므로, 양 끝 위치 사이도 앞뒤 맥락에 따라 구정보에서 신정보로 자연스럽게 이어져야 하기 때문이다. 예컨대 단락의 두 번째 문장이 아무런 정의도 없는 생소한 용어로 불쑥 시작한다면, 앞 문장과의 연결은 첫 단어부터 끊기고 만다.

---

## 12.3 독자 기대 이론으로 실제 논문 단락 고쳐 쓰기

Gopen과 Swan은 'Reader Expectations for the Structure of Prose' 절에서 분자생물학 논문의 한 단락을 첫 사례로 꺼내 든다. 열 사람에게 이 단락이 왜 어렵냐고 물으면 아홉은 URF니 ATPase니 하는 생소한 전문 어휘를 탓하겠지만, 두 사람은 겉에 드러난 어휘가 아니라 문장 속 정보 배치에 숨은 결함을 조목조목 짚어 낸다.

그 단락의 첫 문장은 전체 42단어 가운데 주어("the smallest")와 동사("has been identified") 사이에 무려 23단어가 끼어들어 진단 3에 정면으로 걸린다. 62단어에 달하는 셋째 문장은 한술 더 떠서, 주어("experiments")와 동사("have indicated") 사이에 27단어가 끼어 있고, 이어지는 that 절에서도 새 주어("six human URF's")와 동사("encode") 사이를 다시 20단어가 가로막고 있다. 게다가 정작 강조해야 할 핵심 내용이 문장 끝에 놓이지 않아, 무엇이 중요한지 독자마다 제각각 해석할 여지가 컸다(진단 1).

이 단락을 고쳐 쓸 때 저자들은 낱말을 무작정 줄이지 않았다. 대신 멀리 떨어져 있던 주어와 동사를 가까이 붙여 주고, 강조할 정보를 문장 끝으로 옮기며 불필요한 군더더기만 일부 덜어냈다. 그 결과 고쳐 쓴 글은 원문과 분량이 크게 차이 나지 않는데도 읽히는 속도와 명료함이 완전히 달라졌다. 물론 저자들은 이 개작이 원저자의 속내를 100% 그대로 복원했다고 장담하지 않고, 자신들이 해석한 의도를 반영했을 뿐이라고 조심스럽게 밝힌다. 문장 배치를 다듬어 읽다 보면 뜻이 환해지기는 하지만, 고치기 전 원문의 의미와 어긋난 구석은 없는지 반드시 맞대어 확인해야 한다는 뜻이다.

실제로 막힌 초록을 만났을 때는 이 과정을 그대로 따라 해 볼 수 있다.

> **초록을 다섯 번 읽고도 막혔다면, 네 진단으로 어디서 관계를 놓쳤는지 표시해 본다.** 문장 끝의 강조 위치, 앞 문장과의 연결, 주어와 동사의 거리, 구정보와 신정보의 흐름을 차례로 짚어 본 뒤에도 여전히 모호하다면, 그때 비로소 용어나 배경지식, 피로 같은 다른 요인을 살핀다. 구체적인 개작 시연과 워크시트 양식은 [발췌 `gopen_swan_urf_rewrite`](./excerpts/excerpt_03_gopen_swan_urf_rewrite.md)에 따로 묶어 두었다.

Gopen과 Swan이 'Subject-Verb Separation' 절에서 남긴 말처럼, "Long sentences need not be difficult to read; they are only difficult to write"(긴 문장이 꼭 읽기 어려운 것은 아니다. 쓰기가 어려울 뿐이다). 네 가지 진단 도구가 겨누는 과녁은 문장의 길이가 아니라 정보가 놓인 자리다.

---

## 12.4 한국어 모어 화자를 위한 보정

한국어 모어 화자가 영어 문장의 강조 위치를 자주 놓치는 데는 구조적인 어순 차이도 한몫한다. 영어는 주어-동사-목적어(SVO) 어순이지만 한국어는 주어-목적어-동사(SOV) 어순이다. 한국어 문장에서는 강조하고 싶은 정보를 문장 앞머리에 내세우는 일이 자연스러운데, 그 감각을 그대로 영어 작문에 옮기면 정작 강조해야 할 핵심어가 강조 위치(stress position)가 아니라 화제 위치(topic position)에 덜컥 앉아 버린다.

한국어 조사 "은/는"을 영어 주어로 직역하는 습관도 같은 함정을 판다. "은/는"이 붙은 명사는 문법적 주어라기보다 이야기의 화제(topic)를 가리킬 때가 많다. 이를 영어 문장의 문법적 주어로 그대로 쓰면, topic 위치가 앞 문장과의 연결이 아니라 한국어 화제에 맞춰 채워지면서 글쓴이의 의도와 다른 흐름이 만들어질 수 있다.

이런 어순 간섭을 피하려면 초안을 점검할 때 간단한 확인 절차를 두는 편이 좋다.

> 한국어로 단락의 뼈대를 먼저 짠 뒤 영어로 옮긴다면, 영어 문장마다 끝자리(강조 위치)에 어떤 단어가 놓였는지 따로 적어 본다. 내가 힘주어 말하려던 핵심어가 그 자리에 와 있으면 통과하고, 엉뚱한 군더더기가 끝을 차지하고 있다면 어순을 다시 짠다(→ [29장](./chapter_29_reader_expectations.md)).

지금까지는 글과 단락, 문장의 구조를 뜯어보며 독해가 막히는 이유를 찾았다. 그런데 논문에는 문장만 있는 것이 아니다. 본문을 읽다 보면 문장 대신 수식과 증명이 페이지를 가득 채우는 구간이 불쑥 나타난다. 문장과는 결이 다른 이 벽을 어떻게 넘어야 할까.

# 13장 수식·증명 읽기

문장 구조를 아무리 잘 진단해도 수식이 빼곡한 페이지 앞에 서면 다시 숨이 막힌다. [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1의 13번 항목에서는 글쓴이에게 스스로 해 볼 만한 점검 하나를 권한다. 가장 간단한 수식만 남기고 나머지 수식을 모두 'blah' 같은 의미 없는 소리로 바꿔 읽어도 문장이 매끄럽게 이어져야 한다는 것이다. Knuth가 이 테스트를 제안한 까닭은 많은 독자가 처음 논문을 읽을 때 수식을 일단 훑고 지나가기 때문이다. 반대로 읽는 사람 입장에서는 몇 번째 읽기에서 수식을 어디까지 따라갈지 미리 선을 그어 두어야 시간 낭비를 막을 수 있다(→ [7장](./chapter_07_keshav_three_passes.md); [30장](./chapter_30_math_and_proofs.md)).

---

## 13.1 패스에 따라 수식을 다르게 읽는다

Keshav의 읽기 규약에서 1st pass에서는 수식을 일단 다음 단계로 넘기고, 2nd pass에서도 증명 같은 세부는 건너뛴다(→ [7장 §7.1–7.2](./chapter_07_keshav_three_passes.md)). 수식을 손으로 한 줄씩 따라 적으며 검증하는 일은 논문을 머릿속으로 다시 구현해 보는 3rd pass(§7.3)의 몫이다.

이 경계를 흐려 두면 양극단으로 빠지기 쉽다. 처음 훑는 1st pass에서부터 모든 수식을 붙잡고 늘어진다면 논문 한 편에 몇 시간을 쏟다가 다음 논문을 열어 보지도 못하고 지쳐 버린다. 그렇다고 수식을 매번 건너뛰기만 하면 1년이 지나도 분야의 핵심 수식을 자기 손으로 풀지 못하는 상태로 남는다.

예컨대 SLAM을 막 시작한 학생이 ORB-SLAM 논문을 1st pass로 훑다가 자코비안 유도에서 몇 시간씩 발이 묶이는 경우가 흔하다. 1st pass의 목표는 5 Cs 한 페이지를 채우는 데 있다. 자코비안 유도는 그 논문을 실제로 재구현하기로 결정한 뒤 3rd pass에서 파고들어도 늦지 않다.

---

## 13.2 유도 한 페이지를 읽는 4단계

3rd pass에 들어가 수식 유도(derivation)가 빽빽한 페이지를 마주했다면, 무작정 첫 줄부터 대수 변형을 따라가지 말고 다음 네 단계를 순서대로 밟아 보자.

**단계 1 — 입력과 출력을 적는다.** 이 유도가 어디서 출발해 무엇을 얻으려는지 한 줄로 먼저 못 박는다. EKF 예측 단계라면 "이전 step의 posterior $(\mu_{k-1}, \Sigma_{k-1})$에서 현재 step의 prior $(\bar{\mu}_k, \bar{\Sigma}_k)$를 구한다" 정도면 충분하다. 이 한 줄이 써지지 않는다면 아직 유도의 목적지조차 모른다는 뜻이니, 계산으로 들어가기 전에 입력과 출력부터 다시 확인한다.

**단계 2 — 가정을 뽑는다.** 본문에 명시된 가정과 슬쩍 전제된 가정을 따로 가려 적는다. EKF라면 프로세스 노이즈가 평균 0인 가우시안을 따른다는 가정은 본문에 적혀 있지만, 테일러 전개로 선형화하는 지점이 참값에 충분히 가깝다는 전제는 대개 말없이 넘어간다. 이렇게 명시되지 않고 숨어 있는 전제가 바로 [10장](./chapter_10_reading_for_review.md)의 심사위원 모드에서 짚어낼 unstated assumption 후보다.

**단계 3 — 수식 사이의 문장만 따라간다.** 수식 기호는 잠시 가려 두고 수식과 수식 사이에 놓인 설명 문장만 읽어 흐름이 이어지는지 확인한다. 문장만 따라가도 논리가 잡힌다면 저자가 독자를 배려해 친절히 쓴 페이지라, 굳이 모든 줄을 손으로 풀지 않아도 맥락이 들어온다. 반대로 문장 흐름이 뚝 끊긴다면 내가 필요한 배경 용어를 모르는 것인지, 저자가 수식 사이의 다리를 건너뛴 것인지 따져 보아야 한다. 이 방법은 Knuth의 'blah 테스트'를 읽는 쪽에서 역으로 적용해 보는 셈인데, 이웃한 수식이 어떻게 연결되는지 설명이 비어 있다면 독자 입장에서 따라가기 어려운 것이 당연하다([30장](./chapter_30_math_and_proofs.md)).

**단계 4 — 결과를 가르는 한두 줄만 손으로 유도한다.** 모든 줄을 똑같은 힘으로 풀지 말고 핵심 갈림길에 집중한다. 대개 가정이 결과 식으로 바뀌는 줄, 근사가 개입하는 줄, 잔차(residual)를 정의하는 줄이 여기에 해당한다. EKF에서는 Kalman gain을 정의하는 줄과 update 이후 covariance가 줄어드는 줄이 대표적인 후보다.

단계 1에서 목적지를 확인하지 않고 곧바로 단계 4로 뛰어들면, 어느 줄이 승부처인지도 모른 채 모든 식 변형을 기계적으로 베껴 적게 된다.

---

## 13.3 증명을 건너뛸까, 펼칠까

유도와 달리 정리(theorem)와 증명(proof)을 어디까지 펼칠지는 현재 읽고 있는 pass의 목적에 따라 정한다.

| Pass | 증명 |
|------|------------------|
| 1 | 건너뛴다 |
| 2 | 그 정리를 내 작업에 직접 쓸 때만 펼친다 |
| 3 | 펼친다 |

증명을 펼치든 건너뛰든, 정리 문장 자체가 앞뒤 문맥 없이 완결되게 읽히는지 점검해 볼 만하다. Knuth §1의 5번 항목에서는 정리 문장이 앞선 본문의 가정에 기대지 않고 대개 독립적으로 읽혀야 한다고 권한다([30장 §30.2](./chapter_30_math_and_proofs.md)). 정리 하나를 이해하려고 앞 단락을 몇 번씩 거슬러 올라가야 한다면 그 정리 문장은 덜 다듬어진 상태다. 거슬러 올라가 확인해야 했던 정의와 참조를 표시해 두면, 내 글을 쓸 때 무엇을 챙겨야 하는지도 함께 보인다.

증명을 펼치기로 했다면 저자가 남겨 둔 이정표(signpost)를 먼저 찾는다. Knuth의 강의 노트에는 특히 읽기 좋았던 학생 답안의 사례로 "The lemma is half proved"나 "We divide the proof into two parts, first proving ⟨blah⟩ and then proving ⟨grunt⟩" 같은 이정표 문장이 나온다. 이런 문장이 있다면 저자가 나눈 구획을 따라 읽고, 없다면 독자가 스스로 경계를 그어 가며 쪼개 읽는다. 이정표가 전혀 없는 긴 증명에서 길을 잃었다면 내 이해력을 탓하기 전에 글에 이정표가 세워져 있는지부터 확인하자. 이정표가 없어 막힌 대목 역시 심사 의견의 근거로 남길 수 있다([10장](./chapter_10_reading_for_review.md)).

직접 증명이 가능한 대목에 굳이 귀류법을 동원한 증명도 비슷한 눈으로 본다. Knuth는 강의 노트의 연습 문제 풀이에서 불필요한 귀류법을 "또 하나의 잘못"으로 지목하며 직접 증명으로 고쳐 썼고, Halmos의 강연을 정리한 대목에도 직접 증명이 가능하다면 귀류법을 피하라는 권고가 실려 있다. 귀류법으로 꼬아 놓은 증명에서 자꾸 걸린다면 내 실력 이전에 증명 구조 자체가 불필요하게 돌아가고 있는 것은 아닌지 의심해 보자. 글이 안 읽힐 때 글의 구조부터 점검하라는 [12장 §12.1](./chapter_12_reader_expectations_diagnosis.md)의 시선은 수식과 증명 앞에서도 그대로 통한다.

---

## 13.4 SLAM에서 수식이 빽빽한 세 곳

로보틱스·SLAM 논문을 읽다 보면 수식이 유독 빽빽하게 몰리는 세 관문을 자주 마주친다.

**자코비안 유도.** SE(3)·SO(3) 공간에서 perturbation을 주어 자코비안을 구하는 과정이다. 수식 사이의 문장을 따라가다 보면 chain rule에서 어느 항이 spatial frame 기준이고 어느 항이 body frame 기준인지 헷갈리는 지점에서 가장 흔히 막힌다. 문제는 이 frame 규약이 저자마다 다르다는 데 있다. 수식이 처음 등장할 때 규약을 명시했는지부터 확인하고, 설명이 빠져 있다면 그 논문만 붙들고 씨름하기보다 $\mathfrak{se}(3)$ 표기를 일관되게 정리해 둔 교과서 하나를 기준점으로 삼아 유도를 대조해 본다.

**EKF predict/update.** 한 페이지에 수식이 여남은 줄씩 들어가는 전형적인 대목이다. 여기서는 앞의 단계 1처럼 입력과 출력부터 분명히 못 박아 두면 페이지 전체가 한눈에 읽힌다. 교과서와 논문마다 기호와 첨자 표기가 제각각이므로, 내가 익숙한 표준 자료 하나를 정해 다른 논문의 식을 그 표기로 옮겨 적은 뒤 비교하는 편이 훨씬 빠르다.

**MAP 추정 유도.** Bayes 규칙에서 출발해 로그를 씌우고, 최적화 문제로 바꾼 뒤 Newton step으로 풀어 가는 흐름이다. 가우시안 prior와 likelihood 가정이 어느 줄에서 들어오는지 추적하는 것이 핵심인데, 결국 maximum likelihood와 maximum a posteriori를 가르는 것은 prior 항이 끼어드는 딱 한 줄이다. 바로 그 줄이 단계 4에서 손으로 직접 유도하며 짚어 볼 승부처다.

이 세 곳의 수식은 한 번 보고 단번에 익지 않는다. 같은 자료를 다시 펼칠 때마다 어느 줄에서 막혔는지 흔적을 남겨 두자. 논문 지면의 제약 때문에 빠진 중간 설명은 선배 연구자가 블로그에 풀어 쓴 해설이 메워 주기도 한다(→ [14장](./chapter_14_reading_with_code.md)).

---

## 13.5 막힌 곳을 적는 노트

수식 페이지를 읽다가 막히면 먼저 원인을 셋으로 갈라 본다. 내가 기호나 용어를 모르는 것인지, 분야의 기초 배경이 부족한 것인지, 저자가 설명을 건너뛴 것인지에 따라 다음에 할 일이 달라지기 때문이다. 용어를 모르면 따로 찾아 정리하고, 배경이 약하면 핵심 논문이나 교과서를 한 편 더 읽고, 저자의 설명이 부실하다면 그 부분은 일단 넘어가거나 심사 의견의 근거로 남긴다.

막힌 흔적은 아래처럼 단순한 네 칸 양식으로 적어 두면 충분하다.

```
[자료 + page · line] | [막힌 줄 원문 인용] | [원인 분류] | [다음에 할 일]
```

같은 원인이 다섯 번쯤 반복해서 쌓이면 그 주제를 따로 날 잡아 공부할 과제로 올린다. 선배에게 질문을 모아서 깔끔하게 물어보기에도 가장 좋은 시점이다(→ 「대학원노트」 [10장 「한 메일에 한 질문」](../grad-notes/chapter_10_one_question_email.md)). 게다가 이렇게 쌓아 둔 노트는 훗날 연구실 후배를 돕는 자산이 된다. 내가 끙끙대며 막혔던 그 줄에서 다음 후배도 똑같이 걸리기 십상이니, 몇 년 뒤 신입에게 무엇부터 짚어 줄지 이 노트에서 바로 고를 수 있다.

논문의 글과 수식을 다 뜯어보았는데도 구현의 마지막 조각이 잡히지 않는다면, 이제 종이 위를 벗어나 논문이 가리키는 실제 코드와 저장소를 열어 볼 차례다.

# 14장 코드 동반 읽기

SLAM이나 컴퓨터 비전 논문은 코드를 함께 공개하는 경우가 잦지만, 공개가 당연한 기본값이나 의무는 아니다. 다만 공식 저장소가 열려 있는 논문이라면 원고와 코드를 나란히 펼쳐 읽는 편이 훨씬 남는다. [13장](./chapter_13_reading_math_proofs.md)에서 다룬 수식 읽기만으로는 잡히지 않는 구현 세부와 실제 재현 조건까지 코드에서 확인할 수 있기 때문이다. 논문에 미처 적히지 않은 크고 작은 결정은 GitHub 저장소와 issue tracker, PR 댓글 속에 그대로 남아 있는 경우가 많으니, 재구현을 목표로 읽는다면 저장소까지 읽기 범위에 넣는다.

---

## 14.1 논문과 저장소 사이

Keshav의 3rd pass는 저자와 같은 가정을 두고 논문을 머릿속에서 다시 구현해 보는(virtual re-implementation) 과정이다. 공개 저장소가 있다면 코드와 issue tracker를 함께 읽으며 그 머릿속 재구현을 현실의 코드 수준까지 넓힐 수 있다. 논문의 방법 절에 압축된 알고리즘의 뼈대가 실제 코드에서 어떤 hyperparameter와 실행 조건으로 풀려 있는지 확인하는 일이다.

공식 저장소가 있는데도 논문만 읽고 구현까지 다 이해했다고 착각하기 쉽다. 1st·2nd pass를 마치고도 저장소를 열어 보지 않으면, 나중에 내 thesis에서 그 논문을 baseline으로 돌릴 때 꼭 필요한 실행 환경, 전처리 규칙, 숨은 parameter 설정을 놓쳐 뒤늦게 헤매기 십상이다.

물론 논문에 빠진 설명은 코드 밖에서 선배 연구자의 블로그 해설이 채워 주기도 한다. 김기섭 교수의 [블로그](https://gsk1m.github.io/)에 올라온 SLAM 해설 글이 좋은 예다. 「FAST-LIO가 말 그대로 Fast 한 이유」는 FAST-LIO의 Kalman gain 계산이 왜 빠른지 그림과 함께 풀어 주고, 「From-scratched Pose-graph SLAM Tutorial: 1편」은 single rotation averaging을 바닥부터 구현하는 과정을 따라가며 원리를 짚어 준다.

---

## 14.2 코드와 함께 읽는 네 단계

논문 한 편을 읽고 코드를 직접 빌드해 실행한 뒤, 논문의 수식과 코드의 행을 짝짓기까지의 과정을 네 단계로 나누어 보자. 아래에 적은 시간은 처음 잡는 계획값일 뿐, 저장소 규모와 의존성, 하드웨어 환경에 따라 크게 달라진다. 덩치가 큰 프로젝트는 실행 환경만 맞추고 대응표를 짜는 데도 며칠이 걸릴 수 있으므로 단계마다 여러 차례에 나누어 진행한다.

**단계 1 — 논문을 1st·2nd pass로 읽는다 (1–2시간).** 아직 GitHub은 열지 않는다. 5 Cs를 한 줄씩 채울 수 있고, 초록의 broad-narrow-broad 흐름([6장](./chapter_06_why_read.md))을 확인한 뒤에야 저장소로 넘어간다. 논문의 큰 맥락조차 잡히지 않은 상태에서 코드부터 열면 함수 이름의 숲에서 길을 잃기 쉬우니, 막힌다면 논문부터 다시 읽는다.

**단계 2 — 저장소를 둘러본다 (30분).** README와 디렉터리 구조, 실행을 시작하는 진입 스크립트의 위치만 훑는다. 이 짧은 탐색이 끝나면 프로그램이 어디서 시작해 어떤 모듈을 거쳐 흘러가는지 한 문장으로 요약할 수 있어야 한다. SLAM 코드라면 "main이 관측을 차례로 받아 odometry 모듈에 넘기고, mapping 모듈이 그 결과에서 keyframe을 고른다" 정도의 문장이 나오면 충분하다.

**단계 3 — 직접 빌드해서 한 번 돌린다 (처음 잡는 시간 2–4시간).** docker나 로컬 환경에서 실제로 빌드하고 예제 데이터로 돌려 본다. 보통 첫 빌드 오류 때문에 예상 시간을 훌쩍 넘기기 쉽다. CMake, OpenCV, CUDA, ROS 버전이 맞는지 먼저 대조하고, 오류에 막히면 issue tracker에서 같은 환경의 보고를 검색한다. 다만 알려진 문제가 전부 issue에 올라와 있지는 않다는 점도 염두에 둔다.

**단계 4 — 논문과 코드를 하나씩 짝짓는다 (2–4시간).** 논문 방법 절의 핵심 단락이나 수식이 코드의 어느 함수에 구현되어 있는지 찾아 대응표를 만든다. 예를 들어 논문의 식 2가 코드 47–83행에 대응한다는 식으로 짝지었다면 핵심 연결고리를 확인한 셈이다. 코드 전체를 한 줄도 빠짐없이 짝지을 필요는 없다. [13장 §13.2](./chapter_13_reading_math_proofs.md)에서 골라 둔 '결과를 가르는 한두 줄'이 코드의 어디에 자리 잡고 있는지부터 찾는다. 내 thesis에서 고치거나 확장할 자리 역시 대개 그 근처에 있다.

이렇게 논문의 식과 코드의 함수를 맞춰 보기 시작하면, 곧 코드만 읽고는 납득이 안 되는 크고 작은 선택과 마주친다. 그 이유를 밝히는 단서는 흔히 GitHub의 issue와 PR 토론에 남아 있다.

---

## 14.3 코드 저장소의 이슈와 PR까지 읽기

GitHub issue tracker에는 수많은 사용자가 실제로 부딪힌 문제와 우회법이 모인다. 빌드나 실행에서 막히면 같은 오류 메시지부터 검색해 보되, 답이 아예 없거나 오래전 버전 기준의 낡은 답일 수 있다는 점은 감안해야 한다. issue 안의 토론은 오류 해결을 넘어 코드의 설계 결정을 비추는 창구이기도 하다. 예컨대 특정 모듈을 왜 멀티스레드로 구현하지 않았는지에 대한 저자의 고민이 댓글에 남아 있는 식이다.

PR(Pull Request) 댓글에는 논문에 실리지 않은 구현 세부가 특히 많이 들어 있다. 가령 hyperparameter 하나를 0.05에서 0.1로 바꾼 이유가 PR 설명에 한 줄 적혀 있다면, 그 한 줄은 논문 실험 절에 건조하게 적힌 "set α = 0.1"보다 훨씬 많은 맥락을 알려 준다.

따라서 issue와 PR은 에러가 터졌을 때만 뒤지지 말고, 단계 4에서 논문-코드 대응표를 만들 때도 함께 훑어 둔다. 아래 세 항목을 추려 남기면 충분하다.

| 항목 | 남길 것 |
|---|---|
| 닫힌 issue 상위 5개 | 자주 막히는 문제와 해결법 |
| merge된 PR 상위 5개 | 중요한 설계 변경의 이유 |
| 열린 issue 상위 3개 | 현재 알려진 한계 |

이렇게 모아 둔 기록은 실제 구현과 운용 조건이라는 측면에서 논문의 limitation 절을 입체적으로 보완해 준다. 다만 논문의 limitation 절에는 저자가 검증하고 인정한 한계가 적혀 있는 반면, 열린 issue에는 사용자가 실제로 겪은 결함과 아직 확인되지 않은 오해나 환경 오류가 뒤섞여 있다. 내 환경에서 재현되는지, 어느 버전에서 나타나는지 직접 확인한 뒤에야 그 시스템의 진짜 한계로 받아들인다.

---

## 14.4 대표 저장소 한 곳부터

분야마다 기준점 삼아 뜯어볼 만한 대표 저장소가 있다. SLAM에서는 ORB-SLAM3, FAST-LIO2, LIO-SAM, RTAB-Map이 대표적이고, CV에서는 SAM, DINOv2, NeRF Studio, COLMAP을 꼽을 수 있다(→ robotics-practice ch20 §20.6).

분야에 막 발을 들인 학생이라면 대표 저장소 한두 곳을 앞의 네 단계대로 끝까지 따라간 뒤, 논문과 저장소가 기준으로 삼은 benchmark에서 직접 결과를 비교해 보면 감을 제대로 잡을 수 있다. KITTI, TUM, EuRoC가 SLAM에서 널리 쓰이는 데이터셋이기는 하지만, 센서 구성과 과제가 내 연구 문제와 맞는지부터 확인한다. 실제로 robotics-practice ch20 §20.7에서도 ORB-SLAM3를 직접 빌드해 데이터셋에서 돌리고 trajectory를 ground truth와 비교해 보는 것을 중급 단계의 마일스톤으로 둔다.

자기 코드를 맨바닥에서 다 짜기 전에 대표 저장소 하나를 끝까지 따라가 보면 환경 설정, 디버깅, 로그 기록의 살아 있는 기준을 얻는다. 이는 이미 돌아가는 환경에서 코드 한 줄부터 고쳐 보라는 「대학원노트」 [11장 「환경 설정이 연구를 가릴 때」](../grad-notes/chapter_11_tool_trap.md) §11.1의 조언과도 맞닿아 있다. 먼저 한 번 돌려 보고 난 뒤에야 그대로 가져다 쓸 부분과 내 문제에 맞게 바꿀 부분을 정확히 가를 수 있다.

---

## 14.5 AI 도구로 논문·코드 구조 파악하기

논문의 문장과 코드의 함수를 짝짓는 작업은 AI 도구에 맡기기 좋다. "이 논문의 'we apply pre-integration on IMU measurements between keyframes'가 코드의 어느 함수에 해당하는지 찾아 줘"라고 물으면 AI가 유력한 후보 함수 두세 개를 바로 짚어 준다. 코드를 처음부터 끝까지 grep으로 뒤지는 대신, AI가 추려 준 후보를 내가 직접 열어 확인하면 탐색 시간이 크게 줄어든다.

PR 댓글처럼 문맥이 거칠게 잘린 글을 해독할 때도 AI의 도움을 받을 수 있다. PR 토론은 전문 용어가 빽빽한 데다 말투가 격식 없이 짧아서 여러 번 읽어도 요지가 안 잡히기 일쑤다. "이 PR 댓글에서 무엇을 결정했고 왜 그랬는지 한 단락으로 풀어 줘"라고 요청하면 그 결정이 코드의 어느 지점과 이어지는지 한결 쉽게 파악된다.

다만 AI가 짝지어 준 결과는 반드시 내 눈으로 다시 검증해야 한다. AI는 그럴듯하게 행 번호를 틀리거나 이름만 비슷한 다른 함수를 짚어 내기도 한다. 확인 없이 AI의 연결 결과를 노트에 그대로 적어 두면, 나중에 내 thesis에서 근거를 인용할 때 엉뚱한 함수를 가리키게 된다. 코드를 AI로 작성하더라도, 그 코드가 논문의 어느 수식·절차와 대응하는지는 언제나 연구자 본인이 최종 판정해야 한다.

논문을 읽고, 수식을 풀고, 코드와 issue까지 파헤쳐 확인한 사실들은 공들여 얻은 만큼 쉽게 잊히기도 한다. AI에게 요약을 맡길 수 있는 시대일수록, 내 손으로 검증한 claim과 근거 위치, 그리고 내 연구의 결정만을 골라 노트에 남기고 인용과 묶어 두어야 반년 뒤에도 곧바로 글의 재료로 꺼내 쓸 수 있다.

---

# 15장 AI 시대의 노트와 인용 관리

읽어 둔 논문의 세부는 시간이 흐르면 어김없이 흐려진다. 그래서 몇 달 뒤에 노트를 다시 펼치더라도 왜 이 논문을 남겨 두었는지 단번에 떠올릴 수 있어야 한다.

AI가 언제든 논문 PDF를 다시 열어 요약해 줄 수 있는 시대에는 길고 성실한 요약문을 사람이 손수 적을 이유가 크게 줄었다. 대신 사람이 직접 확인해 못 박아 두어야 할 세 가지가 남았다. 논문이 실제로 어떤 claim을 내세웠는지, 그 근거가 원문의 어느 위치에 있는지, 그리고 그 claim 때문에 내 연구에서 무엇을 다르게 결정하는지다. 모은 자료는 저장하는 데서 그치지 않고 내 글을 쓸 때 곧바로 다시 찾아 꺼낼 수 있어야 하므로, 1st pass 뒤에 남기는 5 Cs 양식([8장](./chapter_08_five_cs.md))에 근거 위치와 결정을 적는 칸을 덧붙인다.

---

## 15.1 논문 노트 양식 — 5 Cs에 실험·한계·인용 추가하기

[8장](./chapter_08_five_cs.md)의 5 Cs(Category, Context, Correctness, Contributions, Clarity)가 첫 훑어읽기를 정리하는 틀이라면, 장기 보관용 노트에는 여기에 세 칸을 더 채운다.

**근거 위치.** 내 논문에서 인용하거나 맞붙을 만한 claim 하나와, 그 claim이 실제로 놓인 자리를 짝지어 적는다. 쪽, 절, 그림, 표, 식 번호 가운데 하나는 반드시 붙인다. 원문을 토씨 하나 안 틀리고 옮겨야 할 대목만 짧게 발췌하고, 나머지는 내 말로 풀어 쓴 claim과 위치만 남겨 두면 충분하다. 훗날 서론을 쓸 때 정작 필요한 것은 구구절절한 줄거리가 아니라 "이 주장을 어느 표가 뒷받침했는가"에 답하는 정확한 한 줄이다.

**내 작업과 맺는 관계.** 이 논문이 내 thesis와 어떤 관계로 얽히는지 baseline 후보, related work, 반박할 대상, 무관 가운데 하나로 분명히 가른다. 특히 '무관'이라고 적고 이유를 한 줄 남겨 두면, 반년 뒤 공동 저자나 심사위원이 왜 그 논문을 빠뜨렸는지 물을 때 곧바로 답할 수 있다.

**다음 행동.** 중단, 보류, 진행 가운데 하나를 고른다([8장 §8.6](./chapter_08_five_cs.md)의 세 가지 결정). 진행하기로 했다면 2nd·3rd pass를 언제 할지 날짜를 박아 두고, 보류한 논문 역시 다시 열어 볼 시점을 적어 두어야 주간 정리 시간에 잊지 않고 꺼내 볼 수 있다.

요약 노트 분량은 처음에 한 편당 한 페이지 안쪽으로 잡는 편이 적당하다. 2nd·3rd pass나 코드 분석처럼 깊이 파고든 기록이 길어지면 별도 파일로 빼고, 대표 노트에는 claim과 근거 위치, 내 작업과의 관계만 깔끔하게 남긴다. 이렇게 요약과 정독 기록을 층위별로 나누어 두면, 나중에 목록만 훑어도 어느 논문을 실제로 뜯어보았는지 한눈에 보인다.

파일 이름은 `저자-연도-키워드` 규칙으로 지어 두면 탐색이 한결 빨라진다. 키워드를 영문 소문자로 통일해 두면 grep이나 터미널 검색에도 깔끔하게 걸린다(예: `mur-artal-2015-orbslam.md`).

---

## 15.2 인용 관리 — 서지 정보 확인하기

참고문헌 관리 도구는 원 출처의 서지 정보를 모아 두었다가 투고할 학회 양식에 맞춰 변환해 주는 역할을 한다. 이때 서지 정보의 기준은 반드시 DOI가 가리키는 원문, arXiv, OpenReview, 학회·출판사 공식 페이지에 둔다.

BibTeX 항목은 DOI, arXiv, CrossRef, Semantic Scholar, OpenAlex, 학회 페이지에서 자동으로 긁어오는 편이 빠르다. Google Scholar의 인용 내보내기는 간편하지만 필드가 비어 있거나 학회 이름이 제멋대로 줄여 적혀 있는 경우가 잦으므로, 최종 제출본에 들어갈 항목은 꼭 DOI나 공식 학회 페이지를 기준으로 맞춘다.

자동으로 불러온 BibTeX이라 해도 투고 전에 아래 다섯 가지는 한 번씩 눈으로 짚고 넘어간다.

| 항목 | 확인할 것 |
|---|---|
| ID | DOI나 arXiv ID가 맞는가 |
| 저자 | 첫 저자와 마지막 저자, 철자가 맞는가 |
| venue | 학회·학술지 이름과 연도가 맞는가 |
| 버전 | arXiv 프리프린트와 심사를 거친 판이 구분되는가 |
| key | 한 논문이 두 key로 중복되지 않았는가 |

참고문헌 관리 도구로 무엇을 쓸지는 연구실 관행이나 공동 저자들의 작업 환경에 맞추면 된다. 관리하는 논문이 100편을 넘어가도 원칙은 똑같다. 한 논문이 하나의 key에만 묶여 있고, 인용 정보가 공식 URL과 연결되어 있으며, 문서를 빌드할 때 깨진 참고문헌 오류가 바로 드러나면 그것으로 충분하다. 어떤 도구를 쓰든 도구가 노트의 주인이 되어서는 안 된다. 노트의 중심은 언제나 내가 직접 검증한 claim과 그 때문에 바뀐 내 연구의 결정이다.

---

## 15.3 논문·부록 묶음(paper packet)으로 AI에 질문하기

논문 한 편을 저장할 때는 PDF 파일 하나만 달랑 두지 말고 관련 자료를 한데 묶어 둔다. 이 묶음을 paper packet이라고 부르자. 논문 URL과 DOI(또는 arXiv ID), PDF, 공식 코드 저장소, 프로젝트 페이지, 부록, OpenReview 토론, 데이터셋 링크가 여기에 모인다. PDF 위에 그은 밑줄과 여백 메모는 읽는 순간의 작업 흔적으로 남기고, 훗날 다시 찾아 쓸 핵심 claim과 근거 위치, 식별자는 별도의 노트 파일에 정리한다.

이렇게 paper packet을 갖춰 두면 AI 도구를 훨씬 안전하고 요긴하게 부릴 수 있다.

**5 Cs 초안.** paper packet을 AI에게 건네며 "5 Cs를 채우되 항목마다 근거 위치를 붙이고, 근거가 없는 항목에는 '없음'이라고 적어라"라고 지시한다. 나는 백지에서 시작하는 대신 AI가 내놓은 초안의 근거 위치를 원문에서 직접 대조하는 일로 1st pass를 연다.

**다음에 읽을 후보.** 이 논문의 참고문헌 목록과 이 논문을 인용한 후속 논문 목록을 AI에게 주고 "내 thesis 키워드와 가장 가까운 5편을 골라 왜 가까운지 한 줄씩 적어라"라고 시킨다. 여기서 다음에 읽을 후보군이 추려지지만, 그중 무엇을 실제로 읽을지는 여전히 내가 결정한다.

**related work 비교표.** 논문 A와 B를 함께 주고 방법, 가정, 데이터셋, metric, 한계, 내 작업과 맺는 관계라는 여섯 칸짜리 표로 나란히 비교해 달라고 요청한다. 그렇게 얻은 표 역시 원문 위치에서 사실 여부를 직접 확인한 뒤에야 내 related work 단락의 뼈대로 쓴다.

AI가 뽑아 준 5 Cs 노트는 어디까지나 초안이다. 최종 노트에 남기는 것은 내 눈으로 확인한 claim과 정확한 위치뿐이다. AI의 hallucination 가운데 가장 교묘하고 위험한 것이 그럴듯하게 지어낸 인용 위치이므로, 절·표·식 번호가 어긋난 항목은 미련 없이 버린다.

---

## 15.4 검색과 재호출 — 태그보다 문장

노트는 쌓는 것보다 몇 달 뒤 정확히 다시 꺼내는 일이 훨씬 중요하다. 다시 찾는 수단은 태그 하나가 아니다. 본문 전체 검색, citation key, DOI나 arXiv ID, 임베딩 검색, grep까지 상황에 맞게 골라 쓸 수 있다. 이 도구들은 결국 노트에 적힌 문장과 식별자를 긁어 찾으므로, 태그를 수십 개 달기보다 정확한 claim과 식별자가 담긴 한 문장을 적어 두면 검색에 훨씬 잘 걸린다.

따라서 태그는 아래처럼 꼭 필요한 세 축만 최소한으로 유지한다.

| 축 | 값 |
|---|---|
| 분야 | slam · cv · dl · vfm · vla |
| 읽은 깊이 | skim · read · implement · cite |
| 관계 | baseline · related · rebuttal · out |

세 축만 겹쳐도 가령 내 thesis의 baseline 후보로 찜해 둔 SLAM 논문 5편을 순식간에 추려 낼 수 있다. 그보다 세세한 구분은 태그를 늘리는 대신 related work 비교표에서 풀면 된다.

노트가 쌓여 갈수록 한 번씩 claim 목록을 가로로 훑어 정리하는 시간도 필요하다. 한 달에 한 번 30분 정도를 출발값으로 잡고, 노트들 사이에서 서로 부딪치는 claim이나 같은 baseline을 쓰는 논문, 내 가설을 흔든 논문을 한 줄씩 뽑아 모아 본다. "논문 A와 B는 둘 다 가정 X에서 출발하지만 metric Y에서 결과가 다르다" 같은 비교 문장이 몇 줄 쌓이기 시작하면, 비로소 내 연구가 비집고 들어갈 자리가 선명하게 드러난다.

Whitesides가 연구실 학생들에게 보낸 글에서 남겼듯, 흥미롭더라도 발표하지 않은 결과는 존재하지 않는 것과 같다([17장 §17.4](./chapter_17_outline_first.md)). 공들여 모아 둔 노트 역시 내 글 속에 쓰여야 비로소 값을 한다. 노트에서 내 논문 원고로 건너가는 다리는 생각보다 단순하다. related work 한 단락을 쓰고 싶다면 관련 노트 몇 편을 골라 표 하나로 묶는 데서 출발하면 된다(몇 편을 묶을지는 그 단락에서 다루려는 claim의 크기에 달렸다). 그렇게 채운 표의 칸, 곧 방법, 가정, 한계, 내 작업과 맺는 관계를 문장으로 풀어 이으면 그대로 단락의 초고가 된다(→ [23장 (서론)](./chapter_23_introduction.md); [24장 (관련 연구)](./chapter_24_related_work.md)).

이제 읽고 기록하며 벼려 온 재료들이 책상 위에 모였다. 남의 논문을 뜯어보는 독자의 자리에서 일어나, 백지 위에 내 연구의 이야기를 세우는 저자의 자리로 옮겨 앉을 때다. 그 출발선에서 가장 먼저 내려놓아야 할 것은 막연한 완벽주의와 잘못된 글쓰기 감각이다.

---

# 16장 쓰기 전에 정할 것

남의 논문을 읽는 독자에서 내 논문을 쓰는 저자로 자리를 옮길 때, 처음 펜을 잡은 대학원생이 가장 먼저 버려야 할 습관은 학부 시험의 채점 감각이다. [임형태 박사](https://github.com/LimHyungTae/paper-writing-checklist)가 지적하듯 논문에는 학부 시험처럼 100점을 찍는 '만점' 상태가 애초에 없다. 천장이 없는 글에 만점을 노리고 달려들면 수정만 한없이 길어지고 원고는 끝내 책상을 떠나지 못한다.

[최윤섭 박사의 「첫 번째 논문을 최대한 빨리 써라」](https://gradschoolstory.chkwon.net/yoonsup/first-paper/) 역시 같은 지점을 짚는다. 실험을 잘 해내는 능력과 논문을 써서 출판까지 끌고 가는 능력은 전혀 다른 근육이기 때문에, 출판의 전 과정을 하루라도 일찍 몸으로 겪어 보아야 한다는 것이다. 박사 말년에 가서야 첫 논문을 쓰기 시작하면 경험 부족 탓에 한 번에 통과될 리 없고, 그만큼 졸업도 기약 없이 밀린다. 최윤섭 박사는 이 이치를 투박하지만 잊기 힘든 비유로 남겼다.

> "고기도 먹어본 놈이 잘 먹고, 방귀도 자꾸 뀌어야 똥이 나온다."

첫 논문부터 Nature나 Science 같은 한 방을 노리기보다 작은 논문이라도 차근차근 완성해 내며 출판 감각을 익히라는 뜻이다. 실제로 최윤섭 박사도 자신이 주도했던 논문이 애초 계획보다 2년 넘게 늦어졌다고 털어놓는다. 여러 저널에서 세 번 거절당한 끝에 실린 저널에서도 세 차례 리비전을 거치며 추가 실험과 수정에만 6개월을 썼다는 것이다(→ [32장](./chapter_32_revision_rebuttal.md)).

---

## 16.1 리젝트의 반대말

완벽한 100점이 없다면 무엇을 목표로 원고를 다듬어야 할까. 임형태 박사는 같은 체크리스트에서 논문은 '만점'이 될 수 없다는 항목 바로 아래에 답을 적었다. "Accept를 노린다는 마인드가 아니라, reject의 complement를 노린다는 마인드"로 쓰라는 것이다. 물론 합격률과 심사 방식은 학회, 트랙, 연도마다 다르므로, 이 말은 합격을 보장하는 요령이라기보다 원고의 빈틈을 검수하는 태도로 새겨야 한다.

실제로 논문을 떨어뜨리는 꼬투리는 거창한 이론 결함보다 사소해 보이는 실수에서 나오는 경우가 많다. 본문과 그림의 표기 불일치, 당연한 baseline 비교 누락, 핵심 메시지가 한눈에 들어오지 않는 그림 1이 대표적이다. 임형태 박사는 "ensure consistency", "ensure robustness"처럼 뜻이 두루뭉술한 상투어도 독자에게 정확한 정보를 주지 못하니 걷어 내야 할 표현으로 꼽는다.

[김기섭 교수의 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html)에도 똑같은 조언이 실려 있다.

> "경력 초기에는 대작을 노리기 보다는 '리젝 줄 이유를 찾기 어려운' 논문을 작성하려고 해보세요."

김기섭 교수는 이를 위해 잘 쓰인 논문의 모양새를 평소 많이 익혀 두라고 권한다. 기본 형식이 잡혀 있지 않으면 아이디어가 아무리 좋아도 심사위원 처지에서 '억셉 줄 이유가 충분하지 못하게' 된다는 이야기다. 같은 글에서 그는 "한 가지 논문은 단 한 가지 컨셉을 지녀야 합니다"라는 원칙도 함께 못 박는데, 전하고 싶은 컨셉이 둘이라면 억지로 한 편에 욱여넣기보다 논문을 둘로 나누는 편이 훨씬 낫다.

---

## 16.2 형식 안에서 쓴다

논문은 자유로운 산문보다 정해진 틀의 비중이 훨씬 큰 글이다. 임형태 박사는 논문을 "엄격한 template이 존재하는 글"이라 정의하며, 첫 논문을 쓰는 사람일수록 글이나 그림을 창의적으로 꾸미려 들지 말라고 신신당부한다. 초보자가 새로 고안한 낯선 표현은 대개 자기 머릿속에서만 통하고 독자에게는 암호처럼 읽히기 때문이다.

가장 확실한 돌파구는 검증된 본보기를 정해 따라 쓰는 것이다. 임형태 박사는 내가 읽은 논문 가운데 인용 수가 100에 가까운 좋은 논문을 골라 문장 구조와 표현을 익히고 그림의 구성까지 직접 따라 그려 보라고 권한다. 실제로 그는 첫 논문을 쓸 때 [He et al. 2016](https://arxiv.org/abs/1512.03385)의 ResNet 논문 문단을 거의 통째로 외울 만큼 필사하며 논문 문체를 익혔다고 밝혔다. 인용 수와 더불어 내 연구 주제와 얼마나 가깝고 명료하게 쓰였는지를 살피면 훨씬 수월한 본보기를 고를 수 있다. 로보틱스 분야라면 [Cyrill Stachniss 연구실](https://scholar.google.com/citations?user=8vib2lAAAAAJ&hl=en)의 논문으로 영어를 공부해 보는 것도 좋은 방법이다. Stachniss 교수가 논문도 이야기책처럼 술술 읽혀야 한다는 철학을 지니고 있어, 단락의 구조가 단단하고 독자의 이해를 돕기 위해 공들인 흔적이 글 곳곳에 배어 있기 때문이다.

그렇다고 처음부터 영어로 매끈한 문장을 뽑아내려고 빈 화면 앞에서 얼어붙을 필요는 없다. [엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)에는 초보자에게 건네는 첫 마디로 이렇게 적혀 있다.

> "모든걸 두려워하지 마시고 일단 쓰기부터 시작하시란 것이다. 영어가 어렵다면 한글로라도 좋다."

무엇이든 종이 위에 꺼내 놓아야 전체 짜임새에서 어디가 비었는지 보이고, 초안이 손에 쥐어져야 지도교수나 동료와 구체적인 논의를 시작할 수 있기 때문이다. 엄태웅 대표는 목차부터 나눈 뒤 들어갈 내용을 개조식으로 채워 나가는 방식을 권하고, [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 역시 데이터 수집이 "끝날" 때까지 기다리지 말고 연구 초기부터 논문 개요를 쓰기 시작하라고 강조한다. 영어 표현을 고르느라 진도가 멈춘다면 한글 초안으로 뼈대부터 세우는 편이 백번 낫다.

---

## 16.3 교정은 도구와 나눠서 한다

원고가 자라나다 보면 오타, 수 일치, 첨자·인덱스 오류, 인용 누락, 깨진 참고문헌 같은 자잘한 실수가 필연적으로 끼어든다. 임형태 박사는 누구나 쓸 때 실수한다는 현실을 인정하고, 그 실수를 시스템적으로 줄이기 위해 LaTeX를 쓴다고 말한다. 공동 저자라면 원고를 돌리기 전에 Grammarly를 거치거나 ChatGPT에게 섹션 단위로 교정을 맡겨 표면 오류를 한 번쯤 걸러 내는 것이 기본 예의다. 한꺼번에 논문 전체를 넣으면 모델이 대충 훑고 넘어가기 쉬우므로, 한 섹션씩 LaTeX 원본 그대로 입력해 점검받는 편이 정확하다. 아래는 임형태 박사가 체크리스트에 공유한 교정 프롬프트다.

```
아래는 낸 논문의 ${SECTION} 부분이야

.
.
(본문 내용)
.
.

위의 문장들에서 오탈자나 수일치, 문법 등 틀린 부분을 proofread해주고, 틀린 부분이 있으면 개조식으로 line-by-line으로 간략히 알려 줘
문장 앞에 % 되어 있는 부분은 주석 처리된 줄이어서 proofreading할 때 무시해 줘.
```

이렇게 사소한 문법과 오탈자를 도구에 맡겨 미리 청소해 두면, 원고를 받아 든 공동 저자와 지도교수는 오타를 고치는 대신 논문의 논리와 주장을 다듬는 데 귀한 시간을 쓸 수 있다.

---

## 16.4 영어 수준과 글쓰기 스타일

영어 문체를 다듬을 때 흔히 빠지는 오해 중 하나가 모든 문장을 수동태로 써야 격식이 산다는 생각이다. 그러나 과학 글쓰기에서도 능동태와 `we`는 자연스럽게 쓰인다. [Knuth, Larrabee, Roberts 1989](https://www-cs-faculty.stanford.edu/~knuth/klr.html) §1의 6번 항목에서는 지루한 수동태를 피하는 데 `we`가 아주 유용하다고 짚어 준다. 다만 이때 `we`는 글쓴이와 독자를 아우르는 "너와 나 함께"라는 뜻으로 쓰고, 단순히 `I`를 점잖게 부풀려 부르는 대명사처럼 남발하지는 말라고 단서를 단다.

초안의 문장 수준을 가늠할 때도 '원어민처럼 들리는가' 같은 막연한 감각에 매달리기보다, 연구실의 스타일 가이드에 맞는지와 문장이 뜻을 모호함 없이 전하는지를 기준으로 삼는다. 임형태 박사는 토플 점수가 110점 이상이 아니라면 우선 지도교수의 글쓰기 스타일을 최대한 존중해 따라가라고 조언한다. 다만 지도교수가 고친 문장이 연구의 핵심 뜻을 지나치게 바꾸거나 심사위원이 공격할 빈틈을 만들어 명백히 틀렸다고 판단될 때는, 근거를 갖추어 공손하게 의견을 내 보자고 덧붙인다. 능동태 사용, 대명사, 핵심 용어 표기 규칙은 집필을 시작할 때 지도교수·공동 저자와 미리 맞춰 두고 원고 끝까지 일관되게 지킨다.

---

## 16.5 단락의 기본 뼈대: 맥락–내용–결론(CCC)

문법과 스타일의 기준을 세웠다면, 단락 안의 정보 흐름을 지키는 뼈대는 읽을 때와 똑같이 [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 3에서 제시한 context-content-conclusion(C-C-C) 구조에서 가져온다(단락·섹션·논문 전체로의 적용은 [19장](./chapter_19_ccc.md)에서 자세히 다룬다).

초안을 쓸 때 단락의 길이는 기계적인 규칙이 아니라 구조를 점검하는 신호등으로 쓴다. 유난히 길거나 반대로 한두 줄로 뚝 끊긴 단락이 보이면 맥락, 내용, 결론 가운데 빠진 요소가 없는지부터 살핀다. 그 단락의 핵심 메시지를 한 줄로 요약할 수 없다면 한 단락 안에 두 개의 메시지가 엉켜 있을 가능성이 크니 과감히 둘로 나눈다.

---

## 16.6 많이 읽히는 곳에 시간을 쓴다

쓰기 전에 마지막으로 정해 둘 원칙은 한정된 에너지를 어디에 집중할 것인가다. Mensh & Kording 2017의 rule 9에서 지적하듯, 논문의 제목과 초록, 그림은 본문의 나머지보다 압도적으로 많은 독자가 보는 반면 방법 절은 가장 적게 읽힌다. 따라서 독자의 시선이 머무는 비중에 맞춰 원고 작성 시간도 배분해야 한다([18장](./chapter_18_time_budget.md)).

완벽주의를 버리고, 검증된 형식 안에서, 교정 도구와 단락 구조를 곁에 두고 쓰기로 마음먹었다면 이제 당장 손대야 할 작업은 명확하다. 거창하게 서론 첫 문장부터 문학적으로 빚으려 들지 말고, 연구 전체의 그림과 빈 실험을 한눈에 드러내는 아웃라인부터 세우는 일이다.

# 17장 아웃라인부터 시작하기

쓰기를 미루지 않겠다고 마음먹었더라도, 실험이 다 끝나지 않았는데 당장 무엇부터 써야 할지 막막할 수 있다. [George Whitesides의 "Writing a Paper" (2004)](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 바로 이 지점에서 관점을 뒤집는다. 논문을 실험이 끝난 뒤 적는 결과 보고서가 아니라, 진행 중인 연구 자체를 설계하고 점검하는 틀로 쓰라는 것이다. 그래서 Whitesides는 데이터 수집이 "끝날" 때까지 기다리지 말고 연구 초기부터 outline을 쓰기 시작하라고 권한다.

---

## 17.1 아웃라인을 데이터 구조로 다루기

Whitesides는 문서 하나를 계획서이자 논문 outline으로 삼아, 연구 내내 쓰고 고치기를 반복하는 방식을 제안한다. 연구 초기에는 이 문서의 대부분이 앞으로 할 계획으로 채워져 있다가, 실험이 쌓이고 연구가 마무리될 무렵에는 자연스럽게 논문의 완성된 outline으로 바뀐다. 새 데이터가 나올 때마다 이 문서의 해당 자리에 끼워 넣으며 뼈대를 최신 상태로 유지한다.

이때 outline을 문장 몇 개 끄적여 놓은 메모가 아니라, 목적·가설·결론이 서로 맞물린 데이터 구조로 다루어야 한다. 그러니 outline 단계에서는 유려한 줄글이 거의 들어가지 않는다. 공동 저자들과 outline의 데이터 배치와 논리 구성에 먼저 합의해 두면, 나중에 살을 붙여 본문을 쓰는 일은 생각보다 수월하게 풀린다. 줄글을 다 써 놓은 뒤 전체 구성을 뜯어고치는 일은 더디고 고통스럽지만, outline 상태에서 슬롯을 옮기고 고치는 데는 품이 적게 든다.

아직 실험하지 못해 비어 있는 자리는 억지로 꾸며 쓰지 말고 빈칸으로 남겨 둔다. 빠진 데이터가 들어갈 자리, 그 데이터가 어떻게 나오리라는 가설, 그리고 가설이 맞을 때 내릴 해석을 outline에 미리 적어 두자. `[DATA NEEDED]`나 `[HYPOTHESIS]` 같은 표시를 박아 두면, 지금 당장 연구실에서 돌려야 할 실험이 무엇인지 한눈에 드러난다.

---

## 17.2 아웃라인의 7칸 골격 (주장·가설·결과·표)

Whitesides는 2.3절 "The Outline"에서 논문의 뼈대를 다음 일곱 개의 슬롯 순서로 잡는다.

1. Title
2. Authors
3. Abstract — 나중에
4. Introduction
5. Results & Discussion (합쳐서)
6. Conclusions
7. Experimental

눈에 띄는 점은 3번 Abstract에 붙은 단서다. Whitesides는 여기에 "초록은 쓰지 말라. 논문이 완성된 뒤에 쓰면 된다"고 딱 잘라 적었다. 본문의 뼈대와 결론이 서기도 전에 초록부터 붙잡고 있으면 표현만 맴돌기 십상이기 때문이다.

반면 Introduction 슬롯에는 연구 목적(objectives), 그 목적이 중요한 이유(justification), 배경, 독자 안내, 결론 예고를 모두 채워 넣는다. 특히 Whitesides는 서론의 첫 한두 단락만큼은 outline 단계에서도 완전한 문장으로 다듬어 써 보라고 권하며, 그중에서도 첫 문장에 가장 큰 공을 들이라고 강조한다. 첫 문장에서는 연구의 목적과 그 목적이 중요한 이유를 짧고 선명하게 밝히는 것이 이상적이다.

Results & Discussion은 보통 한 덩어리로 묶어 쓰되, 주요 주제별로 소제목을 나누어 배치한다. Whitesides는 2.4절에서 결과를 반드시 중요한 순서대로 배열하라고 지시한다. 처음 논문을 쓰는 학생일수록 첫 실패에서 시작해 시행착오 끝에 마지막 성공으로 끝나는 실험 일지를 그대로 옮겨 놓기 쉬운데, Whitesides는 이런 시간순 나열을 "완전히 틀렸다"고 일축한다. "The reader usually does not care how you arrived at your big results, only what they are." 독자가 궁금해하는 것은 큰 결과에 도달하기까지 겪은 고생길이 아니라, 그래서 밝혀낸 핵심 결과가 무엇인지다.

마지막 Conclusions에는 앞선 결과의 단순 반복이 아니라 한 단계 위에서 내려다본 종합 분석을 담는다(작성법은 [20장](./chapter_20_subheadings_and_conclusions.md)에서 자세히 다룬다).

---

## 17.3 아웃라인 4~5회 고쳐 쓰기 주기

이렇게 잡은 7-슬롯 outline은 한 번 적어 두고 끝내는 문서가 아니다. Whitesides의 연구실에서는 공동 저자들과 outline에 최종 합의하기까지 보통 네다섯 번을 오가며 고친다(→ [3장 §3.3](./chapter_03_ownership_shift.md)). 그 반복이 마무리될 즈음이면 outline 안에 자리 잡은 표와 그림이 그대로 논문 본문의 표와 그림이 된다.

Whitesides 본인이 회차마다 할 일을 딱딱 정해 둔 것은 아니지만, 실제 작업 계획을 세울 때는 다음처럼 리듬을 잡아 볼 수 있다.

- **1회차.** 현재까지의 가설과 핵심 결과를 7개 슬롯에 거칠게 채운다. 이 시점에서는 대부분의 칸에 `[DATA NEEDED]`나 `[HYPOTHESIS]` 표시가 남는 것이 정상이다.
- **2-3회차.** 실제 그림과 표의 초안을 슬롯 안에 넣는다. 시각 자료를 자리에 끼워 보는 이 단계에서 비로소 빠진 실험이나 약한 대조군이 선명하게 드러나며, 추가 실험 계획도 대개 여기서 결정된다.
- **4-5회차.** 각 구획의 소제목을 주장이 담긴 완결된 문장으로 다듬고, 슬롯과 슬롯 사이의 논리 흐름이 매끄럽게 이어지는지 점검한다.

회차 사이에 24시간 정도 간격을 두는 것은 묵혔다 다시 보기 위한 출발값일 뿐이다. 같은 날이라도 새 실험 데이터가 나왔거나 공동 저자의 피드백이 도착했다면 바로 열어 고쳐도 무방하다. 마감 일정과 실험이 돌아가는 주기에 맞춰 반복 간격을 유연하게 조율한다.

---

## 17.4 이번 논문에 넣을 결과 고르기

outline을 다듬는 과정은 이번 논문에 무엇을 넣고 무엇을 뺄지 가려내는 편집 작업이기도 하다. Whitesides는 가장 중요한 결과부터 앞에 세우고 부차적인 결과는 뒤로 미루거나 아예 빼 버리라고 조언하며, 짧은 논문이 긴 논문보다 훨씬 읽기 쉽다고 적었다. 핵심 가설과 곧바로 맞물리지 않는 흥미로운 결과는 아깝더라도 다음 논문의 outline 파일로 옮겨 담아 둔다.

빼낸 결과를 휴지통에 버리지 않고 다음 outline으로 옮겨 두는 까닭은 Whitesides가 1절에서 강조한 연구 원칙에 닿아 있다. "'Interesting and unpublished' is equivalent to 'non-existent'"(흥미롭더라도 발표하지 않은 결과는 존재하지 않는 것과 같다). 바로 앞 문장에서도 그는 연구에서 논문이 나오지 않으면 애초에 그 연구를 하지 않은 것과 다름없다고 못 박았다.

데이터가 쌓이다 보면 연구를 처음 시작할 때 세웠던 가설과 다 쓴 논문의 목적이 달라지기도 한다. 당황할 필요는 없다. Whitesides는 데이터가 원래 가설보다 다른 가설을 더 잘 뒷받침하는 것처럼 보인다면, 두 가설을 나란히 적어 두고 데이터를 가장 설득력 있게 설명하는 조합을 고르라고 말한다. "Much of good science is opportunistic and revisionist." 훌륭한 과학의 상당 부분은 뜻밖의 발견을 기민하게 포착해 논리를 새로 짜는 데서 나온다.

---

## 17.5 아웃라인 골격과 서사 구조

한편 [Joshua Schimel의 Writing Science (2012)](https://global.oup.com/academic/product/writing-science-9780199760244)는 OCAR나 ABDCE 같은 서사 구조를 중심으로 논문을 짜라고 권한다. 이 때문에 데이터와 슬롯에서 출발하라는 Whitesides의 방식과 서사를 앞세우는 Schimel의 조언이 서로 부딪친다고 느끼는 학생도 있다.

하지만 두 접근법은 배타적인 선택지가 아니라 작업 시점에 따라 이어 쓰는 도구다. 연구와 집필의 초반부에는 Whitesides의 7-슬롯으로 빠진 데이터와 필요한 실험을 냉정하게 찾아내고, 데이터가 채워져 본문을 엮어 가는 후반부에는 Schimel의 서사 구조로 독자가 끝까지 따라올 수 있는 흐름을 점검한다. 어느 회차에서 시선을 옮길지는 프로젝트의 성격과 데이터 진척도에 따라 유동적으로 정하면 된다.

---

## 17.6 도입 단락을 따라 써 보기

outline의 요소들이 실제 논문의 도입 문단으로 어떻게 녹아드는지 확인해 보려면 [KISS-ICP (Vizzo et al., RA-L 2023)](https://arxiv.org/abs/2209.15397)의 Introduction을 펼쳐 보는 것이 좋다. 첫 단락과 이어지는 기여 설명을 읽으며 Whitesides가 꼽은 연구 목적, 중요한 이유, 배경, 독자 안내, 결론 예고가 각각 어느 문장에 자리 잡았는지 표시해 보자. 예컨대 "We show that with the proper use of ICP that builds on basic reasoning about the system's physics and the sensor data's nature, we obtain competitive odometry."라는 문장은 본문 뒷부분의 구성을 알려 주는 독자 안내가 아니라, 논문의 핵심 결과를 앞당겨 요약해 주는 결론 예고다.

구체적인 원문 발췌와 문장별 분석은 [`kiss_icp_intro_hook.md`](./excerpts/excerpt_01_kiss_icp_intro_hook.md)에 정리해 두었으니, outline의 각 슬롯이 어떻게 매끄러운 도입 문단으로 변하는지 한번 직접 따라 써 보며 감을 익혀 보자.

7-슬롯 outline과 반복 주기가 손에 잡혔다면, 다음으로 부딪히는 현실적인 질문은 한정된 시간과 에너지를 어디에 얼마나 쏟아야 하느냐다. 제목·초록·그림·방법 가운데 독자가 실제로 눈을 두는 곳에 맞춰 시간을 배분하고, 초안을 누구에게 어떤 순서로 시험 삼아 읽혀 볼지 정해야 원고가 효율적으로 완성된다.

# 18장 시간 배분과 피드백 루프

[17장](./chapter_17_outline_first.md)에서 아웃라인을 반복하며 이야기의 뼈대를 세웠다면, 이제 그 뼈대 위에 문장을 올리고 남의 눈으로 점검할 차례다. 그런데 실제 논문 작업에서는 정작 공을 들여야 할 곳과 손이 많이 가는 곳이 어긋나기 쉽다. 방법 섹션을 몇 주씩 다듬어 내놓았는데 심사 의견에서는 제목과 초록, 큰 그림부터 흐릿하다는 지적이 돌아오곤 한다. 독자가 가장 많이 보는 대목과 저자가 가장 오래 붙든 대목이 서로 달랐기 때문이다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 바로 이 불균형과 수정의 우선순위를 rule 9와 rule 10에서 다룬다.

---

## 18.1 가장 많이 읽히는 부분에 시간을 쓴다

Rule 9의 핵심은 한 문장으로 요약된다. "The title, abstract, and figures are viewed by far more people than the rest of the paper, and the methods section is read least of all. Budget accordingly." 제목, 초록, 그림은 논문의 다른 어떤 부분보다 훨씬 많은 독자가 들여다보지만, 방법 섹션은 끝까지 읽는 사람이 가장 적으니 쓰는 시간 역시 독자의 시선이 머무는 비율에 맞춰 나누라는 권고다.

작업을 시작할 때는 아래 순서를 첫 점검표로 삼아 두고, 분야의 관행이나 원고의 성격에 따라 조금씩 조정한다.

> Title > Abstract > Figure(특히 Fig 1) > Outline > Introduction > Results > Discussion > Method > Related Work

이 목록에서 아웃라인이 앞자리를 차지한 데에는 이유가 있다. Rule 9는 제목부터 아웃라인을 함께 내세우면서, 계획한 문단마다 비공식 문장 하나씩을 먼저 적어 보는 방식을 권한다. 전체 이야기에 어울리지 않는 문단을 문장 단위로 다듬느라 시간을 흘려보내지 않으려면, 아웃라인 단계에서 각 문단이 맡은 역할부터 살펴보고 맞지 않는 문단을 걸러 내는 편이 낫기 때문이다.

물론 방법을 읽는 독자가 적다고 해서 대충 써도 된다는 뜻은 아니다. 방법 섹션의 목표는 다른 연구자가 실험을 그대로 재현할 수 있게 정보를 빠짐없이 남기는 데 있다. 내용은 정확히 적되, 유려한 문장을 빚는 데 들일 에너지는 제목과 초록, 그림 쪽으로 돌려 두는 편이 현명하다.

---

## 18.2 글쓰기 단계별 시간 배분 비율

실제 일정에 반영하려면 막연한 우선순위보다 손에 잡히는 기준이 필요하다. 논문 한 편을 쓰는 데 드는 전체 시간을 100%로 보고 아래 비율에서 출발해 볼 수 있다. 이 수치는 Mensh와 Kording의 논문에 실린 값이 아니라, 작업 계획을 세울 때 가늠자로 쓰려고 잡은 기준이다.

| 항목 | 비율 |
|---|---|
| Title + Abstract | 15-20% |
| Figures (특히 Fig 1과 main result figure) | 25-30% |
| Outline iteration ([17장](./chapter_17_outline_first.md)) | 15-20% |
| Introduction | 15% |
| Results & Discussion | 10-15% |
| Method + 부록 | 5-10% |

표를 기준으로 삼아 두면 시간 배분이 거꾸로 뒤집히는 일을 일찍 알아챌 수 있다. 방법 섹션에 시간의 절반 넘게 쏟아붓고 제목과 초록, 그림에는 합쳐 10%만 쓰는 식의 치우침을 경계하자는 뜻이며, 이 숫자 역시 불균형을 드러내기 위한 예시다. 원고를 쓰면서 구간별 작업 시간을 간단히 기록해 두면 자신이 어디에 시간을 과하게 쓰고 있는지 바로 확인된다.

---

## 18.3 테스트 독자 운영법

시간 배분을 맞춰 초고를 쓰더라도 혼자서만 원고를 붙들고 있으면 논리의 빈틈을 놓치기 쉽다. Rule 10은 글쓰기를 이야기, 아웃라인, 문장을 함께 고쳐 나가는 최적화 문제로 정의한다. 논문의 전체 흐름이 막힘없이 통하는지 확인하려면 결국 여러 사람의 눈, 특히 테스트 독자(test reader)가 필요하며, 그 독자가 읽다 멈추거나 지루해하는 지점이 곧 이야기의 속도를 조절할 자리다.

단계마다 확인하려는 목표가 다르므로 테스트 독자도 그에 맞춰 바꿔 가며 부탁하는 편이 효과적이다.

- **Outline 단계** — 같은 분야 동료 한 명. 논리의 뼈대가 제대로 잡혔는지, 전개가 말이 되는지 본다.
- **초고 단계** — 다른 세부 분야 동료 한 명. Introduction에서 넓은 맥락을 좁혀 들어가 연구 공백(gap)을 드러내는 흐름이 다른 분야 독자에게도 자연스럽게 통하는지 살핀다.
- **수정 단계** — 비전공 대학원생 한 명. 초록만 보여 주고 "이 논문이 무엇을 푸는지 한 문장으로 말해 달라"고 부탁한다.

테스트 독자를 구했다면 묻는 방식도 가려야 한다. "이 부분 괜찮아?"처럼 막연히 물으면 대개 의례적인 대답만 돌아오기 마련이다. 대신 "이 논문이 무슨 문제를 푸는지 한 문장으로 설명해 달라"처럼 독자가 내용을 자기 말로 다시 꺼내 놓게 해야 글이 실제로 전달됐는지 가늠할 수 있다. Mensh와 Kording 역시 Table 1에서 독자가 논문을 한 문장으로 요약하지 못하는 현상을 rule 1을 어긴 신호로 꼽았다.

---

## 18.4 막연한 피드백 읽기

테스트 독자나 심사위원에게서 돌아오는 반응은 겉으로 드러난 말투에 따라 원인이 다르다. Rule 10에 따르면 막연한 피드백과 시큰둥한 심사 의견은 대개 독자가 논문의 큰 그림을 잡지 못했다는 신호이고, 아주 구체적인 지적은 문단 안의 국소적인 논리 빈틈을 가리킨다. 따라서 원고를 읽은 뒤 "좋네요", "뭔가 어렵다", "잘 모르겠다" 같은 두루뭉술한 답이 돌아온다면 어휘나 문장을 만지기 전에 구조부터 의심해야 한다. 뼈대가 어긋난 채 단어만 갈아 끼워서는 다음 독자에게서도 똑같은 답이 돌아온다.

돌아온 반응이 가리키는 문제 지점에 따라 손볼 섹션을 아래처럼 가려낼 수 있다.

- "초록만 보고 무슨 논문인지 모르겠다" — 제목과 초록을 처음부터 다시 쓴다. [22장](./chapter_22_title_abstract.md) 참고.
- "왜 이게 중요한지 모르겠다" — Introduction에서 연구 공백을 좁혀 들어가는 흐름을 점검한다(→ [23장](./chapter_23_introduction.md)).
- "방법은 알겠는데 결과가 와닿지 않는다" — Results의 소제목이 주장을 담은 문장인지 먼저 본다(→ [26장](./chapter_26_results_discussion.md)).

결국 피드백을 읽는 요령은 감상을 곧이곧대로 받아 적는 데 있지 않고, 그 막연함이 어느 층위의 구조 결함에서 비롯했는지 역추적하는 데 있다.

---

## 18.5 피드백 빈도와 간격

남의 눈을 빌리는 일만큼이나 자신이 원고를 새로운 눈으로 다시 볼 시간 간격도 중요하다. 아웃라인을 고치는 회차 사이나 초고와 수정 사이에 일정한 간격을 두면, 방금 써 내려간 문장에 갇히지 않고 한 발 떨어져 원고를 읽을 수 있다. 아웃라인 회차 사이에는 24시간, 초고와 수정 사이에는 48시간 정도를 출발값으로 두고, 마감 일정과 협업 주기에 맞춰 탄력적으로 조절한다.

마감을 코앞에 두고 새 독자를 부를 때는 큰 구조를 뜯어고칠 여유가 실제로 남아 있는지부터 따져 보아야 한다. 가령 마감 일주일 전쯤에는 논문의 큰 구조를 잠정 고정한 뒤, 원고를 이미 속속들이 아는 공동 저자와 함께 오탈자와 표기, 수식 번호 같은 표면의 오류를 마지막으로 훑는 편이 안전하다. 물론 이 전환 시점은 학회 일정과 팀 규모에 따라 달라진다.

---

## 18.6 초고 마무리 전 반복 점검 신호

작업이 중반을 넘겼는데도 섹션 간 수정 횟수 차이가 유독 크게 벌어지거나, 초록은 손대지 않은 채 방법 섹션만 계속 고치고 있거나, 주고받는 피드백이 단어 선택 수준에서만 맴돈다면 §18.1에서 세운 우선순위가 뒤집혔을 가능성이 높다. 문단 안의 작은 결함은 혼자 읽어도 비교적 빨리 눈에 띄지만, 섹션이나 논문 전체를 관통하는 구조의 빈틈은 원고를 처음 보는 독자의 반응을 받아 보아야 비로소 드러난다. 피드백으로 어딘가 어색한 단락이나 섹션이 잡혔다면, 다음 장에서 살펴볼 CCC 구조로 각 자리에 필요한 요소가 빠지지 않았는지 바로 점검해 볼 수 있다.

# 19장 CCC: 단락·섹션·논문에 같은 구조 쓰기

테스트 독자의 피드백에서 요점이 흐리다는 지적이 나온 단락이 있다면, 첫 문장 대신 마지막 문장부터 들여다보는 편이 빠르다. 마지막 문장이 독자에게 어떤 판단을 남기는지, 그 판단이 문장의 끝자리에 제대로 놓였는지, 앞선 문장들이 그 판단에 꼭 필요한 맥락과 근거를 건네고 있는지를 거슬러 올라가며 살핀다.

이처럼 맥락과 내용, 결론이 맞물리는지 따져 보는 틀은 단락 하나에 그치지 않고 섹션과 논문 전체에도 똑같이 적용된다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 3에서 Context-Content-Conclusion(C-C-C)을 과학 논문의 기본 골격으로 제안한다.

---

## 19.1 독자의 두 질문

C-C-C 구조는 독자가 글을 읽으며 품는 가장 근본적인 두 가지 의문을 미리 막아 준다. 처음에 맥락을 깔지 않고 본론부터 꺼내면 독자는 "Why was I told that?"(이걸 왜 들려주지?) 하고 되묻고, 중간 내용만 늘어놓은 채 끝맺음을 비워 두면 "So what?"(그래서 뭐?) 하고 반문한다. 맥락에서 시작해 내용과 근거를 거쳐 결론에 닿도록 짜 두면 독자는 길 잃을 틈 없이 주장을 따라간다.

논문을 처음 쓰는 학생은 자칫 연구를 진행한 시간순으로 글을 풀어가기 쉽다. "처음에 A를 시도했는데 실패했고, 그래서 B로 갔는데 이건 또 다른 문제가 있어서, 결국 C에 도달했다"는 식이다. 시행착오를 남기는 연구 노트라면 자연스러운 기록이지만, 논문에서 이 순서를 그대로 밟으면 정작 독자가 알아야 할 핵심 주장과 근거의 논리가 작업 일지에 파묻히고 만다. Rule 3에서도 시간순으로 적고 싶은 마음 자체는 자연스럽다고 인정하면서도, 독자는 연구자의 여정이 아니라 최종 주장과 그 논리를 원한다고 선을 긋는다([11장 §11.3](./chapter_11_ccc_lens.md)). 따라서 연구 과정을 설명해야 할 때조차 기록을 순서대로 옮기기에 앞서, 그 과정이 어느 주장을 뒷받침하는지부터 먼저 정해 두어야 한다.

물론 C-C-C에도 적용 조건은 있다. Mensh와 Kording은 이 구조가 맥락을 차분히 읽을 여유가 있는 독자에게 맞으며, 성급한 독자를 붙잡으려면 신문 기사처럼 흥미로운 핵심 내용부터 앞세워야 한다고 짚었다. 다만 과학 논문은 이미 제목과 초록에서 핵심 내용을 먼저 드러내므로, 본문인 Introduction까지 넘어온 독자라면 배경 맥락을 받아들일 준비가 되어 있다고 보았다.

---

## 19.2 세 규모에서 반복되는 구조

C-C-C가 유용한 까닭은 단락, 섹션, 논문 전체라는 세 규모에서 같은 리듬으로 작동하기 때문이다([11장 §11.1](./chapter_11_ccc_lens.md)). 실제 원고에 이 틀을 옮길 때는 섹션의 첫 단락에서 그 섹션의 목적과 자리를 먼저 밝히고, 닫는 단락에서 섹션 전체의 결론을 맺어 준다.

다만 세 요소를 단락마다 기계적으로 우겨넣을 필요는 없다. 단락 하나하나는 저마다 결론을 갖되, 섹션 전체의 흐름이 실험 순서에만 묶여 있으면 독자는 각 결과가 어떤 주장을 받치는지 놓치게 된다. 반대로 앞 단락이 맥락을 이미 충분히 깔아 두었다면 다음 단락은 곧바로 결과로 들어가도 무방하다. 형식의 기계적 반복보다, 독자가 지금 읽는 자리에서 필요한 맥락과 근거를 제때 건네받고 있는지가 훨씬 중요하다.

---

## 19.3 초록 한 편에 맥락–내용–결론(CCC) 담기

본문의 섹션들은 앞 섹션이 맺은 결론을 이어받아 이야기를 풀어가지만, 초록은 그 한 단락 안에서 모든 것이 시작하고 끝나야 한다. Rule 5에 따르면 대다수 독자는 초록만 읽으므로, 초록 하나로 논문의 메시지 전체를 실어 날라야 하기 때문이다. 그래서 초록에는 맥락, 내용, 결론이 빈틈없이 들어간다. 먼저 맥락에서 연구 공백이나 열린 질문을 짚어 주고, 내용에서 결과를 요약한 뒤, 결론에서 그 결과로 앞선 질문에 답한다. Mensh와 Kording은 결과가 연구 공백을 "like a key fits its lock"(열쇠가 자물쇠에 맞듯) 정확히 메우려면, 잘 쓰인 초록이라도 대개 여러 차례 고쳐 써야 한다고 강조했다.

본문을 고치는 동안에는 논문이 계속 움직여 연구 공백의 초점도 함께 흔들리기 마련이다. 초록을 일찍 써 두었더라도 공백이 달라지면 다시 쓸 수밖에 없는데, 이 점이 초록은 논문이 완성된 뒤에 써도 된다는 [Whitesides의 조언](./chapter_17_outline_first.md)과도 맥이 닿는다. 완성된 초록은 본문과 완전히 독립해야 하므로, "Fig. 3"이나 섹션 번호를 본문에서 끌어다 쓰면 초록만 읽는 독자는 흐름을 잃는다.

---

## 19.4 문장의 강조와 단락의 결론을 연결하기

단락 수준에서 C-C-C를 챙길 때는 문장 안쪽의 정보 배치와도 호흡을 맞춰야 한다. [Gopen & Swan 1990](https://www.americanscientist.org/sites/americanscientist.org/files/20053191534_306.pdf)은 독자가 문장 끝에 오는 정보를 자연스럽게 강조된 정보로 읽는다고 설명하며 그 자리를 stress position(강조 위치)이라 불렀다. stress position 개념은 Mensh와 Kording의 rule 3이 단락의 마지막 문장에 독자가 기억할 결론을 두라고 권하는 것과 맞닿아 있지만, 두 기준이 가리키는 층위는 서로 다르다. stress position은 한 문장 안에서 강조가 실리는 자리이고, C-C-C의 conclusion은 한 단락 안에서 핵심 요점이 놓이는 자리다.

층위가 다른 만큼 두 자리는 서로를 대신해 주지 못한다. 단락의 마지막 문장에 결론을 적어 넣었더라도 그 문장의 끝자리를 부수적인 출처나 앞에서 이미 꺼낸 말로 채워 버리면, 독자는 어디에 힘을 실어 읽어야 할지 다시 판단해야 한다. 반대로 매 문장의 끝에 중요한 정보를 잘 배치했더라도, 그 문장들이 마지막 문장의 단일한 주장으로 모이지 않으면 단락의 결론은 여전히 서지 않는다. 문장의 강조 위치와 단락의 결론을 따로 짚어 본 뒤 둘을 나란히 맞춰 보면, 개별 문장은 매끄러운데 정작 요점이 남지 않는 단락을 정확히 찾아낼 수 있다.

---

## 19.5 흔한 실수 5종

원고를 검토할 때 C-C-C가 무너지는 지점을 짚어 보면 대개 비슷한 다섯 가지 양상으로 나타난다.

- **맥락 없이 결과로 출발하기** — 앞선 맥락이 없는데도 단락 첫 문장을 결과로 시작하면, 독자는 그 결과를 왜 읽어야 하는지 알지 못한다.
- **결론 자리에 연결 문장 두기** — 단락의 마지막 문장을 다음 단락으로 넘어가는 안내 문장으로 써 버리면, 결론이 머물러야 할 자리를 연결 문장이 차지해 독자가 기억할 요점이 사라진다.
- **섹션 도입 단락 생략하기** — 도입 단락 없이 곧장 §2.1로 들어가면 섹션 규모의 맥락이 통째로 빈다.
- **Discussion에 새 결과 꺼내기** — 내용과 결론이 뒤섞이는 실수다. Rule 8에 따르면 Discussion은 결과가 연구 공백을 어떻게 메웠는지, 해석의 한계는 무엇인지, 분야에 어떤 의미를 남기는지를 다루는 자리다.
- **Conclusion을 Results 요약으로 끝내기** — 이미 본 결과를 다시 읊는 데 그친다. 이 문제는 [20장](./chapter_20_subheadings_and_conclusions.md)에서 자세히 다룬다.

이 가운데 단락 안쪽의 결함은 혼자서도 비교적 쉽게 보이지만, 섹션이나 논문 전체에서 C-C-C가 엇나간 자리는 처음 읽는 테스트 독자에게 원고를 건네 봐야 비로소 드러나는 경우가 많다([18장 §18.3](./chapter_18_time_budget.md)). 이제 마지막 실수에서 짚은 두 가지, 곧 훑어 읽는 독자의 시선을 붙잡는 소제목과 단순 요약에 머무르지 않는 결론을 어떻게 쓰는지 다음 장에서 이어서 살펴본다.

---

# 20장 주장을 담은 소제목과 요약이 아닌 결론

19장에서 살핀 C-C-C 구조가 단락과 섹션 본문의 뼈대를 잡아 준다면, 바쁜 독자가 가장 먼저 훑는 소제목과 원고의 문을 닫는 결론은 그 뼈대의 핵심 주장을 밖으로 꺼내 보여 주는 자리다. 실제로 논문 본문을 처음부터 끝까지 정독하지 않고 소제목만 훑은 뒤 그림으로 내려가는 독자가 적지 않다. 이런 독자에게도 논문의 중심 메시지가 닿으려면 소제목 자체에 주장이 실려 있어야 한다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 역시 2.3절에서 되도록 구체적이고 정보가 풍부한 소제목을 달라고 권한다.

---

## 20.1 소제목에 주장이 필요한 이유

원고를 훑어 읽는 독자의 시선은 본문 문단보다 소제목과 그림 캡션에 먼저 닿는다. 이 독자에게 "Loop Closure Experiments"라는 소제목은 그저 실험의 주제만 알려 줄 뿐 아무런 판단도 전하지 않는다. 같은 자리에 "Loop closure recall improves 14% with multi-scale BEV"라고 적어 두면 단 한 줄만으로 핵심 결과를 전할 수 있다(여기서 든 14%와 아래 표의 수치는 모두 소제목 문형을 보여 주려고 만든 가상의 값이다).

Whitesides는 Results & Discussion을 주요 주제별로 나누어 굵은 소제목을 달아야 구성이 분명해지고 독자도 관심 있는 대목을 금방 찾아 읽을 수 있다고 보았다. 그가 든 예에서 "The Rate of Self-Exchange Decreases with the Polarity of the Solvent"는 "Measurement of Rates"보다 길지만 독자에게 훨씬 실속 있는 정보를 건넨다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 7도 같은 방향이다. 결과가 주장을 받치는 논리 흐름을 이어지는 서술문으로 바꿔 Results의 소제목으로 쓰라는 지침인데, 이렇게 짠 소제목만 위에서 아래로 훑어 내려가도 논문 전체의 논지를 자연스럽게 따라갈 수 있다.

물론 "Network Architecture"나 "Ablation Study" 같은 주제형 소제목이 분야에서 관행처럼 쓰여 낯설지 않은 것도 사실이다. Whitesides의 예시에도 "Synthesis of Alkane Thiols"처럼 주제만 밝힌 소제목이 섞여 있다. 다만 결과를 보고하는 섹션의 소제목이라면 주제어로 남겨 두기 전에 그 절의 주장을 문장으로 담을 수 있는지 먼저 따져 볼 만하다.

---

## 20.2 주장 없는 소제목 고쳐 쓰기 5가지 사례

주제만 적힌 소제목을 주장이 실린 문장으로 바꿀 때 문장의 골격이 어떻게 달라지는지, 로보틱스 논문에서 흔히 마주치는 다섯 쌍을 나란히 놓고 비교해 보자.

| Before (topic) | After (claim) |
|---|---|
| Loop Closure Experiments | **Loop closure recall improves 14% with multi-scale BEV** |
| Ablation Study | **Removing geometric prior degrades RTE by 38% on KITTI-08** |
| Comparison with Baselines | **Our method matches LIO-SAM accuracy at 1/3 the runtime** |
| Network Architecture | **A two-branch encoder separates appearance from geometry** |
| Dataset and Metrics | **We evaluate on KITTI-360 and VIVID with rotation/translation error** |

오른쪽 After 열을 보면 다섯 줄 모두에 동작을 나타내는 동사와 그 대상이 또렷이 살아 있다. "improves 14%", "degrades RTE by 38%", "matches LIO-SAM accuracy at 1/3 the runtime", "separates appearance from geometry"처럼 핵심 효과나 작동 원리가 한 줄 안에 담긴다. 반면 동사 없이 명사구만 남으면 소제목은 어떤 결론도 전하지 못한 채 주제 이름표에 그치고 만다.

---

## 20.3 주장형 소제목과 결론 작성 3단계

주장을 담은 소제목은 머릿속에서 단번에 뽑아내려 하기보다 본문 결론을 압축하는 절차를 거쳐 만드는 편이 깔끔하다.

1. 해당 섹션 본문에서 내리는 핵심 결론을 평서문 한 문장으로 적는다.
2. 주어-동사-목적어가 분명히 드러나도록 문장을 다듬고, 명사구 안쪽의 수식 관계도 손본다. Whitesides는 3절 "Some Points of Style"에서 명사를 형용사처럼 앞세워 붙이지 말라고 권하며 "ATP formation" 대신 "formation of ATP"로 쓰는 예를 들었다.
3. 학회 템플릿의 단 폭 안에서 가급적 한 줄에 들어오도록 군더더기를 덜어 낸다. 초안은 60–80자 안팎으로 시작해 볼 수 있지만 절대적인 길이 규칙이 있는 것은 아니므로, 글자 수에 매이기보다 주장이 온전히 맺히는지, 같은 층위의 소제목끼리 형식이 나란히 맞는지부터 살핀다.

이 다듬기 작업은 [17장](./chapter_17_outline_first.md)에서 나눈 아웃라인 반복 가운데 4–5회차에서 하는 편이 좋다. 1–3회차에서는 소제목을 임시 표지로 남겨 두었다가, 본문의 결론이 단단히 선 뒤에 그 결론을 끌어올려 소제목으로 확정하면 수정이 덜 꼬인다.

---

## 20.4 결론은 요약이 아니다

소제목이 각 절의 주장을 앞으로 끌어낸다면, 논문 말미의 Conclusions는 전체 연구에서 얻은 의미를 한 단계 끌어올려 글을 끝맺는 자리다. 그런데 Conclusions 섹션에서 가장 자주 보이는 결함은 Results의 수치를 그대로 다시 늘어놓는 일이다. "In summary, we showed A, B, and C."로 문을 여는 Conclusions는 독자가 초록과 Results에서 이미 읽은 정보를 되풀이할 뿐이어서 아무런 새 통찰도 주지 못한다.

Whitesides는 2.3절에서 Conclusions가 말 그대로 결론의 자리여야 하며, 한 단계 높은 분석을 보태고 연구의 의의를 분명히 밝혀야 한다고 강조한다. Results에 실린 내용은 특별히 힘주어 짚어야 할 대목이 아니라면 되풀이하지 않고, 아웃라인 단계에서는 결론을 짧은 구나 문장의 목록으로 먼저 추려 둔다. 그 앞의 2.2절에서도 아웃라인의 생각을 Introduction, Results and Discussion, Conclusions로 나누면서, Conclusions가 답해야 할 질문으로 "What does it all mean? What hypotheses were proved or disproved? What did I learn? Why does it make a difference?"를 꼽았다.

실제 분량은 논문의 구조에 따라 달라진다. Discussion 섹션이 별도로 마련된 논문이라면 해석과 한계는 앞선 섹션에서 이미 다루었으므로 Conclusions는 짧아도 좋다. 짧은 요점 3–5개 정도로 시작해 학회 형식과 기여의 수에 맞춰 조정하면 된다. 반면 Discussion 없이 곧장 Conclusions로 이어지는 형식이라면, 이 섹션에 결과의 해석과 한계까지 함께 담아야 하므로 자연히 호흡이 길어진다.

---

## 20.5 흔한 실수

소제목과 Conclusions를 다듬고 난 뒤에도 아래 두 가지 실수가 남아 있지는 않은지 마지막으로 한 번 더 훑어본다.

- **Conclusions에 future work 한 줄만 얹기** — 연구에서 무엇을 배웠고 왜 중요한지 한 단계 높여 분석하는 대목이 빠져 있다. 향후 과제는 그 분석과 의의를 짚은 뒤에 덧붙이는 편이 자연스럽다.
- **같은 층위의 소제목 길이가 들쭉날쭉하기** — 한 섹션 안에 10자짜리 소제목과 90자짜리 소제목이 뒤섞이면 훑어 읽는 리듬이 끊어진다. 같은 층위에 놓인 소제목은 문형과 길이를 비슷하게 맞춰 둔다.

주장을 담은 소제목으로 섹션의 문을 열고 요약이 아닌 분석으로 논문의 문을 닫으면 글 전체의 골격이 선명해진다. 이제 이 굵은 뼈대 안쪽으로 들어가, 한 단락 안에서 문장과 문장이 어떻게 맞물려 흘러가는지 다음 장에서 살펴본다.

---

**출처.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 2.2절(Conclusions에 들어갈 질문), 2.3절(정보가 담긴 소제목, 요약이 아닌 결론), 3절(명사를 형용사로 쓰지 않기). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 7(서술문 소제목). 로보틱스 소제목 다섯 쌍과 그 수치는 설명용으로 지어낸 예시다.

# 21장 문단 흐름

문장 하나하나는 공들여 다듬었는데 단락으로 이어 읽으면 어딘가 흐름이 끊긴다고 호소하는 학생이 많다. 다섯 문장을 떼어 놓고 보면 흠잡을 데 없는데, 한데 붙여 놓으면 문장 사이가 삐걱거린다. 이 어색함은 개별 문장의 문법이 틀려서가 아니라, 문장의 첫머리(topic position)와 끝자리(stress position)가 단락 안에서 서로 맞물리지 않을 때 생긴다(→ [12장 §12.2](./chapter_12_reader_expectations_diagnosis.md)).

이 맞물림의 원리는 [Gopen & Swan 1990](https://www.americanscientist.org/blog/the-long-view/the-science-of-scientific-writing)이 잘 설명해 준다. 두 저자는 문장 첫머리에 이미 앞에서 나온 정보(old information)를 두고, 끝자리에 강조할 새 정보(new information)를 놓으라고 권한다. 이 배치는 문장 한 줄의 가독성을 넘어 단락 전체의 흐름까지 좌우한다. 첫머리마다 앞 내용과 이어지지 않는 낯선 말이 잇달아 나오면, 독자는 새 문장이 앞 문장과 어떤 고리로 이어지는지, 이 단락 안에서 무슨 구실을 하는지 매번 혼자 추측해야 하기 때문이다. 19장에서는 C-C-C로 단락의 어느 자리에 무엇이 들어갈지 큰 뼈대를 잡았고, 이번 장에서는 그 뼈대 안에서 문장과 문장을 틈 없이 잇는 방법을 다룬다.

---

## 21.1 문장 층위와 단락 층위

단락을 읽는 독자의 시선은 문장 층위와 단락 층위라는 두 흐름을 동시에 따라간다. 문장 안에서는 첫 자리(topic position)가 앞 문장을 받아 주는 연결 고리를 맡고, 끝자리(stress position)가 강조할 새 정보를 품는다. 한 단계 위인 단락 차원에서는 첫 문장이 입구가 되고, 마지막 문장이 독자가 가져갈 요점(takeaway)을 건넨다.

잘 읽히는 단락에서는 이 두 층위가 모두 같은 방향, 곧 앞에서 나온 정보에서 새 정보 쪽으로 흐른다. 어느 한쪽이 엇나가면 독자는 문장이 바뀔 때마다 이 정보가 왜 지금 등장했는지 가늠하느라 에너지를 쓰고, 그런 작은 멈춤이 쌓이다 보면 단락 끝에 다다랐을 때 핵심 요점마저 흐려진다. 학생 원고에서 흔히 보이는 문제는 [29장](./chapter_29_reader_expectations.md)의 원칙을 떠올려 개별 문장은 어느 정도 손보면서도, 문장과 문장이 맞물리는 연결 상태까지 따로 점검해야 할 작업으로는 여기지 않는 데 있다.

---

## 21.2 주제 연결(Topic chain) — 문장 첫머리로 이어 가기

문장이 매끄럽게 넘어가려면 **각 문장의 첫 명사구가 앞 문장의 어딘가와 이어져 있어야 한다.** 앞 문장의 끝자리에 놓였던 명사구를 다음 문장 첫머리에서 그대로 이어받는 형태가 가장 자연스럽다. 아래 두 예문을 나란히 놓고 첫 명사구가 어떻게 달라졌는지 살펴보자.

> 원문: The proposed method achieves 14% improvement on KITTI. Many KITTI sequences are challenging due to dynamic objects. Loop closure is critical.
>
> 연결을 일부 고친 문장: The proposed method achieves 14% improvement on KITTI. This benchmark contains many sequences that are challenging due to dynamic objects. Loop closure is critical.

예문의 14%는 문장 연결을 보여 주려고 넣은 가상 수치이며, 두 문안에 담긴 사실 정보는 똑같다. 원문에서는 첫 문장 끝의 KITTI와 둘째 문장 첫머리의 Many KITTI sequences가 느슨하게 겹치기만 하지만, 고친 문안에서는 둘째 문장이 This benchmark로 시작해 앞 문장의 KITTI를 곧바로 받는다. 덕분에 독자는 어느 데이터셋의 시퀀스를 가리키는지 한눈에 알아차린다.

반면 셋째 문장은 고친 뒤에도 여전히 앞 문장과 동떨어져 있다. Loop closure가 왜 중요한지, 앞서 말한 14% 향상이나 동적 물체와 어떤 관계가 있는지가 주어진 문장 어디에도 없기 때문이다. 이 빈틈을 메우려면 글재주로 문장을 이어 붙이기 전에 방법과 실험에서 근거부터 확인해야 한다. 연결을 살리겠다며 검증하지도 않은 "동적 물체가 있는 sequence에서도 14% 향상이 유지된다" 같은 말을 끼워 넣거나, critical을 most critical로 높여 부르면 원고에 없던 결과와 최상급 주장을 지어내는 셈이 된다.

앞 문장과 다음 문장을 자연스럽게 잇는 **첫머리에는 바로 앞에 나온 명사나 대명사, 혹은 앞 문장 전체를 묶어 부르는 명사구**가 잘 어울린다. "this result", "such configurations" 같은 묶음 명사구가 좋은 연결 도구다. 이때 주의할 점을 [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)도 분명히 짚어 둔다. "this"를 혼자 세우지 말고 반드시 뒤에 명사를 붙여 무엇을 가리키는지 밝히라는 권고다. 가령 "This is a fast reaction; This leads us to conclude" 대신 "This reaction is fast; This observation leads us to conclude"처럼 쓰면 앞 문장의 어느 대목을 받아 넘기는지 더는 모호하지 않다.

---

## 21.3 강조 위치(Stress chain) — 문장 끝에 새 정보 두기

Topic chain이 앞 문장과의 고리를 붙잡아 준다면, Stress chain은 단락의 논리를 앞으로 밀고 나간다. **한 문장의 끝자리에서 강조된 새 정보가 다음 문장의 첫머리로 넘어가면서, 단락 안에 새로운 정보가 층층이 쌓여 가는 구조다.**

> ✓ Textureless walls provide weak image gradients. Weak image gradients make photometric motion estimation less informative. This loss of photometric information motivates adding geometric constraints in a hybrid method.

이 세 문장을 따라가 보면 고리가 빈틈없이 맞물린다. 둘째 문장은 첫 문장 끝에 놓인 weak image gradients를 첫머리에서 그대로 받아 넘긴다. 이어 셋째 문장의 This loss of photometric information은 둘째 문장이 도달한 정보 손실을 한 묶음으로 받아, 기하 제약을 함께 쓰려는 이유로 연결한다. 그 결과 단락의 마지막 문장 끝자리에는 방법 선택의 이유라는 핵심 요점이 자연스럽게 올라선다.

다만 이 예문은 문장 흐름이 맞물리는 구조를 보여 줄 뿐, 그 방법이 실제로 통한다는 기술적 근거까지 대신해 주지는 않는다. 질감이 부족한 벽면에서는 밝기 변화에 기대는 추정이 약해지는 편이고, 기하 제약은 질감 유무와 무관하게 쓸 수 있다. 하지만 장면의 기하 구조 자체가 단조롭다면 기하 제약 역시 정보가 부족할 수 있으므로, 이 예문만으로 hybrid method의 성공이 보장되지는 않는다.

반대로 **문장 끝자리를 상투어가 차지하면 stress chain은 맥없이 끊긴다.** "in this paper", "of our approach" 같은 말이 매 문장의 끝을 막고 서면 정작 독자가 힘을 주어 읽어야 할 새 정보가 어디 있는지 흐려지고 만다. 이는 [12장 §12.2](./chapter_12_reader_expectations_diagnosis.md)에서 짚은 진단 1(stress position)과 똑같은 결함이다.

---

## 21.4 흔한 결함

Topic chain과 stress chain이 어긋날 때 학생 원고에서 되풀이되는 결함은 크게 네 가지로 요약된다.

**Topic 끊김.** 문장 첫머리에 앞 문장과 아무런 연결 고리가 없는 새 명사가 잇달아 등장해, 독자가 문장마다 앞뒤 관계를 스스로 이어 맞추어야 한다.

**Stress 흩뿌리기.** §21.3에서 본 것처럼 문장 끝자리마다 상투어가 자리 잡아, 강조해야 할 새 정보가 문장 안쪽으로 밀려나 흐릿해진다.

**한 단락에 요점 둘.** 단락이 끝났을 때 독자가 들고 갈 요점 후보가 두 개 이상 남는다. [11장 §11.2](./chapter_11_ccc_lens.md)의 Q2(이 단락의 content는 한 가지인가)에서 바로 걸리는 결함이므로 단락을 나누어 각 요점에 독립된 자리를 주어야 한다.

**접속사 남발.** "However", "Moreover", "Therefore" 같은 접속사를 습관처럼 문장 첫머리에 둔다. 앞 문장의 내용을 이어받는 명사구 대신 접속사만 세워 두면 topic chain이 텅 비어 버린다. 접속사는 앞뒤 정보 사이의 논리적 전환이나 인과 관계를 꼭 짚어야 할 때만 남긴다.

이 네 가지 결함은 읽을 때는 어렴풋이 "어색하다"는 느낌으로만 남지만, 문장의 앞뒤 조각을 따로 떼어 내면 눈으로 금방 가려낼 수 있다.

---

## 21.5 두 줄 뽑기로 스스로 진단하기

내 원고가 어딘가 뻑뻑하게 읽힌다면, 단락 하나를 골라 아래 순서대로 두 줄을 뽑아 본다.

1. 문장마다 첫 명사구만 떼어 내 한 줄로 늘어놓는다. 이 줄이 **topic chain**이다.
2. 문장마다 마지막 명사구만 떼어 내 한 줄로 늘어놓는다. 이 줄이 **stress chain**이다.

뽑아낸 두 줄을 나란히 놓고 보면 단락의 건강 상태가 그대로 드러난다. Topic chain이 앞의 개념을 받아 자연스럽게 이어지는지, stress chain의 끝부분을 따라가며 새 정보가 차곡차곡 쌓이는지 살핀다. 두 줄 가운데 어느 한 곳이라도 뚝 끊기거나 헛돌면, 그 자리가 곧 흐름이 막힌 지점이다.

---

## 21.6 CCC 점검과 함께 쓰기

큰 뼈대와 세밀한 연결은 서로를 대신할 수 없지만, 두 점검이 모두 필요하다. C-C-C 골격을 잘 갖춘 단락이라도 둘째 문장 첫머리가 첫 문장 끝을 받아 주지 못하면 여전히 문장 사이가 삐걱거린다. 거꾸로 C-C-C가 무너진 단락에서 두 줄 뽑기를 해 보면, stress chain의 마지막 낱말이 애초에 결론에 닿지 못한 채 겉돈다.

따라서 점검 순서는 **C-C-C를 먼저, 두 줄 뽑기를 나중**으로 잡는 편이 낫다. 각 자리에 맥락과 내용, 결론이 빠짐없이 들어갔는지 확인한 뒤에야 문장과 문장을 매끄럽게 잇는 작업이 의미를 갖는다. 들어갈 내용 자체가 비어 있는데 문장 연결부터 다듬어 놓으면 빈자리는 결국 빈자리로 남기 때문이다.

이로써 아웃라인 설계([17장](./chapter_17_outline_first.md))와 시간 배분([18장](./chapter_18_time_budget.md))에서 출발해 C-C-C 구조([19장](./chapter_19_ccc.md)), 주장을 담은 소제목과 결론([20장](./chapter_20_subheadings_and_conclusions.md)), 그리고 문단 흐름까지 쓰기의 기본 도구를 모두 갖추었다. 다음 장부터는 이 도구를 실제 논문의 각 섹션에 차례로 적용해 보며, 독자가 가장 먼저 마주하는 제목과 초록부터 차근차근 짚어 나간다.

# 22장 제목과 초록

지금까지 2부에서 아웃라인을 세우고 시간을 배분하며, C-C-C 골격과 문단 흐름으로 글의 뼈대를 다지는 기본 원칙을 살펴보았다. 이제 3부에서는 그 원리를 실제 논문의 각 섹션에 차례로 적용해 본다. 출발점은 독자가 논문을 만나는 가장 앞자리, 곧 제목과 초록이다.

심사위원 한 사람이 맡는 원고 수와 심사 절차는 학회와 학술지마다 다르지만, 대부분의 독자는 [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)의 first pass처럼 제목과 초록, 서론부터 훑어본다. Keshav는 논문을 쓸 때 심사위원과 독자 대다수가 원고를 단 한 번만 훑어본다고 생각하라고 조언한다. 처음 훑어볼 때 요지를 알아차리지 못하면 심사위원은 논문을 떨어뜨리기 쉽고, 5분 안에 핵심을 잡지 못한 독자는 끝내 그 논문을 읽지 않고 덮어 버리기 때문이다. 그래서 그는 섹션 제목을 일관되게 짓고 초록을 간결하면서도 빠짐없이 쓰라고 권한다.

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) 역시 rule 1에서 제목을, rule 5에서 초록을 따로 떼어 다룬다. 두 사람은 rule 9에서 제목과 초록, 그림을 보는 독자가 나머지 본문을 읽는 독자보다 훨씬 많으니 그만큼 시간을 넉넉히 배분하라고 당부했다([18장 §18.1](./chapter_18_time_budget.md)).

---

## 22.1 제목 — 기여를 담은 한 줄

**제목에는 논문의 중심 기여를 담는다.** Mensh와 Kording은 rule 1에서 논문의 초점을 하나의 중심 기여에 맞추고, 바로 그 기여를 제목으로 전하라고 권한다. 한 편에 여러 기여를 한꺼번에 내세우면 각 기여의 설득력이 오히려 흐려지고 독자의 기억에도 덜 남기 때문이다. 이 조언은 [16장 §16.1](./chapter_16_mindset.md)에서 인용한 김기섭 교수의 "한 가지 논문은 단 한 가지 컨셉을 지녀야 합니다"라는 말과도 정확히 맞닿아 있다. 제목은 독자가 가장 먼저 마주하는 문장이자 초록을 읽어 볼지 말지 결정하는 관문인 만큼, 논문에서 가장 비중이 큰 한 줄로 다루어야 한다.

**제목만 보아도 무엇을 새로 밝혔는지 드러나야 한다.** Mensh와 Kording은 같은 자리에서, 연구 결과를 서술한 짧은 제목이 더 많이 인용된다는 Paiva 외(2012)의 연구를 함께 소개한다. 가령 "BEV-based Loop Closure"는 다루는 주제만 알려 줄 뿐이다. 반면 "BEV-based loop closure halves recall failures on KITTI"처럼 동사와 효과, 대상을 함께 적으면 결과를 바로 전하는 제목이 된다(이 예문의 수치는 문형을 보여 주려고 지어낸 값이다). 물론 분야 관행에 따라 명사구 제목을 택하는 경우도 많지만, 그럴 때도 이 논문이 무엇을 새로 보였는지가 제목에 드러나는지 꼭 점검해 본다.

**길이는 학회·학술지 규정과 명료성을 기준으로 잡는다.** 모든 분야에 두루 통하는 12~15단어 규칙 같은 것은 없다. 기여를 알아보는 데 꼭 필요한 말은 남기되, 검색 결과 목록에서 뒷부분이 잘리더라도 핵심 뜻이 살아남도록 중요한 단어를 앞부분에 배치한다.

**핵심 용어를 빠뜨리지 않는다.** 기여와 직결되는 용어를 제목에 심어 두어야 관련 연구자가 논문을 찾을 수 있다. 검색과 색인에 실제로 쓰이는 분야 용어를 고르되, 기여를 설명하는 데 필요한 만큼만 깔끔하게 쓴다.

---

## 22.2 초록 — 그 안에서 완결된 이야기

제목이 독자의 시선을 붙잡았다면, 이제 초록이 본문을 읽지 않고도 논문 전체의 메시지를 건네줄 차례다. 대다수 독자는 초록만 읽고 지나간다. 그래서 rule 5는 초록 한 단락 안에 이야기 전체를 완결 지어야 한다고 권한다([19장 §19.3](./chapter_19_ccc.md)).

**Rule 5에 따르면 잘 짜인 초록은 맥락, 내용, 결론의 세 단계로 흐른다.**

1. **맥락(context)** — 첫 문장에서 연구가 속한 넓은 분야를 제시한 뒤, 이 연구가 답하려는 열린 질문까지 범위를 좁혀 간다. 기존 문헌에 무엇이 빠져 있는지(구체적인 빈틈)와 그 빈틈이 앞의 넓은 맥락과 이어져 왜 중요한지를 분명히 밝힌다.
2. **내용(content)** — "Here we"로 운을 떼며, 앞의 빈틈을 메우기 위해 고안한 새 방법이나 접근법을 먼저 소개하고 핵심 결과를 요약한다.
3. **결론(conclusion)** — 결과를 해석해 맥락 끝에서 던진 질문에 직접 답한다. 이어서 그 결론이 넓은 분야를 어떻게 한 걸음 더 밀고 나가는지 덧붙이기도 한다.

Mensh와 Kording은 이 순서를 지키면 초록에서 가장 흔히 저지르는 실수, 곧 독자가 이해할 준비도 되기 전에 성급히 결과부터 내미는 실수를 피할 수 있다고 강조한다.

**본문을 가리키는 말은 넣지 않는다.** 초록에 "Fig. 3 shows …", "in Sec. 4 we …" 같은 표현이 들어가면 초록만 떼어 읽는 독자는 그 그림이나 절을 확인할 길이 없다. 초록은 본문과 떼어 놓고 따로 읽어도 뜻이 온전히 통해야 한다.

**길이는 투고처의 단어 제한을 따른다.** 150~250단어는 여러 분야에서 자주 볼 수 있는 범위일 뿐 보편적인 규칙은 아니다. 제한된 분량 안에 맥락·내용·결론을 모두 채워야 하므로, 같은 맥락을 두 번 겹쳐 쓰지 않도록 군더더기를 덜어 낸다.

---

## 22.3 언제 쓰는가

제목과 초록은 독자가 가장 먼저 읽는 부분이지만, 저자가 실제로 글을 써 내려가는 순서는 그 반대일 때가 많다. **초록은 논문을 다 쓴 뒤에 쓰는 편이 낫다.** [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 개요(outline)에 들어갈 항목을 적으면서 초록 자리에 아예 "초록은 쓰지 말라. 논문이 완성된 뒤에 쓰면 된다(Do not write an abstract. That can be done when the paper is complete.)"고 못 박았다. 본문의 실험 결과와 해석이 계속 달라지는 동안 초록을 먼저 다듬어 두면, 본문이 바뀔 때마다 초록을 처음부터 다시 고쳐 써야 하기 때문이다.

반면 **제목은 일찍부터 떠올려 두고 자주 돌아보며 고치는 편이 좋다.** Mensh와 Kording은 rule 1에서 제목을 초기에 잡고 계속 다듬는 습관이 글쓰기뿐 아니라 실험 설계와 이론 전개를 가다듬는 데에도 도움을 준다고 적었다. [김기섭 교수의 「연구길의 초입에서」](https://gsk1m.github.io/productivity/2024/05/25/entering-research.html) 12번 항목도 같은 맥락이다. 간단한 가설만 서 있더라도 코드를 한 줄도 짜기 전에 제목부터 그럴듯하게 지어 보면 연구 방향을 점검해 시간을 크게 아낄 수 있다는 것이다. 김기섭 교수는 그 이유로 처음부터 너무 작은 문제를 겨냥한 논문은 아무리 공을 들여도 탑티어에 가기 힘들 수 있다는 점을 꼽는다. 이렇게 연구 내내 나침반으로 삼은 가제목은 본문의 결론이 모두 선 뒤에 비로소 최종 결과를 담아 확정한다(→ [20장 §20.3](./chapter_20_subheadings_and_conclusions.md)).

제목과 초록이 짧다고 해서 막판에 남는 자투리 시간으로 때우려 해서는 안 된다. [18장 §18.2](./chapter_18_time_budget.md)의 비율 가이드처럼 제목과 초록을 다듬는 시간을 일정 안에 미리 따로 떼어 두어야, 완성 단계에서 쫓기듯 문장을 넘기는 일을 막을 수 있다.

---

## 22.4 검색 결과에 보이는 제목과 초록

오늘날 독자들은 학회 프로시딩을 펼치기 전에 arXiv 신착 목록이나 검색 결과, 논문 추천 화면에서 제목과 초록 첫머리를 먼저 만난다. 각 플랫폼이 추천 알고리즘을 공개하는 범위가 제각각이라 특정 낱말 수나 키워드 밀도가 노출에 얼마나 영향을 주는지 일반화하기는 어렵다. 다만 실제 분야 용어와 논문의 기여가 제목과 초록에 선명히 자리 잡고 있으면, 검색 목록을 빠르게 훑는 독자의 눈에도 논문의 가치가 곧바로 들어온다. 이 점만큼은 분명하다.

특히 **초록의 첫 한두 문장은 여러 목록 화면에서 제목 바로 아래에 잘려 보이는 대목**이다. 첫 두 문장에서 연구 분야와 이 논문이 겨냥한 빈틈을 구체적으로 짚어 두어야, 독자가 뒤에 이어질 접근법과 결과를 읽어 볼 이유가 생긴다. 알고리즘의 작동 방식을 어림짐작해 단어를 끼워 맞추기보다, 기여가 또렷이 읽히는 제목과 그 자체로 완결된 초록을 쓰는 편이 결국 더 많은 독자를 불러 모은다.

이제 제목과 초록을 보고 논문을 읽어 보기로 마음먹은 독자를 본문의 첫 관문인 서론으로 안내할 차례다. 다음 장에서는 독자의 관심을 설득으로 바꾸는 서론의 구조를 살펴본다.

# 23장 서론

제목과 초록이 독자의 시선을 붙잡았다면, 이제 서론이 이 논문을 끝까지 읽고 평가할 큰 틀을 세워 주어야 한다. [Keshav (2007)](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)의 first pass에서도 서론은 제목·초록과 더불어 가장 먼저 꼼꼼히 살피는 대목이다([7장 §7.1](./chapter_07_keshav_three_passes.md)). 서론에서 논지가 흐트러지면 독자는 이 연구가 도대체 무슨 문제를 풀려는지, 기존 연구와 무엇이 다른지 감을 잡지 못한 채 뒤 섹션으로 넘어가게 된다.

초보자가 가장 자주 빠지는 함정은 서론을 Related Work의 축약본으로 채우는 일이다. 선행 연구 인용을 연달아 늘어놓다가 맨 끝에 가서야 "we propose …" 한 문장으로 건너뛰면, 심사위원은 "그래서 이 논문이 왜 꼭 필요한가?"라는 물음에 답을 얻지 못한 채 기여 문장을 마주하게 된다.

이 함정을 피하려면 두 가지 설계도를 겹쳐 놓고 서론을 짜는 편이 좋다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767)는 서론에 반드시 들어가야 할 다섯 가지 요소를 짚어 주었고, [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)은 rule 6에서 서론이 연구의 빈틈(gap)을 한 단계씩 좁혀 가는 전개를 보여 주었다.

---

## 23.1 Whitesides가 꼽은 서론의 요소

Whitesides는 논문 개요(outline)에 들어갈 항목을 정리하면서(2.3절 항목 4) 서론에 보통 다음 다섯 요소가 빠짐없이 담겨야 한다고 설명한다. 첫째 항목을 뺀 나머지는 원문에서 저자가 스스로에게 던지는 물음 형식으로 적혀 있다.

1. **Objectives** — 이 연구의 목표.
2. **Justification** — 그 목표가 왜 중요한가.
3. **Background** — 다른 사람들은 무엇을 어떻게 했는가. 우리는 앞서 무엇을 했는가.
4. **Guidance to the reader** — 독자는 논문에서 무엇을 눈여겨봐야 하는가. 흥미로운 대목은 어디인가. 우리는 어떤 전략을 썼는가.
5. **Summary/conclusion** — 독자는 어떤 결론을 기대해야 하는가.

Whitesides는 같은 항목에서 서론의 첫 한두 단락만큼은 개요 단계에서 이미 완전한 문장으로 적어 보고, 특히 첫 문장에 연구 목표와 그 중요성을 함께 담으라고 당부했다([17장 §17.2](./chapter_17_outline_first.md)).

초고를 쓴 뒤 자기 서론을 점검할 때는 본문에서 위 다섯 요소에 해당하는 대목을 한 줄씩 뽑아 나란히 적어 본다. 어느 한 줄이 비어 있거나 억지로 끌어다 붙여야 한다면 서론의 설득 고리에 구멍이 난 자리다. 특히 Guidance to the reader 자리에서는 단순히 뒤 섹션 번호만 읊는 데 그치지 않고, Whitesides가 물은 대로 독자가 눈여겨볼 대목과 연구 전략까지 짚어 주고 있는지 함께 확인한다.

---

## 23.2 빈틈을 좁혀 가는 순서

Whitesides가 서론에 들어갈 재료를 알려 준다면, Mensh와 Kording은 rule 6에서 그 재료를 어떤 순서로 좁혀 가며 배치해야 하는지 보여 준다. 서론은 지금의 지식이나 방법론에 남아 있는 빈틈과 그 빈틈이 왜 중요한지를 또렷이 드러내야 한다. 이를 위해 보통 큰 배경에서 작은 문제로 점차 좁혀 들어가는 단락들을 쌓아 올려 문헌의 빈틈을 선명히 밝힌 뒤, 마지막 단락에서 이 논문이 그 빈틈을 어떻게 메웠는지 요약한다. 두 사람이 예로 든 세포 분화 연구의 흐름은 다음과 같다.

- **Field gap** — 첫 단락에서는 세포 분화를 이해하는 일이 왜 중요한지 밝히고, 분야 전체가 아직 분화의 계기를 규명하지 못했다는 점을 설명한다.
- **Subfield gap** — 둘째 단락에서는 astrocyte라는 특정 세포의 분화 과정에서 구체적으로 무엇이 알려지지 않았는지 좁혀 들어간다.
- **이 논문이 메울 빈틈** — 셋째 단락에서는 어떤 유전자가 astrocyte 분화를 이끌 수 있다는 단서를 제시하며, 아직 이 가설이 검증되지 않았음을 분명히 짚는다.

마지막 단락을 뺀 앞선 단락들은 모두 같은 리듬으로 움직인다. 첫 한두 문장으로 단락의 주제를 알려 준 뒤, 관련 문헌에서 이미 알려진 사실을 정리하고, 마침내 이 논문이 의미를 얻는 "아직 알려지지 않은 것"에 닿는다. 두 사람은 논문의 동기를 설명하는 선을 넘어 서론에 방대한 문헌 검토를 끌어들이지 말라고 못 박는다. 빈틈에 초점을 맞춰 단단히 짠 서론이라면, 경험 많은 독자는 저자가 내세운 빈틈이 과연 중요한지만 따져 보아도 논문의 가치를 단번에 가늠할 수 있기 때문이다.

앞 단락들에서 빈틈을 날카롭게 짚었다면, 마지막 단락에서는 방금 드러낸 빈틈을 메우는 결과를 간추려 준다. 초록과 달리 이미 앞선 단락에서 맥락을 충분히 깔았으므로 같은 배경을 되풀이할 필요가 없으며, 대신 결과는 초록보다 조금 더 구체적으로 적는다. 논문의 최종 결론은 이 자리에서 짧게 내비치거나 아예 뒤로 미루어 둔다.

여기서 가장 조심해야 할 건너뛰기는 subfield gap에서 곧바로 논문의 기여로 넘어가는 일이다. 이 논문이 정확히 어느 빈틈을 메우는지 밝히는 셋째 단계를 생략하면, 독자는 제안된 기여가 앞선 문제 중 어느 대목을 해결하는지 스스로 추측해야 한다.

## 23.3 엄태웅 대표의 서론 순서

지금까지 본 영미권 논문 작성법과 정확히 같은 흐름이 [엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/)에도 한국어로 한눈에 정리되어 있다.

> "먼저 Introduction의 시작은 큰 문제제기부터 시작해 본인의 연구 영역까지 점진적으로 스코프를 좁혀오도록 하고, 그런 과정에서 다른 사람들이 문제를 해결해 온 방식을 간략해 설명해주자. 그런 뒤 이들의 한계점과 본인 연구에 대한 필요성을 역설하고, 마지막으로 본 논문의 기여를 요약해주면 (그리고 앞으로 나올 내용의 outline을 그려주면) Introduction은 끝이 난다."

큰 문제 제기에서 시작해 자기 연구 영역으로 범위를 좁히며 선행 연구의 한계를 짚는 전개는 §23.2의 빈틈 좁히기와 겹치고, 마지막의 기여 요약과 괄호 안의 아웃라인은 각각 Whitesides의 summary/conclusion과 guidance에 해당한다.

엄태웅 대표는 같은 글에서 서론에 들일 공의 비중도 힘주어 말한다. "정확한 수치는 알 수 없지만, 추측컨데 90%의 논문은 Abstract과 Introduction을 읽는 단계에서 그 다음을 읽을 가치가 있는지 없는지가 판단되는 것 같다"고 적으며, 그래서 "Abstract과 Introduction은 논문을 쓰는데 40~50%의 노력을 투자할 가치가 있다고 생각한다"고 조언한다. 여기서 90%는 저자가 스스로 밝혔듯 추측이고 40~50% 역시 "생각한다"로 맺은 경험적 의견이지만, 이 조언은 제목과 초록 같은 앞부분에 시간을 넉넉히 들이라는 Mensh와 Kording의 rule 9([18장 §18.1](./chapter_18_time_budget.md))와 같은 방향을 가리킨다.

무엇보다 그가 남긴 "우리는 어떤 텍스트북의 Introduction이 아닌 내 논문의 Introduction을 쓰고 있다"는 문장은 서론의 분량을 조절할 때 좋은 기준이 된다. 세상의 배경지식을 하나도 빠짐없이 늘어놓을 필요 없이, 내 연구의 빈틈을 이해하는 데 꼭 필요한 만큼만 남기면 된다.

## 23.4 두 서론 작성법 비교하기

Whitesides의 다섯 요소와 rule 6의 전개를 머릿속에서 함께 쓰기 쉽도록 아래 표로 나란히 맞대어 보았다. 두 원전에 원래 실린 대응표가 아니라, 서론을 짜고 점검할 때 쓰기 좋게 작업용으로 맞춘 정리다.

| Whitesides의 요소 | rule 6의 단계 |
|---|---|
| Background | field gap과 subfield gap 단락에서 설명하는 "알려진 것" |
| Justification | 빈틈이 왜 중요한지 밝히는 부분 |
| Objectives | 이 논문이 메울 빈틈과 그것을 메우려는 시도 |
| Summary/conclusion | 마지막 단락의 결과 요약 |
| Guidance to the reader | 대응하는 단계 없음. 독자가 눈여겨볼 대목과 전략 |

실제 작업에서는 rule 6의 순서에 따라 단락들이 점차 좁혀 들어가도록 개요를 짜고, 초고가 나온 다음에는 Whitesides의 다섯 요소로 빠진 재료가 없는지 점검하면 빈틈이 줄어든다. 이제 이 틀이 실제 출판된 논문에서 어떻게 구현되는지 구체적인 사례로 확인해 보자.

---

## 23.5 KISS-ICP의 서론

[KISS-ICP (Vizzo et al., RA-L 2023)](https://arxiv.org/abs/2209.15397)의 서론은 여섯 단락에 걸쳐 문제와 해법을 깔끔하게 좁혀 간다.

첫 단락은 odometry 추정이 미지의 환경에서 자율 주행하는 모바일 로봇의 기본 구성 요소라는 넓은 맥락으로 문을 연다. 이어 현재의 LiDAR odometry가 대개 ICP를 활용하면서 로봇의 움직임이나 환경 구조에 관한 특정 가정에 기대어 정확도를 끌어올린다고 짚는다. 그런 뒤 단락 끝에서는 parameter 조정 없이도 다양한 센서와 환경, 움직임 조건에서 곧바로 쓸 수 있는 3D LiDAR odometry는 저자들이 아는 한 아직 없다고 밝힌다. 바로 이 마지막 문장이 이 논문이 메우려는 빈틈이다.

둘째 단락은 곧바로 해법의 목표를 내건다. 30년 전 Besl과 McKay가 제안한 고전적인 point-to-point ICP로 되돌아가, 단일 설정만으로 여러 환경과 센서 해상도, 움직임을 아우르겠다는 선언이다. 셋째 단락에서는 feature 추출이나 학습, loop closure 없이도 동일한 parameter로 여러 시나리오에서 동작한다는 점을 보태고, 넷째 단락에서 주요 기여를, 다섯째 단락에서 세 가지 핵심 주장을 차례로 제시한다. 마지막 여섯째 단락은 공개 구현의 저장소 주소를 안내하며 마무리한다.

이 서론을 Whitesides의 요소로 뜯어보면 background와 justification은 첫 단락에, objective는 둘째 단락에 분명히 자리한다. 넷째 단락은 독자가 눈여겨봐야 할 핵심 구성 요소와 adaptive threshold를 짚어 주므로 guidance to the reader 구실을 하며, 다섯째 단락의 세 주장은 실험에서 무엇을 입증할지 미리 보여 주는 summary/conclusion에 해당한다. 한편 이 서론에는 이어지는 섹션의 순서를 안내하는 문장이 따로 들어 있지 않다(→ 발췌와 문장별 분석: [`kiss_icp_intro_hook.md`](./excerpts/excerpt_01_kiss_icp_intro_hook.md)).

## 23.6 흔한 실수

서론 초고를 마쳤다면 아래 네 가지 실수가 끼어들지 않았는지 점검해 본다.

**첫 문장을 유행 이야기로 연다.** "Recently, deep learning has revolutionized …"처럼 분야의 유행을 읊는 문장으로 시작하면 첫 단락의 힘이 빠진다. Whitesides는 되도록 첫 문장에서부터 연구 목표와 그 중요성을 밝히라고 권했고, rule 6의 예시 역시 첫 단락에서 분야의 빈틈을 곧장 꺼낸다.

**Background가 교과서처럼 길다.** 선행 연구를 체계적으로 분류하고 비교하는 일은 Related Work 섹션이 맡을 몫이다([24장](./chapter_24_related_work.md)). 서론의 background는 오직 이 논문이 메울 빈틈을 이해하는 데 필요한 만큼만 남겨 둔다.

**독자가 눈여겨볼 대목을 알려 주지 않는다.** "In Sec. 2 we …"처럼 섹션 순서를 짚어 주는 단락은 분야와 학회 관행에 따라 넣기도 하고, KISS-ICP처럼 과감히 빼기도 한다. 이 안내 단락의 유무보다, 독자가 주목할 흥미로운 대목과 연구 전략이 서론 어딘가에 분명히 적혀 있는지가 더 중요하다. Whitesides가 guidance to the reader로 꼽은 핵심 요소가 바로 이 두 가지다.

**목표와 기여를 같은 말로 되풀이한다.** 첫 단락에 적은 목표 문장과 기여 목록의 첫 번째 항목이 표현만 살짝 바꾼 같은 말이라면 둘 중 하나는 군더더기다. 기여 목록에는 목표의 반복이 아니라 실제로 이루어 낸 구체적 결과를 적어 앞선 문장과 겹치지 않게 다듬는다.

이처럼 서론에서는 논문이 메울 빈틈을 한 줄로 또렷이 밝히는 데 집중한다. 그 빈틈 주변에서 다른 연구들이 그동안 무엇을 어떻게 시도해 왔는지 지도를 펼치는 일은 이제 다음 장의 Related Work 섹션으로 넘긴다.

---

# 24장 관련 연구

23장에서 살펴본 서론이 "이 논문이 왜 필요한지"를 설득하는 자리라면, Related Work는 그 문제 주변에서 "누가 무엇을 어떻게 시도했는지"를 정리해 내 연구의 자리를 짚어 주는 섹션이다. 두 섹션의 할 일을 나누지 않으면 어느 한쪽이 맥락 없는 분야 소개만 늘어놓는 글로 흐르기 쉽다.

Related Work를 연도순 인용 목록으로 채우면 선행 연구를 무슨 기준으로 가르고 비교하는지 드러나지 않는다. "Smith et al. 2018 did A. Lee et al. 2019 did B. ..."처럼 연구를 한 편씩 나열만 해 나가면, 섹션 끝까지 읽어도 자기 방법이 기존 연구의 어느 빈틈에 놓이는지 감이 잡히지 않는다. 독자나 심사위원 입장에서도 이 논문의 novelty가 무엇인지, 비교 대상(baseline)을 공정하고 빠짐없이 챙겼는지 가늠하기 어렵다.

[엄태웅 대표의 「영어 못해도 논문 잘 쓰는 법」](https://gradschoolstory.chkwon.net/terry/englishpaperwriting/) 역시 Related Work를 "내 연구결과의 상대적인 위치를 보여주는 곳"으로 정의하며 "논문들에 대한 단순 나열을 피하고 비판적 시각을 견지하도록 하자"고 강조한다. 거절당할 빌미를 줄이려면 우선 나열식 요약을 걷어 내고 핵심 baseline이 빠지지 않게 챙겨야 한다(→ [16장 §16.1](./chapter_16_mindset.md)).

---

## 24.1 분류 기준 세우기

**Related Work의 뼈대는 분류 기준이다.** 아무 기준 없이 논문을 묶기보다, 연구의 차이를 가장 잘 드러내는 축을 먼저 세우고 그 축 위에 선행 연구와 자기 방법의 자리를 정하는 일이 핵심이다.

분야마다 기준은 다르지만, 로보틱스와 컴퓨터 비전 논문에서 자주 활용하는 분류 축은 대개 다음 네 가지 가운데서 뽑는다.

- 입력 modality — LiDAR, RGB, RGB-D, IMU 융합
- 표현 방식 — sparse, dense, neural field
- 학습에 기대는 정도 — geometric, learned, hybrid
- 적용 환경 — 실내, 야외, 동적 환경

**기준이 둘 이상이면 표로 뼈대를 잡는다.** 다루어야 할 논문이 많고 두 기준이 연구 간 차이를 실질적으로 가른다면, 한 기준을 행에 두고 다른 기준을 열에 놓아 분류표를 먼저 그려 본다. 이 표는 글을 쓰기 전에 생각을 가다듬는 도구로도 유용하다. 만약 자기 방법이 표의 빈칸에 놓인다면, 그 칸이 이 논문이 메우려는 빈틈의 후보가 된다. 물론 그 빈칸이 실제로 연구할 가치가 있는 자리인지는 별도의 논증으로 설득해야 한다.

그려 둔 표가 분류 구도를 산문보다 훨씬 선명히 보여 준다면 Related Work 본문에도 표를 싣는다. 반면 기준이 하나뿐이거나 다룰 연구 수가 적다면 표 없이 산문으로 풀어쓰는 편이 깔끔하다. 어느 형식을 택하든, 어떤 기준으로 선행 연구를 나누었고 자기 방법이 그 지형 안에서 어디에 놓이는지는 글에 또렷이 밝혀 두어야 한다.

---

## 24.2 정확하고 정중하게 비판하기

분류 기준을 세워 선행 연구를 배치했다면, 이제 각 연구가 풀지 못한 지점을 짚어 내며 내 연구의 필요성으로 이어 갈 차례다. 이때 비판 방식이 정중하고 구체적이지 못하면 오히려 역효과가 난다.

**비판은 어디까지나 방법의 한계에 한정한다.** 저자의 역량이나 태도를 깎아내리는 표현은 피해야 한다. "Smith et al.'s approach is naive"는 사람을 겨냥한 비난으로 읽히기 쉽지만, "Smith et al.'s approach assumes static environments"라고 적으면 방법론의 가정과 한계만 정확히 짚는다. 엄태웅 대표 역시 남의 논문을 비판할 때는 표현을 조심하라고 당부한다. 선행 연구의 저자가 심사위원으로 들어올 경우 날 선 표현이 반발을 부를 수 있을 뿐 아니라, 지적이 과하거나 부정확하면 "본인 논문 띄우기 위해 부풀려 얘기했네"라는 인상을 주어 원고 전체의 신뢰를 잃기 쉽기 때문이다.

**모호한 추측성 표현을 걷어 낸다.** "may suffer from", "is limited in some scenarios", "could be improved" 같은 흐릿한 말만으로는 한계가 실제로 어디까지인지 알 수 없다. 비판 대상 논문 자체가 보고한 데이터셋과 실험 조건, 평가 지표를 구체적으로 끌어와 쓰고, 수치는 반드시 원 논문이 보고한 값만 인용한다. 엄태웅 대표가 권하듯 "B연구는 A연구를 개선하였다"라고 두루뭉술하게 적기보다 "B연구는 어떠한 측면에서 이러한 아이디어를 사용하여 A연구를 정확도 OO%에서 OO%로 개선하였다"처럼 수치를 들어 대조하면 논지가 훨씬 단단해진다. 아래 두 문장을 비교해 보면 차이가 분명하다.

> ❌ Method X may suffer from drift in long sequences.
>
> ✓ Method X reports $d_1$ drift on sequence A, compared with $d_2$ on the shorter sequences [citation].

✓ 문장의 $d_1$, $d_2$와 시퀀스 이름은 실제 원 논문에서 확인한 값으로 채워 넣는다. 이처럼 조건과 수치, 인용을 한 문장에 묶어 두면 독자도 비판의 근거를 직접 찾아가 검증할 수 있다.

**비판의 강도가 높을수록 근거도 탄탄해야 한다.** 자기 실험에서 실제로 측정한 결과나 선행 연구가 직접 보고한 한계만 근거로 삼아야 한다. 근거 없이 비판의 어조만 높이면, 자기 방법을 돋보이게 하려고 비교를 비튼 것은 아닌지 심사위원이 의심한다.

**결과를 미리 선언하지 않는다.** Related Work에서 성급하게 "we outperform all prior work"라고 써 버리면, 정작 Results 섹션에서 증명해야 할 말을 앞당겨 내뱉는 꼴이 된다. 이는 [19장 §19.5](./chapter_19_ccc.md)에서 짚은 결함, 곧 내용과 결론이 뒤섞이는 문제와 같은 종류다.

---

## 24.3 핵심 baseline을 빠뜨리면

정중하고 정확한 비판만큼이나 중요한 것이 비교 범위다. **자기 방법과 가장 가까이 맞닿아 있는 baseline을 빠뜨리면 novelty 주장은 물론 실험 비교의 공정성까지 함께 흔들린다.** Related Work에서 거론하지 않은 연구는 십중팔구 실험 섹션의 비교표에서도 빠지기 마련이다. [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)은 논문을 깊이 파고드는 third pass까지 마치면 빠진 관련 연구 인용을 집어낼 수 있어야 한다고 적었는데, 꼼꼼한 심사위원은 바로 그 누락을 가장 먼저 찾아낸다. 누락이 심사 판정에 미치는 영향은 논문의 주장과 투고처에 따라 다르지만, 적어도 왜 비교에서 제외했는지는 납득할 수 있게 설명해야 한다.

**얼마나 많은 논문을 인용해야 하는지 정해진 최소 기준은 없다.** 5편이나 3~5편 같은 숫자 규칙에 기대기보다, 내 논문이 내세운 주장마다 다음 네 가지가 빠지지 않았는지 하나씩 확인하는 편이 정확하다. 챙길 항목은 ① 문제 정의를 처음 연 연구, ② 자기 방법과 접근이 가장 가까운 연구, ③ 같은 벤치마크에서 널리 쓰이는 강한 비교 대상, ④ 최근에 발표된 직접 관련 연구다. 최신 논문을 어느 시점까지 반영했는지도 문헌 검색을 마친 날짜를 명시해 분명히 한다. 선행 연구를 체계적으로 모아 정리하는 일은 [9장](./chapter_09_lit_survey_workflow.md)의 문헌 조사 흐름을 따르면 수월하다.

**자기 연구실 논문에 치우친 인용도 경계해야 한다.** 자기 연구실의 선행 연구만 집중적으로 끌어오면 분야 전체의 지형을 비뚤게 비춘다는 인상을 줄 수 있다. 여기서도 모든 분야에 통하는 30% 같은 기계적 안전선은 없다. 자기 연구실 논문을 인용할 때마다 지금 세우는 주장에 꼭 필요한 문헌인지 다시 묻고, 다른 연구 그룹에서 나온 유사한 선행 연구도 똑같은 기준으로 빠짐없이 찾는다.

---

## 24.4 서론과 할 일 나누기

23장에서 다룬 서론이 이 논문이 메우려는 빈틈을 한 줄로 또렷이 밝히는 곳이라면, Related Work는 그 빈틈을 둘러싼 주변 지형을 꼼꼼히 펼치는 곳이다. 두 섹션의 역할은 아래처럼 깔끔하게 나눌 수 있다.

| 항목 | 서론 (23장) | Related Work (24장) |
|---|---|---|
| 길이 | 빈틈을 밝히는 데 필요한 만큼 | 분류와 자리를 설명하는 데 필요한 만큼 |
| 인용 수 | 핵심 주장에 직접 필요한 인용 | 분류 기준의 주요 갈래와 직접 비교 대상을 다루는 인용 |
| 뼈대 | 빈틈을 좁혀 가는 순서 | 분류 기준(필요하면 두 기준의 표) |
| 비판 | 빈틈을 밝히는 한 줄 | 수치를 근거로 자세히 |
| 자기 방법 | 기여 한 문장 | 분류표 안의 한 칸 |

역할이 뒤섞이는 대표적인 사례는 서론에 선행 연구 30편을 한꺼번에 쏟아붓는 원고다. Mensh와 Kording이 서론에 논문의 동기를 넘어서는 폭넓은 문헌 검토를 넣지 말라고 당부한 이유도 여기에 있다([23장 §23.2](./chapter_23_introduction.md)). 분야 관행상 서론 안에 Related Work를 합쳐서 논문을 쓰더라도, 문제 제기와 선행 연구 분류가 한 단락에 뒤엉키지 않도록 단락과 역할을 분명히 가르는 편이 좋다.

서론으로 문제의 빈틈을 밝히고 Related Work로 주변 지형과 자기 방법의 자리까지 짚었다면, 이제 그 빈틈을 실제로 메우는 구체적 설계를 보여 줄 차례다. 다음 장에서는 독자가 방법을 검증하고 재현할 수 있게 Method 섹션을 짜는 법을 다룬다.

---

# 25장 방법(Method) 섹션 쓰기

서론과 Related Work에서 논문의 문제의식과 자리를 분명히 세웠다면, 이제 그 빈틈을 실제로 어떻게 메웠는지, 구체적인 장치를 보여 줄 차례다. [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619)의 rule 9에서 보았듯 Method는 논문에서 가장 적게 읽히는 섹션이다([18장 §18.1](./chapter_18_time_budget.md)). 하지만 역설적으로 Method까지 꼼꼼히 파고드는 소수는 실험을 직접 재현해 보려거나 비교가 공정했는지 따져 묻는 깐깐한 독자와 심사위원이다. 이들에게 꼭 필요한 정의와 설정이 빠져 있으면, 아무리 앞선 섹션이 매끄러워도 논문의 주장(claim)을 받치는 근거가 통째로 흔들린다.

Method를 쓸 때 가장 먼저 피해야 할 습관은 연구 노트처럼 시행착오를 시간순으로 늘어놓는 일이다. "처음에 X를 시도했는데 안 돼서 Y로 갔고, Y에도 한계가 있어서 Z에 이르렀다"와 같은 탐색의 역사는 연구 노트에 남겨 두면 된다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 역시 2.4절에서 이런 시간순 서술을 피하라고 당부한다([17장 §17.2](./chapter_17_outline_first.md)). Method에는 연구자가 거쳐 온 우회로가 아니라, 결과를 재현하는 데 필요한 최종 절차와 그 절차를 선택한 논리적 근거를 체계적인 순서로 적어야 한다.

---

## 25.1 결과 섹션에 맞춰 방법의 순서 짜기

시간순이 아니라면 Method의 순서는 무엇을 기준으로 세워야 할까? 답은 단순하다. **Method의 순서는 Results의 순서를 따른다.** Whitesides는 개요 항목을 정리하면서(2.3절 항목 7) Experimental 섹션의 소제목을 Results 섹션의 순서에 맞춰 적으라고 권하고, Mensh와 Kording 역시 rule 7에서 control과 method는 전체 논리에 필요한 자리에 놓여야 한다고 설명한다. 결국 Results의 그림과 표를 만들어 낸 절차가 그대로 Method의 서브섹션이 되는 셈이다.

실무적으로는 Results의 개요(outline)를 먼저 잡은 뒤, 거기서 거슬러 올라가며 Method의 개요를 짠다. 26장에서 다룰 주요 결과 표, ablation 표, 정성 비교 그림이 각각 Method의 어느 서브섹션에서 설명한 구성 요소에 대응하는지 개요 단계에서 짝을 맞춰 두면 중간에 빠지거나 겉도는 절이 줄어든다.

골격이 잡히면 **Method의 소제목도 구체적으로 적는다.** "Section 3.1 Feature Extraction"처럼 뭉뚱그리기보다 "Section 3.1 Multi-scale BEV feature extraction"처럼 핵심 기법이 드러나게 적는 편이 훨씬 많은 정보를 준다. 물론 Method 소제목에는 [20장](./chapter_20_subheadings_and_conclusions.md)의 주장형 소제목처럼 실험 결과를 먼저 실을 수 없으니, 기법의 핵심과 대상을 정확히 담은 명사구로 정리한다.

## 25.2 기호 정의 표(Notation table) 구성하기

서브섹션마다 수식과 변수가 연달아 등장하는 논문에서는 독자가 앞뒤 페이지를 오가며 기호의 뜻을 다시 찾다가 흐름을 놓치기 쉽다. **기호가 많은 논문이라면 Method 앞부분에 notation table(기호 표)을 두어** 핵심 기호를 한 번에 정리해 두고, 본문에서 처음 등장할 때도 문맥 안에서 뜻을 한 번 더 짚어 준다. 물론 기호가 몇 개 안 되는 논문이라면 굳이 표를 만들지 않고 본문에서 바로 정의하는 편이 깔끔하다.

표를 둘 때는 아래 네 열을 기본 틀로 삼아 학회·학술지 지면과 기호 수에 맞게 간추려 쓴다.

| Symbol | Meaning | Dimension/Unit | First introduced |
|---|---|---|---|
| $\mathbf{T}_k$ | sensor pose at time $k$ | $SE(3)$ | §3.1 |
| $\mathbf{r}_i$ | reprojection residual for measurement $i$ | $\mathbb{R}^2$ | §3.2 |
| $\lambda$ | regularization weight | scalar | §3.3 |

표로 기호를 모아 두면 **한 기호에 한 뜻만 주는 원칙**을 지키기도 훨씬 수월해진다. 로보틱스 논문에서는 $R$ 하나가 회전행렬과 residual, reward를 동시에 가리켜 독자를 혼란에 빠뜨리는 일이 잦다. 표를 먼저 정리해 두면 이런 기호 충돌을 초고 단계에서 바로 걸러 낼 수 있다(→ [30장 R8](./chapter_30_math_and_proofs.md); [31장](./chapter_31_notation_hygiene.md)).

## 25.3 재현 가능한 알고리즘 의사코드 작성하기

수식만으로 파악하기 어려운 **단계의 순서나 분기, 반복 구조가 방법의 핵심이라면 pseudocode(의사코드)를 함께 싣는 편이 좋다.** LaTeX에서는 `algorithm2e` 패키지가 널리 쓰이지만, 투고하려는 학회나 학술지 템플릿이 따로 정한 환경이 있다면 그 규칙을 따른다.

독자가 코드를 옮겨 적듯 따라올 수 있게 의사코드에는 세 가지 요소를 빠뜨리지 않는다.

- **Input** — 알고리즘이 어떤 데이터와 hyperparameter를 받는지 한 줄에 명시한다.
- **Output** — 계산 끝에 무엇을 어떤 형태로 돌려주는지 한 줄로 밝힌다.
- **단계** — 한 줄에 한 동작씩 깔끔하게 적고, 본문 수식을 불러다 쓰는 줄에는 식 번호를 달아 본문과 연결한다.

의사코드를 실었다면 **계산 복잡도**도 빼놓지 말고 짚어 준다. 입력 크기가 커질 때 계산 비용이 어떻게 늘어나는지 이론적으로 분석할 수 있다면 의사코드 바로 뒤나 본문에서 밝히고, 실제 측정한 실행 시간(runtime)은 이와 구분해 따로 보고한다. 특히 방법이 빠르다고 주장하려면 사용한 하드웨어, 구현 환경, 입력 크기, 측정 방식까지 함께 적어야 설득력이 생긴다. 이론적 복잡도를 따질 수 있는데도 막연히 runtime 숫자만 적어 내면 심사위원은 왜 빠른지, 입력이 커져도 그 속도가 유지되는지 짐작할 수밖에 없다.

---

## 25.4 하이퍼파라미터 표로 설정값 모으기

실제 구현과 재현의 성패는 종종 hyperparameter 한두 개에 달려 있다. **재현에 필요한 hyperparameter는 본문 문장 여기저기에 흩뿌리지 말고 한곳에서 바로 찾을 수 있게 모아야 한다.** "we use learning rate 1e-4 …"가 3.1절에 나오고 "batch size 32 …"가 4.2절 구석에 박혀 있으면, 독자는 어떤 조합으로 결과를 얻었는지 맞추느라 원고를 뒤적여야 한다. 설정값이 많다면 표나 공개 config 파일로 일괄 정리하되, 결과에 큰 영향을 주는 핵심 값만큼은 본문에서도 이유와 함께 설명한다.

Hyperparameter 표를 짤 때는 parameter 이름과 값, 의미에 더해 값을 바꾸었을 때 성능이 어떻게 변하는지(sensitivity)까지 함께 적어 두면 훨씬 유익하다. 그 민감도의 구체적 근거는 자연스럽게 26장의 ablation 표로 이어진다. 만약 **dataset마다 다른 값을 적용했다면** dataset을 행에, parameter를 열에 놓은 표로 정리해 어떤 benchmark에서 어떤 값을 기본값으로 썼는지 한눈에 드러낸다.

---

## 25.5 방법 섹션을 26장의 결과 섹션과 맞물리게 쓰기

§25.1에서 세운 Results 중심 골격이 원고 끝까지 살아남으려면, Method의 서브섹션과 Results의 서브섹션이 일대일로 맞물려 있는지 마지막으로 대조해야 한다. 두 섹션이 짝을 이루면 심사위원도 방법의 각 부품이 실제로 제 몫을 했는지 손쉽게 검증할 수 있다. 반대로 두 섹션 사이에서 흔히 나타나는 불일치는 다음 두 가지다.

- **Method에는 있는데 Results에는 없는 구성 요소** — Method §3.2에서 "we use multi-scale fusion"이라고 한참 설명해 놓고, 정작 Results의 어느 그림이나 표에서도 그 효과를 따져 보지 않은 경우다. 대개 해당 요소의 ablation 실험이 빠져 있다([26장 §26.2](./chapter_26_results_discussion.md)).
- **Results에는 있는데 Method에는 없는 구성 요소** — Results §4의 ablation 표에는 "w/o geometric prior" 행이 버젓이 들어가 있는데, 정작 Method 본문에서는 geometric prior의 정의나 수식을 찾을 수 없는 경우다. 설명이나 기호 정의가 누락된 자리다.

개요를 짜는 단계에서부터 Method의 각 서브섹션 옆에 대응할 Results의 표와 그림을 적어 두면, 이런 어긋남을 실험과 집필이 끝나기 전에 일찍 잡아낼 수 있다. 이렇게 Method의 설계도와 기호, 설정값, 검증 대상이 빈틈없이 맞물려 준비되었다면, 이제 다음 장에서 그 설계가 실제 데이터에서 어떤 결과를 내고 무엇을 뜻하는지 Results와 Discussion으로 풀어낼 차례다.

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 7(control과 method는 논리에 필요한 자리에), rule 9(Method를 읽는 사람이 가장 적다). [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 2.3절 항목 7(Experimental 소제목을 Results 순서에 맞추기), 2.4절(시간순으로 쓰지 말고 중요한 결과부터). [robotics-practice 19장 §19.8.5](https://alexjunholee.github.io/robotics-practice/guide.html#198-연구-실전) — LaTeX 도구 예시.

# 26장 결과와 논의

Method에서 실험 절차와 설계 근거를 세웠다면, 이제 Results와 Discussion에서 그 절차가 실제로 어떤 수치를 냈는지 보여 주고 그 의미를 풀어야 한다. Results와 Discussion을 따로 둘지 한 섹션으로 합칠지는 투고할 학회나 학술지 형식에 따라 다르다. 하지만 두 섹션을 합치더라도 한 문단 안에서 결과를 전하는 문장과 그것을 해석하는 문장은 분명히 갈라야 한다. 그래야 독자가 어디까지가 관측된 사실이고 어디부터가 저자의 해석인지 혼동하지 않는다. 결과와 해석을 한데 섞을 때 생기는 혼동은 [19장 §19.5](./chapter_19_ccc.md)에서 짚은 결함, 곧 content와 conclusion이 한 문단에 뒤섞이는 문제와 정확히 맞닿아 있다.

[Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) 역시 rule 7과 rule 8에서 이 둘의 역할을 엄격히 구분한다. rule 7은 주장을 뒷받침하는 그림과 표, 관측을 Results의 논리 순서에 맞춰 배치하는 데 초점을 둔다. 한편 rule 8은 Discussion에서 그 결과로 문헌의 빈틈을 어떻게 메웠는지, 해석의 한계는 무엇인지, 분야에 어떤 뜻을 남기는지를 짚도록 이끈다.

---

## 26.1 결과(Results)의 순서를 방법 섹션과 맞추기

[25장 §25.1](./chapter_25_method.md)에서 Method의 순서를 Results에 맞춰 거슬러 잡았듯, **Results의 서브섹션도 Method의 서브섹션과 하나씩 대응해야** 심사위원이 방법과 검증을 바로 대조할 수 있다.

처음 골격을 짤 때는 아래 네 항목에서 출발해 보되, 모든 논문에 네 가지를 다 넣을 필요는 없으므로 중심 주장을 입증하는 데 꼭 필요한 항목만 골라 쓴다.

1. **주요 결과 비교** — 핵심 비교 표. 자기 방법을 가장 가까운 기존 방법, 공개된 최신 방법과 비교한다.
2. **정성 비교 그림 한두 개** — 궤적 시각화나 실패 사례 비교처럼 수치 비교만으로는 드러나지 않는 양상을 보여 준다.
3. **Ablation** — 구성 요소(component)를 하나씩 빼 보며 각각의 효과를 검증한다.
4. **실패 사례(failure case)** — 자기 방법이 실패하는 조건을 솔직히 보여 주고, 한계를 다루는 논의와 자연스럽게 잇는다.

구성이 잡히면 각 서브섹션의 **소제목은 주장을 담은 완결된 문장으로 쓴다.** rule 7에서 권하는 서술문 소제목은 Results와 가장 궁합이 좋다(→ [20장 §20.1](./chapter_20_subheadings_and_conclusions.md)). 예컨대 "Loop closure recall improves 14% with multi-scale BEV" 같은 형태인데, 여기서 14%는 문장 형식을 보여 주려고 지어낸 수치일 뿐이다. 실제 소제목에는 실험으로 검증한 결과만 넣어야 한다.

---

## 26.2 요소 제거 실험(Ablation) 설계와 보고

논문에서 여러 구성 요소의 기여를 각각 주장한다면 ablation 실험이 뒤따라야 한다. 어떤 요소가 실제로 얼마만큼의 효과를 내는지 보이려면, 전체 시스템에서 구성 요소를 하나씩 떼어 내고 그 결과를 나란히 비교할 수밖에 없다.

Ablation 표를 짤 때는 행에 제거한 구성 요소나 바꾼 설정을 두고 열에 결과 지표를 배치하며, 기준이 되는 전체 방법(full method)은 첫 행이나 마지막 행에 놓아 한눈에 비교되게 만든다. 아래 수치는 표의 배치를 보여 주려고 지어낸 예시다.

| Variant | KITTI ATE (m) ↓ | KITTI RTE (%) ↓ | Runtime (ms) ↓ |
|---|---|---|---|
| **Ours (full)** | **0.42** | **0.61** | **18** |
| w/o geometric prior | 0.58 | 0.84 | 15 |
| w/o multi-scale fusion | 0.51 | 0.73 | 14 |
| w/o loop closure | 0.71 | 1.12 | 12 |

표에서 보듯 **구성 요소는 한 번에 하나씩만 빼야 한다.** 두 요소를 동시에 빼 버리면 성능 하락이 어느 쪽 때문인지 가릴 수 없기 때문이다. 만약 두 요소의 상호작용을 보고 싶다면 각각의 단일 제거 행을 먼저 두고, 둘을 함께 뺀 행(`w/o A + B`)을 별도로 추가하는 것이 정석이다.

---

## 26.3 통계 유의성과 공정한 비교

아무리 좋은 수치가 나와도 비교 조건이 공정하지 않으면 심사위원은 결과를 믿지 않는다. 실험 설계와 보고 단계에서 흔히 놓치는 네 가지 조건을 챙겨야 한다.

**반복 실험과 변동 보고.** 무작위성이 개입하는 실험을 반복할 수 있다면 평균만 적지 말고 결과의 변동 폭도 함께 보고한다. 표본 특성과 추정 대상(estimand)에 맞춰 표준편차(std), 표준오차, 신뢰구간, 분포 그림 가운데 알맞은 것을 고르고, 실행 횟수는 계산 비용과 결과의 분산, 분야의 표준 평가 절차를 함께 따져 정한다. 사용한 seed와 결과를 집계한 방식까지 밝혀 두어야 재현이 가능하다.

**공정한 hyperparameter 탐색.** 자기 방법만 hyperparameter를 샅샅이 찾고 baseline은 별다른 검증 없이 기본값 그대로 두면 비교가 한쪽으로 기울 수밖에 없다. 방법마다 탐색 공간이 다르므로 시도 횟수만 기계적으로 맞추려 들지 말고, 공식 설정을 따랐는지, 어떤 검증 절차와 탐색 공간, 계산 예산을 썼는지 모두 투명하게 보고한다.

**dataset split과 평가 절차 통일.** 공식 benchmark나 직접 비교할 논문이 정해 둔 split과 지표를 먼저 확인하는 것이 기본이다. 부득이하게 다른 split을 쓴다면 그 이유를 설명하고, baseline 역시 같은 절차(evaluation protocol)로 다시 평가했는지 분명히 적어야 한다. 예컨대 KITTI처럼 task마다 공개된 ground truth와 test server 구성이 다른 데이터셋에서는 해당 task의 공식 지침을 그대로 따른다.

**주 지표와 trade-off.** 실험 전에 미리 정한 주 지표(primary metric)로 성능을 판정하되, 논문의 주장에 얽힌 trade-off도 숨기지 말고 함께 살펴본다. 정확도, 실행 시간(runtime), 메모리 사용량, 강건성 가운데 무엇을 얻고 무엇을 내주었는지 짚어 두어야 뒤이은 Discussion에서 설득력 있게 해석할 수 있다.

---

## 26.4 논의(Discussion)에서 결과와 한계 해석하기

앞선 Results가 관측된 숫자와 그림을 늘어놓는 자리라면, Discussion은 그 결과에 맥락과 해석을 입히는 자리다. Mensh와 Kording이 rule 8에서 제시한 Discussion의 전개 순서는 이 흐름을 깔끔하게 잡아 준다.

1. **첫 문단에서는 Results의 핵심 발견을 요약한다.** 결과를 꼼꼼히 읽지 않은 독자도 이 문단에서 요지를 건져 올릴 수 있도록, 수치를 단순히 나열하는 대신 결과가 뜻하는 바를 중심에 둔다.
2. **이어지는 문단에서는 논문의 약점이나 강점을 하나씩 다룬다.** 각 문단에서 약점이나 강점을 관련 문헌과 잇대어 평가하고, 앞으로 어떤 실험을 더하면 약점을 보완할 수 있는지도 짚는다.
3. **마지막 문단에서는 이 논문으로 분야가 어떻게 앞으로 나아가는지 밝힌다.**

해석을 풀어갈 때는 **한계를 피하지 않고 밝히는 태도**가 중요하다. Limitation 섹션을 따로 둘지는 학회·학술지 규정에 따른다. 다만 Discussion 안이나 지정된 별도 절에서는 방법이 전제하는 가정(예: 정적인 환경을 가정함), 실험이 검증한 범위(예: 실내 데이터셋에서만 검증함), 계산 복잡도의 한계(예: 메모리가 $O(N^2)$로 늘어남)를 분명히 짚어야 한다. 분야 특성에 따라 필요한 항목이 있다면 덧붙이되, "한계가 없다"는 식의 서술 대신 지금의 검증이 정확히 어디까지 닿았는지 선을 그어 준다.

아울러 **Results와 Discussion이 분리된 형식이라면 새 결과를 Discussion에 섞지 않는다.** 추가 수치나 새 그림, 뒤늦은 ablation 결과가 Discussion에 끼어들면 독자는 어디까지가 객관적 관측이고 어디부터가 저자의 해석인지 가려내기 어렵다. 새 실험 결과는 반드시 Results 안에 두고, Discussion에서는 이미 제시한 결과의 의미만 다룬다.

---

## 26.5 분야별 벤치마크 후보

실제로 실험을 꾸릴 때는 분야별로 널리 통용되는 benchmark와 지표를 참고할 필요가 있다. 다만 아래 표는 과제·센서·연도에 따라 달라지는 후보를 찾는 출발점일 뿐, 공식 표준 목록이 아니다. 따라서 투고할 때는 benchmark의 공식 평가 페이지와 직접 비교할 논문의 평가 절차를 반드시 다시 확인해야 한다.

| 분야 | 데이터셋 후보 | 지표 후보 |
|---|---|---|
| Visual SLAM | KITTI · TUM RGB-D · EuRoC | ATE · RTE |
| LiDAR SLAM | KITTI · MulRan · Newer College | ATE · RTE · Loop closure recall |
| 3D 재구성 | ScanNet · Tanks and Temples · Replica | F-score · 정확도 · 완전성 |
| Object detection | COCO · LVIS · Open Images | mAP · AP@[0.5:0.95] |

비교 표를 최종 원고에 실을 때는 독자가 숫자를 빠르게 읽을 수 있도록 두 가지를 챙긴다. 첫째, 굵은 글씨와 밑줄 같은 **강조 규약이 무엇을 뜻하는지 캡션이나 각주에 한 줄로 적어야** 심사위원이 그 뜻을 짐작하느라 시간을 쓰지 않는다([28장 §28.2](./chapter_28_tables.md)). 둘째, **자기 방법의 행은 음영이나 별표로 눈에 띄게 표시하고**, 표 아래 각주에 "Ours" 같은 표기가 무엇을 가리키는지 밝혀 둔다. 심사위원이 표를 훑어볼 때 어느 행이 제안한 방법인지 한눈에 들어와야 비교가 빨라진다.

결과 섹션이 수치와 논리의 뼈대를 세웠다면, 이제 그 수치를 독자 눈앞에 놓을 그림과 표의 만듦새를 따져 볼 차례다.

---

**출처.** [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) rule 7(Results의 논리, 서술문 소제목), rule 8(Discussion의 순서와 한계). [robotics-practice 19장 §19.8.2](https://alexjunholee.github.io/robotics-practice/guide.html#198-연구-실전) — ablation, 변인 통제, 반복 실험, 공정한 비교의 요점. benchmark 표와 통계 보고 방식은 task의 공식 평가 절차와 연구 설계에 맞춰 다시 확인한다.

# 27장 그림: 안티패턴과 좋은 패턴

Results에서 어떤 실험과 비교가 필요한지 정했다면, 이제 그 결과를 가장 먼저 눈으로 전달하는 그림을 다듬을 차례다. [Keshav 2007](https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf)은 second pass에서 그래프의 축 라벨과 error bar부터 확인하라고 권하며, 이런 기본적인 실수에서 서둘러 만든 엉성한 연구와 탄탄한 연구가 갈린다고 보았다([7장 §7.2](./chapter_07_keshav_three_passes.md)). [Mensh & Kording 2017](https://doi.org/10.1371/journal.pcbi.1005619) 역시 rule 9에서 그림처럼 독자 눈에 가장 많이 띄는 요소에 공을 들이라고 강조한다([18장 §18.1](./chapter_18_time_budget.md)).

실제 논문에서 되풀이되는 그림 안티패턴(피해야 할 패턴)은 [cxli233 (GitHub)의 Friends Don't Let Friends Make Bad Graphs](https://github.com/cxli233/FriendsDontLetFriends)에 잘 정리되어 있다. 아래에서는 그중 로보틱스와 비전·머신러닝 논문에서 자주 걸리는 사례부터 짚어 본다.

---

## 27.1 차트 안티패턴

**평균 차이를 bar plot으로만 그리는 경우.** 평균을 막대 높이로만 나타내면 그 안의 데이터 분포가 통째로 가려진다. 두 막대의 차이가 표본 수 때문인지, 분산이 커서인지, 실제 평균 차이 때문인지 독자가 가늠할 수 없다. KITTI 시퀀스별 RTE 평균을 방법 A와 B의 막대 두 개로만 세워 둔 그림이 대표적이다. 시퀀스별 개별 값을 점으로 찍는 strip plot을 먼저 깔고, 그 위에 평균 막대나 box plot을 얹어야 분포와 요약값을 함께 전할 수 있다.

**표본이 적은데 violin plot을 쓰는 경우.** violin plot은 커널 밀도 추정(KDE)으로 분포 모양을 그리므로, 표본이 적을수록 bandwidth를 어떻게 잡느냐에 따라 곡선 모양이 요동친다. 모든 분포에 두루 통하는 `n≥10` 같은 절대적인 문턱값은 없다. 다만 KITTI 시퀀스 몇 개처럼 표본이 적어 관측치 전부를 점으로 보여 줄 수 있을 정도라면, 분포를 추정해 그리기보다 strip plot으로 데이터를 있는 그대로 보여 주는 편이 훨씬 정직하다. 부득이하게 violin plot을 써야 한다면 표본 수와 bandwidth 설정을 함께 점검한다.

**한 방향 데이터에 양방향 colormap을 쓰는 경우.** RdBu나 coolwarm 같은 발산형 colormap은 0을 중심으로 양수와 음수가 각각 뚜렷한 의미를 가질 때만 어울린다. 예컨대 0~100% 범위의 recall에 RdBu를 입히면 50%가 마치 중립 기준값처럼 도드라져 보이지만, recall 50%에는 그런 뜻이 없다. 0 이상 한 방향으로만 커지는 데이터에는 viridis나 magma처럼 값의 변화가 시각적으로 고르게 느껴지도록 설계된(perceptually uniform) 순차형 colormap을 써야 한다.

**pie chart를 쓰는 경우.** 비슷한 비율 여러 개를 부채꼴 각도만으로 비교하기란 쉽지 않다. 순위와 미세한 차이를 정확히 드러내야 한다면 길이를 나란히 비교할 수 있는 정렬된 가로 막대 그래프가 훨씬 낫다. 항목 개수로 일률적인 기준을 정하기보다, 라벨이 겹치지 않고 값의 차이가 한눈에 읽히는지로 판단한다.

**rainbow colormap(jet)을 쓰는 경우.** cxli233이 지적하듯 빨강·초록 계열이나 무지개 색 척도는 적록 색각 이상이 있는 독자에게 혼동을 주고, 흑백 인쇄 시 밝기 정보가 뭉개져 데이터가 제대로 남지 않는다. 게다가 밝기가 값에 비례해 고르게 변하지 않아 실제 데이터에는 없는 가짜 경계선이 보이기도 한다. Matplotlib이 2.0 버전부터 기본 colormap을 viridis로 바꾼 것도 이런 이유에서다. 따라서 depth map이나 error map을 그릴 때는 먼저 값이 한 방향으로 커지는지 아니면 기준값을 중심으로 양쪽으로 갈리는지 따져 보고, 그 성격에 맞는 perceptually uniform colormap을 골라야 한다.

---

## 27.2 라벨·축·통계 안티패턴

차트 종류와 색상을 제대로 골랐더라도, 축 정보와 통계 표기가 빠지면 그림은 읽을 수 없는 도형이 된다.

**축 라벨이나 단위가 없는 그림.** 가로축이 시간인지 frame 번호인지, 단위가 초인지 밀리초인지 그림만 보고 바로 알 수 있어야 결과를 해석할 수 있다. 세로축도 마찬가지여서, drift가 m 단위인지 %인지, RTE가 m/s인지 m/frame인지 빠짐없이 밝혀야 한다.

**error bar의 정의가 빠진 그림.** 막대나 점 위에 ± 표시만 덜렁 그려 두면 독자는 그것이 표준편차(std)인지, 표준오차(sem)인지, 95% 신뢰구간인지 알 길이 없다. 캡션에 한 줄로 정확히 밝혀야 독자가 결과의 불확실성을 제대로 가늠할 수 있다.

**유의성 표시의 기준이 없는 그림.** 별표(`*`, `**`, `***`)만 그려 두고 어떤 통계 검정의 어떤 p값 기준인지 캡션에서 빼먹으면, 독자는 통계적 유의성을 확인할 수 없다.

---

## 27.3 캡션만 읽어도 이해되게 쓰기

그림 자체의 시각 요소가 갖춰졌다면, 이제 그 그림에 설명을 붙일 차례다. 좋은 그림은 본문을 뒤적이지 않고 캡션만 읽어도 이해되어야 한다. 논문을 빠르게 훑어보는 심사위원이 그림과 캡션만 보고도 핵심 요점(takeaway)을 건져 올릴 수 있게 하려면, 다음 순서로 캡션을 쓰는 것이 깔끔하다.

1. **요점 한 줄.** "Method A는 KITTI 시퀀스 00-10 전반에서 method B보다 RTE가 14% 낮다" 같은 완결된 서술문으로 시작한다. (14%는 문장 형식을 보여 주려고 지어낸 수치다.)
2. **데이터·축·기호의 뜻.** 점, 색, error bar가 각각 무엇을 나타내는지 빠짐없이 풀이한다.
3. **통계와 표본 수.** 표본 수와 사용한 검정 방법, p값 기준을 명시한다.

이렇게 그림이 전할 메시지와 캡션 구조가 잡히면, 실제로 그림을 제작하는 과정에서도 시행착오를 크게 줄일 수 있다.

---

## 27.4 그림 만드는 과정

그림을 만들 때는 코드를 열기 전에 **종이 위에 여러 안을 거칠게 스케치해 비교하는 단계**부터 시작하는 편이 빠르다. 무엇을 보여 주고 무엇을 대비할지 손으로 먼저 잡아 둔 뒤에야 그에 맞는 코드를 짜기 때문이다. [Whitesides 2004](https://onlinelibrary.wiley.com/doi/10.1002/adma.200400767) 역시 2.2절에서 가장 분명하고 보기 좋은 구성을 찾으려고 그림 하나를 다섯 번에서 열 번까지 다르게 스케치하기도 한다고 적었다. 물론 몇 번을 스케치하고 언제 코드로 옮길지는 그림이 얼마나 복잡한지에 맞춰 유연하게 정할 일이다.

이렇게 **본문 초고를 쓰기 전에 핵심 그림 후보를 미리 스케치해 보면**, 누락된 비교나 빠진 실험이 막상 Results를 쓰다가 뒤늦게 발견되지 않고 초기에 드러난다. Whitesides가 2.2절에서 개요 단계에서부터 그림을 그려 데이터를 정리해 보라고 권유한 것도 바로 이 때문이다.

본격적으로 여러 그림을 제작할 때는 **논문 전체와 패널(panel) 사이에서 색, 기호, 선 모양을 일관되게 유지해야 한다.** 예컨대 method A를 처음부터 끝까지 같은 색과 기호로 고정해 둔다. 그림 3에서 파란 동그라미였던 방법이 그림 7에서 갑자기 빨간 세모로 바뀌면, 심사위원은 매번 범례를 새로 읽느라 흐름을 놓친다.

---

## 27.5 좋은 그림 체크리스트

초안을 마친 그림마다 다음 여섯 항목을 차례로 점검해 보자.

- 축 라벨과 단위를 적었는가
- 캡션에 error bar의 뜻을 적었는가
- 색각 이상이 있는 독자도 구분할 수 있는 팔레트(viridis 계열이나 ColorBrewer의 팔레트)를 썼는가
- 캡션 첫 줄이 요점을 말하는 서술문인가
- panel마다 색과 기호가 같은가
- 선과 도형이 중심인 그림은 되도록 vector 형식(PDF/SVG)으로 저장하고 글꼴을 포함했는가. 사진이나 heatmap은 학회·학술지가 요구하는 해상도와 색 공간을 지켰는가

이 가운데 해당 그림에 적용되는 항목을 하나라도 통과하지 못했다면, 그 그림은 아직 제출할 완성본이 아니라 손봐야 할 초안이다.

분포와 공간 정보를 그림으로 빚어냈다면, 이제 정확한 수치를 나란히 대조하는 표를 어떻게 설계할지 살펴본다.
