## 출처

- George A. Hazelrigg (NSF), ["Honing Your Proposal Writing Skills"](https://aykuterdem.github.io/resources/Honing-Proposal-Skillls.pdf). 공학 연구 제안서의 목표를 쓰는 네 문형을 제시한다. 각 문형의 한국어 이름은 권창현 교수 글 「지금 하고 있는 게 연구인가, 아닌가?」를 따랐다.
- 권창현 교수 (Changhyun Kwon), 「지금 하고 있는 게 연구인가, 아닌가?」, Grad School Story, 2016년 11월 19일. [원문](https://gradschoolstory.chkwon.net/changhyun/지금-하고-있는-게-연구인가-아닌가/). 아인슈타인의 말은 이 글에 실린 영문과 권창현 교수의 우리말 번역을 그대로 옮겼다. 아인슈타인이 어디서 한 말인지는 확인하지 못했다.

# 생각은 책상 밖의 빈 시간에도 자란다

**출처**: 최윤섭 박사 (Yoonsup Choi), 「생각해라. 생각해라. 생각해라.」, Grad School Story, gradschoolstory.chkwon.net/yoonsup/think/ + August Kekulé의 벤젠 고리 발견 일화 (1865년 구조 발표, 1890년 강연 회고)

---

연구자는 흔히 컴퓨터 앞에 앉아 있는 시간과 생각하는 시간을 동일시한다. 하지만 막혀 있던 아이디어가 모니터 앞이 아니라 샤워실이나 버스 안에서 불쑥 풀리는 경험은 낯설지 않다. 최윤섭 박사의 조언과 케큘레의 일화를 보면, 책상 밖의 빈 시간이 어떻게 연구의 가장 밀도 높은 작업장이 되는지 알 수 있다.

## 발췌

최윤섭 박사는 자신이 말하는 '생각'이 막연한 공상이 아님을 분명히 못 박는다.

> 필자가 말하고 싶은 것은 이것저것 되는대로 떠오르는 잡생각을 하는 것이 아니라, 완전히 연구에 집중해서 몰두하는 '생각'이다.

원문에서는 이렇게 생각에 몰입하기 좋은 순간으로 아침 샤워, 산책, 화장실, 버스나 지하철 안, 지하철역 승강장, 재미없는 세미나, 그리고 잠들기 직전을 꼽는다. 반대로 생각을 방해하는 환경으로는 컴퓨터 앞과 스마트폰을 보는 시간을 지목한다(이 노트에서는 그중 샤워, 산책, 버스·지하철, 지하철역, 재미없는 세미나를 중심으로 살펴본다).

독일 화학자 케큘레가 1890년 벤젠 고리 발견 25주년 기념 강연(Benzolfest)에서 남긴 회고 역시 이 몰입의 연장선에 있다(아래는 독일어 원문을 줄여 옮긴 것이다).

> 겐트에 머물 때 그는 낮에도 볕이 들지 않는 작업실에서 교과서를 쓰고 있었지만 글이 잘 나가지 않았다. 의자를 벽난로 쪽으로 돌리고 반쯤 잠이 들자 원자들이 다시 눈앞에서 어른거렸다. 긴 줄들이 뱀처럼 꿈틀거리며 돌다가, 그 가운데 뱀 한 마리가 제 꼬리를 물었다. 그는 번개를 맞은 듯 깨어나 그날 밤 남은 시간을 그 가설의 결과를 따져 보는 데 썼다. 그리고 청중에게 꿈꾸기를 배우자고 하면서도, 깨어 있는 이성으로 검토하기 전에는 꿈을 발표하지 말자고 당부했다.

---

## 분석 — 왜 이 표현이 좋은가

최윤섭 박사는 왜 하필 그런 순간에 생각에 깊이 잠기게 되는지 정확한 심리적 원리는 모르지만, 원리보다 '생각에 잠기게 된다'는 결과 자체가 중요하다고 말한다. 그가 꼽은 시간들을 겹쳐 보면 한 가지 공통점이 드러난다. 대체로 **손이 비어 있고 눈앞의 자극이 단순해지는 시간**이라는 점이다. 실제로 그는 불을 끄고 샤워할 때 효과가 더 좋았는데, 시각 자극을 차단하기 때문인 것 같다고 회고한다. 포항에서 부산까지 두 시간 버스를 탈 때도 스마트폰이나 노트북이 없던 덕분에 제한된 공간에서 오롯이 자기 생각에만 집중할 수 있었다고 적는다. 반면 재미없는 세미나는 결이 조금 다르다. 남의 발표를 한 귀로 흘려들으면서도 오히려 내 연구의 실마리가 불쑥 떠오르는 경우가 많았다는 것이다. 이 공통 구조를 이해하면 꼭 원문의 목록을 따르지 않더라도 출근길 자전거, 점심 산책, 빨래 개기, 설거지처럼 저마다의 일상에서 비슷한 '생각의 틈'을 찾아낼 수 있다.

반대로 원문에서 경계하는 환경은 바로 책상 앞이다. 최윤섭 박사는 컴퓨터 앞에 앉아 있으면 설령 모니터를 꺼 두어도 생각이 좀처럼 자유롭게 뻗어 나가지 못해, 막힐 때면 일부러 책상을 벗어나 산책을 하거나 벤치에서 커피를 마셨다고 한다. 책상 위에서는 화면, 메시지, 이메일, 코드가 끊임없이 주의를 잡아당기기 때문이다. 책상 앞에 오래 앉아 있었다는 사실이 곧 연구에 몰두했다는 증거가 될 수는 없다.

그렇기에 발췌한 정의 문장이 중요해진다. 샤워나 산책은 그저 잡생각이 스쳐 지나가는 시간일 수도 있고, 연구에 몰입하는 시간일 수도 있다. 그 차이를 가르는 것은 손이 빈 시간에 풀려던 문제를 놓지 않고 붙드는 태도다. 원문에서 "출근해서 자리에 앉는 순간 이미 연구 전체에서 내가 어디에 있고 오늘 무엇을 할지 알고 있어야 한다"고 강조한 까닭도 여기에 있다.

케큘레의 일화는 최윤섭 박사가 글의 「무의식을 활용해라」 절에서 전하는 경험과 고스란히 포개진다. 최윤섭 박사는 잠들기 전 데이터 분석법이나 논리 전개, 논문 그림 구성을 골똘히 궁리하다 보면 실제로 꿈에 문제가 나타나 실마리가 선명해지곤 했다고 밝힌다. 케큘레 역시 교과서 원고가 막힌 채 선잠에 들었다가 뱀이 제 꼬리를 무는 고리 구조를 떠올렸다. 그러나 더 눈여겨보아야 할 대목은 그다음이다. 그는 깨어나자마자 밤새 그 가설이 낳는 결과를 냉정하게 따져 보았고, 청중에게도 꿈꾸기를 배우되 **깨어 있는 이성으로 검증하기 전에는 결코 꿈을 발표하지 말라**고 당부했다. 결국 무의식의 번뜩임도 의식적으로 문제를 붙들고 씨름하던 사람에게 찾아오며, 그 착상조차 이성의 검증을 통과해야 비로소 지식이 된다.

이 대목에서 Knuth가 *Mathematical Writing* §6에서 남긴 작업 방식도 함께 떠올려 볼 만하다. Knuth는 초고를 꼭 연필로 쓰는데, 손으로 적는 속도가 생각하는 속도와 거의 맞물려 돌아가기 때문이라고 말한다. 타자는 생각보다 빨라서 중간중간 손을 멈추어야 하고, 그 멈춤이 사고의 흐름을 끊어 놓는다는 것이다. 손을 비운 채 생각을 굴리는 시간과, 펜을 쥐고 그 생각을 종이 위에 붙잡아 두는 시간은 서로 다른 단계다. 길 위에서 싹튼 착상은 책상으로 돌아와 연필을 쥐었을 때 비로소 제 모습을 갖춘다.

## 따라 쓰기 — 자기 분야에 적용

먼저 내 일상에서 손이 비고 눈앞이 단조로워지는 시간을 찾아보자. 샤워, 산책, 빨래, 식사, 출퇴근길처럼 화면을 들여다보지 않아도 되는 시간이면 충분하다. 최윤섭 박사가 꼽은 상황을 억지로 흉내 낼 필요는 없다. 중요한 것은 외부 자극을 줄인 상태에서 실제로 내 생각이 어디서 잘 이어지는지 스스로 실험해 확인하는 일이다.

그 빈 시간을 보내기 직전에는 지금 가장 막혀 있는 질문 한 줄만 머릿속에 챙겨 넣는다. 걸으면서 답을 억지로 짜내려 기를 쓸 필요는 없다. 그저 질문을 품은 채 하던 일을 이어 가고, 자리에 돌아오면 곧장 펜을 집어 들거나 빈 문서를 열어 떠오른 단서를 적는다. 완성된 해법이 아니어도 단어 몇 개, 거친 그림 하나, 걸리는 반례 하나면 충분하다. 기록을 미루면 생각은 금세 휘발된다. 일주일에 한 번쯤은 어떤 시간대에 생각이 잘 이어졌고 어떤 시간은 스마트폰에 빼앗겨 책상 앞과 다를 바 없었는지 돌아보며, 효과가 확인된 시간대를 다음 주 일정에 미리 확보해 두는 편이 좋다.

로보틱스나 컴퓨터 비전(CV) 연구자는 특히 코드 디버깅에 하루를 통째로 쓰기 쉽다. `print` 문 한 줄을 고쳐 결과가 바뀌면 당장 진척이 있는 것처럼 착각하기 쉽지만, 왜 바뀌었는지 모른다면 문제를 이해한 것이 아니다. 일과 중 코드를 끄고 종이 한 장만 들고 생각하는 시간을 의식적으로 떼어 두자. 시뮬레이션 결과를 손으로 도식화하거나 연구실 회의 발표를 준비하는 과정도 훌륭한 정리의 계기가 된다. 남에게 설명하려고 그림을 그리다 보면 정작 내가 무엇을 모르는지가 적나라하게 드러나기 때문이다. 최윤섭 박사 역시 지하철역 승강장에 서 있다가 논문 그림의 핵심 아이디어를 얻곤 했다고 회고한다. 매일이든 주 몇 회든 자기 리듬에 맞는 생각 시간을 실험해 보고, 그 시간이 실제 연구 판단과 실행을 어떻게 바꾸는지 기록해 나가자.

# 좋은 서론은 질문 하나를 독자 앞에 놓는다

**출처**: He, Zhang, Ren, Sun, 2015 — Deep Residual Learning for Image Recognition, arXiv:1512.03385 → CVPR 2016

---

학계 전체가 당연하게 믿고 있던 전제를 정면으로 부정하면 독자의 저항을 부르기 쉽다. ResNet 논문은 기존의 통념을 공격하는 대신, 누구나 수긍할 만한 질문 하나를 독자 앞에 가만히 내려놓음으로써 딥러닝의 패러다임을 바꿀 문제를 자연스럽게 꺼내 보인다.

## 발췌

Abstract 도입부는 문제의 핵심과 저자들의 해법을 군더더기 없는 두 문장으로 제시한다.

> Deeper neural networks are more difficult to train. We present a residual learning framework to ease the training of networks that are substantially deeper than those used previously.

이어지는 Introduction 두 번째 단락의 핵심 두 문장(참고문헌 번호 생략)에서, 저자들은 분야의 암묵적 가정을 하나의 질문으로 끌어올린다.

> Driven by the significance of depth, a question arises: Is learning better networks as easy as stacking more layers? An obstacle to answering this question was the notorious problem of vanishing/exploding gradients, which hamper convergence from the beginning.

세 번째 단락에서는 그 장애물을 걷어 낸 자리에 드러난 뜻밖의 현상, 곧 degradation 문제를 짚는다.

> Unexpectedly, such degradation is not caused by overfitting, and adding more layers to a suitably deep model leads to higher training error, …

---

## 한국어 의역

신경망이 깊어질수록 학습시키기는 더 어려워진다. 우리는 기존에 쓰던 것보다 훨씬 깊은 신경망도 수월하게 학습시킬 수 있는 잔차 학습 프레임워크(residual learning framework)를 제안한다. 망의 깊이가 중요하다는 사실이 밝혀지면서 자연스레 질문 하나가 떠오른다. 더 좋은 신경망을 학습시키는 일이 그저 층을 더 많이 쌓는 것만큼 단순할까? 오랫동안 이 질문에 답하지 못하게 가로막아 온 것은 악명 높은 기울기 소실·폭발(vanishing/exploding gradient) 문제였다. 이 문제는 학습 초반부터 수렴을 방해한다. 그런데 정규화 초기화(normalized initialization)와 중간 정규화 층(intermediate normalization layer) 덕분에 이 장애가 대체로 해소되어 수십 층짜리 망도 수렴하기 시작하자, 이번에는 성능 저하(degradation)라는 전혀 다른 문제가 모습을 드러냈다. 망이 깊어질수록 정확도가 포화 상태에 이르더니 이내 급격히 떨어진다. 뜻밖에도 이러한 저하는 과적합(overfitting) 때문이 아니었다. 이미 적당히 깊은 모델에 층을 더 얹으면 오히려 학습 오차(training error) 자체가 높아졌다.

---

## 분석 — 왜 이 표현이 좋은가

ResNet 서론의 가장 뛰어난 성취는 분야가 의심 없이 받아들이던 전제를 공격적인 반박 대신 차분한 **질문**으로 꺼내 놓았다는 점이다. "Is learning better networks as easy as stacking more layers?"(층을 더 쌓기만 하면 더 나은 망을 얻을 수 있는가?)라는 질문이 던져지자마자, 저자들은 바로 다음 문장에서 그 질문에 오랫동안 답하지 못했던 이유로 vanishing/exploding gradient를 짚는다. 그리고 그 장애물이 normalization 기법으로 대체로 해결된 뒤에야 비로소 진짜 적, 곧 degradation 문제가 모습을 드러냈다고 서술한다. **질문 → 기존의 장애물 → 장애물 해소 뒤에 드러난 새로운 문제**로 이어지는 이 3단 계단은 논리적 비약이 전혀 없어, 독자는 서론 둘째·셋째 단락을 지나며 논문이 해결하려는 난제의 정체를 정확히 붙잡게 된다. 학계의 기본 가정을 정면으로 뒤집기 조심스러울 때일수록, 이처럼 질문의 형태로 독자를 서서히 설득하는 방식이 힘을 발휘한다.

degradation 현상을 기존의 익숙한 원인인 과적합(overfitting)과 단호히 분리해 낸 대목도 결정적이다. 깊은 신경망의 테스트 정확도가 떨어지면 독자나 심사위원은 본능적으로 과적합을 먼저 의심한다. 저자들은 "Unexpectedly, such degradation is not caused by overfitting"이라고 선을 그은 뒤, 층을 더 쌓을수록 **학습 오차(training error)** 까지 함께 올라간다는 결정적 증거를 제시한다(저자들은 이 현상이 앞선 연구 [11, 42]에서도 보고되었고 자신들의 실험으로도 이를 재확인했다고 밝힌다). 학습 오차 자체가 치솟는다는 근거가 있어야만 비로소 과적합과는 본질적으로 다른 문제임을 입증할 수 있기 때문이다. 이렇게 기존 진단명과 현상을 떼어 놓은 덕분에, 저자들은 다음 단락에서 이를 "not all systems are similarly easy to optimize"(모든 시스템이 똑같이 최적화하기 쉬운 것은 아니다)라는 최적화 문제로 재정의하고 residual mapping을 해법으로 내세울 발판을 마련한다. 기존의 틀로 설명되지 않는 현상에 고유한 이름과 증거를 붙여 분리해 내야만, 그것이 온전한 내 연구 문제로 성립한다.

단어의 자리 배치 역시 치밀하다. 문장 맨 앞을 여는 부사 `"Unexpectedly"`는 뒤에 이어질 진술이 독자의 통념을 깰 것임을 미리 알리는 신호등 구실을 한다. 만약 같은 내용을 `"Such degradation, surprisingly, is not caused by overfitting"`처럼 문장 중간 쉼표 사이에 끼워 넣었다면 놀라움의 힘이 반감되었을 것이다. 더욱이 바로 앞 문장 안에 둔 괄호 `"(which might be unsurprising)"`이 정확도 포화 현상 자체는 놀랍지 않을 수 있다고 미리 선을 그어 둔 덕분에, 문두의 `"Unexpectedly"`가 정확히 무엇을 겨냥하는지 한층 또렷하게 도드라진다.

초록의 설계 역시 교과서적이다. 문제는 `"Deeper neural networks are more difficult to train"` 단 한 문장으로 깔끔하게 짚고, 곧장 기여의 구체적 수치로 무게중심을 옮긴다. `152 layers`, `"8× deeper than VGG nets"`, ImageNet test set 앙상블 오류 `3.57%`, ILSVRC 2015 분류 1위, CIFAR-10에서의 100층·1000층 분석이 촘촘히 뒤따른다. `"substantially deeper"`라는 추상적 형용사를 던진 뒤 빈말로 남기지 않고 곧바로 숫자로 증명해 내는 구조다. 또한 둘째 문장에서 `"We present a residual learning framework to ease the training"`으로 큰 틀을 밝힌 뒤, 이어지는 문장들에서 `"We explicitly reformulate the layers as learning residual functions"`로 구체적 접근법을 못 박고 `"We provide comprehensive empirical evidence"`로 실험적 입증을 예고하며 호흡을 빈틈없이 이어 간다.

---

## 따라 쓰기 — 자기 분야에 적용

기존 연구가 놓친 새로운 병목을 문제로 제기하고 싶다면 ResNet 서론의 문장 골격을 빌려 보자.

> "Driven by [분야의 기본 가정], a question arises: [그 가정이 정말 성립하는가]? An obstacle to answering this question was [기존에 알려진 장애]. [그 장애가 풀린 뒤], [기존 진단으로 설명되지 않는 현상] has been exposed. Unexpectedly, [그 현상은 기존 원인 때문이 아니다], [결정적 근거]."

만약 포착한 현상에 아직 통용되는 이름이 없다면 간결한 이름을 붙이고, 왜 기존의 원인으로는 설명되지 않는지 대조 근거를 반드시 나란히 대야 한다.

문장의 강조 효과를 살리고 싶을 때는 `"Unexpectedly"` 같은 태도 부사를 문장 첫머리에 세워 독자의 시선을 새로운 현상에 집중시키는 기법이 효과적이다. 다만 한 단락에 두 번 이상 쓰면 정작 무엇이 진짜 뜻밖의 발견인지 흐려지므로, 가장 결정적인 문장 딱 한 곳에만 아껴 써야 한다.

마지막으로 초록에서는 문제를 짤막하게 던지고 기여는 반드시 구체적인 수치로 받쳐야 한다. ResNet이 층수, 기준 모델 대비 배수, 오류율, 대회 순위로 답했고 ORB-SLAM이 시스템 기능과 27개 평가 sequence로 답했듯, 정해진 숫자 개수에 얽매일 필요는 없다. 다만 `"substantially deeper"` 같은 수식어를 썼다면 `"152 layers"`처럼 그 말을 증명할 수치가 뒤따르는지 확인해야 한다. 수치가 빠진 형용사는 근거 없는 자화자찬으로 읽히기 쉽다. 좋은 서론은 독자에게 익숙한 질문에서 출발해, 누구나 납득할 수밖에 없는 증거로 새로운 문제의 문을 연다.

# 그림 1은 초록의 핵심 표현을 한눈에 보여 준다

**출처**: Chen, Vizzo, Läbe, Behley, Stachniss, 2021 — Range Image-based LiDAR Localization for Autonomous Vehicles, IEEE International Conference on Robotics and Automation (ICRA) 2021

---

논문을 처음 훑는 독자와 심사위원은 대개 초록에서 곧장 그림 1로 건너뛴다. 그럼에도 그림 1을 단순히 첫 페이지를 채우는 장식용 개념도로 소모하는 경우가 적지 않다. Chen 등은 이 논문에서 그림 1을 초록의 핵심 표현과 정확히 짝지어, 글로 읽은 아이디어를 눈으로 곧바로 검증하게 한다.

## 발췌

초록 마지막 문장은 제안 방법이 서로 다른 환경에서도 온라인으로 정확히 동작함을 요약한다.

> The experimental results show that our method can reliably and accurately localize a mobile system in different environments and operate online at the LiDAR sensor frame rate to track the vehicle pose.

원문 Fig. 1의 캡션 첫 문장은 그림이 보여 줄 핵심 대상을 군더더기 없이 밝힌다.

> Visualization of range images and triangular mesh map.

```
[ 그림 1의 네 패널을 글로 정리한 배치 ]

  왼쪽 위: Mesh map              오른쪽 위: Current scan
  왼쪽 아래: Synthetic range image  오른쪽 아래: Current range image
```

원문 캡션에 따르면 왼쪽 열은 지도로 활용되는 삼각형 mesh와 그 mesh에서 렌더링한 합성 range image(`synthetic range image`)이고, 오른쪽 열은 같은 위치에서 취득한 실제 LiDAR point cloud와 그 scan에서 생성한 현재 range image(`current range image`)다. 이때 mesh 지도에서 붉은색 영역은 지면, 푸른색 영역은 지면이 아닌 구조물을 뜻한다. 흥미롭게도 이 그림은 시스템의 처리 흐름도가 아니라, 서로 이질적인 지도와 현재 관측을 **동일한 표현(range image)** 으로 나란히 대조해 보여 준다. 전체 파이프라인의 흐름은 뒤이어 나오는 Fig. 2(Overview of our approach)가 따로 맡는다. 서론의 기여 설명에 따르면 두 range image의 차이로 관측 모델을 구성하고, 이를 Monte Carlo localization에 결합해 입자의 importance weight를 갱신하며 차량의 자세 $(x,y,\theta)$를 추정한다. 원문에서는 LiDAR 프레임 속도의 온라인 동작이 수렴 이후(after convergence)의 성능이라는 점도 함께 명시한다.

---

## 분석 — 왜 이 그림 1이 좋은가

초록에서는 지도와 현재 관측을 모두 range image로 변환해 비교한다는 핵심 아이디어를 말로 설명한다. 이 그림 1의 가장 큰 강점은 그 아이디어를 네 개의 패널 배치만으로 직관적으로 납득시킨다는 점이다. mesh 지도와 3차원 LiDAR point cloud라는 전혀 다른 형태의 두 데이터가 아래쪽 패널에서 똑같은 2차원 range image로 나란히 정돈되는 모습이 한눈에 들어온다. 덕분에 독자는 초록의 문장을 읽은 직후 그림 1을 보며 방금 읽은 개념이 실제로 어떤 모습인지 즉시 확인할 수 있다. 다만 위치 추정의 정밀도나 처리 속도까지 이 그림으로 증명할 수는 없으므로 그 몫은 실험 절에 넘긴다. 그렇더라도 적어도 "초록의 핵심 개념과 그림 1이 정확히 짝을 이루는가"라는 기준으로 보면 이 그림은 훌륭한 본보기가 된다.

물론 같은 Stachniss 연구진의 다른 논문들을 살펴보면 그림 1의 형식은 문제 성격에 따라 얼마든지 달라진다. 여기서 우리가 가져와야 할 원리는 특정 레이아웃이 아니라, **초록의 핵심 명사와 그림 속 두 입력 및 공통 표현이 빈틈없이 맞물린다**는 구조적 일관성이다.

Whitesides는 §2.3의 outline 항목 4(Introduction)에서 서론의 첫 문장이 연구 목적과 그 중요성을 간결히 담아야 이상적이라고 조언했는데, 이 논문에서는 그 원칙을 그림 설계까지 확장한 셈이다. `range image`라는 핵심 표현이 네 군데를 관통하며 반복된다. **제목**(*Range Image-based*), **초록**(range image 기반 관측 모델), **그림 1**(나란히 놓인 두 range image), **기여 설명**(두 range image의 차이로 만든 관측 모델)이 그 네 곳이다. 핵심어가 텍스트와 그림을 일관되게 꿰고 있으니, 심사위원으로서는 초록과 그림 1만 훑어도 논문의 골자를 놓칠 수 없다.

그림 1과 그림 2의 깔끔한 역할 분담도 눈여겨볼 만하다. 그림 1이 "지도와 현재 관측을 어떻게 같은 표현으로 바꾸는가"라는 핵심 아이디어에 집중한 반면, 입자별 렌더링·관측 모델·자세 사후분포로 이어지는 처리 흐름은 그림 2가 전담한다. 핵심 표현을 보여 주는 그림과 시스템 아키텍처 다이어그램을 분리하면 두 그림이 각기 다른 질문에 명쾌하게 답할 수 있다. 아키텍처의 박스 개수에 정해진 규칙은 없으나, 전체 흐름이 한눈에 읽히는지, 세부 모듈에 가려 주된 입력과 출력이 묻히지 않는지를 기준으로 그림을 나눌지 합칠지 결정하면 된다.

네 문장으로 이루어진 캡션 역시 제 몫을 다한다. 각 패널이 가리키는 대상, 지도 색상의 의미, 그리고 같은 위치에서 얻은 두 range image의 대응 관계를 빠짐없이 짚어 준다. 약어와 색상 코드, 화살표와 패널 구조를 친절히 풀어쓰려면 캡션이 자연히 길어질 수 있지만, 본문을 뒤적이지 않고 그림만으로도 내용을 해석할 수 있는지를 기준으로 삼아 꼭 필요한 정보를 빠뜨리지 않는 것이 중요하다.

---

## 따라 쓰기 — 자기 분야에 적용

논문을 설계할 때부터 **초록의 핵심 문장과 그림 1을 함께 맞춰 보는 과정**을 작업 루틴에 넣어 보자. 먼저 초록에서 핵심 표현이나 작동 원리를 집약한 문장을 고른 뒤, 그 안의 핵심 명사와 동사를 그림 1의 패널·박스·화살표·라벨과 연결해 일대일로 대응하는지 확인해 본다. 만약 초록에는 있는데 그림 1에 안 보이는 요소가 있다면, 그것이 그림 2(상세 구조)로 넘길 세부 구현인지, 실험 절에서 입증할 성능 주장인지, 아니면 덜어 내야 할 과장된 수식어인지 가려낸다. 반대로 그림 1에만 덩그러니 놓인 요소가 있다면 초록에 반드시 들어가야 할 핵심인지, 시각적 이해를 돕는 보조 장치인지 판단해 초록과 그림을 동시에 고쳐 나간다.

시스템 그림을 그릴 때는 처음부터 모든 모듈을 욱여넣지 말고, 초록의 중심 주장을 설명하는 최소한의 흐름만 먼저 배치하는 것이 좋다. 세부 블록이 핵심 입출력을 가리기 시작하면 과감히 overview 그림과 상세 시스템 그림으로 분리한다. 이때 박스 개수를 억지로 맞추려고 필수 조건을 생략하거나, 반대로 그림 2를 채우자고 불필요한 세부를 덧붙여서는 안 된다.

캡션을 쓸 때는 첫 문장에서 그림이 보여 주는 핵심 대상을 선언하고(흐름도라면 `입력 → 핵심 표현 → 출력`의 뼈대를 활용할 수 있다), 이어지는 문장들에서 그림 해석에 필수적인 기호·색상·패널 구성을 설명한다. 알고리즘의 세세한 수식이나 hyperparameter, 구체적 실험 수치는 그림을 이해하는 데 직접 필요할 때만 남긴다. 마지막으로 제목·초록·그림 1·기여 목록이라는 네 관문 모두에 이 논문의 `range image`처럼 핵심 명사구나 시스템 이름이 똑같은 표현으로 살아 있는지 확인하자. 글과 그림이 같은 언어로 말할 때 논문의 설득력은 배가된다.

# 박사는 지식의 경계를 조금 미는 일이다

**출처**: [Matt Might](https://matt.might.net/), 2010 — [The Illustrated Guide to a Ph.D.](https://matt.might.net/articles/phd-school-in-pictures/). CC BY-NC 4.0.

---

박사 과정이 무엇인지 설명해 달라는 질문을 받으면, 대답이 대개 추상적인 수사나 막연한 고생담으로 흐르기 쉽다. 컴퓨터과학자 Matt Might는 매년 신입 박사과정생들에게 말 대신 간단한 원 그림 열두 장을 건네며, 박사 학위가 인류의 지식 지도 위에서 정확히 어느 자리에 놓이는지 단숨에 납득시킨다.

## 발췌

Might는 말로 풀면 길어질 박사 학위의 의미를 그림 열두 장에 담은 짧은 문장들로 이어 가며 보여 준다.

> Imagine a circle that contains all of human knowledge:
> By the time you finish elementary school, you know a little:
> By the time you finish high school, you know a bit more:
> With a bachelor's degree, you gain a specialty:
> A master's degree deepens that specialty:
> Reading research papers takes you to the edge of human knowledge:
> Once you're at the boundary, you focus:
> You push at the boundary for a few years:
> Until one day, the boundary gives way:
> And, that dent you've made is called a Ph.D.:
> Of course, the world looks different to you now:
> So, don't forget the bigger picture:
>
> Keep pushing.

이 비유에서 인류의 지식 전체는 커다란 원 하나이고, 박사 학위는 그 원의 둘레 바깥으로 손톱만큼 밀어낸 작은 돌출부(`dent`)에 해당한다.

---

## 분석 — 왜 이 비유가 좋은가

이 그림의 미덕은 박사 학위의 실체를 거창한 신화에서 끌어내려 눈앞에 그려 볼 수 있는 크기로 보여 준다는 데 있다. 박사를 '모든 것을 꿰뚫는 박식한 사람'이나 '분야 전체의 최고 권위자'로 막연히 상상하던 학생이 이 그림 열두 장을 보면, 그 거대한 환상이 지식의 경계에 낸 아주 작은 `dent` 하나로 바뀐다. 최윤섭 박사 역시 [「박사 학위라는 것의 의미」](https://gradschoolstory.chkwon.net/yoonsup/what-phd-means/)에서 같은 결의 고백을 남겼다. 그에게 박사 학위란 특정 주제의 지식을 남보다 많이 쌓았다거나 최고 전문가가 되었다는 증표가 아니라, 앞으로도 평생 인류 지식의 경계를 스스로 조금씩 넓혀 갈 준비가 되었다는 뜻이었다.

그림이 따라가는 배움의 궤적도 정확하다. 학부에서 전공이라는 방향을 얻고 석사에서 그 방향을 깊게 파고든 뒤, 연구 논문을 읽기 시작하면서 비로소 인류 지식의 가장자리에 발을 딛는다. 그 경계에 닿고 나면 더 넓히는 대신 한 점에 초점을 모으고, 몇 해 동안 그 한 지점을 묵묵히 밀어붙인다. 학부와 석사가 지식을 넓게 익히는 시기라면, 박사 과정은 극도로 좁은 한 점을 오래 파고드는 시간이다. 따라서 진학을 고민하는 단계라면, 수년간 붙들고 씨름할 만한 구체적인 질문이 내게 있는지 짧은 연구 경험으로 미리 가늠해 볼 필요가 있다.

그림의 분량 배분 역시 시사하는 바가 크다. 앞선 여섯 장은 초등학교부터 논문 읽기에 이르는 긴 준비 과정을 보여 준다. 반면 이어지는 그림 가운데 세 장은 경계의 한 점에 오롯이 집중해 "a few years" 동안 밀어붙이는 모습, 그리고 마침내 경계가 조금 물러나는 순간을 그린다(원문은 박사 과정의 나이나 구체적인 연수를 못 박지 않는다). 즉 Might는 박사를 단순히 공부의 연장으로 보지 않고, 경계 위의 한 점을 집요하게 밀어내는 시간으로 정의한다. 「대학원노트」 1장 역시 같은 문제의식을 우리의 일상어로 차분히 풀어낸다.

끝으로 열한 번째와 열두 번째 그림은 반드시 한 쌍으로 함께 읽어야 균형이 잡힌다. 열한 번째 그림은 경계를 밀어낸 뒤 "이제 세상이 달라 보일 것"이라며 그 작은 돌파가 주는 안목의 변화를 긍정하는 반면, 열두 번째 그림은 시야를 다시 원 전체로 넓혀 "더 큰 그림을 잊지 말라"고 당부한다. 커다란 원 전체에 비하면 내가 만든 `dent`는 실로 보잘것없이 작기 때문이다. 만약 앞의 그림만 붙들고 있으면 자기 성취의 비중을 과대평가하기 쉽고, 반대로 뒤의 그림만 바라보면 몇 해를 바친 노력을 너무 하찮게 여기기 쉽다. 학위를 마친 뒤 세상에 나가 자신의 좌표를 다시 잡을 때, 이 두 장의 시선은 오만과 자괴감 사이에서 균형을 잡아 주는 좋은 나침반이 된다.

## 따라 쓰기 — 박사 결정과 진로에 적용하는 법

그림 열두 장에 담긴 이 비유는 인생의 갈림길마다 서로 다른 나침반으로 활용할 수 있다. 먼저 **박사 진학을 고민할 때**는 처음 여섯 장 위에 자신의 학사·석사 경로를 겹쳐 보자. 내 전공이 어느 방향을 가리키고 있는지, 그 끝자락에서 몇 해 동안 밀어붙여 볼 만한 한 점을 구체적으로 적어 낼 수 있는지 따져 보면 된다. 그 한 점이 또렷이 보인다면 진학을 결정할 든든한 단서를 얻은 셈이고, 방향만 막연하고 점이 비어 있다면 진학에 앞서 한 학기쯤 연구 경험을 쌓으며 그 점을 찾는 시간부터 갖는 편이 안전하다.

이미 **박사 과정 중에 있다면** 경계를 미는 그림 세 장을 매년 우선순위를 가르는 기준으로 삼을 수 있다. 학위 기간 전체를 `"You push at the boundary for a few years"` 한 장으로 압축해 보면 남는 문장은 **"같은 한 점을 민다"** 단 하나다. 해마다 연구 계획을 점검할 때 이 문장에 비추어, 작년에 밀던 그 한 지점에서 경계가 조금이라도 더 나아갔는지 아니면 그저 새로운 방향만 여러 갈래 벌려 놓았는지 냉정히 확인해 보자.

마지막 두 장은 **졸업 직후 진로를 다질 때** 곁에 두기 좋다. 호칭과 소속이 바뀌고 연구자로서의 시선이 흔들릴 때마다 두 장을 나란히 펼쳐 보자. 내가 이룬 성취가 대단해 보여 마음이 들뜰 때는 거대한 원 전체를 비추는 열두 번째 그림을 떠올려 겸손을 되찾고, 반대로 남들의 연구에 비해 내 작업이 너무 초라하게 느껴질 때는 이제 세상이 달라 보인다고 말해 주는 열한 번째 그림으로 스스로를 다독이면 된다. 나아가 연구 발표를 하거나 에세이를 쓸 때도 이 원을 내 연구 분야의 언어로 직접 그려 볼 수 있다. 내 전공이 뻗어 나간 방향, 경계에 닿은 바로 그 지점, 그리고 내가 밀어낸 작은 `dent`에 내 연구 주제의 이름을 붙여 보는 순간, 막연하던 연구의 의미가 한눈에 들어오는 지도로 바뀐다.

  marked.setOptions({
    highlight: function(code, lang) {

      try { return hljs.highlightAuto(code).value; } catch(e) {}
      return code;

    breaks: false,
    gfm: true
  });
  marked.use({ renderer: { del: function(token) { return '~' + (token.text || token) + '~'; } } });

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  }

  function protectMath(src) {
    var placeholders = [];
    var idx = 0;
    var codeBlocks = [];
    src = src.replace(new RegExp('\\x60\\x60\\x60[\\s\\S]*?\\x60\\x60\\x60', 'g'), function(m) {
      codeBlocks.push(m);
      return '%%CODEBLOCK' + (codeBlocks.length - 1) + '%%';
    });
    var inlineCodes = [];
    src = src.replace(new RegExp('\\x60[^\\x60\\n]+\\x60', 'g'), function(m) {
      inlineCodes.push(m);
      return '%%INLINECODE' + (inlineCodes.length - 1) + '%%';
    });
    src = src.replace(/\$\$([\s\S]*?)\$\$/g, function(m, math) {
      placeholders.push({ display: true, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/\$([^\s$](?:[^$]*[^\s$])?)\$/g, function(m, math) {
      placeholders.push({ display: false, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/%%CODEBLOCK(\d+)%%/g, function(m, i) { return codeBlocks[parseInt(i, 10)]; });
    src = src.replace(/%%INLINECODE(\d+)%%/g, function(m, i) { return inlineCodes[parseInt(i, 10)]; });
    return { src: src, placeholders: placeholders };
  }

  function restoreAndRenderMath(html, placeholders) {
    return html.replace(/%%MATH(\d+)%%/g, function(m, i) {
      var p = placeholders[parseInt(i, 10)];
      try {
        return katex.renderToString(p.math, { displayMode: p.display, throwOnError: false, trust: true });
      } catch(e) {
        return p.display ? '$$' + p.math + '$$' : '$' + p.math + '$';
      }
    });
  }

  var state = { observer: null, scrollHandler: null };
  var contentEl = document.getElementById('content');
  var loadingEl = document.getElementById('loading');
  var tocContainer = document.getElementById('toc-container');

  function applyChrome() {
    document.documentElement.lang = 'ko';
    document.title = DOC_TITLE;
    document.getElementById('topbar-title').textContent = TOPBAR_TITLE;
    document.getElementById('search-input').placeholder = SEARCH_PLACEHOLDER;
    document.getElementById('toc-no-results').textContent = '검색 결과 없음';
    document.getElementById('loading-text').textContent = '가이드 렌더링 중...';
    document.querySelectorAll('#lang-toggle a').forEach(function(a) { a.classList.add('active'); });
    try { localStorage.setItem(STORAGE_KEY, 'ko'); } catch(e) {}
  }

  function parseHeading(text) {
    var ch = text.trim().match(/^(\d+)장\s+(.+)$/) || text.trim().match(/^Ch\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ch) return { kind: 'chapter', num: parseInt(ch[1], 10), title: ch[2].trim(), label: parseInt(ch[1], 10) + '장' };
    var ex = text.trim().match(/^E\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ex) return { kind: 'excerpt', num: parseInt(ex[1], 10), title: ex[2].trim(), label: 'E.' + parseInt(ex[1], 10) };
    return null;
  }

  function parseGroupLabel(label) {
    var parts = label.split('·');
    if (parts.length < 2) return { kicker: '', title: label.trim() };
    return { kicker: parts[0].trim(), title: parts.slice(1).join('·').trim() };
  }

  function findEntryHeading(item) {
    var h1s = contentEl.querySelectorAll('h1');
    for (var i = 0; i < h1s.length; i++) {
      var parsed = parseHeading(h1s[i].textContent);
      if (parsed && parsed.kind === item.kind && parsed.num === item.num) return h1s[i];
    }
    return null;
  }

  function annotateEntryHeadings() {
    contentEl.querySelectorAll('h1').forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      h1.classList.add(parsed.kind === 'excerpt' ? 'excerpt-heading' : 'chapter-heading');
    });
  }

  function buildPartIntros() {
    annotateEntryHeadings();
    CHAPTER_GROUPS.forEach(function(group, index) {
      var first = null;
      for (var i = 0; i < group.items.length; i++) {
        first = findEntryHeading(group.items[i]);
        if (first) break;
      }
      if (!first) return;

      var meta = parseGroupLabel(group.label);
      var partId = 'part-' + index + '-' + slugify(meta.title);
      if (document.getElementById(partId)) return;

      var section = document.createElement('section');
      section.className = 'part-intro';

      var kicker = document.createElement('div');
      kicker.className = 'part-kicker';
      kicker.textContent = meta.kicker || 'Part';
      section.appendChild(kicker);

      var title = document.createElement('h1');
      title.className = 'part-title';
      title.id = partId;
      title.textContent = meta.title;
      section.appendChild(title);

      if (group.intro) {
        var intro = document.createElement('p');
        intro.textContent = group.intro;
        section.appendChild(intro);
      }

      first.parentNode.insertBefore(section, first);
    });
  }

  function render() {
    applyChrome();
    contentEl.style.display = 'none';
    loadingEl.style.display = 'flex';

    requestAnimationFrame(function() {

      contentEl.innerHTML = html;
      contentEl.querySelectorAll('a[href]').forEach(function(link) {
        var url = new URL(link.getAttribute('href'), window.location.href);
        if ((url.protocol === 'http:' || url.protocol === 'https:') && url.origin !== window.location.origin) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      });

      if (window.mermaid) {
        var mermaidBlocks = contentEl.querySelectorAll('pre > code.language-mermaid');

          container.className = 'mermaid';
          container.id = 'mermaid-ko-' + i;
          container.textContent = code.textContent;
          pre.replaceWith(container);
        });
        try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}
      }

      tocContainer.innerHTML = '';
      buildPartIntros();
      buildOverview();
      buildTOC();
      contentEl.style.display = 'block';
      loadingEl.style.display = 'none';
      setupScrollTracking();

      if (window.location.hash) {
        var initId = window.location.hash.slice(1);

  function buildOverview() {
    var h1s = contentEl.querySelectorAll('h1');
    var entries = {};

    h1s.forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      var sections = [];
      var node = h1.nextElementSibling;
      while (node && node.tagName !== 'H1') {
        if (node.tagName === 'H2') {
          if (!node.id) node.id = slugify(node.textContent);
          sections.push({ text: node.textContent.trim(), id: node.id });
        }
        node = node.nextElementSibling;
      }
      entries[parsed.kind + '-' + parsed.num] = {
        kind: parsed.kind,
        num: parsed.num,
        label: parsed.label,
        title: parsed.title,
        id: h1.id,
        sections: sections
      };
    });

    if (Object.keys(entries).length === 0) return;

    var overview = document.createElement('section');
    overview.className = 'guide-overview';
    var header = document.createElement('div');
    header.className = 'overview-header';
    var oTitle = document.createElement('h1');
    oTitle.className = 'overview-title';
    oTitle.textContent = OVERVIEW_TITLE;
    header.appendChild(oTitle);
    overview.appendChild(header);

    CHAPTER_GROUPS.forEach(function(group) {
      var valid = group.items.map(function(item) { return entries[item.kind + '-' + item.num]; }).filter(Boolean);
      if (!valid.length) return;
      var groupEl = document.createElement('div');
      groupEl.className = 'overview-group';
      var label = document.createElement('div');
      label.className = 'overview-group-label';
      label.setAttribute('role', 'heading');
      label.setAttribute('aria-level', '2');
      label.textContent = group.label;
      groupEl.appendChild(label);
      if (group.intro) {
        var intro = document.createElement('p');
        intro.className = 'overview-group-intro';
        intro.textContent = group.intro;
        groupEl.appendChild(intro);
      }

      valid.forEach(function(entry) {
        var wrap = document.createElement('div');
        wrap.className = 'overview-chapter';
        var link = document.createElement('a');
        link.className = 'overview-chapter-link';
        link.href = '#' + entry.id;
        var num = document.createElement('span');
        num.className = 'overview-chapter-num';
        num.textContent = entry.label;
        link.appendChild(num);
        link.appendChild(document.createTextNode(' ' + entry.title));
        wrap.appendChild(link);
        groupEl.appendChild(wrap);
      });
      overview.appendChild(groupEl);
    });

    var about = contentEl.querySelector('.about-document');
    if (about) contentEl.insertBefore(overview, about);
    else contentEl.insertBefore(overview, contentEl.firstChild);
  }

  function buildTOC() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var fragment = document.createDocumentFragment();
    var usedHeadingIds = Object.create(null);
    headings.forEach(function(heading) {
      var baseId = heading.id || slugify(heading.textContent);
      var uniqueId = baseId;
      var suffix = 2;
      while (usedHeadingIds[uniqueId]) {
        uniqueId = baseId + '-' + suffix;
        suffix += 1;
      }
      usedHeadingIds[uniqueId] = true;
      heading.id = uniqueId;
      if (heading.classList.contains('overview-title')) return;

      var link = document.createElement('a');
      var parsed = parseHeading(heading.textContent);
      var tocClass = 'toc-section';
      if (heading.classList.contains('part-title')) tocClass = 'toc-part';
      else if (parsed) tocClass = 'toc-chapter' + (parsed.kind === 'excerpt' ? ' toc-excerpt' : '');
      link.className = 'toc-item ' + tocClass;
      link.href = '#' + heading.id;
      if (heading.classList.contains('part-title')) {
        var kicker = heading.parentElement ? heading.parentElement.querySelector('.part-kicker') : null;
        link.textContent = (kicker ? kicker.textContent + ' · ' : '') + heading.textContent;
      } else {
        link.textContent = heading.textContent;
      }
      link.dataset.headingId = heading.id;
      fragment.appendChild(link);
    });
    tocContainer.appendChild(fragment);
  }

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\w\s가-힣-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 80) || 'section';
  }

  function setupScrollTracking() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var tocItems = tocContainer.querySelectorAll('.toc-item');
    if (headings.length === 0) return;
    if (state.observer) state.observer.disconnect();

    var tocMap = {};
    tocItems.forEach(function(item) { tocMap[item.dataset.headingId] = item; });
    var currentActive = null;
    var observer = new IntersectionObserver(function(entries) {
      var topHeading = null;
      var topOffset = Infinity;
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var rect = entry.target.getBoundingClientRect();
          if (rect.top < topOffset) { topOffset = rect.top; topHeading = entry.target; }
        }
      });
      if (topHeading) {
        if (currentActive) currentActive.classList.remove('active');
        var item = tocMap[topHeading.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
          var itemRect = item.getBoundingClientRect();
          var containerRect = tocContainer.getBoundingClientRect();
          if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) item.scrollIntoView({ block: 'center', behavior: 'auto' });
        }
      }
    }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });
    headings.forEach(function(h) { observer.observe(h); });
    state.observer = observer;

    if (!state.scrollHandler) {
      var ticking = false;
      state.scrollHandler = function() {
        if (!ticking) {
          requestAnimationFrame(function() {
            var curHeadings = contentEl.querySelectorAll('h1, h2');
            var curTocItems = tocContainer.querySelectorAll('.toc-item');
            var curMap = {};
            curTocItems.forEach(function(item) { curMap[item.dataset.headingId] = item; });
            var found = null;
            var scrollTop = window.scrollY + 80;
            for (var i = curHeadings.length - 1; i >= 0; i--) {
              if (curHeadings[i].offsetTop <= scrollTop) { found = curHeadings[i]; break; }
            }
            if (found) {
              var active = tocContainer.querySelector('.toc-item.active');
              if (active) active.classList.remove('active');
              var item = curMap[found.id];
              if (item) item.classList.add('active');
            }
            ticking = false;
          });
          ticking = true;
        }
      };
      window.addEventListener('scroll', state.scrollHandler);
    }
  }

  function setupSearch() {
    var searchInput = document.getElementById('search-input');
    var noResults = document.getElementById('toc-no-results');
    searchInput.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      var tocItems = tocContainer.querySelectorAll('.toc-item');
      if (!query) {
        tocItems.forEach(function(item) { item.classList.remove('toc-hidden'); });
        noResults.style.display = 'none';
        return;
      }
      var matchCount = 0;
      tocItems.forEach(function(item) {
        var text = item.textContent.toLowerCase();
        if (text.includes(query)) { item.classList.remove('toc-hidden'); matchCount++; }
        else item.classList.add('toc-hidden');
      });
      noResults.style.display = matchCount === 0 ? 'block' : 'none';
    });
  }

  function setupProgressBar() {
    var progressBar = document.getElementById('progress-bar');
    var ticking = false;
    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = Math.min(progress, 100) + '%';
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() { updateProgress(); ticking = false; });
        ticking = true;
      }
    });
    updateProgress();
  }

  function setupMobileMenu() {
    var toggle = document.getElementById('menu-toggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.querySelector('#sidebar-overlay');
    toggle.addEventListener('click', function() {
      var isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('visible', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    overlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('#sidebar-overlay').classList.remove('visible');
    document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
  }

  function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });
  }
})();
</script>
